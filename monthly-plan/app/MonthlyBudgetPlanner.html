:root{
  /* neutrals carry a slight lavender bias so they read as chosen, not inherited */

  --ink:#1B1524; --ink-2:#574E66; --ink-3:#8B8298;
  --rule:#ECE7F2; --rule-2:#DCD4E7;

  --calm:#3F7A66; --flag:#9C6427; --flag-soft:#FAF1E8;
  --bold:#2E2040; --bold-2:#241932;
  --on-bold:#F5F1FA; --on-bold-dim:#B6A9C7;
  --pop:#F0B98F; --pop-ink:#3A2214;
  --pos:var(--ok); --neg:var(--over); --on-bold-alert:#F4B3A4;

  /* Status is reserved and universal: green = within plan, red = over plan.
     Green/red sit in the 6-8 CVD band, so every use carries a second cue
     (hatched texture on the over-plan arm, plus labels and tooltips). Validated light. */
  --ok:#1F7A52; --over:#D23B2B;
  --ok-1:#E4F1EA; --ok-2:#B4D9C6; --ok-3:#74B899; --ok-4:#1F7A52;

  --on-plan:#EDEAF1;
  --ch-in:#1F7A52; --ch-out:#D23B2B;
  /* categorical hues (donut only), fixed order, never cycled — green and red are
     deliberately absent because they now mean status. Validated light: all checks pass. */
  --cat-1:#5C3F8F; --cat-2:#DD9012; --cat-3:#2478D4;
  --cat-4:#B8309A; --cat-5:#12A5A0; --cat-6:#8A8296; --cat-0:#8A8296;

  --r-lg:18px; --r-md:14px; --r-sm:10px; --r-xs:8px;
  --shadow-sm:0 1px 2px rgba(27,21,36,.05), 0 1px 1px rgba(27,21,36,.03);
  --shadow-md:0 6px 20px -6px rgba(27,21,36,.12), 0 1px 3px rgba(27,21,36,.05);

  --accent:#C3A9E8; --accent-ink:#1B1024; --accent-soft:#292234; --accent-line:#352C44;
  --calm:#8FD3B8; --flag:#E0A76B; --flag-soft:#302518;
  --bold:#221C2C; --bold-2:#1A1522; --on-bold:#EDE7F5; --on-bold-dim:#A79BBA;
  --pop:#F0B98F; --pop-ink:#2A1708;
  --pos:var(--ok); --neg:var(--over); --on-bold-alert:#F2A899;
  /* dark steps are chosen against the dark surface, not flipped. Validated dark. */
  --ok:#3E9E72; --over:#D6584A;
  --ok-1:#1E2E27; --ok-2:#27483A; --ok-3:#2F6F52; --ok-4:#3E9E72;
  --ov-1:#31211F; --ov-2:#4E2C28; --ov-3:#8E3E35; --ov-4:#D6584A;
  --on-plan:#2A2730;
  --ch-in:#3E9E72; --ch-out:#D6584A;
  --cat-1:#7F62B8; --cat-2:#BE8A2E; --cat-3:#3577CC;
  --cat-4:#AE4592; --cat-5:#149A95; --cat-6:#8A8296; --cat-0:#8A8296;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);
  --shadow-md:0 6px 20px -6px rgba(0,0,0,.55), 0 1px 3px rgba(0,0,0,.4);
  --shadow-lg:0 24px 60px -12px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.5);
  color-scheme:dark;
}

:root[data-theme="lavender"]{
  --paper:#FAF9FC; --card:#FFFFFF; --sunk:#F5F2F9;
  --ink:#1B1524; --ink-2:#574E66; --ink-3:#8B8298;
  --rule:#ECE7F2; --rule-2:#DCD4E7;
  --accent:#5C3F8F; --accent-ink:#FFFFFF; --accent-soft:#F3EEFA; --accent-line:#E0D6EF;
  --calm:#5C3F8F; --flag:#8A5428; --flag-soft:#F9F0E6;
  --bold:#2E2040; --bold-2:#241932; --on-bold:#F5F1FA; --on-bold-dim:#B6A9C7;
  --pop:#F0B98F; --pop-ink:#3A2214; --pos:var(--ok); --neg:var(--over);

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button,a,input,select,textarea{-webkit-tap-highlight-color:transparent}
button{cursor:pointer;border:0;background:none;color:inherit}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--num);letter-spacing:-.02em;line-height:1.18;text-wrap:balance}
h1{font-size:34px;font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
small,.small{font-size:12px}
svg{width:18px;height:18px;stroke-width:1.6;flex-shrink:0}
button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
[hidden]{display:none!important}

/* ---------- frame ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh}
.rail{background:var(--bold-2);color:var(--on-bold);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:var(--s6) var(--s3) var(--s5);overflow-y:auto;z-index:40}
.brand{display:flex;gap:var(--s3);align-items:center;padding:var(--s1) var(--s2) var(--s7)}
.brand-mark{height:34px;width:34px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--pop);color:var(--pop-ink);font:800 17px var(--num)}
.brand b{display:block;font:700 16px var(--num);letter-spacing:-.02em}
.brand small{font-size:9px;letter-spacing:.16em;color:var(--on-bold-dim)}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.14em;padding:var(--s5) var(--s3) var(--s2);color:var(--on-bold-dim);font-weight:600}
.navlink{width:100%;display:flex;align-items:center;gap:var(--s3);min-height:40px;padding:var(--s2) var(--s3);color:var(--on-bold-dim);border-radius:var(--r-sm);text-align:left;font-size:14px;position:relative;transition:background .13s ease,color .13s ease}
.navlink:hover{background:#ffffff0f;color:var(--on-bold)}
.navlink[aria-current=page]{background:#ffffff16;color:var(--on-bold);font-weight:600}
.navlink[aria-current=page]:before{content:'';position:absolute;left:calc(var(--s3) * -1);top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--pop);border-radius:0 3px 3px 0}
.navlink svg{opacity:.85}
.rail-foot{margin-top:auto;padding:var(--s6) var(--s2) 0;color:var(--on-bold-dim);font-size:11px}
.rail-foot a{color:inherit;text-decoration:none}
.rail-note{border:1px solid #ffffff1f;border-radius:var(--r-md);padding:var(--s3);margin:var(--s6) 0 var(--s4);font-size:12px;line-height:1.5}
.rail-note b{display:block;color:var(--pop);margin-bottom:var(--s1)}
.main{min-width:0}

/* ---------- top chrome: one continuous bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper)}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);max-width:1400px;padding:var(--s3) var(--s7);margin:auto}
.top-left,.actions,.flex{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.top-left{flex-wrap:nowrap}
.month-switch{display:flex;gap:var(--s1);align-items:center}
.month-label{font:650 17px/1 var(--num);letter-spacing:-.02em;color:var(--ink);white-space:nowrap;padding:0 var(--s1)}
.month-switch input{width:28px;height:28px;min-height:28px;color:transparent;border:0;background:transparent;
  padding:0;position:relative;cursor:pointer;border-radius:var(--r-xs)}
.month-switch input::-webkit-calendar-picker-indicator{opacity:0;position:absolute;inset:0;width:100%;height:100%;margin:0;padding:0;cursor:pointer}
@supports ((-webkit-mask-image:none) or (mask-image:none)){
 /* paint our own glyph in the theme accent: the browser's is black on dark and white on light */
 .month-switch input{-webkit-mask:var(--cal-icon) center/17px 17px no-repeat;mask:var(--cal-icon) center/17px 17px no-repeat;background-color:var(--accent);opacity:.8}
 .month-switch input:hover{opacity:1}
}
.month-switch input:focus-visible{box-shadow:none;outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-xs);border:1px solid transparent;background:transparent;color:var(--ink-2);transition:background .13s ease,color .13s ease}
.ibtn:hover{background:var(--accent-soft);color:var(--accent)}

/* ---------- buttons: one primary, quiet everything else ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:36px;padding:var(--s2) var(--s3);border:1px solid var(--rule-2);background:var(--card);color:var(--ink);border-radius:var(--r-sm);font-weight:600;font-size:13px;text-decoration:none;white-space:nowrap;transition:background .13s ease,border-color .13s ease,box-shadow .13s ease}
.btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
.btn.primary:hover{background:var(--accent);filter:brightness(1.12);color:var(--accent-ink)}
.btn.pop{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}
.btn.pop:hover{background:var(--pop);filter:brightness(1.06);color:var(--pop-ink)}
.btn.danger{color:var(--neg);border-color:var(--rule-2)}
.btn.danger:hover{background:color-mix(in srgb,var(--neg) 8%,var(--card));border-color:var(--neg);color:var(--neg)}
.btn.quiet{background:transparent;border-color:var(--rule-2);color:var(--ink-2)}
.btn.quiet:hover{background:var(--accent-soft);color:var(--accent)}
.btn.small{min-height:30px;padding:var(--s1) var(--s2);font-size:12px}
.link{color:var(--accent);font-size:13px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--accent-line);padding-bottom:1px}
.link:hover{border-bottom-color:var(--accent)}
.status{font-size:11px;color:var(--ink-3);display:inline-flex;align-items:center;gap:var(--s1)}
.status:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}

/* ---------- page ---------- */
.page{max-width:1400px;padding:var(--s6) var(--s7) var(--s8);margin:auto}
.pagehead{display:flex;justify-content:space-between;gap:var(--s5);align-items:center;margin-bottom:var(--s6);flex-wrap:wrap}
.pagehead-text{min-width:0;flex:1 1 320px}
.pagehead h1{font-size:clamp(26px,3vw,32px)}
.pagehead .actions{flex:0 0 auto;gap:var(--s2);justify-content:flex-end}
.pagehead .actions .btn{min-height:38px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:var(--s2)}
.subtitle{color:var(--ink-2);font-size:14px;margin-top:var(--s2);max-width:62ch}
.muted{color:var(--ink-2)}
.dim{color:var(--ink-3)}
.number{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}

/* ---------- hero ---------- */
.hero{background:var(--bold);color:var(--on-bold);border-radius:var(--r-lg);padding:var(--s6) var(--s7);display:grid;grid-template-columns:1.3fr 1fr;gap:var(--s7);margin-bottom:var(--s4);position:relative;overflow:hidden}
.hero .eyebrow{color:var(--on-bold-dim)}
.hero h2{font-size:38px;font-weight:700;margin:var(--s2) 0 var(--s3);letter-spacing:-.03em}
.hero p{color:var(--on-bold-dim);font-size:13px;max-width:44ch;line-height:1.6}
.hero .hero-foot{margin-top:var(--s5)}
.hero-side{border-left:1px solid #ffffff1f;padding:var(--s1) 0 var(--s1) var(--s6);display:grid;align-content:center;gap:var(--s3)}
.hero-fact{display:flex;align-items:baseline;justify-content:space-between;font-size:12px;gap:var(--s3);color:var(--on-bold-dim)}
.hero-fact strong{font:650 17px var(--num);white-space:nowrap;color:var(--on-bold);font-variant-numeric:tabular-nums}
.hero-meter{height:6px;border-radius:6px;background:#ffffff1f;overflow:hidden;margin:var(--s1) 0}
.hero-meter i{display:block;background:var(--pop);height:100%;border-radius:6px}

/* ---------- tiles ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s5)}
.kpi{background:var(--card);border-radius:var(--r-md);padding:var(--s4) var(--s5);box-shadow:var(--shadow-sm)}
.kpi .label{font-size:12px;color:var(--ink-2);display:flex;justify-content:space-between;gap:var(--s1);font-weight:500}
.kpi .label svg{display:none}
.kpi b{font:700 clamp(20px,2vw,26px)/1.1 var(--num);letter-spacing:-.03em;display:block;margin:var(--s2) 0 var(--s1);overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-3);font-size:11px}
.good{color:var(--ok)}
.warn{color:var(--over)}

/* ---------- surfaces ---------- */
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--s4);margin-bottom:var(--s4)}
.equal{grid-template-columns:1fr 1fr}
.card{background:var(--card);border-radius:var(--r-md);padding:var(--s5);min-width:0;margin-bottom:var(--s4);box-shadow:var(--shadow-sm)}
.grid2>.card,.cards>.card{margin-bottom:0}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s4)}
.cardhead p{font-size:12px;color:var(--ink-3);margin-top:var(--s1)}
.pill{display:inline-flex;border-radius:99px;padding:3px var(--s2);font-size:11px;color:var(--ink-2);background:var(--sunk);align-items:center;gap:var(--s1);white-space:nowrap;font-weight:600}
.pill.good{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--over) 12%,transparent);color:var(--over)}

/* ---------- rows ---------- */
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--rule)}
.row:last-child{border-bottom:0}
.row strong{font-size:13px;font-weight:600}
.row small{display:block;color:var(--ink-3);margin-top:2px}
.row .number{white-space:nowrap;font-weight:650}
.meter{height:4px;background:var(--sunk);border-radius:4px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px;opacity:.8}
.meter i.over{background:var(--over);opacity:1;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.28) 0 2px,transparent 2px 5px)}
.budget-row{margin:var(--s3) 0}
.budget-row small{display:block;margin-top:var(--s1);font-size:11px}
.budget-row .row{border:0;padding:0 0 var(--s2);font-size:12px}
.legend{display:flex;gap:var(--s4);align-items:center;flex-wrap:wrap;color:var(--ink-2);font-size:11px}
.dot{width:8px;height:8px;border-radius:2px;display:inline-block;margin-right:var(--s1);background:var(--accent)}
.dot.income{background:var(--ch-in)}
.dot.expense{background:var(--ch-out)}
.dot.saving{background:var(--accent)}

/* ---------- donut ---------- */
.donut-wrap{display:flex;align-items:center;gap:var(--s6)}
.donut{width:196px;height:196px;flex-shrink:0;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut-mid{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;pointer-events:none}
.donut-mid{padding:0 34px;text-align:center}
.donut-mid strong{font:700 19px var(--num);letter-spacing:-.03em;line-height:1.1}
.donut-mid small{font-size:8px;color:var(--ink-3);letter-spacing:.09em;margin-top:3px;line-height:1.2}
.donut-key{flex:1;min-width:0}

/* ---------- notices ---------- */
.notice{background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:var(--r-sm);margin-bottom:var(--s4);font-size:13px;display:flex;justify-content:space-between;gap:var(--s4);align-items:center;color:var(--ink-2);line-height:1.5}
.notice.warning{background:var(--flag-soft);color:var(--flag)}
.backup-banner{margin:0;border-radius:0;padding:var(--s2) var(--s6);font-size:12.5px;background:var(--flag-soft);color:var(--ink)}
.backup-banner b{color:var(--flag)}
.backup-banner .actions{flex-wrap:nowrap}
@media(max-width:620px){.backup-banner{padding:var(--s2) var(--s4)}}
.demo-banner{background:var(--sunk);color:var(--ink-2);padding:var(--s2) var(--s7);display:flex;justify-content:space-between;gap:var(--s3);font-size:12px;align-items:center;border-top:1px solid var(--rule)}
.empty{padding:var(--s7) var(--s5);text-align:center;color:var(--ink-3);font-size:13px}
.empty svg{height:26px;width:26px;color:var(--accent);margin-bottom:var(--s3);opacity:.6}
.empty h3{color:var(--ink);margin-bottom:var(--s2)}
.empty p{max-width:42ch;margin:0 auto var(--s4)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.step{background:var(--sunk);padding:var(--s5);border-radius:var(--r-sm)}
.step span{font:700 11px var(--num);color:var(--accent);letter-spacing:.06em}
.step h3{margin:var(--s3) 0 var(--s2)}
.step p{font-size:12px;color:var(--ink-2);margin-bottom:var(--s4);line-height:1.5}

/* ---------- tables ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding:var(--s2) var(--s3);background:var(--sunk);white-space:nowrap}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--rule);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr{transition:background .1s ease}
tbody tr:hover{background:var(--accent-soft)}
.num{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
td input,td select{min-height:32px;padding:var(--s1) var(--s2)}
td input.money{max-width:112px;text-align:right}
td input.day{width:64px;text-align:center}
.table-card{padding:0;overflow:hidden}
.table-card .cardhead{padding:var(--s5) var(--s5) var(--s3)}

/* ---------- forms ---------- */
input,select,textarea{background:var(--card);border:1px solid var(--rule-2);border-radius:var(--r-xs);min-height:38px;padding:var(--s2) var(--s3);max-width:100%;transition:border-color .13s ease,box-shadow .13s ease}
input:hover,select:hover,textarea:hover{border-color:var(--ink-3)}
textarea{resize:vertical;min-height:96px;line-height:1.55}
label{display:block;font-size:12px;font-weight:600}
label>input,label>select,label>textarea{display:block;width:100%;margin-top:var(--s2);font-weight:400}
label>small{display:block;font-weight:400;color:var(--ink-3);margin-top:var(--s1);line-height:1.5}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--s4)}
.full{grid-column:1/-1}
.formfoot{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s6);flex-wrap:wrap}
.filters{display:flex;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.filters input{flex:1;min-width:150px}
.segment{display:flex;gap:2px;flex-wrap:wrap;background:var(--sunk);padding:2px;border-radius:var(--r-sm)}
.segment button{font-size:12px;border-radius:var(--r-xs);padding:var(--s1) var(--s3);border:0;color:var(--ink-2);min-height:28px;font-weight:600;transition:background .13s ease,color .13s ease}
.segment button:hover{color:var(--accent)}
.segment button[aria-pressed=true]{background:var(--card);color:var(--accent);box-shadow:var(--shadow-sm)}

/* ---------- goals ---------- */
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);margin-bottom:var(--s4)}
@media(min-width:1560px){.cards{grid-template-columns:repeat(4,minmax(0,1fr))}}
.th-sort{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent;padding:0;font:inherit;color:inherit;letter-spacing:inherit;text-transform:inherit;cursor:pointer}
.th-sort:hover{color:var(--accent)}
.th-sort .caret{font-size:10px;opacity:.45}
.th-sort.is-sorted{color:var(--accent)}
.th-sort.is-sorted .caret{opacity:1}
th.num .th-sort{justify-content:flex-end}
.goal-row-meter{width:104px}
.goal-sub{display:block;color:var(--ink-3);font-size:11px;margin-top:3px}
.goal-row-meter .meter{margin:0}
.goal-type{font-size:10px;letter-spacing:.06em;text-transform:uppercase}
.goal-type.is-debt{background:color-mix(in srgb,var(--over) 12%,transparent);color:var(--over)}
.goal-card.is-debt .goal-icon{background:color-mix(in srgb,var(--over) 12%,transparent);color:var(--over)}
.goal-cover{margin:calc(var(--s5) * -1) calc(var(--s5) * -1) var(--s4);border-radius:var(--r-md) var(--r-md) 0 0;overflow:hidden;background:var(--sunk);aspect-ratio:16/9}
.kpi .nw{white-space:nowrap}
.goal-cover img{display:block;width:100%;height:100%;object-fit:cover}
.goal-cover.is-blank{display:grid;place-items:center;background:linear-gradient(135deg,var(--accent-soft),var(--sunk))}
.goal-cover.is-blank svg{width:30px;height:30px;color:var(--accent);opacity:.32}
.goal-photo-field .field-label{display:block;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);margin-bottom:var(--s2)}
.goal-photo-row{display:flex;gap:var(--s3);align-items:flex-start}
.goal-photo-preview{width:146px;flex:0 0 146px;aspect-ratio:16/9;border-radius:var(--r-sm);border:1px dashed var(--rule);background:var(--sunk);display:grid;place-items:center;padding:var(--s2);text-align:center;overflow:hidden}
.goal-photo-preview img{width:100%;height:100%;object-fit:cover;border-radius:calc(var(--r-sm) - 1px)}
.goal-photo-actions{display:flex;flex-direction:column;gap:var(--s2);align-items:flex-start}
.goal-photo-actions small{color:var(--ink-3);font-size:11px;line-height:1.5}
.goal-photo-actions .btn{cursor:pointer}
@media(max-width:620px){.goal-photo-row{flex-direction:column}.goal-photo-preview{width:100%;flex:none}}
.goal-icon{height:34px;width:34px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);margin-bottom:var(--s4)}
.goal-total{font:700 26px var(--num);margin:var(--s5) 0 var(--s1);letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.goal-note{font-size:11px;color:var(--ink-3);margin:var(--s2) 0 var(--s4)}
.goal-stall{display:flex;gap:9px;align-items:flex-start;font-size:11.5px;line-height:1.55;color:var(--flag);background:var(--flag-soft);border-radius:var(--r-sm);padding:11px 12px;margin:0 0 var(--s4)}
.goal-stall svg{width:14px;height:14px;flex:0 0 14px;margin-top:2px}
.goal-stall b{color:var(--flag)}

/* ---------- calendar ---------- */
.calendar{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));border-left:1px solid var(--rule);border-top:1px solid var(--rule);border-radius:var(--r-sm);overflow:hidden}
.calhead{padding:var(--s2);text-align:center;font-size:10px;background:var(--sunk);color:var(--ink-3);border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);font-weight:700;letter-spacing:.06em;text-transform:uppercase}
.calday{min-height:110px;border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:var(--s2);text-align:left;display:flex;flex-direction:column;align-items:stretch;gap:3px;min-width:0;background:var(--card);transition:background .12s ease}
.calday:hover{background:var(--accent-soft)}
.calday.today .date{background:var(--accent);color:var(--accent-ink)}
.date{width:22px;height:22px;display:grid;place-items:center;font-size:11px;border-radius:50%;margin-bottom:2px;font-weight:600}
.event{padding:2px var(--s1);border-radius:3px;background:var(--accent-soft);color:var(--accent);font-size:9px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:left}
.event.due{background:var(--flag-soft);color:var(--flag)}
.event.logged{background:var(--accent-soft);color:var(--accent)}
.calblank{background:var(--sunk)}

/* ---------- misc content ---------- */
.insight{border-left:2px solid var(--accent-line);padding:var(--s1) 0 var(--s1) var(--s4);margin:var(--s5) 0}
.insight h3{font-size:14px;margin-bottom:var(--s1)}
.insight p{font-size:13px;color:var(--ink-2);line-height:1.55}
.checkline{display:flex;align-items:flex-start;gap:var(--s3);font-size:13px;font-weight:400;padding:var(--s3) 0;border-bottom:1px solid var(--rule)}
.checkline input{width:17px;height:17px;min-height:17px;margin:2px 0 0;accent-color:var(--accent);flex-shrink:0}
.checkline span{flex:1;transition:color .15s ease}
.checkline input:checked+span{text-decoration:line-through;text-decoration-thickness:1px;color:var(--ink-3)}
.guide p,.guide li{font-size:13px;color:var(--ink-2);margin:var(--s2) 0;line-height:1.65;max-width:70ch}
.guide h3{margin-top:var(--s6)}
.guide ol{padding-left:var(--s5)}
.theme-grid{display:flex;gap:var(--s2);flex-wrap:wrap}
.theme-btn{height:38px;padding:var(--s2) var(--s3);border:1px solid var(--rule-2);border-radius:var(--r-sm);font-size:12px;font-weight:600;background:var(--card);transition:border-color .13s ease}
.theme-btn:hover{border-color:var(--ink-3)}
.theme-btn[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.theme-btn i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:var(--s1)}
.footer{display:flex;justify-content:space-between;gap:var(--s4);font-size:10px;color:var(--ink-3);margin-top:var(--s7);border-top:1px solid var(--rule);padding-top:var(--s4)}
.scrim{display:none}

/* ---------- dialogs ---------- */
dialog{width:min(600px,calc(100% - 28px));max-height:90vh;border:0;border-radius:var(--r-lg);background:var(--card);color:var(--ink);padding:0;box-shadow:var(--shadow-lg)}
dialog::backdrop{background:rgba(27,21,36,.42);backdrop-filter:blur(3px)}
.dialog-in{padding:var(--s6)}
.dialog-head{display:flex;justify-content:space-between;gap:var(--s4);align-items:center;margin-bottom:var(--s2)}
.dialog-in>.subtitle{margin-bottom:var(--s5)}
.error{color:var(--neg);background:color-mix(in srgb,var(--neg) 9%,var(--card));padding:var(--s2) var(--s3);border-radius:var(--r-xs);margin:var(--s2) 0;font-size:13px}
.toast{position:fixed;bottom:var(--s5);left:50%;transform:translateX(-50%);z-index:99;border-radius:var(--r-sm);padding:var(--s3) var(--s4);background:var(--bold-2);color:var(--on-bold);font-size:13px;max-width:calc(100% - 30px);display:flex;align-items:center;gap:var(--s4);box-shadow:var(--shadow-lg)}
.toast button{color:var(--pop);text-decoration:underline;white-space:nowrap}

/* ---------- utility ---------- */
.mobile-menu{display:none}
.closing-note{font-size:12px;color:var(--ink-2);padding:var(--s4) 0;line-height:1.55}
.print-title{display:none}
.help-inline{border-bottom:1px dotted var(--ink-3);cursor:help}
.mobile-close{display:none}
.annual-table td,.annual-table th{padding:var(--s2) var(--s3)}
.plan-summary{position:sticky;top:77px;z-index:10;display:flex;justify-content:space-between;align-items:center;background:var(--card);border-radius:var(--r-md);padding:var(--s4) var(--s5);margin-bottom:var(--s5);gap:var(--s4);font-size:13px;box-shadow:var(--shadow-md)}
.plan-summary b{font:700 20px var(--num);font-variant-numeric:tabular-nums}
@media(min-width:1550px){.page{padding-top:43px}.hero{padding:37px}.kpi{padding:24px}}
@media(max-width:1150px){.app{grid-template-columns:220px minmax(0,1fr)}.page{padding:28px 24px}.topbar-in{padding:13px 24px}.kpis{gap:10px}.kpi{padding:15px}.cards{grid-template-columns:1fr 1fr}.donut-wrap{gap:13px}.donut{width:135px;height:135px}.donut-mid strong{font-size:20px}.hero h2{font-size:37px}.status{display:none}}
@media(max-width:900px){.app{display:block}.rail{position:fixed;left:0;top:0;width:250px;transform:translateX(-100%);transition:transform .18s}.menu-open .rail{transform:translateX(0)}.menu-open .scrim{display:block;position:fixed;inset:0;background:#160c2470;z-index:35}.mobile-menu,.mobile-close{display:inline-grid}.mobile-close{position:absolute;right:8px;top:8px;color:var(--on-bold)}.grid2{gap:15px}.pagehead h1{font-size:27px}.card{padding:20px}.topbar-in{padding:12px 20px}.hero{gap:20px}.footer{margin-bottom:20px}}
@media(max-width:620px){.page{padding:23px 16px 30px}.topbar-in{padding:10px 12px;gap:6px}.topbar .btn{padding:8px 11px;font-size:12px}.topbar .btn svg{display:none}.top-left{gap:5px}.month-switch{gap:2px}.month-switch input{width:131px;font-size:12px}.month-switch .ibtn{width:29px;border:0;background:transparent}.mobile-menu{width:32px}.pagehead{flex-direction:column;gap:14px;margin-bottom:20px}.pagehead h1{font-size:27px}.pagehead .actions{width:100%}.subtitle{font-size:13px}.hero{grid-template-columns:1fr;padding:24px;gap:23px}.hero h2{font-size:40px}.hero-side{border-left:0;padding:20px 0 0;border-top:1px solid #ffffff25}.hero .hero-foot{margin-top:17px}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:23px}.kpi{padding:15px}.grid2,.cards,.steps{grid-template-columns:1fr}.card{padding:20px}.table-card{padding:0}.cardhead{gap:10px}.cardhead h2{font-size:17px}.donut-wrap{gap:24px}.donut{width:150px;height:150px}.notice{align-items:flex-start;flex-direction:column;font-size:12px}.demo-banner{padding:10px 16px;font-size:11px}.demo-banner .btn{padding:5px 8px;font-size:10px}.fields{grid-template-columns:1fr}.full{grid-column:auto}.dialog-in{padding:22px}.calendar{min-width:620px}.calendar-scroll{overflow-x:auto;margin:-2px}.calday{min-height:105px}.legend{gap:9px;font-size:10px}.footer{flex-direction:column;gap:6px}.plan-summary{top:63px;font-size:11px;padding:11px}.plan-summary b{font-size:17px}.table-card .cardhead{padding:19px 17px 0}td,th{padding:10px}.table-wrap table{min-width:580px}.filters>*{flex:1;min-width:120px}.actions .btn{flex:1}.formfoot .btn{flex:1}.goal-total{font-size:31px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{body{background:white;font-size:11px;color:#222}.rail,.topbar,.pagehead .actions,.demo-banner,.toast,.scrim,dialog,.no-print,.footer button,.btn,.ibtn{display:none!important}.app{display:block}.page{max-width:none;padding:0}.pagehead{margin-bottom:18px}.hero,.card,.kpi{break-inside:avoid}.hero{background:#eee!important;color:#222}.hero p,.hero .eyebrow{color:#555}.hero-side{border-color:#aaa}.kpis{grid-template-columns:repeat(4,1fr)}.grid2{grid-template-columns:1fr 1fr}.card{padding:16px}.table-wrap{overflow:visible}.table-wrap table{min-width:0}.plan-summary{position:static}.print-title{display:block;font-size:11px;margin-bottom:18px}.calendar{min-width:0}.calendar-scroll{overflow:visible}input,select,textarea{border:0;padding:0}*{-webkit-print-color-adjust:exact;print-color-adjust:exact}}

.add-short{display:none}@media(max-width:900px){.rail{visibility:hidden}.menu-open .rail{visibility:visible}}@media(max-width:620px){.add-full{display:none}.add-short{display:inline}.topbar .actions{flex-shrink:0}.plan-summary{flex-wrap:wrap}.plan-summary .btn{margin-left:auto}}

.plan-summary{top:var(--bar-height,77px)}
/* hero: secondary action and the overdrawn state */
.hero h2.alert{color:var(--on-bold-alert)}
.hero .hero-foot{display:flex;gap:var(--s2);flex-wrap:wrap;align-items:center}
.hero .btn.quiet{color:var(--on-bold);border-color:#ffffff33;background:transparent}
.hero .btn.quiet:hover{background:#ffffff14;color:var(--on-bold);border-color:#ffffff4d}
.hero-side .hero-fact strong{font-variant-numeric:tabular-nums}

/* collapsible budget groups */
.budget-group{padding:0;overflow:hidden}
.budget-group>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;
  gap:var(--s4);padding:var(--s4) var(--s5);transition:background .13s ease}
.budget-group>summary::-webkit-details-marker{display:none}
.budget-group>summary:hover{background:var(--accent-soft)}
.budget-group>summary:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.budget-group-name{display:flex;align-items:center;gap:var(--s2);min-width:0}
.budget-group-name h2{font-size:16px}
.budget-group-name svg{width:16px;height:16px;color:var(--ink-3);transition:transform .16s ease;flex:0 0 auto}
.budget-group[open]>summary .budget-group-name svg{transform:rotate(90deg)}
.budget-group[open]>summary{border-bottom:1px solid var(--rule)}
.budget-group-figs{font-size:11px;color:var(--ink-3);display:flex;align-items:baseline;gap:var(--s1);white-space:nowrap;text-align:right}
.budget-group-figs b{font-size:14px;color:var(--ink);font-weight:700;margin-right:2px}
.budget-group-figs em{font-style:normal;font-size:14px;color:var(--ink-2);font-weight:650;margin-left:var(--s3)}

/* totals bar */
.plan-summary{flex-wrap:wrap}
.plan-summary>div{min-width:118px}
.plan-summary .btn{margin-left:auto}

/* ---------- shared chart hover ---------- */
.tip{position:fixed;z-index:200;pointer-events:none;background:var(--bold-2);color:var(--on-bold);
  border-radius:var(--r-sm);padding:var(--s2) var(--s3);box-shadow:var(--shadow-lg);max-width:280px;font-size:12px}
.tip-title{font:700 11px var(--num);letter-spacing:.04em;text-transform:uppercase;color:var(--on-bold-dim);margin-bottom:var(--s1)}
.tip-row{display:flex;align-items:baseline;gap:var(--s2);white-space:nowrap;line-height:1.7}
.tip-row i{width:10px;height:2px;border-radius:2px;flex:0 0 auto;align-self:center}
.tip-row b{font:700 13px var(--num);font-variant-numeric:tabular-nums}
.tip-row span{color:var(--on-bold-dim);font-size:11px}
.chart-hint{font-size:11px;color:var(--ink-3);margin-top:var(--s2)}
/* a card with padding:0 must still pad any loose text it holds */
.table-card>.chart-hint,.table-card>p,.table-card>.heat-legend{padding-left:var(--s5);padding-right:var(--s5)}
.table-card>.chart-hint:last-child,.table-card>p:last-child{padding-bottom:var(--s4)}
.table-card>:last-child{margin-bottom:0}
.area-chart{outline:none}
.area-chart:focus-visible{outline:2px solid var(--accent);outline-offset:4px;border-radius:var(--r-sm)}
.chart-cross{stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 4;opacity:.7}
.chart-point{fill:var(--card);stroke-width:1.5;transition:r .1s ease}
.chart-point.on{r:5.5;stroke-width:2.5}
.chart-mark-label{fill:var(--ink-2);font:700 10px var(--num);font-variant-numeric:tabular-nums}
.area-chart svg{cursor:crosshair}

/* ---------- plan vs actual: every number outside the bar ---------- */
.compare-bar-row{display:grid;grid-template-columns:minmax(84px,132px) minmax(0,1fr);align-items:center;
  gap:var(--s2);padding:var(--s1) var(--s2);border-radius:var(--r-xs);outline:none}
.compare-bar-row:hover,.compare-bar-row:focus-visible{background:var(--accent-soft)}
.cb-name{font-size:11px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;color:var(--ink);font-weight:600}
.cb-series{display:grid;gap:3px;min-width:0}
.cb-line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:var(--s2);align-items:center}
.cb-track{height:9px;background:var(--sunk);border-radius:3px;overflow:hidden;display:block}
.cb-track i{display:block;height:100%;border-radius:3px;min-width:2px;transform-origin:left center}
.cb-val{font-size:11px;color:var(--ink-2);font-weight:650;white-space:nowrap;text-align:right;min-width:66px;
  font-family:var(--num);font-variant-numeric:tabular-nums}
.cb-line:first-child .cb-val{color:var(--ink)}

/* ---------- vertical compare ---------- */
.compare-column{outline:none;border-radius:var(--r-xs);padding-top:var(--s1)}
.compare-column:hover,.compare-column:focus-visible{background:var(--accent-soft)}
.compare-stage>i{transition:filter .1s ease}
.compare-column:hover .compare-stage>i{filter:brightness(1.08)}
.donut-seg{transition:opacity .12s ease}
.donut-wrap:hover .donut-seg{opacity:.5}
.donut-wrap .donut-seg:hover{opacity:1}

/* ---------- annual overview: one square per month ---------- */
.heat-legend{display:flex;align-items:center;gap:var(--s1);flex-wrap:wrap;font-size:11px;color:var(--ink-3);padding:0 var(--s5) var(--s3)}
.heat-legend i{width:16px;height:12px;border-radius:2px;display:block}
.heat-legend span:first-of-type{margin-right:var(--s1)}
.heat-legend span+i{margin-left:0}
.heat-legend em{font-style:normal;margin-left:auto;line-height:1.45}
.heat-table{min-width:812px;padding:0 var(--s5) var(--s3)}
.heat-scroll{overflow-x:auto;overscroll-behavior-x:contain;scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent;padding-bottom:var(--s1)}
.heat-scroll::-webkit-scrollbar{height:10px}
.heat-scroll::-webkit-scrollbar-track{background:var(--sunk);border-radius:99px;margin:0 var(--s5)}
.heat-scroll::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:99px;border:2px solid var(--sunk)}
.heat-scroll::-webkit-scrollbar-thumb:hover{background:var(--ink-3)}
.heat-row{display:grid;grid-template-columns:minmax(130px,1.3fr) repeat(12,minmax(34px,1fr)) 78px 78px 84px;
  align-items:center;gap:2px;padding:1px 0}
.heat-head{position:sticky;top:0;background:var(--card);z-index:2;padding:var(--s2) 0 var(--s2);
  border-bottom:1px solid var(--rule-2);margin-bottom:var(--s2)}
.heat-head b{font-size:9px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);text-align:center;font-weight:700}
.heat-head-name{text-align:left!important}
.heat-head-name,.heat-name{position:sticky;left:0;background:var(--card);z-index:5;box-shadow:8px 0 0 var(--card)}
.heat-head-name{z-index:6}
.heat-month{background:var(--card);border:1px solid var(--rule);border-radius:var(--r-xs);
  padding:3px 0;color:var(--ink-2);line-height:1.4}
.heat-month.is-now{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.heat-head b.num,.heat-row .num{text-align:right}
.heat-group{font-size:9px;text-transform:uppercase;letter-spacing:.08em;color:var(--accent);font-weight:700;
  padding:var(--s3) 0 var(--s1)}
.heat-name{font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-right:var(--s2)}

function focusKey(el){

 if(el.id)return '#'+CSS.escape(el.id);
 const d=el.dataset||{},keys=Object.keys(d).sort();

function countUp(){

 const els=[...document.querySelectorAll('[data-count]')].map(el=>({el,to:+el.dataset.count,final:el.textContent}))
   .filter(x=>Number.isFinite(x.to)&&x.to!==0);
 if(!els.length)return;
 const dur=620,start=performance.now();
 const step=t=>{
  const p=Math.min(1,(t-start)/dur),e=1-Math.pow(1-p,3);
  for(const x of els){if(!x.el.isConnected)continue;x.el.textContent=p<1?fmt(Math.round(x.to*e)):x.final;}
  if(p<1)countTimer=requestAnimationFrame(step);
 };
 countTimer=requestAnimationFrame(step);
}

const COVER_W=800,COVER_H=450;
function coverFromFile(file){return new Promise((resolve,reject)=>{
 if(!file)return reject(Error('Choose an image file.'));
 if(!/^image\//.test(file.type))return reject(Error('That is not an image. Choose a JPG, PNG or WebP.'));
 if(file.size>12*1024*1024)return reject(Error('That image is larger than 12 MB. Please choose a smaller one.'));
 const url=URL.createObjectURL(file),img=new Image();
 img.onload=()=>{URL.revokeObjectURL(url);
  if(!img.width||!img.height)return reject(Error('That file could not be read as an image.'));
  const c=document.createElement('canvas');c.width=COVER_W;c.height=COVER_H;
  const ctx=c.getContext('2d'),scale=Math.max(COVER_W/img.width,COVER_H/img.height);
  const w=img.width*scale,h=img.height*scale;
  ctx.fillStyle='#000';ctx.fillRect(0,0,COVER_W,COVER_H);
  ctx.drawImage(img,(COVER_W-w)/2,(COVER_H-h)/2,w,h);
  let out;try{out=c.toDataURL('image/jpeg',.72);}catch{return reject(Error('That image could not be processed. Try another file.'));}
  if(out.length>900000)return reject(Error('That image is too detailed to store. Try a smaller one.'));
  resolve(out);};
 img.onerror=()=>{URL.revokeObjectURL(url);reject(Error('That file could not be read as an image.'));};
 img.src=url;});}

function varianceStep(cat,plan,actual){
 if(!plan&&!actual)return null;
 const goodAbove=Budget.type(cat)!=='expense';
 if(!plan)return goodAbove?'ok3':'ov3';
 const d=(actual-plan)/plan;
 if(Math.abs(d)<=.02)return '0';
 const good=(d>0)===goodAbove,m=Math.abs(d);
 return (good?'ok':'ov')+(m<.15?1:m<.5?2:3);
}

    const dueDay=Budget.planFor(state,m.month)[c.id]?.day||0;
    const notDueYet=current&&dueDay>0&&dueDay>+Budget.today().slice(8)&&!m.actual;

    else if(!notDueYet){
     rowsTip.push({name:'Actual',value:fmt(m.actual),color:'var(--accent)'});
     const gap=m.actual-m.plan;

     else if(m.plan||m.actual)rowsTip.push({name:over?'Above plan':'Below plan',value:fmt(Math.abs(gap))+(m.plan?` · ${Math.round(Math.abs(gap)/m.plan*100)}%`:'')});
     if(current)rowsTip.push({name:'Month still running',value:'—'});

/* One hover layer for every chart. Values lead, labels follow; names are untrusted, so textContent only. */
const Tip=(()=>{
 let el=null;
 const node=()=>{if(!el){el=document.createElement('div');el.className='tip';el.hidden=true;document.body.append(el);}return el;};
 function show(x,y,title,rows){
  const t=node();t.textContent='';
  const head=document.createElement('div');head.className='tip-title';head.textContent=title;t.append(head);
  for(const r of rows){
   const line=document.createElement('div');line.className='tip-row';
   const key=document.createElement('i');if(r.color)key.style.background=r.color;else key.style.visibility='hidden';
   const val=document.createElement('b');val.textContent=r.value;
   const name=document.createElement('span');name.textContent=r.name;
   line.append(key,val,name);t.append(line);
  }
  t.hidden=false;place(x,y);
 }
 function place(x,y){
  const t=node(),r=t.getBoundingClientRect();
  let left=x+16,top=y-r.height-16;
  if(left+r.width>innerWidth-8)left=x-r.width-16;
  if(left<8)left=8;
  if(top<8)top=y+20;
  t.style.left=Math.round(left)+'px';t.style.top=Math.round(top)+'px';
 }
 return {show,hide(){if(el)el.hidden=true;}};
})();
const tipData=el=>{try{return JSON.parse(el.dataset.tip);}catch{return null;}};

function clearArea(host){

 const c=host.querySelector('.chart-cross');if(c)c.setAttribute('hidden','');

}
function showArea(host,geom,i,cx,cy){
 host.classList.add('hovering');host.dataset.active=i;
 const x=geom.padL+i*(geom.w-geom.padL-geom.padR)/Math.max(1,geom.n-1);
 const cross=host.querySelector('.chart-cross');
 if(cross){cross.setAttribute('x1',x);cross.setAttribute('x2',x);cross.removeAttribute('hidden');}

 const d=JSON.parse(host.dataset.series);
 const rows=d.series.map(s=>({name:s.name,value:s.values[i],color:s.color}));
 if(d.extra&&d.extra[i])rows.push({name:'',value:d.extra[i]});

function areaHover(e){
 const host=e.target.closest?.('.area-chart[data-geom]');
 if(!host){document.querySelectorAll('.area-chart.hovering').forEach(clearArea);return false;}
 const geom=JSON.parse(host.dataset.geom),svg=host.querySelector('svg');
 if(!svg)return false;
 const rect=svg.getBoundingClientRect();
 const px=(e.clientX-rect.left)/rect.width*geom.w,span=(geom.w-geom.padL-geom.padR)/Math.max(1,geom.n-1);
 showArea(host,geom,Math.max(0,Math.min(geom.n-1,Math.round((px-geom.padL)/span))),e.clientX,e.clientY);
 return true;
}
document.addEventListener('pointermove',e=>{
 if(areaHover(e))return;
 const mark=e.target.closest?.('[data-tip]');
 if(!mark)return Tip.hide();
 const d=tipData(mark);
 if(d)Tip.show(e.clientX,e.clientY,d.t,d.r||[]);
});
document.addEventListener('pointerout',e=>{if(!e.relatedTarget){Tip.hide();document.querySelectorAll('.area-chart.hovering').forEach(clearArea);}});
document.addEventListener('scroll',()=>Tip.hide(),true);
// keyboard reaches the same values as the pointer
document.addEventListener('focusin',e=>{
 const mark=e.target.closest?.('[data-tip]');if(!mark)return;
 const d=tipData(mark);if(!d)return;
 const r=mark.getBoundingClientRect();Tip.show(r.left+r.width/2,r.top,d.t,d.r||[]);
});
document.addEventListener('focusout',()=>Tip.hide());
document.addEventListener('keydown',e=>{
 const host=e.target.closest?.('.area-chart[data-geom]');
 if(!host)return;
 if(e.key==='Escape'){clearArea(host);Tip.hide();return;}
 if(e.key!=='ArrowLeft'&&e.key!=='ArrowRight')return;
 const geom=JSON.parse(host.dataset.geom);
 const i=Math.max(0,Math.min(geom.n-1,(+(host.dataset.active??-1))+(e.key==='ArrowRight'?1:-1)));
 const r=host.querySelector('svg').getBoundingClientRect();
 showArea(host,geom,i,r.left+(geom.padL+i*(geom.w-geom.padL-geom.padR)/Math.max(1,geom.n-1))/geom.w*r.width,r.top+r.height/2);
 e.preventDefault();
});

function areaChart(series,labels,title,format=fmt){

 const ticks=Array.from({length:5},(_,i)=>max-span*i/4);
 const grid=ticks.map(n=>`<line x1="${padL}" y1="${y(n)}" x2="${w-padR}" y2="${y(n)}" class="chart-grid"/><text x="${padL-8}" y="${y(n)+3}" class="chart-axis-label">${esc(compact(n))}</text>`).join('');

  const pts=s.values.map((n,i)=>Number.isFinite(n)?[x(i),y(n),i]:null),segments=[];
  for(const p of pts){if(p){if(!segments.length||!segments.at(-1).length)segments.push([]);segments.at(-1).push(p);}else if(segments.length&&segments.at(-1).length)segments.push([]);}
  return segments.filter(seg=>seg.length).map(seg=>{
   const line=seg.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
   const area=`M${seg[0][0].toFixed(1)} ${zero.toFixed(1)} ${seg.map(p=>`L${p[0].toFixed(1)} ${p[1].toFixed(1)}`).join(' ')} L${seg.at(-1)[0].toFixed(1)} ${zero.toFixed(1)} Z`;
   return `<path d="${area}" class="area-fill" style="fill:url(#${gid}-${si})"/><path d="${line}" class="area-line" pathLength="1" style="stroke:${s.color};animation-delay:${si*120}ms"/>`+
    seg.map(p=>`<circle class="chart-point" data-i="${p[2]}" data-s="${si}" cx="${p[0]}" cy="${p[1]}" r="2.5" style="stroke:${s.color}"/>`).join('');
  }).join('');

 // selective direct labels: the high and low of a single series, never a number on every point
 let marks='';

  const v=shown[0].values,valid=v.filter(Number.isFinite),hi=v.indexOf(Math.max(...valid)),lo=v.indexOf(Math.min(...valid));

 const extra=labels.map((_,i)=>{
  if(shown.length===2){const a=shown[0].values[i],b=shown[1].values[i];
   return Number.isFinite(a)&&a&&Number.isFinite(b)?`${Math.round(b/a*100)}% of ${shown[0].name.toLowerCase()}`:'';}
  if(shown.length===1&&i>0){const prev=shown[0].values[i-1],now=shown[0].values[i];
   if(Number.isFinite(prev)&&prev&&Number.isFinite(now))return `${now>=prev?'+':''}${Math.round((now-prev)/Math.abs(prev)*100)}% vs ${labels[i-1]}`;}
  return '';});
 const payload={labels,extra,series:shown.map(s=>({name:s.name,color:s.color,values:s.values.map(n=>Number.isFinite(n)?format(n):'Not recorded')}))};

  `<div class="legend">${shown.map(s=>`<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`+
  `<svg viewBox="0 0 ${w} ${h}" style="min-width:${w}px">${defs}${grid}<line x1="${padL}" y1="${zero}" x2="${w-padR}" y2="${zero}" class="chart-zero"/>`+
  `<line class="chart-cross" y1="${padY-6}" y2="${h-padY+6}" hidden/>${shapes}${marks}</svg>`+
  `<div class="chart-labels" style="min-width:${w}px">${labels.map((l,i)=>`<span style="left:${(x(i)/w*100).toFixed(3)}%"><b>${esc(l)}</b></span>`).join('')}</div>`+

function compareBarChart(series,labels,title,orientation='vertical',format=fmt){

 if(!shown.length||!labels.length)return '';

  `<div class="compare-column" data-tip="${tipFor(label,i)}" tabindex="0" aria-label="${esc(label+': '+shown.map(s=>s.name+' '+(Number.isFinite(s.values[i])?format(s.values[i]):'not recorded')).join(', '))}">`+

}

function openBackupDB(){return new Promise((resolve,reject)=>{if(!globalThis.indexedDB)return reject(Error('Folder access storage is unavailable in this browser.'));const req=indexedDB.open('jps-monthly-plan-files',1);req.onupgradeneeded=()=>req.result.createObjectStore('handles');req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error);});}

function writeFolderBackup(force=false){
 if(!backupFolder||demo)return Promise.resolve(false);
 const folder=backupFolder;
 // Serialize writes so an older save cannot finish after a newer one.
 backupWriteChain=backupWriteChain.catch(()=>{}).then(async()=>{
  if(folder!==backupFolder||demo)return false;
  const permission=await folder.queryPermission({mode:'readwrite'});
  if(permission!=='granted'){setBackupStatus('Reconnect needed');return false;}
  const day=Budget.today(),file=await folder.getFileHandle(`monthly-plan-backup-${day}.json`,{create:true});
  const writer=await file.createWritable();
  try{await writer.write(JSON.stringify(state,null,2));}finally{await writer.close();}
  localStorage.setItem(DAILY_BACKUP_KEY,String(Date.now()));
  setBackupStatus('Backed up '+new Date().toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'}));
  return true;
 });

}

 <div class="notice"><span><b>${included.length} selected</b> · ${skipped} excluded · ${duplicates.length} look like duplicates<br>Dates read as <b>${preview.order==='mdy'?'month / day':'day / month'}</b>, amounts as <b>${preview.decimal==='comma'?'1.234,56':'1,234.56'}</b>. Change either under Edit mapping.</span></div><div class="legend"><span>Income: <b>${fmt(totals.income)}</b></span><span>Expenses: <b>${fmt(totals.expense)}</b></span><span>Contributions: <b>${fmt(totals.saving)}</b></span></div><div class="actions no-print" style="margin-top:18px">${button('Select all','csv-select-all','small')}${button('Select valid, non-duplicate','csv-select-valid','small')}${button('Deselect all','csv-deselect','small')}${button('Download row issues','csv-issues','small')}</div>
 <div class="csv-bulk"><span class="csv-bulk-label">Set a category for many rows at once</span><select id="csv-bulk-category" aria-label="Category to apply in bulk"><option value="">Choose a category…</option>${categoryOptions()}<option value="__skip">Skip these rows</option></select>${button(`Apply to the ${needCategory} row${needCategory===1?'':'s'} without one`,'csv-apply-missing','small',needCategory?'':'disabled')}${button('Apply to every selected row','csv-apply-selected','small')}</div>${errors.length?`<div class="error">${errors.length} selected ${errors.length===1?'row needs':'rows need'} attention. Fix the mapping or uncheck those rows to continue.</div>`:''}<div class="table-wrap" style="margin-top:18px"><table><thead><tr><th><label class="csv-all"><input type="checkbox" id="csv-select-all-box" ${included.length&&included.length===preview.filter(r=>!r.skip).length?'checked':''} aria-label="Select every row"><span>All</span></label></th><th>Line</th><th>Date</th><th>Description</th><th>Category</th><th class="num">Category amount</th><th>Status</th></tr></thead><tbody>${shown.map(r=>`<tr><td><input type="checkbox" data-csv-include="${r.index}" aria-label="Import CSV line ${r.line}" ${rowIncluded(r)?'checked':''} ${r.skip||(r.duplicate&&!o.allowDuplicates)?'disabled':''}></td><td>${r.line}</td><td>${r.date||esc(r.raw[map.date])}</td><td style="max-width:220px;overflow-wrap:anywhere">${esc(r.note||r.raw[map.note]||'')}</td><td><select data-csv-category="${r.index}" aria-label="Category for CSV line ${r.line}"><option value="">Choose category…</option><option value="__skip" ${r.skip?'selected':''}>Skip this row</option>${categoryOptions(r.category||o.overrides[r.index]?.category||'')}</select></td><td class="num">${r.category?fmt(r.amount):'—'}</td><td><span class="pill ${r.error||r.duplicate?'warn':'good'}">${r.skip?'Skipped':r.error?esc(r.error):r.duplicate?'Possible duplicate':'Ready'}</span></td></tr>`).join('')}</tbody></table></div><div class="row"><span class="small muted">Rows ${page*pageSize+1}–${Math.min((page+1)*pageSize,preview.length)} of ${preview.length}</span><div class="actions">${button('Previous rows','csv-prev','small',page===0?'disabled':'')}${button('Next rows','csv-next','small',(page+1)*pageSize>=preview.length?'disabled':'')}</div></div><div class="formfoot">${button('Cancel import','csv-reset')}${button(`Import ${included.length} selected transactions`,'csv-import','primary',errors.length||!included.length?'disabled':'')}</div><p class="small muted" style="margin-top:15px">Possible duplicates share a date, category, amount and description with an existing or earlier CSV row. Select one only if it is a separate, real transaction. Importing never modifies existing entries.</p></section>`;
}
function rowIncluded(r){if(r.skip)return false;
 if(r.duplicate&&!csvSession.options.allowDuplicates)return false;
 const flag=csvSession.include[r.index];return flag===undefined?!r.error&&!r.duplicate:flag;}
function startCSV(text,name){try{const detected=CSV.detect(text);const parsed=CSV.parse(detected.text,detected.delimiter);if(parsed.length<2)throw Error('Include a header row and at least one data row.');let headerIndex=parsed.findIndex(r=>CSV.guess(r.cells).date>=0);if(headerIndex<0)headerIndex=0;csvSession={text:detected.text,name,delimiter:detected.delimiter,parsed,headerIndex,headers:[],rows:[],map:{},options:{mode:'bank',order:'auto',decimal:'auto',allowClosed:false,defaultCategory:'',incomeCategory:'',expenseCategory:'',categoryMap:{},overrides:{}},stage:'map',include:{},page:0};prepareCSV();go('import');}catch(e){toast(e.message);}}
// Statement category names rarely match a planner's own. Suggest a match, never decide silently:
// every suggestion appears pre-selected in a dropdown the reader confirms.
const SOURCE_HINTS={
 groceries:'groceries',grocery:'groceries',supermarket:'groceries','food & drink':'dining',food:'dining',
 dining:'dining',restaurants:'dining',restaurant:'dining',coffee:'dining','dining out':'dining',
 gas:'transport',fuel:'transport',automotive:'transport',auto:'transport',transport:'transport',
 transportation:'transport',travel:'transport',rideshare:'transport',parking:'transport',
 'bills & utilities':'utilities',utilities:'utilities',bills:'utilities','bills and utilities':'utilities',
 shopping:'personal',personal:'personal',entertainment:'personal','health & wellness':'personal',
 health:'personal',fees:'personal','personal care':'personal',
 rent:'housing',mortgage:'housing',home:'housing',housing:'housing',
 insurance:'insurance',phone:'internet',internet:'internet',
 salary:'salary',payroll:'salary',income:'salary',paycheck:'salary'};
function suggestCategory(value){
 const exact=state.categories.find(c=>CSV.norm(c.name)===value&&!c.archived);
 if(exact)return exact.id;
 const hint=SOURCE_HINTS[value];
 return hint&&state.categories.some(c=>c.id===hint&&!c.archived)?hint:'';
}
// Every distinct value in the file's category column, busiest first, blanks included.
function sourceCategories(s){
 if(!s||s.map.category<0)return [];
 const counts=new Map();
 s.rows.forEach(r=>{const k=CSV.norm(String(r.cells[s.map.category]??'').replace(/^'(?=[=+@-])/,''));
  counts.set(k,(counts.get(k)||0)+1);});
 return [...counts.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])).map(([value,count])=>({value,count}));
}
function prepareCSV(){const s=csvSession;s.headers=s.parsed[s.headerIndex].cells;s.rows=s.parsed.slice(s.headerIndex+1);s.map=CSV.guess(s.headers);s.options.overrides={};s.include={};s.options.categoryMap={};
 if(s.map.debit>=0&&s.map.credit>=0)s.options.mode='split';
 else if(s.headers.some(h=>CSV.norm(h)==='group')&&s.map.category>=0&&s.map.currency>=0)s.options.mode='category';
 // pre-fill the matches we are confident about; they stay visible and editable
 // anything you matched on a previous import wins over a fresh suggestion
 sourceCategories(s).forEach(({value})=>{if(!value)return;
  const learned=state.importMap?.[value];
  const id=(learned&&state.categories.some(c=>c.id===learned&&!c.archived))?learned:suggestCategory(value);
  if(id)s.options.categoryMap[value]=id;});
}
async function readCSVFile(file){if(!file)return;if(file.size>10e6)return toast('CSV files must be smaller than 10 MB.');try{const buf=await file.arrayBuffer(),bytes=new Uint8Array(buf);const encoding=bytes[0]===255&&bytes[1]===254?'utf-16le':bytes[0]===254&&bytes[1]===255?'utf-16be':'utf-8';startCSV(new TextDecoder(encoding,{fatal:true}).decode(bytes),file.name);}catch{toast('The file could not be read. Save it as CSV UTF-8 and try again.');}}
document.addEventListener('change',e=>{const el=e.target;if(el.id==='csv-file')return readCSVFile(el.files[0]);if(!csvSession)return;const s=csvSession;try{
 if(el.id==='csv-delimiter'){const parsed=CSV.parse(s.text,el.value);if(parsed.length<2)throw Error('No data rows found with this delimiter.');s.delimiter=el.value;s.parsed=parsed;s.headerIndex=Math.min(s.headerIndex,parsed.length-2);prepareCSV();render();}
 if(el.id==='csv-header'){const i=+el.value-1;if(!Number.isInteger(i)||i<0||i>=s.parsed.length-1)throw Error('Choose a header row before the final data row.');s.headerIndex=i;prepareCSV();render();}
 if(el.dataset.map){s.map[el.dataset.map]=+el.value;s.options.overrides={};s.include={};render();}
 if(el.dataset.csvOption){s.options[el.dataset.csvOption]=el.value;render();}
 if(el.dataset.sourceIndex!==undefined){const list=sourceCategories(s);const key=list[+el.dataset.sourceIndex]?.value;
  if(key!==undefined){if(el.value)s.options.categoryMap[key]=el.value;else delete s.options.categoryMap[key];}
  s.previewKey=null;render();}
 if(el.dataset.csvCategory!==undefined){const i=+el.dataset.csvCategory;s.options.overrides[i]={category:el.value};delete s.include[i];render();}
 if(el.id==='csv-select-all-box'){s.preview.forEach(r=>{if(!r.skip)s.include[r.index]=el.checked;});render();}
 if(el.dataset.csvInclude!==undefined){s.include[+el.dataset.csvInclude]=el.checked;render();}
 }catch(err){toast(err.message);render();}
});
document.addEventListener('submit',e=>{if(e.target.id==='csv-paste-form'){e.preventDefault();startCSV($('#csv-paste').value,'Pasted data');}});
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(!b)return;if(screen==='budget'&&budgetDirty&&!saveBudgetInputs())return;const a=b.dataset.action,s=csvSession;if(a==='csv-reset'){csvSession=null;render();return;}if(!s)return;
 switch(a){
 case 'csv-preview':{const errors=CSV.mappingErrors(s.headers,s.map,s.options);if(errors.length)return toast(errors.join(' '));s.stage='preview';s.include={};s.page=0;render();window.scrollTo(0,0);break;}
 case 'csv-back':s.stage='map';render();window.scrollTo(0,0);break;
 case 'csv-prev':s.page=Math.max(0,s.page-1);render();break;
 case 'csv-next':s.page++;render();break;
 case 'csv-select-valid':s.include={};render();break;
 case 'csv-select-all':s.preview.forEach(r=>{if(!r.skip&&(!r.duplicate||s.options.allowDuplicates))s.include[r.index]=true;});render();break;
 case 'csv-toggle-duplicates':s.options.allowDuplicates=!s.options.allowDuplicates;s.include={};s.previewKey=null;render();break;
 case 'csv-allow-closed':s.options.allowClosed=true;s.previewKey=null;toast('Those months will be reopened when you import.');render();break;
 case 'csv-apply-missing':case 'csv-apply-selected':{
  const pick=$('#csv-bulk-category')?.value;
  if(!pick)return toast('Choose a category first.');
  const target=a==='csv-apply-missing'?s.preview.filter(r=>!r.skip&&!r.category):s.preview.filter(r=>rowIncluded(r));
  if(!target.length)return toast('No rows to change.');
  target.forEach(r=>{s.options.overrides[r.index]={category:pick};delete s.include[r.index];});
  s.previewKey=null;render();toast(`${target.length} row${target.length===1?'':'s'} updated.`);break;}
 case 'csv-deselect':s.preview.forEach(r=>s.include[r.index]=false);render();break;
 case 'csv-issues':{const rows=s.preview.filter(r=>r.error||r.duplicate||r.skip);download('monthly-plan-import-issues.csv','Line,Issue\r\n'+rows.map(r=>`${r.line},"${(r.error|| (r.skip?'Skipped':'Possible duplicate')).replace(/"/g,'""')}"`).join('\r\n'),'text/csv');toast('Row issue report download requested.');break;}
 case 'csv-import':{const rows=CSV.preview(s.rows,s.headers,s.map,s.options,state).filter(rowIncluded);if(!rows.length||rows.some(r=>r.error||r.skip))return toast('Resolve or exclude selected rows with issues.');if(state.transactions.length+rows.length>MAX_TRANSACTIONS)return toast(LIMIT_MESSAGE);const seen=new Set(state.transactions.map(t=>[t.date,t.category,t.amount,CSV.norm(t.note)].join('|')));
  let dropped=0;
  const fresh=rows.filter(r=>{const k=[r.date,r.category,r.amount,CSV.norm(r.note)].join('|');
   if(seen.has(k)&&!s.options.allowDuplicates){dropped++;return false;}
   seen.add(k);return true;});
  if(!fresh.length)return toast('Every selected row is already in your planner.');
  const reopen=[...new Set(fresh.filter(r=>r.closedMonth).map(r=>r.date.slice(0,7)))];
  commit(()=>{reopen.forEach(m=>{ensure(m).closed=false;});
   state.transactions.push(...fresh.map(r=>({id:Budget.uid(),date:r.date,note:r.note,category:r.category,amount:r.amount})));
   // remember these choices so the next statement matches itself
   const srcCol=s.map.category;
   fresh.forEach(r=>{
    if(srcCol>=0){const key=CSV.norm(String(s.rows[r.index]?.cells[srcCol]??''));if(key)state.importMap[key]=r.category;}
    const nk=Budget.quickKey(r.note);if(nk)state.quickMemory[nk]=r.category;});
   const mk=Object.keys(state.quickMemory);if(mk.length>Budget.MAX_QUICK_MEMORY)mk.slice(0,mk.length-Budget.MAX_QUICK_MEMORY).forEach(k=>delete state.quickMemory[k]);
   selected=fresh.map(r=>r.date.slice(0,7)).sort().at(-1);screen='activity';csvSession=null;},`${fresh.length} transactions imported${dropped?' · '+dropped+' already there, skipped':''}${reopen.length?' · '+reopen.length+' closed month'+(reopen.length===1?'':'s')+' reopened':''}`);window.scrollTo(0,0);break;}
 }
});
render();
</script></body></html>
