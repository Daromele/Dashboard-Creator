/* tokens and the 10 themes, copied from monthly-plan/app/src/core.html. [data-theme] on any element themes that subtree. */

  --paper:#FAF9FC; --card:#FFFFFF; --sunk:#F5F2F9;

  --bold:#2E2040; --bold-2:#241932;
  --on-bold:#F5F1FA; --on-bold-dim:#B6A9C7;
  --pop:#F0B98F; --pop-ink:#3A2214;
  --pos:var(--ok); --neg:var(--over); --on-bold-alert:#F4B3A4;

  /* Status is reserved and universal: green = within plan, red = over plan.
     Green/red sit in the 6-8 CVD band, so every use carries a second cue
     (hatched texture on the over-plan arm, plus labels and tooltips). Validated light. */
  --ok:#1F7A52; --over:#D23B2B;
  --ok-1:#E4F1EA; --ok-2:#B4D9C6; --ok-3:#74B899; --ok-4:#1F7A52;

  --ch-in:#1F7A52; --ch-out:#D23B2B;

     deliberately absent because they now mean status. Validated light: all checks pass. */
  --cat-1:#5C3F8F; --cat-2:#DD9012; --cat-3:#2478D4;
  --cat-4:#B8309A; --cat-5:#12A5A0; --cat-6:#8A8296; --cat-0:#8A8296;

  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--num);letter-spacing:-.02em;line-height:1.18;text-wrap:balance}
h1{font-size:clamp(26px,3vw,32px);font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
small,.small{font-size:12px}
svg{width:18px;height:18px;stroke-width:1.6;flex-shrink:0}
.i{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--pop);color:var(--pop-ink);padding:8px 12px;border-radius:8px;font-weight:600}.skip:focus{left:10px}

/* ---------- frame: rail + main ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
.main{min-width:0}
.rail{background:var(--bold-2);color:var(--on-bold);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:var(--s6) var(--s3) var(--s5);overflow-y:auto;z-index:40;transition:padding .2s ease}
.brand{display:flex;gap:var(--s3);align-items:center;padding:var(--s1) 48px var(--s7) var(--s2);position:relative}
.brand-mark{height:34px;width:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--pop);color:var(--pop-ink);font:800 17px var(--num)}
.brand-txt{min-width:0}
.brand b{display:block;font:700 16px var(--num);letter-spacing:-.02em;line-height:1.2}
.brand small{font-size:9px;letter-spacing:.16em;color:var(--on-bold-dim)}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.14em;padding:var(--s5) var(--s3) var(--s2);color:var(--on-bold-dim);font-weight:600}
.navlink{width:100%;display:flex;align-items:center;gap:var(--s3);min-height:40px;padding:var(--s2) var(--s3);color:var(--on-bold-dim);border-radius:var(--r-sm);text-align:left;font-size:14px;position:relative;transition:background .13s,color .13s,padding .2s}
.navlink:hover{background:#ffffff0f;color:var(--on-bold)}
.navlink[aria-current=page]{background:#ffffff16;color:var(--on-bold);font-weight:600}
.navlink[aria-current=page]:before{content:'';position:absolute;left:calc(var(--s3)*-1);top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--pop);border-radius:0 3px 3px 0}
.navlink svg{opacity:.85}
.rail-foot{margin-top:auto;padding:var(--s6) var(--s2) 0;color:var(--on-bold-dim);font-size:11px;display:grid;gap:var(--s2)}
.rail-foot a{color:var(--on-bold-dim);text-decoration:none}.rail-foot a:hover{color:var(--on-bold)}
.rail-note{border:1px solid #ffffff1f;border-radius:var(--r-md);padding:var(--s3);font-size:12px;line-height:1.5}
.rail-note b{display:block;color:var(--pop);margin-bottom:var(--s1)}
.rail-demo{width:100%;background:#ffffff14;border-color:#ffffff26;color:var(--on-bold);justify-content:center}
.rail-demo:hover{background:#ffffff24;color:var(--on-bold);border-color:#ffffff40}
/* collapsible rail: an icon-only 72px rail, remembered per browser */
.rail-toggle{position:absolute;right:4px;top:2px;width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--r-xs);color:var(--on-bold);background:#ffffff0d;border:1px solid #ffffff26}
.rail-toggle:hover{background:#ffffff1d}
.app.rail-min{grid-template-columns:72px minmax(0,1fr)}
.app.rail-min .rail{padding-left:10px;padding-right:10px;overflow-x:hidden}
.app.rail-min .brand{flex-direction:column;align-items:center;gap:10px;padding:0 0 20px}
.app.rail-min .brand-txt,.app.rail-min .navgroup,.app.rail-min .rail-foot,.app.rail-min .navlink span{display:none}
.app.rail-min .rail-toggle{position:static;width:38px;height:38px}
.app.rail-min .rail-toggle svg{transform:scaleX(-1)}
.app.rail-min .navlink{justify-content:center;padding:10px;gap:0}
.app.rail-min .navlink[aria-current=page]:before{left:-10px}
.app.rail-min .navlink svg{width:21px;height:21px}
.mobile-close,.mobile-menu,.scrim{display:none!important}   /* !important: .ibtn below sets display */
.status{font-size:11px;color:var(--ink-3);display:inline-flex;align-items:center;gap:var(--s1);white-space:nowrap}
.status:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status.warn:before{background:var(--over)}
.rail .status{color:var(--on-bold-dim)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper)}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);max-width:1400px;padding:var(--s3) var(--s7);margin:auto}
.top-left,.actions{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.top-left{flex-wrap:nowrap;min-width:0}
.month-control{display:flex;align-items:center;gap:2px;border:1px solid var(--rule-2);border-radius:var(--r-sm);padding:3px;background:var(--card);transition:border-color .13s,box-shadow .13s}
.month-control:hover,.month-control:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.period-label{font:650 16px/1 var(--num);letter-spacing:-.02em;white-space:nowrap;padding:0 var(--s2)}
/* a native month input shrunk to a calendar glyph painted in the theme accent */
.month-picker{width:28px;height:28px;min-height:28px;padding:0;border:0;color:transparent;background:var(--accent);cursor:pointer;position:relative;opacity:.8;
 -webkit-mask:var(--cal-icon) center/17px 17px no-repeat;mask:var(--cal-icon) center/17px 17px no-repeat}
.month-picker:hover{opacity:1}
.month-picker::-webkit-calendar-picker-indicator{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-xs);color:var(--ink-2);transition:background .13s,color .13s}
.ibtn:hover{background:var(--accent-soft);color:var(--accent)}
.picker{display:flex;flex-direction:column;margin-left:var(--s3)}
.picker small{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.picker select{height:34px;min-height:34px;border-radius:var(--r-sm);max-width:200px;font-weight:600;padding:0 var(--s3)}
.banner{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;padding:var(--s2) var(--s7);font-size:12.5px}
.banner .actions{flex-wrap:nowrap}.banner .link,.banner .btn{white-space:nowrap}
.banner.demo{background:var(--sunk);color:var(--ink-2);border-top:1px solid var(--rule)}
.banner.backup{background:var(--flag-soft);color:var(--ink)}.banner.backup b{color:var(--flag)}
.banner.storage{background:color-mix(in srgb,var(--over) 10%,var(--card));color:var(--ink)}.banner.storage b{color:var(--over)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:36px;padding:var(--s2) var(--s3);border:1px solid var(--rule-2);background:var(--card);color:var(--ink);border-radius:var(--r-sm);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;transition:background .13s,border-color .13s,color .13s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
.btn.primary:hover{filter:brightness(1.12);color:var(--accent-ink)}
.btn.pop{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}.btn.pop:hover{filter:brightness(1.06);color:var(--pop-ink)}
.btn.ghost{background:transparent;border-color:#ffffff40;color:var(--on-bold)}.btn.ghost:hover{background:#ffffff14;color:var(--on-bold)}
.btn.quiet{background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--over)}.btn.danger:hover{background:color-mix(in srgb,var(--over) 8%,var(--card));border-color:var(--over);color:var(--over)}
.btn.small{min-height:30px;padding:var(--s1) var(--s2);font-size:12px}
.link{color:var(--accent);font-size:13px;font-weight:600;border-bottom:1px solid var(--accent-line);cursor:pointer}
.icon-action{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r-xs);color:var(--ink-3)}
.icon-action:hover{background:var(--accent-soft);color:var(--accent)}.icon-action.danger:hover{color:var(--over)}
.icon-action svg{width:17px;height:17px}

/* ---------- page ---------- */
.page{max-width:1400px;padding:var(--s6) var(--s7) var(--s8);margin:auto}
.pagehead{display:flex;justify-content:space-between;gap:var(--s5);align-items:center;margin-bottom:var(--s6);flex-wrap:wrap}
.pagehead-text{min-width:0;flex:1 1 320px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:var(--s2)}
.subtitle{color:var(--ink-2);font-size:14px;margin-top:var(--s2);max-width:62ch}
.number{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-2)}.dim{color:var(--ink-3)}.good{color:var(--ok)}.warn{color:var(--over)}
.segment{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--sunk);padding:2px;border-radius:var(--r-sm)}
.segment button{font-size:12px;border-radius:var(--r-xs);padding:var(--s1) var(--s3);color:var(--ink-2);min-height:28px;font-weight:600}
.segment button:hover{color:var(--accent)}
.segment button[aria-pressed=true]{background:var(--card);color:var(--accent);box-shadow:var(--shadow-sm)}
.hub-tabs{margin:0 0 var(--s5)}.hub-tabs button{font-size:13px;min-height:32px;padding:var(--s1) var(--s4)}
.custom-range{display:inline-flex;gap:var(--s2);align-items:end}
.custom-range label{display:flex;flex-direction:column;font-size:11px;color:var(--ink-3)}
.custom-range input{height:30px;min-height:30px}
.print-title{display:none}
.footer{display:flex;justify-content:space-between;gap:var(--s4);font-size:10.5px;color:var(--ink-3);margin-top:var(--s7);border-top:1px solid var(--rule);padding-top:var(--s4)}

/* ---------- pulse strip: one insight at a time, above the hero ---------- */
.pulse{display:flex;align-items:center;gap:var(--s4);background:var(--accent-soft);border-radius:var(--r-md);padding:var(--s3) var(--s4);margin-bottom:var(--s4)}
.pulse-live{flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:ring 2s ease-out infinite}
.pulse-track{position:relative;flex:1;min-height:24px;font-size:14px}
.pulse-track p{position:absolute;inset:0;display:flex;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;pointer-events:none}
.pulse-track p.on{opacity:1;transform:none;pointer-events:auto}
.pulse-nav{display:flex;align-items:center;gap:6px;flex:none}
.pulse-arrow{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule-2);background:var(--card);font:600 16px/1 var(--ui);display:grid;place-items:center}
.pulse-dot{width:6px;height:6px;border-radius:6px;background:var(--rule-2);padding:0;transition:width .2s}.pulse-dot[aria-pressed=true]{width:18px;background:var(--accent)}

/* ---------- hero ---------- */
.hero{background:var(--bold);color:var(--on-bold);border-radius:var(--r-lg);padding:var(--s7);display:grid;grid-template-columns:1.3fr 1fr;gap:var(--s7);margin-bottom:var(--s4);position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;inset:auto -80px -140px auto;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pop) 35%,transparent),transparent 70%);opacity:.6;pointer-events:none}
.hero .eyebrow{color:var(--on-bold-dim)}
.hero-num{font:700 clamp(56px,8vw,104px)/1 var(--num);letter-spacing:-.04em;margin:14px 0 18px;font-variant-numeric:tabular-nums}
.hero p{color:var(--on-bold-dim);font-size:14px;max-width:48ch;line-height:1.6}.hero p b{color:var(--on-bold)}
.hero .actions{margin-top:var(--s5)}
.hero-side{border-left:1px solid #ffffff1f;padding-left:var(--s6);display:grid;align-content:center;gap:var(--s3);position:relative}
.hero-fact{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;gap:var(--s3);color:var(--on-bold-dim)}
.hero-fact strong{font:650 18px var(--num);white-space:nowrap;color:var(--on-bold);font-variant-numeric:tabular-nums}
.hero-meter{height:6px;border-radius:6px;background:#ffffff1f;overflow:hidden}.hero-meter i{display:block;background:var(--ok);height:100%}

/* ---------- KPI tiles: tinted by meaning (solid), icon squares, direction colors ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.kpi{background:var(--card);border-radius:var(--r-md);padding:var(--s4) var(--s5);box-shadow:var(--shadow-sm);border:1px solid transparent;animation:rise .45s ease both;animation-delay:calc(var(--i,0)*50ms);transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi .label{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;font-weight:500}
.kpi b{font:700 clamp(20px,2vw,26px)/1.1 var(--num);letter-spacing:-.03em;display:block;margin:var(--s2) 0 var(--s1);font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-3);font-size:11.5px}
.kpi.tone-pos{--tc:var(--ok);background:color-mix(in srgb,var(--ok) 11%,var(--card));border-color:color-mix(in srgb,var(--ok) 22%,var(--rule));box-shadow:none}
.kpi.tone-neg{--tc:var(--over);background:color-mix(in srgb,var(--over) 10%,var(--card));border-color:color-mix(in srgb,var(--over) 20%,var(--rule));box-shadow:none}
.kpi.tone-net{--tc:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:color-mix(in srgb,var(--accent) 24%,var(--rule));box-shadow:none}
.kpi.tone-neutral{background:var(--sunk);box-shadow:none}
.kpi-ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none;background:color-mix(in srgb,var(--tc,var(--ink-3)) 16%,var(--card));color:var(--tc,var(--ink-2))}
.kpi-ico svg{display:block;width:14px;height:14px;stroke-width:2}
.delta{font-weight:700}.delta.up{color:var(--ok)}.delta.down{color:var(--over)}

/* ---------- surfaces ---------- */
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--s4);margin-bottom:var(--s4)}
.grid2.equal{grid-template-columns:1fr 1fr}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);margin-bottom:var(--s4)}
.card{background:var(--card);border-radius:var(--r-md);padding:var(--s5);min-width:0;margin-bottom:var(--s4);box-shadow:var(--shadow-sm)}
.grid2>.card,.grid3>.card{margin-bottom:0}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s4)}
.cardhead h2{display:flex;align-items:center;gap:10px}
.cardhead p{font-size:12px;color:var(--ink-3);margin-top:var(--s1)}
.h-ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);flex:none}.h-ico svg{width:15px;height:15px;stroke-width:2}
.card-ico{height:34px;width:34px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);margin-bottom:var(--s4)}
.sub-head{font-size:13px;margin:var(--s6) 0 var(--s2);padding-top:var(--s4);border-top:1px solid var(--rule)}
.sub-head.first{border-top:0;padding-top:0;margin-top:var(--s4)}
.table-card{padding:0;overflow:hidden}.table-card .cardhead{padding:var(--s5) var(--s5) var(--s3);margin:0}
.pill{display:inline-flex;border-radius:99px;padding:3px var(--s2);font-size:11px;color:var(--ink-2);background:var(--sunk);align-items:center;gap:var(--s1);white-space:nowrap;font-weight:600}
.pill.good{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--over) 12%,transparent);color:var(--over)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--rule);font-size:13px}
.row:last-child,.row.flat,.row:has(+.sub-head){border-bottom:0}.row strong{font-weight:600}.row small{display:block;color:var(--ink-3);margin-top:2px}
.notice{background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:var(--r-sm);margin-bottom:var(--s4);font-size:13px;display:flex;justify-content:space-between;gap:var(--s4);align-items:center;color:var(--ink-2)}
.notice.warning{background:var(--flag-soft);color:var(--flag)}
.notice.good{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ink)}.notice.good b{color:var(--ok)}
.notice.refused{background:color-mix(in srgb,var(--over) 10%,var(--card));color:var(--ink)}.notice.refused b:first-child{color:var(--over)}
.empty{padding:var(--s7) var(--s5);text-align:center;color:var(--ink-3);font-size:13px}
.empty svg{height:28px;width:28px;color:var(--accent);margin-bottom:var(--s3);opacity:.7}
.empty-actions{justify-content:center;gap:var(--s3)}
.empty h3{color:var(--ink);margin-bottom:var(--s2)}.empty p{max-width:42ch;margin:0 auto var(--s4)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.steps.steps4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1150px){.steps.steps4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{background:var(--sunk);padding:var(--s5);border-radius:var(--r-sm)}
.step span{font:700 11px var(--num);color:var(--accent);letter-spacing:.06em}
.step h3{margin:var(--s3) 0 var(--s2)}.step p{font-size:12.5px;color:var(--ink-2);margin-bottom:var(--s4)}

/* ---------- tables: sortable, paged ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding:var(--s2) var(--s3);background:var(--sunk);white-space:nowrap}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
td .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:34ch}
tr.total td{font-weight:700;border-top:1px solid var(--rule-2)}
.th-sort{cursor:pointer;user-select:none}.th-sort:hover{color:var(--accent)}
.th-sort[data-sort=desc]::after{content:' ↓';color:var(--accent)}.th-sort[data-sort=asc]::after{content:' ↑';color:var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:var(--s3) var(--s5);font-size:12px;color:var(--ink-3)}
.filters{display:flex;gap:var(--s2);flex-wrap:wrap}
.pct{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--sunk);margin-right:8px;vertical-align:middle;overflow:hidden}.pct i{display:block;height:100%;background:var(--ok)}

/* ---------- forms, dialogs, toast ---------- */
input,select,textarea{background:var(--card);border:1px solid var(--rule-2);border-radius:var(--r-xs);min-height:38px;padding:var(--s2) var(--s3);max-width:100%;transition:border-color .13s,box-shadow .13s}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s4)}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.fields label small{font-weight:400;color:var(--ink-3);font-size:11px}
.fields .full{grid-column:1/-1}
.formfoot{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s6);flex-wrap:wrap}
.error{color:var(--over);background:color-mix(in srgb,var(--over) 9%,var(--card));padding:var(--s2) var(--s3);border-radius:var(--r-xs);margin:var(--s2) 0;font-size:13px}
dialog{border:0;border-radius:var(--r-lg);padding:var(--s7);width:min(560px,calc(100% - 32px));background:var(--card);color:var(--ink);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:#160c2470}
.dialog-head{display:flex;justify-content:space-between;gap:var(--s4);align-items:center;margin-bottom:var(--s2)}
.dialog-head h2{font-size:22px}
dialog .subtitle{margin:0 0 var(--s5)}
.toast{position:fixed;bottom:var(--s5);left:50%;transform:translateX(-50%);z-index:99;border-radius:var(--r-sm);padding:var(--s3) var(--s4);background:var(--bold-2);color:var(--on-bold);font-size:13px;display:flex;gap:var(--s4);align-items:center;box-shadow:var(--shadow-lg);max-width:calc(100% - 30px)}
.toast button{color:var(--pop);text-decoration:underline;font-weight:600;white-space:nowrap}
/* welcome tour: art header, step label, dots, one idea per slide */
.welcome{padding:0;width:min(600px,calc(100% - 28px));max-height:min(760px,92vh);overflow:auto}
.welcome-close{position:absolute;right:16px;top:16px;z-index:2;background:#ffffffc7}
.welcome-art{height:190px;display:grid;place-items:center;color:var(--accent);background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--pop) 34%,var(--card)))}
.welcome-art[data-n="1"]{background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--accent) 18%,var(--card)))}
.welcome-art[data-n="2"]{background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--ok) 22%,var(--card)))}
.welcome-art svg{width:80px;height:80px;stroke-width:1.25}
.welcome-body{padding:28px 34px 12px;text-align:center}
.welcome-step{display:block;color:var(--accent);font-size:10px;font-weight:750;letter-spacing:.16em;margin-bottom:10px}
.welcome-body h2{font-size:26px;margin-bottom:10px}
.welcome-body p{color:var(--ink-2);max-width:460px;margin:0 auto 8px}
.welcome-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 34px 28px}
.welcome-dots{display:flex;gap:8px}.welcome-dots i{width:8px;height:8px;border-radius:50%;background:var(--rule-2)}.welcome-dots i.on{background:var(--accent)}
/* settings: palette chips and sidebar switches */
.theme-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.theme-card{border:1px solid var(--rule);border-radius:var(--r-sm);padding:var(--s2);background:var(--card);display:grid;gap:6px;text-align:left}
.theme-card:hover{border-color:var(--rule-2);box-shadow:var(--shadow-sm)}
.theme-card[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.theme-chip{display:flex;align-items:flex-end;gap:4px;height:42px;padding:6px;border-radius:6px}
.theme-chip i{display:block;flex:1;border-radius:3px}.theme-chip i:nth-child(1){height:100%}.theme-chip i:nth-child(2){height:72%}.theme-chip i:nth-child(3){height:44%}
.theme-card b{font-size:12px;font-weight:600}
.toggle-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nav-toggle{position:relative;cursor:pointer}
.nav-toggle input{position:absolute;opacity:0;pointer-events:none}
.nav-toggle span{min-height:52px;display:flex;align-items:center;gap:var(--s2);border:1px solid var(--rule);border-radius:var(--r-sm);padding:var(--s2) var(--s3);color:var(--ink-2);font-size:12.5px;transition:border-color .13s,background .13s}
.nav-toggle svg{width:17px;height:17px}.nav-toggle b{font-weight:650}
.nav-toggle input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nav-toggle input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.nav-toggle span i{margin-left:auto;width:34px;height:20px;border-radius:20px;background:var(--rule-2);padding:3px;flex:0 0 auto;transition:background .16s}
.nav-toggle span i:after{content:'';display:block;width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px #0003;transition:transform .16s}
.nav-toggle input:checked+span i{background:var(--accent)}.nav-toggle input:checked+span i:after{transform:translateX(14px)}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--bold-2);color:var(--on-bold);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:12px;box-shadow:var(--shadow-lg);max-width:280px}
.tip-title{font:700 11px var(--num);letter-spacing:.04em;text-transform:uppercase;color:var(--on-bold-dim);margin-bottom:var(--s1)}
.tip-row{display:flex;align-items:center;gap:var(--s2);white-space:nowrap;line-height:1.7}.tip-row b{font:700 13px var(--num);margin-left:auto;padding-left:var(--s3)}

/* ---------- chart kit ---------- */
.kit-pie{display:grid;justify-items:center;gap:18px}.kit-pie svg{width:100%;height:auto;max-width:200px;overflow:visible}
.kit-seg{transform-origin:90px 90px;animation:kit-pop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*80ms);transition:transform .2s;cursor:pointer}
.kit-seg:hover,.kit-seg:focus{transform:scale(1.045);outline:none}
.kit-cut{stroke:var(--card);stroke-width:2.5;stroke-linecap:butt}
.kit-mid{font:800 20px var(--num);fill:var(--ink);text-anchor:middle}.kit-mid-sub{font:600 9px var(--ui);letter-spacing:.08em;fill:var(--ink-3);text-anchor:middle}
.kit-key{display:grid;width:100%}.kit-key.two{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--rows),auto);grid-auto-flow:column;column-gap:28px}
@media(max-width:620px){.kit-key.two{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}}
.kit-key-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--rule);font-size:13.5px}
.kit-key-row:hover{background:var(--sunk)}.kit-key-row.linked{cursor:pointer}.kit-key-row.linked:hover span{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.kit-key-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kit-key-row em{font-style:normal;color:var(--ink-2);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--accent)}
.kit-gauge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}.kit-gauge svg{width:100%;height:auto;max-width:200px}
.kit-gauge-track,.kit-gauge-val{fill:none;stroke-width:14;stroke-linecap:round}.kit-gauge-track{stroke:var(--sunk)}.kit-gauge-val{stroke:var(--accent);animation:kit-fill 1.1s cubic-bezier(.2,.8,.2,1) both}
.kit-gauge-num{font:800 24px var(--num);fill:var(--ink);text-anchor:middle}.kit-gauge small{color:var(--ink-3);font-size:12px}
.kit-spark{display:block;width:100%;max-width:140px;height:30px;margin:6px 0 2px}
.kit-spark polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke:var(--spark,var(--accent))}.kit-spark circle{fill:var(--spark,var(--accent))}
.kit-chart svg{width:100%;height:auto;overflow:visible}
.chart-grid{stroke:var(--rule);stroke-width:1}
.kit-axis{font:500 11px var(--ui);fill:var(--ink-3)}
.kit-bar{transform-box:fill-box;transform-origin:bottom;animation:kit-grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
.kit-col{cursor:pointer;outline:none}.kit-col:hover .kit-bar{filter:brightness(1.08)}

.photo-choices button[aria-pressed=true]{border-color:var(--accent)}
.photo-choices img{width:100%;height:100%;object-fit:cover;display:block}
.savebar{position:sticky;bottom:0;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:var(--s3);background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(6px);padding:var(--s3) 0;margin-top:var(--s4);border-top:1px solid var(--rule)}
.check{display:flex;gap:10px;align-items:center;font-size:13px;padding:6px 0}
.check input{min-height:0;width:16px;height:16px;accent-color:var(--accent)}

/* cook mode */
.cook{max-width:860px;margin:0 auto}
.cook-step{font:600 clamp(22px,3vw,32px)/1.45 var(--ui);letter-spacing:-.01em;margin:var(--s5) 0;min-height:4.4em}
.cook-progress{height:6px;border-radius:6px;background:var(--sunk);overflow:hidden;margin:var(--s3) 0}.cook-progress i{display:block;height:100%;background:var(--accent);transition:width .3s}
.cook-nav{display:flex;gap:var(--s3);justify-content:space-between;flex-wrap:wrap}
.cook-nav .btn{min-height:52px;padding:0 var(--s6);font-size:15px}

/* timers dock */
.timers{position:fixed;right:var(--s5);bottom:var(--s5);z-index:90;display:grid;gap:var(--s2)}
.timer{background:var(--bold-2);color:var(--on-bold);border-radius:var(--r-md);padding:var(--s3) var(--s4);display:flex;gap:var(--s3);align-items:center;box-shadow:var(--shadow-lg);min-width:220px}
.timer b{font:700 22px var(--num);font-variant-numeric:tabular-nums}
.timer small{display:block;color:var(--on-bold-dim);font-size:11px;max-width:150px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.timer.done{background:var(--pop);color:var(--pop-ink)}.timer.done small{color:var(--pop-ink)}
.timer button{color:inherit;margin-left:auto}

/* meal plan */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:var(--s2)}
.day{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow-sm);padding:var(--s3);display:flex;flex-direction:column;gap:var(--s2);min-height:220px}
.day.today{box-shadow:0 0 0 2px var(--accent)}
.day header{display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--rule);padding-bottom:var(--s2)}
.day header span{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-weight:700}
.day header b{font:700 20px var(--num)}
.meal{background:var(--sunk);border-radius:var(--r-sm);padding:8px 10px;font-size:12.5px;display:grid;gap:2px;position:relative}
.meal small{font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent);font-weight:700;padding-right:50px}
.meal button.open{text-align:left;font-weight:600;line-height:1.3;color:var(--ink);padding-right:44px}.meal button.open:hover{color:var(--accent)}
.meal-tools{position:absolute;right:4px;top:4px;display:flex;gap:2px}.meal .x{width:22px;height:22px;display:grid;place-items:center;color:var(--ink-3);border-radius:6px}.meal .x:hover{color:var(--accent);background:var(--card)}.meal .x[data-action=unplan]:hover{color:var(--over)}
.meal[draggable=true]{cursor:grab}.meal.dragging{opacity:.4}.day.drop{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.meal .x svg{width:13px;height:13px}
.addmeal{margin-top:auto;border:1px dashed var(--rule-2);border-radius:var(--r-sm);min-height:34px;color:var(--ink-3);font-size:12px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:4px}
.addmeal:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}.addmeal svg{width:14px;height:14px}

/* shopping */
.aisles{columns:3;column-gap:var(--s4)}
.aisles .card{break-inside:avoid;margin:0 0 var(--s4)}
.shop-row{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--rule);font-size:14px}
.shop-row:last-child{border-bottom:0}
.shop-row label{display:flex;gap:10px;align-items:center;flex:1;cursor:pointer;min-width:0}
.shop-row input{min-height:0;width:18px;height:18px;accent-color:var(--accent);flex:none}
.shop-row span{min-width:0}.shop-row small{display:block;color:var(--ink-3);font-size:11px}
.shop-row.done span{text-decoration:line-through;color:var(--ink-3)}
.addline{display:flex;gap:var(--s2);margin-bottom:var(--s4);max-width:620px}.addline input{flex:1}

/* collections */
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:var(--s4)}
.ccard{background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow-sm);overflow:hidden;display:flex;flex-direction:column}
.ccard .mosaic{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;aspect-ratio:16/9;gap:2px;background:var(--rule)}
.ccard .mosaic .pic{aspect-ratio:auto}.ccard .mosaic .pic svg{width:22px;height:22px}.ccard .mosaic .pic small{display:none}
.ccard-body{padding:var(--s4);display:grid;gap:var(--s2)}
.ccard-body .actions{margin-top:var(--s2)}

.rank{display:grid;gap:var(--s2)}
.rank-row{display:grid;grid-template-columns:24px 1fr auto;gap:var(--s3);align-items:center;font-size:13px}
.src-seg{margin-bottom:var(--s4)}.src-name{display:flex;align-items:center;gap:8px;min-width:0}.src-name .clamp{min-width:0}.src-name .pill svg{width:11px;height:11px}
.rank-row i{font:700 11px var(--num);color:var(--ink-3);font-style:normal}
.rank-bar{height:6px;border-radius:3px;background:var(--sunk);overflow:hidden;margin-top:4px}.rank-bar b{display:block;height:100%;background:var(--accent)}
.mini-list .row button{text-align:left;font-weight:600}.mini-list .row button:hover{color:var(--accent)}

@media(max-width:1300px){.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media(max-width:1150px){.grid-even{grid-template-columns:repeat(min(var(--n,3),2),minmax(0,1fr))}.aisles{columns:2}.recipe-cols,.editor{grid-template-columns:1fr}}
@media(max-width:900px){.recipe-hero{grid-template-columns:1fr}.recipe-hero .pic{min-height:220px;order:-1}.week{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){
 .grid-even{grid-template-columns:1fr}.aisles{columns:1}.week{grid-template-columns:1fr}.day{min-height:0}
 .rgrid{grid-template-columns:1fr 1fr;gap:var(--s3)}.rcard-body{padding:var(--s2) var(--s3) var(--s3)}.rcard h3{font-size:13.5px}
 .rstats{grid-template-columns:1fr 1fr}.recipe-hero .rh-text{padding:var(--s5)}
 .linkbar{flex-direction:column}.linkbar .btn{width:100%}.how{gap:var(--s3)}
 .toolbar select{max-width:none;flex:1 1 140px}.count-note{margin-left:0}
 .timers{right:var(--s3);left:var(--s3);bottom:var(--s3)}.photo-choices{grid-template-columns:repeat(3,1fr)}}
@media print{
 .timers,.fav,.savebar,.linkbar,.import-status,.addmeal,.addline,.meal .x,.sample-tag{display:none!important}
 .recipe-hero{grid-template-columns:1fr 200px;background:#fff!important;color:#111;border:1px solid #ddd}
 .recipe-hero h1,.recipe-hero .rstats strong{color:#111}.recipe-hero .rstats div{background:#fff}.recipe-hero .rstats span,.recipe-hero p{color:#555}
 .recipe-hero .pic{min-height:0;height:200px}.recipe-hero:before{display:none}.rate{display:none}
 .recipe-cols{grid-template-columns:1fr 1.4fr}.ing input{display:none}.steps-list p{font-size:12px}
 .rgrid{grid-template-columns:repeat(4,1fr)}.rcard{box-shadow:none;border:1px solid #ddd;animation:none}
 .week{grid-template-columns:repeat(4,1fr)}.day{box-shadow:none;border:1px solid #ddd;min-height:0}
 .aisles{columns:2}.shop-row input{display:none}.shop-row label:before{content:'☐';margin-right:6px}}

/* ================= print documents: recipe card, shopping list, week plan, recipe book =================
   Printing a recipe, list, plan or book swaps the whole app for #print-root, which holds a document laid out
   for paper (real text, page sizes, page breaks). The browser's "Save as PDF" turns it into a crisp PDF. */
#print-root{display:none}
@media print{
 body.printing{background:#fff!important;color:#221c18;font-size:10.5pt}
 body.printing>*:not(#print-root){display:none!important}
 body.printing #print-root{display:block}}
.pd{font-variant-numeric:lining-nums;--p-ink:#221c18;--p-mute:#6e655e;--p-faint:#9a918a;--p-rule:#e6dfd7;color:var(--p-ink);font:10.5pt/1.55 var(--ui);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd *{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-variant-numeric:lining-nums!important}
/* Playfair Display is for titles and a few short accents only; headings and body read in the app fonts */
.pd h1,.pd .serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:0;line-height:1.15;color:var(--p-ink);text-wrap:balance}
.pd h2,.pd h3{font-family:var(--num);font-weight:700;letter-spacing:-.01em;line-height:1.25;color:var(--p-ink)}
.pd p{margin:0}
.pd img{display:block;width:100%;height:100%;object-fit:cover}
.pd figure{margin:0;overflow:hidden;background:var(--p-soft)}
.pd figure:has(img[hidden]),.pd figure:not(:has(img)){display:none}
.pd-kicker{font:700 7.5pt var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--p-accent)}
.pd-lead{font:400 11pt/1.55 var(--ui);color:var(--p-mute)}
/* a short line of accent text (cover subtitle, a name) may use the italic serif */
.pd-accent,.pd-cover .pd-lead{font-family:"Playfair Display",Georgia,serif;font-style:italic}
.pd-break{break-before:page}

/* a recipe */
.pd-recipe h1{font-size:27pt;margin:5pt 0 7pt}
.pd-top{display:grid;grid-template-columns:1fr;gap:.3in;align-items:start;margin-bottom:4pt}
.pd-top.with-photo{grid-template-columns:1fr 2.15in}
.pd-top figure{aspect-ratio:1;border-radius:3pt}
.pd .pd-banner{height:3.1in;border-radius:3pt;margin:0 0 18pt}
.pd-recipe .pd-lead{margin-bottom:12pt;max-width:5.4in}
.pd-meta{display:flex;border-top:.75pt solid var(--p-rule);border-bottom:.75pt solid var(--p-rule);margin:6pt 0 18pt;break-inside:avoid}
.pd-meta div{flex:1;padding:6pt 10pt;border-left:.75pt solid var(--p-rule)}
.pd-meta div:first-child{border-left:0;padding-left:0}
.pd-meta span{display:block;font:700 6.5pt var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--p-faint)}
.pd-meta b{font:700 11pt var(--num);letter-spacing:-.01em}
.pd-cols{display:grid;grid-template-columns:2.2in 1fr;gap:.38in;align-items:start}
.pd-cols h2,.pd-notes h3{font-size:13pt;margin:0 0 8pt;padding-bottom:6pt;border-bottom:1.25pt solid var(--p-accent)}
.pd-ing{list-style:none;margin:0;padding:0}
.pd-ing li{position:relative;padding:4pt 0 4pt 11pt;border-bottom:.5pt solid var(--p-rule);break-inside:avoid;font-size:10pt}
.pd-ing li:before{content:'';position:absolute;left:0;top:10pt;width:4pt;height:4pt;border-radius:50%;background:var(--p-accent)}
.pd-ing li.sec{font:700 7pt var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--p-faint);border:0;padding:10pt 0 2pt}
.pd-ing li.sec:before{display:none}
.pd-steps{list-style:none;margin:0;padding:0}
.pd-steps li{display:grid;grid-template-columns:18pt 1fr;gap:7pt;margin:0 0 9pt;break-inside:avoid}
.pd-steps li>b{font:800 11pt/1.35 var(--num);color:var(--p-accent)}
.pd-steps-sec{font:700 7.5pt var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--p-accent);margin:12pt 0 7pt}
.pd-steps-sec:first-child{margin-top:0}
.pd-notes{margin-top:16pt;padding:11pt 14pt;background:var(--p-soft);border-radius:3pt;break-inside:avoid}
.pd-notes h3{font-size:11.5pt;border:0;padding:0;margin:0 0 4pt}
.pd-notes p{white-space:pre-line;font-size:9.5pt;color:#433b35}
.pd-nutri{display:flex;flex-wrap:wrap;gap:4pt 16pt;margin-top:14pt;font-size:8.5pt;color:var(--p-mute);break-inside:avoid}
.pd-nutri b{color:var(--p-ink);font-weight:600}
.pd-source{display:flex;justify-content:space-between;gap:14pt;margin-top:18pt;padding-top:7pt;border-top:.5pt solid var(--p-rule);font-size:7.5pt;color:var(--p-faint);break-inside:avoid}
.pd-source span:last-child{text-align:right}

/* shopping list */
.pd-docHead{display:flex;justify-content:space-between;align-items:flex-end;gap:16pt;padding-bottom:10pt;margin-bottom:16pt;border-bottom:1.25pt solid var(--p-accent)}
.pd-docHead h1{font-size:26pt;margin-top:4pt}
.pd-docHead .pd-lead{font-size:9.5pt;text-align:right}
.pd-aisles{columns:2;column-gap:.42in}
.pd-aisle{break-inside:avoid;margin:0 0 14pt}
.pd-aisle h2{font-size:12pt;margin:0 0 3pt;display:flex;justify-content:space-between;align-items:baseline}
.pd-aisle h2 small{font:600 7.5pt var(--ui);color:var(--p-faint);letter-spacing:.08em}
.pd-item{display:flex;gap:8pt;align-items:flex-start;padding:4.5pt 0;border-bottom:.5pt solid var(--p-rule);font-size:10pt;break-inside:avoid}
.pd-item i{flex:none;width:8.5pt;height:8.5pt;margin-top:2.5pt;border:.9pt solid #a39a92;border-radius:2pt}
.pd-item small{display:block;font-size:7.5pt;color:var(--p-faint)}
.pd-extra{break-inside:avoid;margin-top:6pt}
.pd-extra h2{font-size:12pt;margin:0 0 3pt}
.pd-extra div{height:22pt;border-bottom:.5pt solid var(--p-rule)}

/* week plan: a landscape page */
.pd-plan{page:land}
.pd-week{width:100%;border-collapse:collapse;table-layout:fixed}
.pd-week th{background:none;padding:0 6pt 7pt;text-align:left;vertical-align:bottom;border-bottom:1.25pt solid var(--p-accent)}
.pd-week th span{display:block;font:700 7pt var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--p-faint)}
.pd-week th b{font:700 14pt var(--num)}
.pd-week th.today b{color:var(--p-accent)}
.pd-week td{height:.98in;padding:6pt;vertical-align:top;border-bottom:.5pt solid var(--p-rule);border-left:.5pt solid var(--p-rule)}
.pd-week td.slot{width:.75in;border-left:0;font:700 7pt var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--p-accent);vertical-align:middle}
.pd-week .meal-t{font:600 9pt/1.3 var(--ui);margin-bottom:4pt}
.pd-week .meal-t small{display:block;font:500 7pt var(--ui);color:var(--p-faint);margin-top:1pt}
.pd-planfoot{display:grid;grid-template-columns:1fr 1fr;gap:.4in;margin-top:14pt;break-inside:avoid}
.pd-planfoot h2{font-size:11.5pt;margin:0 0 2pt}
.pd-planfoot div div{height:19pt;border-bottom:.5pt solid var(--p-rule)}

/* recipe book */
.pd-cover{position:relative;overflow:hidden;width:100vw;height:100vh;break-after:page;color:var(--p-ink)}
.cv-classic{background:#F6F0E6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.3in 1.1in}
.cv-classic:before,.cv-classic:after{content:'';position:absolute;border:1.1pt solid var(--p-deep)}
.cv-classic:before{inset:.42in}.cv-classic:after{inset:.52in;border-width:.5pt}
.cv-classic h1{font-size:46pt;color:var(--p-deep);margin:16pt 0 12pt;line-height:1.08}
.cv-classic .pd-lead{font-size:15pt}
.cv-orn{width:120pt;height:26pt;color:var(--p-accent);margin:4pt auto}
.cv-by{position:absolute;left:0;right:0;bottom:1.25in;text-align:center}
.cv-by span{display:block;font:700 7pt var(--ui);letter-spacing:.26em;text-transform:uppercase;color:var(--p-faint);margin-bottom:4pt}
.cv-by b{font:italic 400 17pt "Playfair Display",Georgia,serif;color:var(--p-deep)}
.cv-modern{background:#fff;display:grid;grid-template-rows:62% 1fr}
.cv-art{background:var(--p-deep);padding:.55in;display:grid;gap:6pt;position:relative;overflow:hidden}
.cv-art.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}.cv-art.n3{grid-template-columns:1.4fr 1fr;grid-template-rows:1fr 1fr}.cv-art.n3 figure:first-child{grid-row:1/3}
.cv-art.n2{grid-template-columns:1fr 1fr}.cv-art figure{border-radius:2pt;background:#ffffff14}
.cv-art.none{background-image:radial-gradient(circle at 18% 22%,color-mix(in srgb,var(--p-pop) 55%,transparent) 0 9%,transparent 9.2%),radial-gradient(circle at 78% 70%,color-mix(in srgb,var(--p-accent) 70%,transparent) 0 17%,transparent 17.2%),radial-gradient(circle at 64% 18%,#ffffff1c 0 5%,transparent 5.2%),radial-gradient(circle at 30% 82%,#ffffff12 0 12%,transparent 12.2%)}
.cv-mono{position:absolute;right:.5in;bottom:.15in;font:600 230pt/1 "Playfair Display",Georgia,serif;color:#ffffff14}
.cv-text{padding:.55in .7in .6in;display:flex;flex-direction:column;justify-content:center;border-left:8pt solid var(--p-accent)}
.cv-text h1{font-size:42pt;margin:8pt 0 8pt;color:var(--p-deep)}
.cv-text .pd-lead{font-size:14pt}
.cv-text .cv-name{margin-top:18pt;font:700 7.5pt var(--ui);letter-spacing:.24em;text-transform:uppercase;color:var(--p-faint)}
.cv-text .cv-name b{display:block;font:italic 400 15pt "Playfair Display",Georgia,serif;letter-spacing:0;text-transform:none;color:var(--p-ink);margin-top:3pt}
.cv-photo{background:var(--p-deep)}
.cv-photo figure{position:absolute;inset:0;background:none}
.cv-photo:after{content:'';position:absolute;inset:0;background:linear-gradient(to top,rgba(18,12,8,.88) 0%,rgba(18,12,8,.55) 34%,rgba(18,12,8,0) 62%)}
.cv-photo .cv-over{position:absolute;left:.75in;right:.75in;bottom:.85in;z-index:1;color:#fff}
.cv-photo .pd-kicker{color:var(--p-pop)}
.cv-photo h1{color:#fff;font-size:48pt;margin:8pt 0 10pt}
.cv-photo .pd-lead{color:#f2e9e1;font-size:15pt}
.cv-photo .cv-line{width:48pt;height:2pt;background:var(--p-pop);margin:16pt 0 10pt}
.cv-photo .cv-who{font:italic 400 14pt "Playfair Display",Georgia,serif;color:#fff}
.pd-contents h1{font-size:32pt;margin:4pt 0 4pt}
.pd-contents>.pd-lead{margin-bottom:22pt}
.pd-toc{columns:2;column-gap:.45in}
.pd-toc section{break-inside:avoid;margin-bottom:14pt}
.pd-toc h2{font:700 7.5pt var(--ui);letter-spacing:.2em;text-transform:uppercase;color:var(--p-accent);margin:0 0 4pt;padding-bottom:4pt;border-bottom:.75pt solid var(--p-rule)}
.pd-toc div{display:flex;align-items:baseline;gap:6pt;padding:3pt 0;font-size:9.5pt}
.pd-toc div i{font:700 8pt var(--num);color:var(--p-faint);font-style:normal;width:18pt;flex:none}
.pd-toc div span{flex:1;min-width:0;border-bottom:.75pt dotted #cfc6bd;padding-bottom:1pt}
.pd-toc div em{font-style:normal;font-size:8pt;color:var(--p-faint);white-space:nowrap}
.pd-made{margin-top:20pt;font-size:7.5pt;color:var(--p-faint);text-align:center}
.pd-divider{height:calc(100vh - 1.75in);display:flex;flex-direction:column;justify-content:center;break-inside:avoid;page-break-inside:avoid}
.pd-divider .num{font:600 96pt/1 "Playfair Display",Georgia,serif;color:var(--p-soft2)}
.pd-divider h1{font-size:44pt;margin:6pt 0 10pt}
.pd-divider .bar{width:56pt;height:3pt;background:var(--p-accent);margin:6pt 0 14pt}

/* the book dialog */
.book-dlg{width:min(680px,calc(100% - 32px))}
.cover-pick{display:grid;grid-template-columns:repeat(3,96px);gap:14px}
.fields .check{flex-direction:row;align-items:center;font-weight:500;color:var(--ink);font-size:13px}
.book-opts{display:flex;gap:18px;flex-wrap:wrap;align-items:center}
.print-tip{display:flex;gap:10px;align-items:flex-start}.print-tip svg{flex:none;margin-top:1px;color:var(--accent)}
.cover-pick label{cursor:pointer}
.cover-pick input{position:absolute;opacity:0;pointer-events:none}
.cover-pick .mini{display:block;aspect-ratio:8.5/11;border-radius:6px;border:2px solid var(--rule);overflow:hidden;position:relative;transition:border-color .13s,box-shadow .13s}
.cover-pick input:checked+.mini{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.cover-pick input:focus-visible+.mini{outline:2px solid var(--accent);outline-offset:2px}
.cover-pick b{display:block;font-size:12px;margin-top:6px;text-align:center}

const GLYPHS=/^[\s\u200b-\u200d\ufeff▢☐□■◻◼▪▫●○•◦‣∙⁃·✓✔✅☑❑❒➤►▶»*–—-]+(?=\S)/u;

const SITES={good:[
  ['Meal kits & big recipe sites',[['HelloFresh','hellofresh.com','https://www.hellofresh.com/recipes/'],['BBC Good Food','bbcgoodfood.com','https://www.bbcgoodfood.com/recipes'],['Taste of Home','tasteofhome.com','https://www.tasteofhome.com/recipes/'],['King Arthur Baking','kingarthurbaking.com','https://www.kingarthurbaking.com/recipes'],['Tasty','tasty.co','https://tasty.co/']]],

async function checkSite(raw){const url=Logic.normalizeLink(raw);if(!url){siteMsg=`<div class="notice refused"><span>Paste the full link of one recipe from the website, starting with https://</span></div>`;return paintSites();}

  if(data.partial||!data.ingredients?.length){siteMsg=`<div class="notice warning"><span><b>${esc(h)} answered, but that page has no full recipe card.</b> Try a link to a single recipe page, not a list or the home page.</span></div>`;}
  else{const name=tidy(data.sourceName)&&!/\./.test(data.sourceName)?tidy(data.sourceName).slice(0,60):h;commit(()=>{state.mySites[h]={name,date:today()};if(state.siteBlocks)delete state.siteBlocks[h];},'',{quiet:true});

/* ================================================================================
   Chart kit · SVG strings, no library. Donut above its legend, flat bars, value labels.
   ================================================================================ */
const CAT=['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)','var(--cat-5)','var(--cat-6)'];
const tipOf=(t,rows)=>esc(JSON.stringify({t,r:rows}));
// past the six theme colors, slices reuse them as lighter tints so neighbours stay distinct
const sliceColor=i=>i<6?CAT[i]:`color-mix(in oklab,${CAT[i%6]} 55%,var(--card))`;
const fold=(rows,max=5)=>{const r=rows.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),keep=r.length<=max+1?r.length:max,top=r.slice(0,keep).map((x,i)=>[x[0],x[1],x[2]||sliceColor(i)]);const rest=r.slice(keep).reduce((n,x)=>n+x[1],0);if(rest)top.push([`Other (${r.length-keep} more)`,rest,sliceColor(keep)]);return top;};
const count=n=>num(n);
function pie(parts,{label='',donut=true,center='',sub='',f=count,act=null}={}){
 const go=name=>{const a=act&&!/^Other \(/.test(name)?act(name):'';return a?` data-action="lib-cat" data-v="${esc(a)}" role="link" title="Show these recipes"`:'';};
 parts=parts.filter(p=>p[1]>0);const total=parts.reduce((n,p)=>n+p[1],0);if(!total)return '';
 const R=80,r0=donut?66:0,c=90,pt=(a,r)=>[(c+r*Math.cos(a)).toFixed(2),(c+r*Math.sin(a)).toFixed(2)];let a=-Math.PI/2;
 const segs=parts.map(([name,n,color],i)=>{const sw=n/total*Math.PI*2,a1=a,a2=a+sw;a=a2;let d;
  if(sw>=Math.PI*2-1e-6)d=`M${c} ${c-R}A${R} ${R} 0 1 1 ${c-0.01} ${c-R}Z`+(donut?`M${c} ${c-r0}A${r0} ${r0} 0 1 0 ${c+0.01} ${c-r0}Z`:'');
  else{const lg=sw>Math.PI?1:0,[x1,y1]=pt(a1,R),[x2,y2]=pt(a2,R);if(donut){const [x3,y3]=pt(a2,r0),[x4,y4]=pt(a1,r0);d=`M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r0} ${r0} 0 ${lg} 0 ${x4} ${y4}Z`;}else d=`M${c} ${c}L${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}Z`;}
  return `<path class="kit-seg" d="${d}" fill="${color}" fill-rule="evenodd" style="--i:${i}"${go(name)} tabindex="0" aria-label="${esc(name)}: ${pc(n/total)}" data-tip="${tipOf(name,[{name:label,value:f(n),color},{name:'Share',value:pc(n/total)}])}"/>`;}).join('');
 let cuts='';if(parts.length>1){let b=-Math.PI/2;for(const p of parts){const [x1,y1]=pt(b,r0),[x2,y2]=pt(b,R+1);cuts+=`<line class="kit-cut" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;b+=p[1]/total*Math.PI*2;}}
 const key=parts.map(([name,n,color])=>`<div class="kit-key-row${act&&go(name)?' linked':''}"${go(name)}><i class="dot" style="background:${color}"></i><span>${esc(name)}</span><b class="number">${pc(n/total,n/total<0.1?1:0)}</b><em class="number">${f(n)}</em></div>`).join('');
 return `<div class="kit-pie"><svg viewBox="0 0 180 180" role="img" aria-label="${esc(label)}">${segs}${cuts}${donut&&center?`<text x="90" y="92" class="kit-mid">${esc(center)}</text><text x="90" y="110" class="kit-mid-sub">${esc(sub)}</text>`:''}</svg><div class="kit-key${parts.length>3?' two':''}" style="--rows:${Math.ceil(parts.length/2)}">${key}</div></div>`;}
function gauge(v,title,note){const p=Math.max(0,Math.min(1,Number.isFinite(v)?v:0));return `<div class="kit-gauge"><svg viewBox="0 0 180 104" role="img" aria-label="${esc(title)} ${pc(v)}"><path d="M20 92A70 70 0 0 1 160 92" class="kit-gauge-track" pathLength="100"/><path d="M20 92A70 70 0 0 1 160 92" class="kit-gauge-val" pathLength="100" style="stroke-dasharray:${(p*100).toFixed(1)} 100"/><text x="90" y="86" class="kit-gauge-num">${pc(v)}</text></svg><b>${esc(title)}</b><small>${esc(note)}</small></div>`;}
function spark(vals){const pts=vals.map((n,i)=>Number.isFinite(n)?[i,n]:null).filter(Boolean);if(pts.length<2)return '';const ys=pts.map(p=>p[1]),mn=Math.min(...ys),sp=(Math.max(...ys)-mn)||1,W=120,H=30,X=i=>2+i*(W-6)/Math.max(1,vals.length-1),Y=n=>H-4-(n-mn)/sp*(H-8),l=pts.at(-1);
 return `<svg class="kit-spark" viewBox="0 0 ${W} ${H}" aria-hidden="true"><polyline points="${pts.map(([i,n])=>X(i).toFixed(1)+','+Y(n).toFixed(1)).join(' ')}"/><circle cx="${X(l[0]).toFixed(1)}" cy="${Y(l[1]).toFixed(1)}" r="3"/></svg>`;}
// columns, stacked when several series; square corners, no gaps, the total printed on top. Counts, not money.
function bars(series,labels,{title='',H=240,W=700,f=count}={}){
 const tot=labels.map((_,i)=>series.reduce((n,s)=>n+Math.max(0,s.values[i]||0),0)),max=Math.max(4,...tot);if(!tot.some(Boolean))return '';
 const pl=36,pr=12,pt=22,pb=28,band=(W-pl-pr)/labels.length,bw=Math.min(38,band*.62),Y=v=>pt+(1-v/max)*(H-pt-pb),ticks=[0,1,2,3,4].map(i=>Math.round(max*i/4));
 const cols=labels.map((l,i)=>{let base=H-pb;const x=pl+band*i+(band-bw)/2;
  const segs=series.map(s=>{const v=Math.max(0,s.values[i]||0);if(!v)return '';const h=(H-pt-pb)*v/max,y=base-h;base=y;return `<rect class="kit-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" style="fill:${s.color};--i:${i}"/>`;}).join('');
  const tip=tipOf(l,[...series.filter(s=>s.values[i]).map(s=>({name:s.name,value:f(s.values[i]),color:s.color})),...(series.length>1?[{name:'Total',value:f(tot[i])}]:[])]);
  return `<g class="kit-col" tabindex="0" data-tip="${tip}"><rect x="${(pl+band*i).toFixed(1)}" y="${pt}" width="${band.toFixed(1)}" height="${H-pt-pb}" fill="transparent"/>${segs}${tot[i]?`<text x="${(x+bw/2).toFixed(1)}" y="${(Y(tot[i])-6).toFixed(1)}" class="kit-axis" text-anchor="middle">${f(tot[i])}</text>`:''}</g><text x="${(x+bw/2).toFixed(1)}" y="${H-8}" class="kit-axis" text-anchor="middle">${esc(l)}</text>`;}).join('');
 return `<div class="kit-chart">${series.length>1?`<div class="legend">${series.map(s=>`<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${[...new Set(ticks)].map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="chart-grid"/><text x="${pl-8}" y="${(Y(v)+4).toFixed(1)}" class="kit-axis" text-anchor="end">${v}</text>`).join('')}${cols}</svg></div>`;}

/* ---------- building blocks ---------- */
const pagehead=(eyebrow,title,sub,actions='')=>`<div class="pagehead"><div class="pagehead-text"><div class="eyebrow">${eyebrow}</div><h1>${title}</h1>${sub?`<p class="subtitle">${sub}</p>`:''}</div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
const tile=(label,value,note,sp='',icon='',i=0,tone='neutral')=>`<div class="kpi" style="--i:${i}" data-icon="${icon}" data-tone="${tone}"><div class="label">${label}</div><b class="number">${value}</b>${sp}<small>${note}</small></div>`;
const cardhead=(title,note='',icon='',actions='')=>`<div class="cardhead"><div><h2>${icon?`<span class="h-ico">${ico(icon)}</span>`:''}${title}</h2>${note?`<p>${note}</p>`:''}</div>${actions?`<div class="actions">${actions}</div>`:''}</div>`;
const empty=(title,text,btn='',icon='compass')=>`<div class="empty">${ico(icon)}<h3>${title}</h3><p>${text}</p>${btn?`<div class="actions empty-actions">${btn}</div>`:''}</div>`;
const pager=(st,total,per)=>{const pages=Math.max(1,Math.ceil(total/per));return pages<2?'':`<div class="pager no-print"><span>${num(st.page*per+1)}–${num(Math.min(total,(st.page+1)*per))} of ${num(total)} · page ${st.page+1} of ${pages}</span><span class="actions">${button('Previous','page','small',`data-d="-1" ${st.page?'':'disabled'}`)}${button('Next','page','small',`data-d="1" ${st.page<pages-1?'':'disabled'}`)}</span></div>`;};
const catColor=name=>{const cats=[...new Set(state.recipes.map(Logic.categoryOf))].sort();const i=cats.indexOf(name);return CAT[i<0?5:i%5];};
// a picture: your photo, else the source's photo, else a tinted tile with the category
function pic(r,label=true){const img=r.hasPhoto?`<img data-photo="${esc(r.id)}" alt="" hidden>`:r.image?`<img src="${esc(r.image)}" alt="" loading="lazy" decoding="async" referrerpolicy="no-referrer" data-remote>`:'';
 return `<div class="pic" style="--c:${catColor(Logic.categoryOf(r))}">${ico('chef')}${label?`<small>${esc(Logic.categoryOf(r))}</small>`:''}${img}</div>`;}
const stars=n=>n?`<span class="stars" aria-label="${n} of 5 stars">${'★'.repeat(n)}<span class="off">${'★'.repeat(5-n)}</span></span>`:'';
function card(r,i=0){const sel=lib.selecting&&screen==='library',on=sel&&lib.sel.has(r.id);
 return `<article class="rcard${sel?' selecting':''}${on?' picked':''}" style="--i:${i%12}">${sel?`<span class="pick" aria-hidden="true">${ico('check')}</span>`:r.sample?'<span class="chip sample-tag">Sample</span>':''}<button class="fav" data-action="favorite" data-id="${r.id}" aria-pressed="${r.favorite}" aria-label="${r.favorite?'Remove from':'Add to'} favorites: ${esc(r.title)}" title="Favorite">${ico('heart')}</button>
 <button class="rcard-open" data-action="${sel?'sel':'open'}" data-id="${r.id}" aria-label="${sel?(on?'Unselect ':'Select '):'Open '}${esc(r.title)}" ${sel?`aria-pressed="${on}"`:''}>${pic(r)}<div class="rcard-body"><div class="eyebrow">${esc(r.sourceName||'My recipe')}</div><h3>${esc(r.title)}</h3>
 <div class="rmeta">${r.total?`<span>${ico('clock')}${mins(r.total)}</span>`:''}${r.made.length?`<span>${ico('check')}Made ${r.made.length}×</span>`:'<span class="chip accent">To try</span>'}${stars(r.rating)}</div></div></button></article>`;}

/* ---------- link import: the browser asks our Netlify function to read the page ---------- */
const recent=[];   // timestamps of imports this session, to keep a runaway double-click from flooding the service
// ask our importer to read one page; errors carry the importer's code (and how long to wait when rate-limited)
async function fetchRecipe(url){const res=await fetch(CONFIG.importEndpoint,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({url}),signal:AbortSignal.timeout(20000)});
 let data;try{data=await res.json();}catch{throw Error('The recipe reader is not available right now. Paste the recipe text instead.');}
 if(!res.ok)throw Object.assign(Error(data.error||'We couldn’t read that recipe.'),{code:data.code,wait:+(res.headers.get('retry-after')||0)});return data;}
// ---------- bulk import: many links, one after another, at a pace the importer accepts ----------
const bulk={items:[],running:false,stop:false};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function bulkImport(text){if(bulk.running)return;if(location.protocol==='file:')return toast('Link import works in the hosted app.');
 const urls=[...new Set((String(text).match(/https?:\/\/[^\s<>"')\]]+/g)||[]).map(u=>Logic.normalizeLink(u.replace(/[.,;]+$/,''))).filter(Boolean))].slice(0,100);
 if(!urls.length)return toast('Paste one or more recipe links, one per line.');
 bulk.items=urls.map(url=>({url,status:'waiting'}));bulk.running=true;bulk.stop=false;render();
 for(const it of bulk.items){if(bulk.stop){it.status='skipped';continue;}
  const have=state.recipes.find(r=>r.sourceUrl&&Logic.normalizeLink(r.sourceUrl)===it.url);if(have){Object.assign(it,{status:'dupe',id:have.id,title:have.title});paintBulk();continue;}
  const hs=hardSite(it.url);if(hs?.social||hs?.block){Object.assign(it,{status:'failed',msg:`${hs.name}: ${hs.fix}`});paintBulk();continue;}
  it.status='working';paintBulk();
  for(let attempt=0;attempt<2;attempt++){try{const data=await fetchRecipe(it.url),r=Logic.fromImport(data,{sourceUrl:it.url});if(!r.title)r.title=hostOf(it.url);
    if(data.partial)r.tags=[...new Set([...r.tags,'needs review'])];
    commit(()=>state.recipes.unshift(r),'',{quiet:true});noteSite(it.url,true);Object.assign(it,{status:data.partial?'review':'saved',id:r.id,title:r.title});break;}
   catch(e){if(e.code==='RATE_LIMIT'&&!attempt){it.status='waiting';paintBulk();await sleep(Math.min(90,e.wait||60)*1000);continue;}
    if(e.code==='SOURCE_ACCESS_DENIED')noteSite(it.url,false);const hs2=hardSite(it.url);
    Object.assign(it,{status:'failed',msg:e.name==='TimeoutError'?'The website took too long.':hs2?`${e.message} ${hs2.fix}`:e.message});break;}}
  paintBulk();await sleep(3500);}
 bulk.running=false;const n=bulk.items.filter(i=>i.status==='saved'||i.status==='review').length;render();toast(`${plural(n,'recipe')} imported${bulk.items.some(i=>i.status==='review')?'. Some need a quick review.':''}`);}
const BULK_LABEL={waiting:['Waiting',''],working:['Reading…','accent'],saved:['Saved','good'],review:['Saved · needs review','warn'],dupe:['Already in your library',''],failed:['Not imported','warn'],skipped:['Skipped','']};
function bulkList(){if(!bulk.items.length)return '';const done=bulk.items.filter(i=>!['waiting','working'].includes(i.status)).length;
 return `<div class="bulk-head"><b>${bulk.running?`Importing ${done+1 > bulk.items.length?bulk.items.length:done+1} of ${bulk.items.length}`:`Finished: ${bulk.items.filter(i=>i.status==='saved'||i.status==='review').length} of ${bulk.items.length} imported`}</b>${bulk.running?button('Stop','bulk-stop','small'):button('Clear','bulk-clear','small quiet')}</div>
 <div class="bulk-list">${bulk.items.map(i=>{const [l,c]=BULK_LABEL[i.status];return `<div class="bulk-row"><span class="clamp">${i.title?`<button class="link-btn" data-action="open" data-id="${i.id}">${esc(i.title)}</button>`:esc(i.url)}${i.msg?`<small>${esc(i.msg)}</small>`:''}</span><span class="pill ${c}">${i.status==='working'?'<span class="spinner" style="width:10px;height:10px"></span>':''}${l}</span>${i.status==='failed'?button(ico('paste')+'Paste','paste','small',`data-url="${esc(i.url)}"`):''}</div>`;}).join('')}</div>`;}
function paintBulk(){const el=$('#bulk-list');if(el)el.innerHTML=bulkList();}
async function importLink(raw,{again=false}={}){
 const url=Logic.normalizeLink(raw);lastLink=String(raw||'').trim();
 if(!url){importMsg=errorBox('Paste a full recipe link, like https://www.example.com/recipes/lemon-cake','');return paintImport();}
 const have=state.recipes.find(r=>r.sourceUrl&&Logic.normalizeLink(r.sourceUrl)===url);
 if(have&&!again){importMsg=`<div class="notice"><span><b>Already in your library:</b> ${esc(have.title)}</span><span class="actions">${button('Open it','open','small primary',`data-id="${have.id}"`)}${button('Import again','import-again','small',`data-url="${esc(url)}"`)}</span></div>`;return paintImport();}
 const hs=hardSite(url);if((hs?.social||hs?.block)&&!again){importMsg=`<div class="notice warning" role="status"><span><b>${esc(hs.block?hostOf(url):hs.name)} ${hs.block?'blocks automatic import.':'links don’t import.'}</b> ${esc(hs.why)} ${esc(hs.fix)}</span><span class="actions">${button(ico('paste')+'Paste the text','paste','small primary',`data-url="${esc(url)}"`)}${button('Try anyway','import-again','small',`data-url="${esc(url)}"`)}</span></div>`;return paintImport();}
 if(location.protocol==='file:'){importMsg=errorBox('Link import works in the hosted app, not in a file opened from your computer. Open your Recipe Library Studio web address, or paste the recipe text instead.',url);return paintImport();}
 if(importing)return;const now=Date.now();while(recent.length&&recent[0]<now-60000)recent.shift();if(recent.length>=10){importMsg=errorBox('That’s a lot of imports in one minute. Wait a moment, then try again.',url);return paintImport();}
 recent.push(now);importing=true;importMsg=`<div class="loading" role="status"><span class="spinner"></span>Reading the recipe from ${esc(hostOf(url))}…</div>`;paintImport();
 try{const data=await fetchRecipe(url);
  const r=Logic.fromImport(data,{sourceUrl:url});if(!r.title)r.title=hostOf(url);importing=false;importMsg='';lastLink='';noteSite(url,true);
  if(data.partial){draft=r;draftPhoto=null;dirty=true;go('edit');toast(r.ingredients.length?'Part of this recipe was found. Fill in the rest, then save.':'No recipe data on that page. We kept the title and photo; add the rest, then save.');}
  else{commit(()=>state.recipes.unshift(r),`Saved “${r.title}” from ${r.sourceName||hostOf(url)}`);openRecipe(r.id);}}
 catch(e){importing=false;const msg=e.name==='TimeoutError'?'The website took too long to answer. Try again, or paste the recipe text.':e instanceof TypeError?'We couldn’t reach the recipe reader. Check your internet connection, or paste the recipe text.':e.message;

   <div class="actions" style="margin-top:8px">${button(ico('play')+'Start cooking','cook','pop',`data-id="${r.id}" ${Logic.stepCount(r)?'':'disabled'}`)}${button(ico('heart')+(r.favorite?'Favorite':'Add to favorites'),'favorite','',`data-id="${r.id}" aria-pressed="${r.favorite}"`)}${button(ico('check')+'Made it','made','',`data-id="${r.id}"`)}${button(ico('calendar')+'Plan','plan-recipe','',`data-id="${r.id}"`)}</div>
   <div class="rate" role="group" aria-label="Your rating">${[1,2,3,4,5].map(n=>`<button data-action="rate" data-id="${r.id}" data-n="${n}" class="${r.rating>=n?'on':''}" aria-label="Rate ${n} of 5" aria-pressed="${r.rating===n}">★</button>`).join('')}<span class="small" style="color:var(--on-bold-dim);margin-left:8px">${r.made.length?`Made ${plural(r.made.length,'time')} · last ${new Date(r.made.at(-1)+'T12:00:00').toLocaleDateString('en-US',{month:'short',day:'numeric'})}`:'Not made yet'}${plannedNext?` · planned for ${dayName(plannedNext.date,{weekday:'long'})}`:''}</span></div></div>

   <div class="scale no-print">${base?`<span class="small dim">Serves</span><span class="stepper"><button data-action="serves" data-d="-1" aria-label="Fewer servings">−</button><output aria-live="polite">${Logic.frac(sv)}</output><button data-action="serves" data-d="1" aria-label="More servings">+</button></span>`:''}<div class="segment" role="group" aria-label="Units">${CONFIG.units.map(u=>`<button data-action="units" data-k="${u}" aria-pressed="${units===u}">${u}</button>`).join('')}</div></div>

   ${units!=='Original'||f!==1?'<p class="small dim" style="margin-top:10px">Amounts are converted and scaled from the original. Volume stays volume and weight stays weight.</p>':''}</div></section>
  <section class="card pair">${cardhead('Method',Logic.stepCount(r)?plural(Logic.stepCount(r),'step'):'','chef')}<div class="pair-body">${r.sections.map(s=>`${s.name?`<h3 class="sec-name">${esc(s.name)}</h3>`:''}<ol class="steps-list">${s.steps.map((t,i)=>{const tm=Logic.timerIn(t);return `<li><span class="stepnum">${i+1}</span><div><p>${esc(t)}</p>${tm?button(ico('clock')+`Start ${mins(tm)} timer`,'timer','small timer-btn no-print',`data-m="${tm}" data-label="${esc(r.title)}"`):''}</div></li>`;}).join('')}</ol>`).join('')||'<p class="dim small">No steps yet. Add them in Edit.</p>'}</div></section></div>

</div></section></div>`;},

 cook(){const r=recipeById(openId);if(!r)return VIEWS.recipe();const steps=r.sections.flatMap(s=>s.steps.map(t=>({sec:s.name,t})));cookAt=Math.max(0,Math.min(cookAt,steps.length-1));const s=steps[cookAt],tm=s?Logic.timerIn(s.t):0;

 plan(){const days=Array.from({length:7},(_,i)=>addDays(week,i)),inWeek=state.plans.filter(p=>p.date>=days[0]&&p.date<=days[6]);

  `<div class="actions no-print" style="margin:-8px 0 16px">${button(ico('spark')+'Fill my week','plan-fill','small',state.recipes.length?'':'disabled')}${button(ico('copy')+'Copy last week','plan-copy','small',state.plans.some(p=>p.date>=addDays(days[0],-7)&&p.date<days[0])?'':'disabled')}${inWeek.length?button(ico('trash')+'Clear this week','plan-clear','small quiet danger'):''}<span class="small dim" style="align-self:center">Drag a meal to move it to another day.</span></div>`+

  let url=c.toDataURL('image/webp',.8);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/jpeg',.8);if(url.length<=340000)return url;side*=.75;}throw Error('That photo could not be made small enough. Try another one.');}finally{bmp.close?.();}}
