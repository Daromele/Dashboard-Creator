      ${filtering ? `<button class="btn" data-logclear>Clear</button>` : ""}
    </div>

    <div class="kpis" style="margin-bottom:22px">
      ${kpi(filtering ? "Matching entries" : "Entries", String(rowsAll.length),
            filtering ? "of " + state.log.length + " in total" : (first ? "since " + esc(day.label(first)) : ""))}
      ${kpi("Out", money.fmtBig(outSum), filtering ? "across what you filtered" : "everything logged")}
      ${kpi("In", money.fmtBig(inSum), filtering ? "across what you filtered" : "everything logged")}
      ${kpi("Net", (inSum - outSum >= 0 ? "+" : "") + money.fmtBig(inSum - outSum), "in minus out", { dark:true })}
    </div>` : ""}

    ${filtering
      /* Filtered results are a list of hits, not a diary — one panel per
         day would put a single row in each and push the rest off screen. */
      ? (shown.length ? `<div class="panel" style="margin-bottom:14px">
          <div class="panel-head"><h2>Matches</h2>
            <span class="row-amt" style="font-size:.875rem;color:var(--ink-3)">${
              esc(shown.length + (rowsAll.length > shown.length ? " of " + rowsAll.length : ""))}</span></div>
          <ul class="rows">${shown.map(e => logRow(e, true)).join("")}</ul>
        </div>` : "")
      : keys.map(k => {
          const rows = groups[k];
          const net = rows.reduce((s,e) => s + (e.dir === "out" ? e.amount : -e.amount), 0);
          const netLabel = net === 0 ? money.fmt(0) : net > 0 ? "−" + money.fmt(net) : money.fmt(-net,{plus:true});
          return `<div class="panel" style="margin-bottom:14px">
            <div class="panel-head"><h2>${esc(day.label(k))}</h2>
              <span class="row-amt" style="font-size:.875rem;color:var(--ink-3)">${esc(netLabel)}</span></div>
            <ul class="rows">${rows.map(e => logRow(e, false)).join("")}</ul></div>`;
        }).join("")}

    ${rowsAll.length > shown.length ? `
      <button class="btn" data-logmore style="margin-top:4px">
        Show more — ${rowsAll.length - shown.length} left</button>` : ""}

    ${!keys.length ? `<div class="empty">
      <h3>${filtering ? "Nothing matches" : "Nothing logged yet"}</h3>
      <p>${filtering
        ? "Try a shorter search, or clear the filters."
        : "Use the box at the top — type what it was and the amount, like <b>lunch 8.40</b>. Start with <b>+</b> for money coming in (<b>+250 bonus</b>), and add a day word like <b>yesterday</b> to put it in the past."}</p>
      ${filtering ? `<button class="btn" data-logclear>Clear filters</button>` : ""}</div>` : ""}`;
}
/* Re-rendering replaces the search box, so put the caret back where the
   user left it or typing loses focus after the first character. */
function redrawLog(){
  const el = $("#log-q");
  const pos = el && el.selectionStart;
  const active = el && document.activeElement === el;
  drawLog();
  const el2 = $("#log-q");
  if (el2 && active){ el2.focus(); if (pos != null) el2.setSelectionRange(pos, pos); }
}

/* ============================== CALENDAR ============================== */
/* The twelve dividers for a year. `has` is drawn from the log alone:
   every month has bills scheduled in it, so marking those would mark
   all twelve and say nothing. A month you have actually recorded
   something in is the fact worth showing — the binder fills up. */
function calMonths(year){
  const seen = new Set(state.log.map(e => e.date.slice(0, 7)));
  const now = day.today().slice(0, 7);
  return Array.from({ length: 12 }, (_, i) => {
    const key = year + "-" + String(i + 1).padStart(2, "0");
    return {
      key, label: new Date(year, i, 1, 12).toLocaleDateString(undefined, { month:"short" }),
      has: seen.has(key), now: key === now
    };
  });
}
function calBinder(year, cur){
  return `
    <div class="tabwrap">
      <div class="tabyear">
        <button data-calyear="-1" aria-label="Previous year">${ICON.left}</button>
        <span>${year}</span>
        <button data-calyear="1" aria-label="Next year">${ICON.right}</button>
      </div>
      <div class="tabs" role="tablist" aria-label="Month">
        ${calMonths(year).map(m => `
          <button class="tab${m.has ? " has" : ""}${m.now ? " now" : ""}" role="tab"
            data-calmonth="${esc(m.key)}" aria-current="${m.key === cur}"
            title="${esc(m.label)} ${year}${m.has ? " — you logged things this month" : ""}">
            ${esc(m.label)}<i class="tab-mark"></i>
          </button>`).join("")}
      </div>
    </div>`;
}

function drawCalendar(r){
  const today = r.today;
  if (!calCursor) calCursor = today.slice(0, 7);
  const [cy, cm] = calCursor.split("-").map(Number);
  const first = new Date(cy, cm - 1, 1, 12);
  const daysIn = new Date(cy, cm, 0).getDate();
  const lead = (first.getDay() + 6) % 7;                 /* Monday-first */

  /* Every scheduled event in this month */
  const monthStart = calCursor + "-01", monthEnd = calCursor + "-" + String(daysIn).padStart(2,"0");
  const evs = {};
  const put = (d, html) => { (evs[d] = evs[d] || []).push(html); };
  for (const i of state.income)
    for (const d of occurrencesIn(i, monthStart, monthEnd))
      put(d, { dir:"in", name:i.name, amount:i.amount });
  for (const b of outgoings())
    for (const d of occurrencesIn(b, monthStart, monthEnd))
      put(d, { dir:"out", name:b.name, amount:expectedAmount(b) });

  const cells = [];
  for (let i = 0; i < lead; i++) cells.push('<div class="cal-day pad"></div>');
  for (let dn = 1; dn <= daysIn; dn++){
    const key = calCursor + "-" + String(dn).padStart(2,"0");
    const list = evs[key] || [];
    const shown = list.slice(0, 3);
    cells.push(`<div class="cal-day ${key === today ? "today" : ""}">
      <span class="cal-date">${dn}</span>
      ${shown.map(e => `<span class="cal-ev ${e.dir}" title="${esc(e.name)} ${esc(money.fmt(e.amount))}">${
        e.dir === "in" ? "+" : ""}${esc(money.fmt(e.amount))} ${esc(e.name)}</span>`).join("")}
      ${list.length > 3 ? `<span class="cal-more">+${list.length - 3} more</span>` : ""}
      <span class="cal-dot">${list.slice(0,4).map(e => `<i class="${e.dir}"></i>`).join("")}</span>
    </div>`);
  }
  while (cells.length % 7) cells.push('<div class="cal-day pad"></div>');

  const inSum = Object.values(evs).flat().filter(e => e.dir === "in").reduce((s,e) => s + e.amount, 0);
  const outSum = Object.values(evs).flat().filter(e => e.dir === "out").reduce((s,e) => s + e.amount, 0);
  const label = first.toLocaleDateString(undefined, { month:"long", year:"numeric" });
  const pos = state.calTabs || "side";

  $("#s-calendar").innerHTML = `
    ${head("Calendar", label, "Pay in and bills out, on the days they land.",
      `<button class="btn" data-cal="-1" aria-label="Previous month">${ICON.left}</button>
       <button class="btn" data-cal="today">This month</button>
       <button class="btn" data-cal="1" aria-label="Next month">${ICON.right}</button>`)}
    <div class="tiles" style="margin-bottom:18px">
      <div class="tile"><span>Coming in this month</span><b>${esc(money.fmt(inSum))}</b></div>
      <div class="tile"><span>Going out this month</span><b>${esc(money.fmt(outSum))}</b></div>
      <div class="tile"><span>Difference</span><b>${esc(money.fmt(inSum - outSum))}</b></div>
    </div>
    <div class="binder pos-${esc(pos)}">
      <div class="cal">
        <div class="cal-head">${["Mon","Tue","Wed","Thu","Fri","Sat","Sun"].map(d => `<span>${d}</span>`).join("")}</div>
        <div class="cal-grid">${cells.join("")}</div>
      </div>
      ${pos === "off" ? "" : calBinder(cy, calCursor)}
    </div>
    <div class="cal-foot">
      <span class="key"><i style="background:var(--ch-in)"></i> Money in</span>
      <span class="key"><i style="background:var(--ch-out)"></i> Money out</span>
      <span class="key"><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i> Today</span>
      <span class="calpos"><span>Month tabs</span>
        ${[["side","Side"],["bottom","Bottom"],["off","Off"]].map(([id, lbl]) =>
          `<button data-calpos="${id}" aria-pressed="${pos === id}">${lbl}</button>`).join("")}
      </span>
    </div>`;

  centreMonthTab();
}

/* Laid along the bottom the twelve dividers overflow a phone, and a strip
   that opens on January while you are looking at September is a strip you
   have to fight. Centre the open month in its own scroller — never with
   scrollIntoView, which would drag the whole page with it.

   A hidden screen measures zero, so this has to run again once the
   calendar is actually on screen; render() calls it after unhiding. */
function centreMonthTab(){
  const wrap = $("#s-calendar .tabwrap");
  const open = $("#s-calendar .tab[aria-current='true']");
  if (!wrap || !open || wrap.scrollWidth <= wrap.clientWidth) return;
  wrap.scrollLeft = open.offsetLeft - (wrap.clientWidth - open.offsetWidth) / 2;
}

/* ============================== INSIGHTS ============================== */
function monthsOfLog(){
  const m = {};
  for (const e of state.log){
    const k = e.date.slice(0, 7);
    m[k] = m[k] || { in:0, out:0 };
    m[k][e.dir] += e.amount;
  }
  return Object.keys(m).sort().slice(-6).map(k => ({ key:k, ...m[k] }));
}
/* One category, measured against its limit if it has one.
   The track is scaled to whichever is bigger — the spend or the limit —
   so the cap mark lands in a meaningful place either way. */
function budgetRow(s, biggest, showLimit){
  const lim = showLimit ? (state.limits || {})[s.cat.id] || 0 : 0;
  const over = lim > 0 && s.amount > lim;
  const scale = Math.max(s.amount, lim, biggest, 1);
  const pct = v => Math.max(0, Math.min(100, v / scale * 100));
  const capAt = pct(lim);

  let note;
  if (lim && over)
    note = `<span class="budget-pill bad">${ICON.spark}Over by ${esc(money.fmt(s.amount - lim))}</span>
            <span>of a ${esc(money.fmt(lim))} limit</span>`;
  else if (lim)
    note = `<span class="budget-pill good">${ICON.check}${esc(money.fmt(lim - s.amount))} left</span>
            <span>of a ${esc(money.fmt(lim))} limit</span>`;
  else
    note = `<span class="budget-pill flat">${Math.round(s.amount / Math.max(1, biggest) * 100)}%</span>
            <span>of your biggest category</span>`;

  return `
    <div class="budget ${over ? "over" : ""}">
      <div class="budget-top">
        <i style="background:var(${s.cat.v})"></i>
        <span>${esc(s.cat.label)}</span>
        <b>${esc(money.fmt(s.amount))}</b>
      </div>
      <div class="budget-track">
        <i class="budget-fill" style="width:${pct(over ? lim : s.amount)}%;background:var(${s.cat.v})"></i>
        ${over ? `<i class="budget-over" style="left:${capAt}%;width:${pct(s.amount) - capAt}%"></i>` : ""}
        ${lim ? `<i class="budget-cap" style="left:${capAt}%"></i>` : ""}
      </div>
      <div class="budget-note">${note}</div>
    </div>`;
}

function drawInsights(){
  const months = monthsOfLog();
  const toggle = `<div class="periods" role="group" aria-label="Period">${PERIODS.map(p =>
    `<button data-period="${p.id}" aria-pressed="${period === p.id}">${
      esc(p.id === "custom" && customFrom && customTo
        ? day.label(customFrom) + " – " + day.label(customTo)
        : p.label)}</button>`).join("")}</div>
    ${period === "custom" ? `<button class="btn" data-sheet="dates">${ICON.calendar}Change dates</button>` : ""}
    <button class="btn" data-act="print">${ICON.print}Print</button>`;

  if (!months.length){
    $("#s-insights").innerHTML = head("Insights","Where it goes","", toggle) +
      `<div class="empty"><p>Once you've logged a few things, this fills in.</p></div>`;
    return;
  }

  const R = periodRange(period), Pv = prevRange(period);
  const now = tally(R.from, R.to), before = tally(Pv.from, Pv.to);
  const ins = topInsight(period);

  /* Daily spend across the window */
  const dayKeys = [];
  for (let d = R.from; d <= R.to; d = day.add(d, 1)) dayKeys.push(d);
  const dayPeak = Math.max(...dayKeys.map(k => now.days[k] || 0), 1);
  const peakDay = dayKeys.reduce((a, k) => (now.days[k] || 0) > (now.days[a] || 0) ? k : a, dayKeys[0]);

  /* Categories, in the fixed order — never re-ranked into new colours */
  const slices = allCats()
    .map(c => ({ cat:c, amount: now.cats[c.id] || 0 }))
    .filter(s => s.amount > 0);
  const catTotal = slices.reduce((s, x) => s + x.amount, 0);

  /* Sorting changes the ORDER, never the colour: each slot keeps its own
     hue wherever it lands, so a re-sort doesn't repaint the chart. */
  const sorted = slices.slice().sort((a, b) => catSort === "name"
    ? a.cat.label.localeCompare(b.cat.label)
    : b.amount - a.amount);
  const biggest = slices.reduce((m, x) => Math.max(m, x.amount), 0);
  const overCount = period === "three" ? 0 : slices.filter(x => {
    const l = (state.limits || {})[x.cat.id] || 0;
    return l > 0 && x.amount > l;
  }).length;

  const topNames = Object.entries(now.names).sort((a,b) => b[1] - a[1]).slice(0, 8);
  const namePeak = topNames.length ? topNames[0][1] : 1;

  $("#s-insights").innerHTML = `
    ${head("Insights", "Where it goes",
      "Money in and money out, measured over " + esc(R.label) + ". No judgement in here — it's just the record.",
      toggle)}

    ${ins ? `
    <div class="banner">
      <span class="banner-mark">${ICON.spark}</span>
      <p>Your <b>${esc(ins.cat.label.toLowerCase())}</b> spending is
         <b>${ins.pct > 0 ? "up" : "down"} ${Math.abs(ins.pct)}%</b> —
         ${esc(money.fmt(ins.now))} against ${esc(money.fmt(ins.before))} in the period before.</p>
    </div>` : ""}

    <div class="kpis" style="margin-bottom:22px">
      ${kpi("Spent", money.fmtBig(now.out), delta(now.out, before.out, false) + " vs period before")}
      ${kpi("Came in", money.fmtBig(now.in), delta(now.in, before.in, true) + " vs period before")}
      ${kpi("Net", (now.in - now.out >= 0 ? "+" : "") + money.fmtBig(now.in - now.out),
            now.in >= now.out ? "you kept money back" : "you drew on savings", { dark:true })}
      ${kpi("Put aside", money.fmtBig(now.moved), "moved to goals, not spent")}
    </div>

    <div class="cols cols-2">
      <div class="stack">
        <div class="panel">
          <div class="panel-head"><h2>Spend over time</h2>
            <span class="row-meta">DAILY</span></div>
          <div class="vbars">${dayKeys.map(k => {
            const v = now.days[k] || 0;
            return `<span class="vbar ${v === 0 ? "zero" : k === peakDay ? "peak" : ""}"
              data-tip="${esc(day.label(k))} · ${esc(money.fmt(v))}">
              <i style="height:${v === 0 ? 2 : Math.max(3, v / dayPeak * 100)}%"></i></span>`;
          }).join("")}</div>
          <div class="vaxis">
            <span>${esc(day.label(dayKeys[0]))}</span>
            <span>Busiest ${esc(day.label(peakDay))} · ${esc(money.fmt(now.days[peakDay] || 0))}</span>
            <span>${esc(day.label(dayKeys[dayKeys.length - 1]))}</span>
          </div>
        </div>

        <div class="panel">
          <div class="panel-head"><h2>Biggest single items</h2></div>
          ${topNames.length ? `<div class="rank">${topNames.map(([name, amt]) => {
            const c = catOf(name);
            return `<div class="rank-row">
              <span>${esc(name)}<br><span class="tag"><i style="background:var(${c.v})"></i>${esc(c.label)}</span></span>
              <span><i class="rank-bar" style="width:${Math.max(4, amt / namePeak * 100)}%;display:block"></i></span>
              <span class="bar-val"><button class="linkish" data-recat="${esc(name)}"
                aria-label="Change category for ${esc(name)}">${esc(money.fmt(amt))}</button></span>
            </div>`; }).join("")}</div>
          <p class="field-note" style="margin-top:12px">Tap an amount to move that name to a different category.</p>`
            : `<div class="empty"><p>Nothing logged in this window.</p></div>`}
        </div>
      </div>

      <div class="stack">
        <div class="panel">
          <div class="panel-head"><h2>Spend by category</h2>
            <button class="linkish" data-sheet="limits">${Object.keys(state.limits || {}).length ? "Edit limits" : "Set limits"}</button></div>
          ${slices.length > 1 ? `<div class="panel-tools">
            <span class="sorter" role="group" aria-label="Sort categories">
              <button data-catsort="amount" aria-pressed="${catSort === "amount"}">Most spent</button>
              <button data-catsort="name" aria-pressed="${catSort === "name"}">A–Z</button>
            </span>
          </div>` : ""}
          ${catTotal ? `
          ${overCount ? `<p class="budget-alert">${ICON.spark}
            <b>${overCount} ${overCount === 1 ? "category is" : "categories are"} over ${overCount === 1 ? "its" : "their"} limit</b>
            this month.</p>` : ""}
          <div class="${slices.length > CAT_BASE ? "ranked" : "donut"}">
            ${slices.length > CAT_BASE ? "" : donut(slices, catTotal, "spent")}
            <div class="catlist budgets">${sorted.map(s =>
              /* A limit is a month's cap, so it only means anything on a
                 month-shaped window. Don't show it against 3 months. */
              budgetRow(s, biggest, period !== "three")).join("")}</div>
          </div>
          <div class="tbl-wrap" style="margin-top:18px">
            <table class="tbl">
              <caption class="field-note" style="text-align:left;margin-bottom:8px">The same figures as a table</caption>
              <thead><tr><th>Category</th><th style="text-align:right">Spent</th><th style="text-align:right">Share</th></tr></thead>
              <tbody>${sorted.map(s => `<tr>
                <td>${esc(s.cat.label)}</td>
                <td class="num">${esc(money.fmt(s.amount))}</td>
                <td class="num">${Math.round(s.amount / catTotal * 100)}%</td></tr>`).join("")}</tbody>
            </table>
          </div>` : `<div class="empty"><p>Nothing to break down yet.</p></div>`}
        </div>
      </div>
    </div>

    ${(() => {
      const names = Object.keys(now.srcs).sort((a,b) => now.srcs[b] - now.srcs[a]);
      if (!names.length) return "";
      const inTotal = names.reduce((s,n) => s + now.srcs[n], 0);
      const groups = Object.keys(now.groups).sort((a,b) => now.groups[b] - now.groups[a]);
      const slicesIn = names.map(n => ({ cat:{ id:n, label:n, v:srcColour(n, names) }, amount:now.srcs[n] }));
      return `
      <div class="panel" style="margin-top:22px">
        <div class="panel-head"><h2>Where it came from</h2>
          <button class="linkish" data-go="plan">Edit income</button></div>
        <div class="cols cols-2">
          <div class="donut">
            ${donut(slicesIn, inTotal, "came in", true)}
            <div class="catlist">${names.map(n => {
              const prev = before.srcs[n] || 0;
              return `
              <div class="catrow">
                <i style="background:var(${srcColour(n, names)})"></i>
                <span>${esc(n)}</span>
                <b>${esc(money.fmt(now.srcs[n]))}</b>
              </div>
              <div class="catnote"><span>${Math.round(now.srcs[n] / inTotal * 100)}% of what came in${
                prev ? " · " + (now.srcs[n] >= prev ? "up " : "down ") +
                  Math.abs(Math.round((now.srcs[n] - prev) / prev * 100)) + "% on the period before" : ""}</span></div>`;
            }).join("")}</div>
          </div>
          <div>
            ${groups.length > 1 ? `
            <div class="tbl-wrap" style="margin-bottom:18px">
              <table class="tbl">
                <caption class="field-note" style="text-align:left;margin-bottom:8px">By group</caption>
                <thead><tr><th>Group</th><th style="text-align:right">Came in</th><th style="text-align:right">Share</th></tr></thead>
                <tbody>${groups.map(g => `<tr>
                  <td>${esc(g)}</td>
                  <td class="num">${esc(money.fmt(now.groups[g]))}</td>
                  <td class="num">${Math.round(now.groups[g] / inTotal * 100)}%</td></tr>`).join("")}</tbody>
              </table>
            </div>` : ""}
            <div class="tbl-wrap">
              <table class="tbl">
                <caption class="field-note" style="text-align:left;margin-bottom:8px">By source</caption>
                <thead><tr><th>Source</th><th style="text-align:right">Came in</th><th style="text-align:right">Before</th></tr></thead>
                <tbody>${names.map(n => `<tr>
                  <td>${esc(n)}</td>
                  <td class="num">${esc(money.fmt(now.srcs[n]))}</td>
                  <td class="num">${before.srcs[n] ? esc(money.fmt(before.srcs[n])) : "—"}</td></tr>`).join("")}</tbody>
              </table>
            </div>
          </div>
        </div>
      </div>`;
    })()}

    <div class="panel" style="margin-top:22px">
      <div class="panel-head"><h2>By month</h2></div>
      <div class="legend">
        <span><i style="background:var(--ch-in)"></i>Money in</span>
        <span><i style="background:var(--ch-out)"></i>Money out</span>
      </div>
      ${drawMonthBars(months)}
    </div>`;
}

/* The original month-by-month view, kept as its own block */
function drawMonthBars(months){
  const peak = Math.max(...months.map(m => Math.max(m.in, m.out)), 1);
  const mLabel = k => day.obj(k + "-01").toLocaleDateString(undefined, { month:"short" });
  return `
    <div class="bars">
      ${months.map(m => `
      <div class="bar-row">
        <span>${esc(mLabel(m.key))}</span>
        <span class="bar-track">
          <i class="bar in"  style="width:${Math.max(2, m.in  / peak * 100)}%"
             data-tip="In ${esc(money.fmt(m.in))}"></i>
          <i class="bar out" style="width:${Math.max(2, m.out / peak * 100)}%"
             data-tip="Out ${esc(money.fmt(m.out))}"></i>
        </span>
        <span class="bar-val">${esc(money.fmt(m.in,{plus:true}))}<br>${esc("−" + money.fmt(m.out))}</span>
      </div>`).join("")}
    </div>
    <div class="tbl-wrap" style="margin-top:20px">
      <table class="tbl">
        <caption class="field-note" style="text-align:left;margin-bottom:8px">The same figures as a table</caption>
        <thead><tr><th>Month</th><th style="text-align:right">In</th><th style="text-align:right">Out</th><th style="text-align:right">Net</th></tr></thead>
        <tbody>${months.map(m => `<tr>
          <td>${esc(day.obj(m.key + "-01").toLocaleDateString(undefined,{month:"long",year:"numeric"}))}</td>
          <td class="num">${esc(money.fmt(m.in))}</td>
          <td class="num">${esc(money.fmt(m.out))}</td>
          <td class="num">${esc(money.fmt(m.in - m.out))}</td></tr>`).join("")}</tbody>
      </table>
    </div>`;
}

/* ============================== WEEKLY REVIEW ============================== */
function drawReview(r){
  const from = day.add(r.today, -6);
  const week = state.log.filter(e => e.date >= from && e.date <= r.today);
  const wIn = week.filter(e => e.dir === "in").reduce((s,e) => s + e.amount, 0);
  const wOut = week.filter(e => e.dir === "out").reduce((s,e) => s + e.amount, 0);
  const busiest = {};
  for (const e of week) if (e.dir === "out") busiest[e.date] = (busiest[e.date] || 0) + e.amount;
  const peakDay = Object.entries(busiest).sort((a,b) => b[1] - a[1])[0];

  const soon = [];
  for (const b of outgoings())
    for (const d of occurrences(b, r.today, day.add(r.today, 7)))
      soon.push({ name:b.name, amount:expectedAmount(b), date:d, id:b.id, varies:!!b.varies });
  soon.sort((a,b) => a.date < b.date ? -1 : 1);
  const obs = observations();

  $("#s-review").innerHTML = `
    ${head("Weekly review", "The last seven days", "A short look back, then one thing to decide. Two minutes, no spreadsheet.")}
    <div class="tiles" style="margin-bottom:22px">
      <div class="tile"><span>Logged out</span><b data-count="${wOut}" data-fmt="plain">${esc(money.fmt(wOut))}</b></div>
      <div class="tile"><span>Came in</span><b data-count="${wIn}" data-fmt="plain">${esc(money.fmt(wIn))}</b></div>
      <div class="tile"><span>Entries</span><b>${week.length}</b></div>
      <div class="tile"><span>Busiest day</span><b style="font-size:1.05rem">${
        peakDay ? esc(day.label(peakDay[0])) + " · " + esc(money.fmt(peakDay[1])) : "—"}</b></div>
    </div>
    <div class="cols cols-2">
      <div class="stack">
      ${obs.length ? `
        <div class="panel">
          <div class="panel-head"><h2>Insights</h2>
            <span class="row-meta">from your own numbers</span></div>
          <ul class="notes">${obs.map((o, i) => `
            <li class="note ${esc(o.tone)}" style="--i:${i}">
              <span class="note-mark">${o.tone === "good" ? ICON.check : o.tone === "warn" ? ICON.spark : ICON.compass}</span>
              <p>${o.text}</p>
            </li>`).join("")}</ul>
        </div>` : `
        <div class="panel">
          <div class="panel-head"><h2>Insights</h2></div>
          <div class="empty"><p>Nothing worth flagging yet. A few weeks of logged spending
            and this fills with things drawn from your own numbers — never a generic tip.</p></div>
        </div>`}
      <div class="panel">
        <div class="panel-head"><h2>Coming in the next week</h2><button class="linkish" data-go="calendar">Calendar</button></div>
        ${soon.length ? `<ul class="rows">${soon.map(b => `
          <li class="row">
            <div class="row-main"><div class="row-title">${esc(b.name)}</div>
              <div class="row-meta">${esc(day.label(b.date))}</div></div>
            <span class="row-amt">${esc(money.fmt(b.amount))}</span>
            <button class="tick" data-pay="${esc(b.id)}" data-date="${esc(b.date)}" aria-label="Mark ${esc(b.name)} paid">${ICON.check}</button>
          </li>`).join("")}</ul>` : `<div class="empty"><p>Nothing due in the next seven days.</p></div>`}
      </div>
      </div>
      <div class="stack">
        <div class="panel">
          <div class="panel-head"><h2>Worth a look</h2></div>
          <p style="color:var(--ink-2)">${
            r.safe <= 0
              ? "You're tight until payday. Is there a bill here you could move, or is this a week to sit still?"
              : state.goals.length
                ? `You have <b style="color:var(--ink)">${esc(money.fmt(r.safe))}</b> spare. Move some to a goal, or leave it as room to breathe?`
                : `You have <b style="color:var(--ink)">${esc(money.fmt(r.safe))}</b> spare. Worth giving some of it a job?`}</p>
          <div style="display:flex;gap:10px;margin-top:16px;flex-wrap:wrap">
            <button class="btn" data-sheet="goal">${ICON.plus}Put some aside</button>
            <button class="btn" data-go="plan">Review the plan</button>
          </div>
        </div>
        <div class="panel">
          <div class="panel-head"><h2>Keep a copy</h2></div>
          <p style="color:var(--ink-2);font-size:.9375rem">A good habit to pair with the review: save a copy of your plan somewhere you'd find it again.</p>
          <button class="btn" data-act="export" style="margin-top:14px">Save a copy</button>
        </div>
      </div>
    </div>`;
}

/* ============================== SETTINGS ============================== */
const THEMES = [
  { id:"paper", label:"Paper", dot:"#1F4A3E" },
  { id:"linen", label:"Linen", dot:"#45392A" },
  { id:"fjord", label:"Fjord", dot:"#1C3C52" },
  { id:"blush", label:"Blush", dot:"#63304A" },
  { id:"slate", label:"Slate", dot:"#2E3841" },
  { id:"night", label:"Night", dot:"#8FD3B8" }
];
function exportStatus(){
  const d = daysSinceExport();
  if (d === null) return "Never saved off this device";
  if (d === 0) return "Saved today";
  if (d === 1) return "Saved yesterday";
  return "Last saved " + d + " days ago";
}
/* Settings is the one screen that is a list of lists, so its sections
   get an icon rather than the plain bullet the other panels use. */

  `<h2 class="ico"><span class="sec-ico">${ICON[icon]}</span>${esc(label)}</h2>`;

/* One settings item. `attrs` carries whatever action the card triggers, so
   the grid stays ignorant of what any particular card does. */

        ${setCard('data-act="restore"', "history", "Go back a day",

      <div class="setgrid">

            aria-pressed="${shown(o.id)}">

        </a>
      </div>

        Payday Plan ${esc(VERSION)} · &copy; ${new Date().getFullYear()} ${esc(BRAND.name)}.

<script>
"use strict";
/* ============================================================
   6. SHEETS — the only forms in the app
   ============================================================
   Each sheet asks for the fewest fields that can possibly work.
   A bill is name + amount + when. That is all.
   ============================================================ */
const sheetEl = $("#sheet"), sheetInner = $("#sheet-inner");
let sheetSubmit = null;

function openSheet(title, bodyHtml, onSubmit, opts){
  opts = opts || {};
  sheetInner.innerHTML = `
    <div class="grabber"></div>
    <div class="sheet-head">
      <h2>${esc(title)}</h2>
      <button class="ibtn" data-close aria-label="Close">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <form id="sheet-form" autocomplete="off" novalidate>
      ${bodyHtml}
      <p class="err" id="sheet-err" role="alert"></p>
      <div class="sheet-foot">
        ${opts.remove ? `<button type="button" class="btn btn-danger" data-remove>Remove</button>` : ""}
        <button type="submit" class="btn btn-primary">${esc(opts.cta || "Save")}</button>
      </div>
    </form>`;
  sheetSubmit = onSubmit;
  sheetEl.showModal();
  const first = sheetInner.querySelector("input:not([type=hidden]),select");
  if (first && !opts.noFocus) setTimeout(() => { first.focus(); if (first.select) first.select(); }, 60);
}
function closeSheet(){ if (sheetEl.open) sheetEl.close(); sheetSubmit = null; }
function sheetError(msg){ const e = $("#sheet-err"); if (e) e.textContent = msg; }

sheetEl.addEventListener("click", e => {
  if (e.target === sheetEl) closeSheet();                 /* tap the backdrop */
  if (e.target.closest("[data-close]")) closeSheet();
  const seg = e.target.closest(".seg button");
  if (seg){
    seg.parentElement.querySelectorAll("button").forEach(b => b.setAttribute("aria-pressed","false"));
    seg.setAttribute("aria-pressed","true");
    const hidden = seg.parentElement.nextElementSibling;
    if (hidden && hidden.tagName === "INPUT") hidden.value = seg.dataset.val;
  }
});
sheetEl.addEventListener("submit", e => {
  e.preventDefault();
  if (!sheetSubmit) return;
  const data = Object.fromEntries(new FormData(e.target));
  try { sheetSubmit(data); }
  catch (err){ sheetError(err.message || "That didn't work. Try again."); }
});

/* ---- Field builders ---- */
const fText = (name, label, value, ph) => `
  <label class="field"><span>${esc(label)}</span>
    <input name="${name}" value="${esc(value ?? "")}" placeholder="${esc(ph || "")}" maxlength="60"></label>`;
const fMoney = (name, label, cents, note) => `
  <label class="field"><span>${esc(label)}</span>
    <input name="${name}" inputmode="decimal" value="${cents != null ? (cents/100).toFixed(2) : ""}" placeholder="0.00">
    ${note ? `<span class="field-note">${esc(note)}</span>` : ""}</label>`;
const fDate = (name, label, value) => `
  <label class="field"><span>${esc(label)}</span>
    <input name="${name}" type="date" value="${esc(value || day.today())}"></label>`;
const fSeg = (name, label, opts, value) => `
  <div class="field"><span>${esc(label)}</span>
    <div class="seg">${opts.map(o => `
      <button type="button" data-val="${esc(o.id)}" aria-pressed="${value === o.id}">${esc(o.label)}</button>`).join("")}</div>
    <input type="hidden" name="${name}" value="${esc(value)}"></div>`;
const fCycle = (value) => fSeg("cycle", "How often", CYCLES, value);
const fSelect = (name, label, opts, value, note) => `
  <label class="field"><span>${esc(label)}</span>
    <select name="${name}">${opts.map(o =>
      `<option value="${esc(o.id)}"${o.id === value ? " selected" : ""}>${esc(o.label)}</option>`).join("")}</select>
    ${note ? `<span class="field-note">${esc(note)}</span>` : ""}</label>`;

/* ---- Sheet definitions ---- */
const SHEETS = {
  /* First run. Two ways in, and neither is a wizard. */
  start(){
    openSheet("Welcome", `
      ${fMoney("amount","How much money do you have right now?", null,
        "The total across the accounts you actually spend from. You can change it any time.")}
      <p class="field-note" style="margin:-6px 0 18px">
        Or look around with a filled-in example first — you can clear it whenever you like.</p>`,
      d => {
        const cents = money.parse(d.amount);
        commit(() => { state.balance = cents; }, null);
        closeSheet();
        /* Second and last step: where the plan gets kept. Skippable, but
           asked once up front rather than discovered a year later. */
        setTimeout(() => SHEETS.backupSetup(), 320);
      },
      { cta:"Start", remove:false });
    /* Secondary action, added after the form is built */
    const foot = sheetInner.querySelector(".sheet-foot");
    const alt = document.createElement("button");
    alt.type = "button"; alt.className = "btn"; alt.textContent = "Show me an example";
    alt.onclick = () => loadDemo();
    foot.insertBefore(alt, foot.firstChild);
  },
  balance(){
    openSheet("Money in hand", `
      ${fMoney("amount","How much do you have right now?", state.balance,
        "The total across the accounts you actually spend from. One number is enough.")}`,
      d => {
        const cents = money.parse(d.amount);
        commit(() => { state.balance = cents; }, "Balance updated");
        closeSheet();
      }, { cta:"Save" });
  },
  /* ---- Can I afford this? ----
     The question people actually ask a budget, answered against the
     whole projection rather than today's balance. */
  afford(){
    openSheet("Can I afford this?", `
      ${fMoney("amount", "How much is it?", null)}
      ${fDate("when", "When would you pay for it?", day.today())}
      <p class="field-note">This walks your next 120 days with the purchase in it —
        every payday, every bill, and what your own living has been costing.</p>`,
      d => {
        const cents = money.parse(d.amount);
        if (cents <= 0) throw new Error("Enter an amount greater than zero.");
        const when = d.when || day.today();
        afforded = afford(cents, when < day.today() ? day.today() : when);
        SHEETS.affordResult();
      }, { cta:"Check" });
  },
  affordResult(){
    const a = afforded;
    if (!a) return SHEETS.afford();
    const cushion = a.floor > 0 ? ` and keeps your ${esc(money.fmt(a.floor))} cushion intact` : "";
    openSheet(a.ok ? "Yes — you can" : "Not comfortably", `
      <div class="verdict ${a.ok ? "yes" : "no"}">
        <span class="verdict-mark">${a.ok ? ICON.check : ICON.spark}</span>
        <div>
          <b>${esc(money.fmt(a.cents))}${a.from === day.today() ? "" : " on " + esc(day.label(a.from))}</b>
          <p>${a.ok
            ? `leaves you at <b>${esc(money.fmt(a.low.balance))}</b> at the tightest point —
               ${esc(day.long(a.low.date))}${cushion}.`
            : `would take you to <b>${esc(money.fmt(a.low.balance))}</b> on
               ${esc(day.long(a.low.date))}${a.short ? `, ${esc(money.fmt(a.short))} below where you'd want to be` : ""}.`}</p>
        </div>
      </div>
      ${!a.ok && a.safeDay ? `<p class="field-note" style="margin-top:2px">
        Wait until <b>${esc(day.long(a.safeDay))}</b> and the same purchase clears every day after it.</p>` : ""}
      ${!a.ok && !a.safeDay ? `<p class="field-note" style="margin-top:2px">
        There's no day in the next 120 where this fits without dipping in. Something in the plan
        would have to change first.</p>` : ""}
      <p class="field-note">Nothing has been logged. This was a question, not a purchase.</p>`,
      () => {
        commit(() => {
          state.balance -= a.cents;
          state.log.unshift({ id:uid(), ts:Date.now(), date: a.from,
            name:"Purchase", amount:a.cents, dir:"out" });
        }, "Logged");
        afforded = null;
        closeSheet();
      }, { cta:"Log it as spent", noFocus:true });
  },
  buffer(){
    openSheet("Cushion", `
      ${fMoney("amount","Hold back this much", state.buffer,
        "Money the app pretends you don't have, so you never scrape zero. Leave at 0 if you'd rather not.")}`,
      d => {
        const cents = money.parse(d.amount || "0");
        commit(() => { state.buffer = Math.max(0, cents); }, "Cushion updated");
        closeSheet();
      });
  },
  currency(){
    const list = ["USD","EUR","GBP","CAD","AUD","NZD","CHF","SEK","NOK","DKK","PLN","JPY","INR","ZAR","NGN","MXN","BRL"];
    openSheet("Currency", `
      <label class="field"><span>Currency</span>
        <select name="currency">${list.map(c =>
          `<option value="${c}"${state.currency === c ? " selected" : ""}>${c}</option>`).join("")}</select></label>
      ${fText("symbol","Or type your own symbol", state.symbol, "e.g. ₦, GH₵")}
      <p class="field-note">This changes how amounts are shown. It does not convert anything.</p>`,
      d => {
        commit(() => {
          state.currency = d.currency || "USD";
          state.symbol = (d.symbol || "").trim().slice(0, 3);
        }, "Currency updated");
        closeSheet();
      });
    /* A custom symbol wins over the dropdown when amounts are drawn, so
       picking from the list has to clear it — otherwise the list looks dead. */
    const symField = sheetInner.querySelector("input[name=symbol]");
    sheetInner.querySelector("select[name=currency]")
      .addEventListener("change", () => { symField.value = ""; });
  },
  income(id){
    const it = state.income.find(x => x.id === id);
    const h = (it && it.history) || [];
    openSheet(it ? "Edit pay" : "Money in", `
      ${fText("name","What is it?", it && it.name, "Wage, client, benefit…")}
      ${fMoney("amount", it && it.varies ? "Usual amount" : "How much?", it && it.amount)}
      ${fDate("next", it ? "Next one" : "When's the next one?", it && it.next)}
      ${fCycle(it ? it.cycle : "monthly")}
      ${fSeg("varies", "Is it the same every time?",
        [{ id:"fixed", label:"Same every time" }, { id:"varies", label:"It varies" }],
        it && it.varies ? "varies" : "fixed")}
      ${fText("group","Whose is it? (optional)", it && it.group, "Mine, Household, partner’s…")}
      ${h.length ? `<p class="field-note" style="margin:-8px 0 16px">Last ${h.length}:
        ${h.map(x => esc(money.fmt(x))).join(" · ")} — forecasting on
        <b>${esc(money.fmt(expectedAmount(it)))}</b>.</p>` : ""}`,
      d => {
        const rec = {
          id: it ? it.id : uid(),
          name: (d.name || "").trim() || "Pay",
          amount: money.parse(d.amount),
          next: d.next || day.today(),
          cycle: d.cycle || "monthly",
          varies: d.varies === "varies",
          group: (d.group || "").trim().slice(0, 24),
          history: it ? (it.history || []) : []
        };
        if (rec.amount <= 0) throw new Error("Enter an amount greater than zero.");
        commit(() => {
          if (it) Object.assign(it, rec); else state.income.push(rec);
        }, it ? "Pay updated" : "Pay added");
        closeSheet();
      },
      { remove: !!it, cta: it ? "Save" : "Add" });
    if (it) $("[data-remove]").onclick = () => {
      commit(() => { state.income = state.income.filter(x => x.id !== it.id); }, "Removed");
      closeSheet();
    };
  },
  bill(id){
    const it = state.bills.find(x => x.id === id);
    const h = (it && it.history) || [];
    openSheet(it ? "Edit bill" : "Money out", `
      ${fText("name","What is it?", it && it.name, "Rent, phone, Netflix…")}
      ${fMoney("amount", it && it.varies ? "Usual amount" : "How much?", it && it.amount)}
      ${fDate("next", it ? "Next due" : "When's it next due?", it && it.next)}
      ${fCycle(it ? it.cycle : "monthly")}
      ${fSeg("varies", "Is it the same every time?",
        [{ id:"fixed", label:"Same every time" }, { id:"varies", label:"It varies" }],
        it && it.varies ? "varies" : "fixed")}
      ${h.length ? `<p class="field-note" style="margin:-8px 0 16px">Last ${h.length}:
        ${h.map(x => esc(money.fmt(x))).join(" · ")} — forecasting on
        <b>${esc(money.fmt(expectedAmount(it)))}</b>.</p>` : ""}
      <div id="sink-field" hidden>
        ${fSeg("sink", "It only lands now and then",
          [{ id:"yes", label:"Hold money back for it" }, { id:"no", label:"Don't" }],
          it ? (sinkOn(it.id) ? "yes" : "no") : "yes")}
        <p class="field-note" style="margin:-10px 0 4px">A share of it comes out of
          safe-to-spend every month, so the bill is already covered when it lands.</p>
      </div>`,
      d => {
        const rec = {
          id: it ? it.id : uid(),
          name: (d.name || "").trim() || "Bill",
          amount: money.parse(d.amount),
          next: d.next || day.today(),
          cycle: d.cycle || "monthly",
          varies: d.varies === "varies",
          added: it ? it.added : day.today(),
          history: it ? (it.history || []) : [],
          skipped: it ? (it.skipped || []) : [],
          paid: it ? (it.paid || []) : []
        };
        if (rec.amount <= 0) throw new Error("Enter an amount greater than zero.");
        commit(() => {
          if (it) Object.assign(it, rec); else state.bills.push(rec);
          state.sink = state.sink || {};
          if (SINKABLE.has(rec.cycle) && d.sink !== "no") state.sink[rec.id] = true;
          else delete state.sink[rec.id];
        }, it ? "Bill updated" : "Bill added");
        closeSheet();
      },
      { remove: !!it, cta: it ? "Save" : "Add" });
    /* The question only makes sense for a bill that isn't monthly, so it

  goal(id){

      ${fText("name","What for?", it && it.name, "Trip, new laptop, cushion…")}
      <div class="field-row">

        ${fMoney("saved","Saved so far", it ? it.saved : 0)}
      </div>

  /* The mirror of a goal: a number you are driving down, not up. */
  debt(id){

      d => {
        const rec = {
          id: it ? it.id : uid(), added: it ? it.added : day.today(),
          name: (d.name || "").trim() || "Debt",
          owed: Math.max(0, money.parse(d.owed || "0")),

  },
  /* ---- Bank statement import ---- */
  csv(){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = ".csv,text/csv,text/plain";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        const rows = parseCSV(rd.result);
        if (rows.length < 2) return toast("That file has no rows to read.");
        csvState = { rows, map: null, order: null, flip: false };
        SHEETS.csvMap();
      };
      rd.readAsText(f);
    };
    inp.click();
  },
  csvMap(){
    const { rows } = csvState;
    const header = rows[0];
    const guess = csvGuess(header);
    /* If nothing in the first row looks like a header, treat it as data */
    const hasHeader = guess.date >= 0 || guess.amount >= 0 || guess.name >= 0;
    const cols = header.map((h, i) => ({
      id: String(i),
      label: (hasHeader && String(h).trim() ? String(h).trim() : "Column " + (i+1)) +
             " — e.g. " + String((rows[1] || [])[i] || "").slice(0, 18)
    }));
    const none = [{ id:"-1", label:"— none —" }];
    const mode = guess.out >= 0 && guess.in >= 0 ? "split" : "single";
    csvState.map = Object.assign({}, guess, { hasHeader, mode });
    csvState.order = csvDateOrder(rows.slice(1).map(r => r[guess.date >= 0 ? guess.date : 0]));

    openSheet("Import a statement", `
      <p class="field-note" style="margin:0 0 15px">
        ${rows.length - (hasHeader ? 1 : 0)} rows found. Tell it which column is which —
        it has already guessed.</p>
      ${fSelect("date", "Date", cols, String(guess.date >= 0 ? guess.date : 0))}
      ${fSelect("name", "Description", none.concat(cols), String(guess.name))}
      ${fSeg("mode", "How are amounts written?",
        [{ id:"single", label:"One amount column" }, { id:"split", label:"Separate in / out" }], mode)}
      <div id="csv-single" ${mode === "split" ? "hidden" : ""}>
        ${fSelect("amount", "Amount", none.concat(cols), String(guess.amount))}
        ${fSeg("flip", "Which way round?",
          [{ id:"no", label:"Minus = money out" }, { id:"yes", label:"Minus = money in" }], "no")}
      </div>
      <div id="csv-split" ${mode === "split" ? "" : "hidden"}>
        <div class="field-row">
          ${fSelect("out", "Money out", none.concat(cols), String(guess.out))}
          ${fSelect("in", "Money in", none.concat(cols), String(guess.in))}
        </div>
      </div>
      ${fSelect("order", "Date order", [
        { id:"dmy", label:"Day / Month / Year" },
        { id:"mdy", label:"Month / Day / Year" },
        { id:"ymd", label:"Year-Month-Day" }], csvState.order)}
      <div id="csv-preview"></div>`,
      d => {
        const built = buildCsvPreview(d);
        if (!built.rows.length) throw new Error("Nothing importable with those columns.");
        csvState.pending = built;
        SHEETS.csvConfirm();
      },
      { cta:"Preview", noFocus:true });

    /* Live preview as the mapping changes */
    const refresh = () => {
      const form = $("#sheet-form");
      if (!form) return;
      const d = Object.fromEntries(new FormData(form));
      $("#csv-single").hidden = d.mode === "split";
      $("#csv-split").hidden  = d.mode !== "split";
      const built = buildCsvPreview(d);
      $("#csv-preview").innerHTML = csvPreviewHtml(built);
    };
    sheetInner.addEventListener("change", refresh);
    sheetInner.addEventListener("click", e => { if (e.target.closest(".seg button")) setTimeout(refresh, 0); });
    refresh();
  },
  csvConfirm(){
    const built = csvState.pending;
    openSheet("Import " + built.rows.length + " entries?", `
      ${csvPreviewHtml(built, true)}
      <p class="field-note" style="margin-top:14px">
        <b>Your balance won't change.</b> These already happened — the amount you have in hand
        already accounts for them. This only fills in the history behind it.</p>`,
      () => {
        commit(() => {
          for (const r of built.rows)
            state.log.push({ id:uid(), ts:Date.now(), date:r.date, name:r.name, amount:r.amount, dir:r.dir });
          state.log.sort((a,b) => a.date < b.date ? 1 : a.date > b.date ? -1 : 0);
          if (state.log.length > 4000) state.log.length = 4000;
        }, built.rows.length + " entries imported");
        closeSheet();
        tab = "log"; render();
      }, { cta:"Import them", noFocus:true });
  },
  /* ---- Rename and repurpose the six category slots ---- */
  cats(){
    const list = catList();
    openSheet("Categories", `
      <p class="field-note" style="margin:0 0 16px">${catCount() >= CAT_MAX
        ? `All ${CAT_MAX} slots plus Other.`
        : `${catCount()} slots plus Other, and you can run up to ${CAT_MAX}.`}
        Rename any of them, and set the words that file an entry there — separated by commas.
        They're tested top to bottom, so put the more specific one first.</p>
      ${list.map((c, i) => `
        <div class="catedit">
          <span class="catedit-dot" style="background:var(${c.v})"></span>
          <div class="catedit-fields">
            <input name="nm_${c.id}" value="${esc(c.label)}" maxlength="24" aria-label="Category name">
            <input name="wd_${c.id}" value="${esc(catWords(c.id))}" aria-label="Matching words"
                   placeholder="words that match, separated by commas">
          </div>
          <span class="catedit-move">
            <button type="button" class="mini" data-catmove="${c.id}" data-dir="up" ${i === 0 ? "disabled" : ""}
              aria-label="Move ${esc(c.label)} up">&#8593;</button>
            <button type="button" class="mini" data-catmove="${c.id}" data-dir="down"
              ${i === list.length - 1 ? "disabled" : ""} aria-label="Move ${esc(c.label)} down">&#8595;</button>
          </span>
        </div>`).join("")}
      <div class="catedit">
        <span class="catedit-dot" style="background:var(--cat-0)"></span>
        <div class="catedit-fields">
          <input name="nm_other" value="${esc(otherCat().label)}" maxlength="24" aria-label="Name for everything else">
          <p class="field-note" style="margin:6px 0 0">Anything matching nothing above lands here.</p>
        </div>
      </div>
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:16px">
        ${catCount() < CAT_MAX
          ? `<button type="button" class="btn" data-catadd>${ICON.plus}Add a category</button>` : ""}
        ${catCount() > CAT_BASE
          ? `<button type="button" class="btn" data-catdrop>Remove the last one</button>` : ""}
      </div>
      ${catCount() > CAT_BASE ? `<p class="field-note" style="margin-top:12px">
        The first six own a colour. Past that the app runs out of hues that stay apart for
        colourblind readers, so the extras share the neutral one and the breakdown on Insights
        switches from a ring to ranked bars — the label does the identifying instead.</p>` : ""}
      <p class="field-note" style="margin-top:14px">Renaming moves nothing — entries follow the words, and
        anything you filed by hand stays where you put it.</p>`,
      d => {
        commit(() => { readCatEditor(d); }, "Categories updated");
        closeSheet();
      }, { cta:"Save categories", noFocus:true });

    /* Bound to the FORM, not to sheetInner. openSheet rebuilds the form
       every time, so its listeners die with it — sheetInner survives, and
       listeners hung there would stack up one per reopen until a single
       click on Add fired six of them at once. */
    const form = $("#sheet-form");
    /* Adding and removing reopen the sheet, so whatever has been typed
       has to be read back first or it is lost on the redraw. */
    const keep = () => readCatEditor(Object.fromEntries(new FormData(form)));
    form.addEventListener("click", e => {
      if (e.target.closest("[data-catadd]")){
        keep();
        state.catCount = Math.min(CAT_MAX, catCount() + 1);
        save(); SHEETS.cats();
        return;
      }
      if (e.target.closest("[data-catdrop]")){
        keep();
        /* Its name and words are left in place, so turning the slot back
           on brings back what was set up rather than a blank. */
        state.catCount = Math.max(CAT_BASE, catCount() - 1);
        save(); SHEETS.cats();
        return;
      }

      /* Reorder live, so the arrows show the real result */
      const mv = e.target.closest("[data-catmove]");
      if (!mv) return;
      const order = catList().map(c => c.id);
      const i = order.indexOf(mv.dataset.catmove);
      const j = mv.dataset.dir === "up" ? i - 1 : i + 1;
      if (j < 0 || j >= order.length) return;
      [order[i], order[j]] = [order[j], order[i]];
      keep();                           /* keep what they have typed so far */
      state.catOrder = order;
      SHEETS.cats();
    });
  },
  /* Pick any two dates. Kept in view state, not saved with the plan —
     a report window is a question you are asking, not part of your money. */
  dates(){
    const t = day.today();
    openSheet("Choose dates", `
      <div class="field-row">
        ${fDate("from", "From", customFrom || day.addMonths(t, -1))}

  /* Optional monthly caps. A limit you never set stays invisible. */
  limits(){
    openSheet("Spending limits", `
      <p class="field-note" style="margin:0 0 16px">A month's cap for any category you care about.

      ${allCats().map(c => fMoney("lim_" + c.id, c.label, (state.limits || {})[c.id] || 0)).join("")}`,

          state.limits = {};

  wipe(){

      <p class="figure-sub" style="margin:0 0 18px">This clears your plan, your bills and everything logged, on this device. Save a copy first if you might want it back.</p>`,

  payday(){
    const r = reckon();
    const inc = (r.todayPay && r.todayPay.item) || r.paydayItem;
    if (!inc) return SHEETS.balance();
    const autos = state.goals.filter(g => (g.auto || 0) > 0 && g.saved < g.target);
    openSheet("Got paid", `
      ${fMoney("amount","How much landed?", expectedAmount(inc),
        inc.varies ? "Pay that moves is remembered, so the forecast follows what you actually earn."
                   : "Change it if the amount was different this time.")}
      <p class="field-note">This adds to your money in hand and moves ${esc(inc.name)} on to its next date.${
        autos.length ? ` It also puts ${esc(money.fmt(autos.reduce((s,g) => s + goalRoom(g), 0)))} straight into ${
          autos.map(g => esc(g.name)).join(", ")}.` : ""}</p>`,
      d => {
        const cents = money.parse(d.amount);
        commit(() => {
          state.balance += cents;
          state.log.unshift({ id:uid(), ts:Date.now(), date:day.today(), name:inc.name,
            amount:cents, dir:"in", src:inc.id });
          if (inc.varies) inc.history = (inc.history || []).concat(cents).slice(-6);
          const nx = nextAfter(inc.next, inc.cycle);
          if (nx) inc.next = nx; else state.income = state.income.filter(x => x.id !== inc.id);
          for (const g of state.goals){
            const amt = goalRoom(g);
            if (amt > 0) moveToGoal(g.id, amt);
          }
        }, "Payday logged");
        closeSheet();
      }, { cta:"Add it" });
  },
  /* Moving real money into a goal — the thing goals could never do before. */
  putaside(id){

      })), pick)}

        closeSheet();
      }, { cta:"Move it" });
  },
  /* A variable bill asks what it actually came to this time. */

  /* ---- Saved data wouldn't open ---- */
  recover(){

      <p class="field-note" style="margin:0 0 16px;font-size:.9375rem;color:var(--ink-2)">

  /* ---- Fixing something already logged ---- */
  entry(id){
    const e = state.log.find(x => x.id === id);
    if (!e) return;
    const g = e.goal ? state.goals.find(x => x.id === e.goal) : null;
    openSheet(g ? "Money put aside" : "Edit entry", `
      ${g ? `<p class="field-note" style="margin:0 0 15px">This moved money into <b>${esc(g.name)}</b>.
               Changing the amount moves ${esc(g.name)} with it.</p>`
           : fText("name","What was it?", e.name, "Coffee, lunch, bus…")}
      ${fMoney("amount","How much?", e.amount)}
      ${fDate("when","When?", e.date)}
      ${g ? "" : fSeg("dir","Which way?",
        [{ id:"out", label:"Money out" }, { id:"in", label:"Money in" }], e.dir)}`,
      d => {
        const amount = money.parse(d.amount);
        if (amount <= 0) throw new Error("Enter an amount greater than zero.");
        const when = d.when || e.date;
        const dir = g ? "out" : (d.dir || e.dir);
        const name = g ? e.name : ((d.name || "").trim() || e.name);
        commit(() => {
          /* Take the old entry back out of the balance, then apply the
             new one. Doing it in that order keeps a direction change
             from silently double-counting. */
          state.balance += e.dir === "out" ? e.amount : -e.amount;
          state.balance += dir === "in" ? amount : -amount;
          if (g) g.saved += amount - e.amount;
          e.name = name; e.amount = amount; e.date = when; e.dir = dir;
        }, "Entry updated");
        closeSheet();
      },
      { remove:true, cta:"Save" });
    $("[data-remove]").onclick = () => {
      commit(() => {
        state.balance += e.dir === "out" ? e.amount : -e.amount;
        if (g) g.saved -= e.amount;
        state.log = state.log.filter(x => x.id !== e.id);
      }, "Removed");
      closeSheet();
    };
  },
  /* The quiet override — categories are guessed, never demanded. */
  recat(name){
    const cur = catOf(name);
    openSheet("Category", `
      ${fSelect("cat", "Put “" + name + "” under", allCats(), cur.id,
        "Everything logged under this name moves with it, past and future.")}`,
      d => {
        commit(() => {
          state.cats = state.cats || {};
          state.cats[String(name).trim().toLowerCase()] = d.cat;
        }, "Moved to " + catDef(d.cat).label);
        closeSheet();
      });
  }
};

let csvState = null;
function buildCsvPreview(d){

    date: +d.date,
    name: +d.name,
    amount: +d.amount,
    out: +d.out,

  };
  return csvRows(csvState.rows, map, d.order || "dmy", d.flip === "yes");
}
function csvPreviewHtml(built, full){
  const show = built.rows.slice(0, full ? 12 : 5);
  const sk = built.skipped;
  const notes = [];
  if (sk.duplicate) notes.push(sk.duplicate + " already logged");
  if (sk.nodate) notes.push(sk.nodate + " with no readable date");
  if (sk.noamount) notes.push(sk.noamount + " with no amount");
  if (!built.rows.length){
    return `<p class="err" style="margin:10px 0 0">Nothing importable yet — check the columns.
      ${notes.length ? esc("Skipped: " + notes.join(", ") + ".") : ""}</p>`;
  }
  return `
    <p class="field-note" style="margin:14px 0 6px"><b>${built.rows.length}</b> to import${
      notes.length ? " · skipping " + esc(notes.join(", ")) : ""}</p>
    <div class="tbl-wrap"><table class="tbl"><tbody>${show.map(r => `
      <tr><td>${esc(day.label(r.date))}</td><td>${esc(r.name)}</td>
        <td class="num" style="color:${r.dir === "in" ? "var(--calm)" : "inherit"}">${
          esc(r.dir === "in" ? money.fmt(r.amount,{plus:true}) : "−" + money.fmt(r.amount))}</td></tr>`).join("")}
    </tbody></table></div>
    ${built.rows.length > show.length
      ? `<p class="field-note" style="margin-top:6px">…and ${built.rows.length - show.length} more.</p>` : ""}`;
}

/* Pull the category editor's fields into state. An empty word list is a
   real choice — it means that slot matches nothing until you refile by hand. */
function readCatEditor(d){
  state.catNames = state.catNames || {};
  state.catRules = state.catRules || {};
  for (const c of CATS.concat([{ id:"other" }])){
    /* Only slots the editor actually drew are in `d`. A switched-off slot
       has no field, and reading one as "" would quietly erase the name and
       words it was set up with — so it is skipped, not blanked. */
    if (!(("nm_" + c.id) in d)) continue;
    const nm = String(d["nm_" + c.id] || "").trim();
    if (nm) state.catNames[c.id] = nm; else delete state.catNames[c.id];
    if (c.id !== "other") state.catRules[c.id] = String(d["wd_" + c.id] || "").trim();
  }
}

function snapSize(s){
  const kb = Math.round((s.data ? s.data.length : 0) / 1024);
  return kb < 1 ? "empty" : kb + " KB";
}
/* How much a goal would take on the next payday */
function goalRoom(g){
  return Math.max(0, Math.min(g.auto || 0, (g.target || 0) - (g.saved || 0)));
}
function moveToGoal(goalId, cents){
  const g = state.goals.find(x => x.id === goalId);
  if (!g) return;
  state.balance -= cents;
  g.saved += cents;
  state.log.unshift({ id:uid(), ts:Date.now(), date:day.today(),
    name:"To " + g.name, amount:cents, dir:"out", goal:g.id });
}
/* Paying a bill: remember what it actually cost when the amount moves. */
function payBill(id, date, cents){
  const bill = outgoings().find(b => b.id === id);
  if (!bill) return;
  const amount = cents == null ? expectedAmount(bill) : cents;
  bill.paid = bill.paid || [];
  if (!bill.paid.includes(date)) bill.paid.push(date);
  if (bill.paid.length > 40) bill.paid = bill.paid.slice(-40);
  if (bill.varies){
    bill.history = (bill.history || []).concat(amount).slice(-6);
  }
  /* Paying a debt is the only outgoing that also shrinks something */
  if (isDebt(bill)) bill.owed = Math.max(0, (bill.owed || 0) - amount);
  state.balance -= amount;
  state.log.unshift({ id:uid(), ts:Date.now(), date:day.today(), name:bill.name, amount, dir:"out" });
}

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go){ tab = go.dataset.go; closeRail(); render(); window.scrollTo(0,0); return; }

  const cal = e.target.closest("[data-cal]");
  if (cal){
    const step = cal.dataset.cal;
    calCursor = step === "today" ? day.today().slice(0,7) : day.addMonths(calCursor + "-01", Number(step)).slice(0,7);
    render();
    return;
  }

  const cmo = e.target.closest("[data-calmonth]");
  if (cmo){ calCursor = cmo.dataset.calmonth; drawCalendar(reckon()); return; }

  const cyr = e.target.closest("[data-calyear]");
  if (cyr){
    calCursor = day.addMonths(calCursor + "-01", Number(cyr.dataset.calyear) * 12).slice(0,7);
    drawCalendar(reckon());
    return;
  }

  const cps = e.target.closest("[data-calpos]");
  if (cps){
    /* A display preference, so it is saved but never worth an undo toast. */
    state.calTabs = cps.dataset.calpos;
    save();
    drawCalendar(reckon());
    return;
  }

  const sh = e.target.closest("[data-sheet]");
  if (sh){ const fn = SHEETS[sh.dataset.sheet]; if (fn) fn(sh.dataset.id); return; }

  const per = e.target.closest("[data-period]");
  if (per){
    const id = per.dataset.period;
    /* Custom has to be asked before it can be shown */
    if (id === "custom" && !(customFrom && customTo)) return SHEETS.dates();
    period = id; drawInsights(); return;
  }

  const cs = e.target.closest("[data-catsort]");
  if (cs){ catSort = cs.dataset.catsort; drawInsights(); return; }

  const sec = e.target.closest("[data-section]");
  if (sec){
    const id = sec.dataset.section;
    state.off = state.off || {};
    if (state.off[id]) delete state.off[id]; else state.off[id] = true;
    save(); render();
    return;
  }

  const recat = e.target.closest("[data-recat]");
  if (recat){ SHEETS.recat(recat.dataset.recat); return; }

  const entry = e.target.closest("[data-entry]");
  if (entry){ SHEETS.entry(entry.dataset.entry); return; }

  const dirBtn = e.target.closest("[data-dir]");
  if (dirBtn){ logDir = dirBtn.dataset.dir; logLimit = 120; drawLog(); return; }

  if (e.target.closest("[data-logclear]")){
    logQuery = ""; logCat = "all"; logDir = "all"; logLimit = 120; drawLog(); return;
  }
  if (e.target.closest("[data-logmore]")){ logLimit += 200; drawLog(); return; }

  const pay = e.target.closest("[data-pay]");
  if (pay){
    /* outgoings(), not state.bills — a debt repayment is due on the same
       rows and its tick has to work the same way. */
    const bill = outgoings().find(b => b.id === pay.dataset.pay);
    const date = pay.dataset.date;
    if (!bill) return;
    /* A bill that moves asks what it came to; a fixed one just goes. */
    if (bill.varies) return SHEETS.billpaid(bill.id, date);
    commit(() => { payBill(bill.id, date, null); }, bill.name + " paid");
    return;
  }

  const skip = e.target.closest("[data-skip]");
  if (skip){
    const bill = outgoings().find(b => b.id === skip.dataset.skip);
    const date = skip.dataset.date;
    if (!bill) return;
    commit(() => {
      bill.skipped = bill.skipped || [];
      if (!bill.skipped.includes(date)) bill.skipped.push(date);
      if (bill.skipped.length > 40) bill.skipped = bill.skipped.slice(-40);
    }, bill.name + " · marked as not taken");
    return;
  }

  const del = e.target.closest("[data-del]");
  if (del){
    const entry = state.log.find(x => x.id === del.dataset.del);
    if (!entry) return;
    commit(() => {
      state.balance += entry.dir === "out" ? entry.amount : -entry.amount;
      state.log = state.log.filter(x => x.id !== entry.id);
    }, "Removed");
    return;
  }

  const act = e.target.closest("[data-act]");
  if (act){ ACTS[act.dataset.act] && ACTS[act.dataset.act](); return; }

  /* NOTE: <html> also carries data-theme, so this MUST be scoped to the
     swatch buttons. An unscoped closest() matches the root element on
     every click and silently eats everything below it. */
  const th = e.target.closest("button[data-theme]");
  if (th){
    state.theme = th.dataset.theme;
    document.documentElement.setAttribute("data-theme", state.theme);
    save(); drawSettings();
    return;
  }
});

   DEMO: SOURCE GESTURES
   ============================================================
   Demo build only, and honestly: this is a speed bump, not a
   lock. Anything served to a browser has already been given to
   the reader, and the browser menu still opens the tools these
   shortcuts don't. What it does do is make "save this page" a
   deliberate act rather than a reflex — and turn the moment
   into the one line worth saying to someone who likes the app
   enough to want its insides.

   Deliberately NOT here: the debugger-in-a-loop trick some sites
   use to fight devtools. It freezes tabs, it looks broken, and
   it would make this app feel like malware.
   ============================================================ */
if (DEMO_BUILD){
  let pitched = 0;
  const pitch = () => {
    /* Once a minute at most: a message that repeats becomes noise */
    if (Date.now() - pitched < 60000) return;
    pitched = Date.now();
    toast("Like it enough to look inside? Buy the file — it's yours to keep.",
      "Get it", () => window.open(BRAND.site, "_blank", "noopener,noreferrer"));
  };

  document.addEventListener("contextmenu", e => {
    /* Never steal the menu from a text field — that would break
       copy and paste for someone genuinely trying the app out. */
    if (e.target.closest("input,textarea,select,a")) return;
    e.preventDefault();
    pitch();
  });

  document.addEventListener("keydown", e => {
    const k = (e.key || "").toLowerCase();
    const devTools = k === "f12"
      || ((e.ctrlKey || e.metaKey) && e.shiftKey && (k === "i" || k === "j" || k === "c"))
      || ((e.ctrlKey || e.metaKey) && (k === "u" || k === "s"));
    if (!devTools) return;
    /* Ctrl+S in a field is someone's muscle memory, not an attack */
    if (e.target.closest("input,textarea")) return;
    e.preventDefault();
    pitch();
  });
}

/* ============================================================
   MOTION
   ============================================================
   Two rules keep this from becoming decoration:

   1. Movement marks arrival, not change. A screen animates when you
      navigate to it and stays still afterwards, so logging a coffee
      doesn't set the whole page dancing.
   2. Anything that moves is gated on prefers-reduced-motion, in CSS
      for the animations and here for the counting.
   ============================================================ */
const stillPlease = () => {
  try { return matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch { return false; }
};
let lastPainted = null;

/* Numbers ride up to their value instead of snapping to it. The final
   frame writes the exact text the renderer produced, so what you end up
   reading is never an interpolated approximation. */
function countUp(root){
  root.querySelectorAll("[data-count]").forEach(el => {
    const to = Number(el.dataset.count);
    if (!isFinite(to) || Math.abs(to) < 100) return;      /* nothing to watch below a unit */
    const fmt = el.dataset.fmt === "plain" ? money.fmt : money.fmtBig;
    const final = el.textContent;
    const t0 = performance.now(), ms = 620;
    const step = now => {
      const k = Math.min(1, (now - t0) / ms);
      const eased = 1 - Math.pow(1 - k, 3);
      if (k >= 1){ el.textContent = final; return; }
      el.textContent = fmt(Math.round(to * eased));
      requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

function animateIn(force){
  const el = $("#s-" + tab);
  if (!el) return;
  if (!force && tab === lastPainted) return;   /* a re-render is not an arrival */
  lastPainted = tab;
  if (stillPlease()) return;
  /* The line draws itself, which needs its own length in CSS */
  el.querySelectorAll(".proj-line").forEach(p => {
    try { p.style.setProperty("--len", (p.getTotalLength() * 3).toFixed(0)); } catch {}
  });
  el.classList.remove("fresh");
  void el.offsetWidth;                          /* restart, rather than continue */
  el.classList.add("fresh");
  countUp(el);
}

/* ---- Toast with undo ---- */
let toastTimer = null;
function toast(msg, actionLabel, action){
  const el = $("#toast");
  el.innerHTML = `<span>${esc(msg)}</span>` +
    (actionLabel ? `<button type="button" id="toast-act">${esc(actionLabel)}</button>` : "");
  el.hidden = false;
  requestAnimationFrame(() => el.classList.add("up"));
  if (action) $("#toast-act").onclick = () => { hideToast(); action(); };
  clearTimeout(toastTimer);
  toastTimer = setTimeout(hideToast, actionLabel ? 6000 : 2600);
}
function hideToast(){
  const el = $("#toast");
  el.classList.remove("up");
  setTimeout(() => { el.hidden = true; }, 240);
}

    e.preventDefault();
