<script>
"use strict";
/* ============================================================
   EXAMPLE DATA — Alex, Sept 2026 → June 2027
   ============================================================
   The dataset is defined across the whole nine-month window.
   Spending history is generated day by day from a fixed seed,
   up to whatever today is, so the demo is always current and
   always identical on every machine. The balance is derived
   from that history, so the log and the headline agree.
   ============================================================ */
/* The window follows whatever today is, so the example always has a
   full nine months behind it — month-on-month comparisons, a filled
   category breakdown and a real projection, on any machine, any day. */
const DEMO_MONTHS_BACK = 9;
const DEMO_OPENING = 128000;            /* in hand at the start of the window */

/* Deterministic PRNG (mulberry32) — same demo everywhere, every time */
function seeded(seed){
  return function(){
    seed |= 0; seed = seed + 0x6D2B79F5 | 0;
    let t = Math.imul(seed ^ seed >>> 15, 1 | seed);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}

/* What a real week actually looks like: a few small things most
   days, a bigger shop weekly, the odd treat at the weekend. */
const BASKET = {
  everyday: [
    ["Coffee", 180, 420], ["Bakery", 250, 650], ["Corner store", 620, 1850],
    ["Transit card", 1000, 2200], ["Pharmacy", 620, 2400], ["Snack", 150, 480],
    ["Lunch at work", 700, 1350], ["Produce stand", 450, 1200], ["Water & snacks", 300, 900]
  ],
  shopBig:   [["Supermarket", 5200, 9400], ["Big grocery run", 4800, 8800]],
  shopSmall: [["Farmers market", 1600, 3600], ["Deli", 1200, 2800], ["Butcher", 1400, 3200]],
  treat: [
    ["Lunch out", 1200, 2400], ["Dinner with Maya", 1800, 3800], ["Takeout", 1400, 2900],
    ["Movies", 900, 1800], ["Bookstore", 1100, 2600], ["Brunch", 1600, 2900],
    ["Drinks with Chris", 1500, 3200], ["Coffee and cake", 700, 1400]
  ],
  now_and_then: [
    ["Haircut", 1800, 2800], ["Gas station", 4000, 6800], ["Gift for Mom", 1500, 4000],
    ["Hardware store", 900, 3400], ["Flight to Denver", 2600, 4900], ["Vet", 3500, 7200],
    ["New sneakers", 4500, 8900], ["Dentist", 5000, 9000], ["Winter coat", 6500, 11000],
    ["Physical therapy", 3800, 5200], ["Oil change", 8000, 16000], ["Eye doctor", 4500, 9500]
  ],
  windfall: [
    ["Refund", 1200, 4200], ["Sold a chair", 2000, 6000], ["Birthday money", 2000, 5000],
    ["Cash back", 900, 2600]
  ]
};

function demoState(){
  const rnd = seeded(20260901);
  const pick = arr => arr[Math.floor(rnd() * arr.length)];
  const between = (lo, hi) => Math.round((lo + rnd() * (hi - lo)) / 10) * 10;

  const DEMO_FROM = day.addMonths(day.today(), -DEMO_MONTHS_BACK);
  /* The wage lands every second Friday — anchor on the first Friday in the window */
  let wageAnchor = DEMO_FROM;
  while (day.obj(wageAnchor).getDay() !== 5) wageAnchor = day.add(wageAnchor, 1);

  const s = blankState();
  s.currency = "USD";
  s.symbol = "";              /* let Intl draw it, so $ follows the locale */
  s.buffer = 15000;                       /* $150 cushion */
  s.started = DEMO_FROM;

  /* --- The plan, running through the whole window --- */
  const upcoming = (dayOfMonth) => {          /* next occurrence on/after today */
    const t = day.today();
    let d = t.slice(0, 8) + String(dayOfMonth).padStart(2, "0");
    if (d < t) d = day.addMonths(d, 1);
    return d;
  };
  let wage = wageAnchor;
  while (wage < day.today()) wage = day.add(wage, 14);

  s.income = [
    { id:"in-wage",   name:"Paycheck",           amount:118000, cycle:"biweekly", next:wage,
      varies:true, history:[], group:"Household" },
    { id:"in-client", name:"Client retainer",    amount:38000,  cycle:"monthly",  next:upcoming(20),
      group:"Freelance" }
  ];
  s.bills = [
    { id:"bl-rent",   name:"Rent",              amount:72500, cycle:"monthly", next:upcoming(3),  paid:[] },
    { id:"bl-power",  name:"Electricity",       amount:6850,  cycle:"monthly", next:upcoming(11), paid:[],
      varies:true, history:[] },
    { id:"bl-net",    name:"Internet",          amount:3990,  cycle:"monthly", next:upcoming(5),  paid:[] },
    { id:"bl-phone",  name:"Phone",             amount:2400,  cycle:"monthly", next:upcoming(13), paid:[] },
    { id:"bl-ins",    name:"Home insurance",    amount:3840,  cycle:"monthly", next:upcoming(8),  paid:[] },
    { id:"bl-gym",    name:"Climbing gym",      amount:4500,  cycle:"monthly", next:upcoming(2),  paid:[] },
    { id:"bl-music",  name:"Music",             amount:1099,  cycle:"monthly", next:upcoming(16), paid:[] },
    { id:"bl-tv",     name:"Streaming",         amount:1399,  cycle:"monthly", next:upcoming(22), paid:[] },
    { id:"bl-transp", name:"Transit pass",       amount:4200,  cycle:"monthly", next:upcoming(1),  paid:[] },
    { id:"bl-water",  name:"Water",             amount:2260,  cycle:"monthly", next:upcoming(26), paid:[],
      varies:true, history:[] },
    /* The two that catch people out: they don't show up in a monthly
       average, then land all at once. */
    { id:"bl-tax",    name:"Property tax",      amount:16800, cycle:"quarterly",
      next: day.addMonths(day.today(), 2), paid:[] },
    { id:"bl-carins", name:"Car insurance",     amount:41500, cycle:"yearly",
      next: day.addMonths(day.today(), 4), paid:[] }
  ];
  /* Both of the once-in-a-while bills are held back for, which is the
     whole point of them being in the example. */
  s.sink = { "bl-tax": true, "bl-carins": true };
  s.goals = [
    { id:"gl-trip",  name:"Trip to Hawaii",    target:120000, saved:46000,  auto:5000 },
    { id:"gl-cush",  name:"Emergency cushion", target:300000, saved:165000, auto:0 },
    { id:"gl-lap",   name:"New laptop",        target:140000, saved:32000,  auto:0 }
  ];

  /* --- Nine months of history, up to today --- */
  const stop = day.today();
  const log = [];
  let balance = DEMO_OPENING;
  let n = 0;

  /* Drive the history off the real recurrence rules rather than the day
     of the month, or a yearly bill gets logged twelve times a year. */
  const dueOn = {};
  for (const item of s.income.concat(s.bills))
    for (const d of occurrencesIn(item, DEMO_FROM, stop))
      (dueOn[d] = dueOn[d] || []).push(item);

  for (let d = DEMO_FROM; d <= stop; d = day.add(d, 1)){
    const dow = day.obj(d).getDay();      /* 0 Sun … 6 Sat */
    const weekend = dow === 0 || dow === 6;
    const seenToday = new Set();
    const add = (name, cents, dir) => {
      if (seenToday.has(name)) return;        /* one of each per day reads truer */
      seenToday.add(name);
      log.push({ id:"dm" + (n++), ts:n, date:d, name, amount:cents, dir });
      balance += dir === "in" ? cents : -cents;
    };

    /* Pay days and bills, on the days the rules actually put them */
    for (const item of (dueOn[d] || [])){
      const isIncome = s.income.includes(item);
      const actual = item.varies
        ? between(item.amount * 0.78, item.amount * 1.3)
        : item.amount + Math.round(between(-200, 400));
      add(item.name, actual, isIncome ? "in" : "out");
      if (!isIncome) item.paid.push(d);
      if (item.varies) item.history = item.history.concat(actual).slice(-6);
    }

    /* Everyday spending — tuned so the month roughly balances,
       the way it does for someone living close to their pay. */
    const howMany = weekend ? (rnd() < .45 ? 2 : 3) : (rnd() < .14 ? 1 : rnd() < .6 ? 2 : 3);
    for (let i = 0; i < howMany; i++){
      const [nm, lo, hi] = pick(BASKET.everyday);
      add(nm, between(lo, hi), "out");
    }
    if (dow === 6){ const [nm, lo, hi] = pick(BASKET.shopBig);   add(nm, between(lo, hi), "out"); }
    if (dow === 3){ const [nm, lo, hi] = pick(BASKET.shopSmall); add(nm, between(lo, hi), "out"); }
    if (weekend && rnd() < .8){ const [nm, lo, hi] = pick(BASKET.treat); add(nm, between(lo, hi), "out"); }
    if (!weekend && rnd() < .38){ const [nm, lo, hi] = pick(BASKET.treat); add(nm, between(lo, hi), "out"); }
    if (rnd() < .075){ const [nm, lo, hi] = pick(BASKET.now_and_then); add(nm, between(lo, hi), "out"); }
    if (rnd() < .022){ const [nm, lo, hi] = pick(BASKET.windfall); add(nm, between(lo, hi), "in"); }
    /* Money moved to the funds on the 21st. This is the lever that keeps
       the example living close to its pay rather than quietly piling up. */
    if (Number(d.slice(8)) === 21) add("To savings", 27000, "out");
    /* The months that always cost more than you planned for */
    if (d.slice(5) === "12-19") add("Christmas", between(38000, 52000), "out");
    if (d.slice(5) === "04-08") add("Flights to Hawaii", between(21000, 29000), "out");
    if (d.slice(5) === "01-09") add("Winter bills catch-up", between(9000, 14000), "out");
  }

  for (const b of s.bills) b.paid = b.paid.slice(-14);
  log.reverse();                          /* newest first, as the app expects */
  s.log = log.slice(0, 2000);
  s.balance = balance;
  s.touched = stop;
  s.lastExport = Date.now() - 3 * 86400000;   /* a user who keeps copies */
  s.demo = true;
  return s;
}

function loadDemo(){
  commit(() => { state = demoState(); }, "Example data loaded");
  document.documentElement.setAttribute("data-theme", state.theme || "paper");
  tab = "today";
  closeSheet();
  render();
  window.scrollTo(0, 0);
}
</script>

<script>
"use strict";
/* ============================================================
   8. SAVING YOUR DATA
   ============================================================
   Two ways out: a one-off copy (with a real Save dialog so you
   choose the folder), and a linked file the app keeps current.
   ============================================================ */
/* Not in the demo. Linking asks you to choose a file and then writes to it —
   on a demo that means a stranger's example household could overwrite the
   real plan a visitor picked by mistake. "Save a copy" still works, so the
   feature is still visible, it just cannot destroy anything. */
const canPick = () => !DEMO_BUILD && typeof window.showSaveFilePicker === "function";

function snapshot(){
  return JSON.stringify({ format:"payday-plan", version:VERSION, savedAt:new Date().toISOString(), state }, null, 2);
}
function stamp(){ return day.today(); }

async function saveAs(text, filename, mime){
  if (canPick()){
    let handle;
    try {
      handle = await window.showSaveFilePicker({
        suggestedName: filename,
        types: [{ description:"Payday Plan file", accept: { [mime]: [filename.slice(filename.lastIndexOf("."))] } }]
      });
    } catch (err){
      if (err && err.name === "AbortError") return false;          /* user cancelled: do nothing */
      return fallbackDownload(text, filename, mime);
    }
    try {
      const w = await handle.createWritable();
      await w.write(new Blob([text], { type:mime }));
      await w.close();
      return true;
    } catch { return fallbackDownload(text, filename, mime); }
  }
  return fallbackDownload(text, filename, mime);
}
function fallbackDownload(text, filename, mime){
  const url = URL.createObjectURL(new Blob([text], { type:mime }));
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  setTimeout(() => URL.revokeObjectURL(url), 5000);
  return true;
}

/* ============================================================
   LINKED FILE — the app writes your plan straight to disk
   ============================================================
   The file handle is kept in IndexedDB, because localStorage can
   only hold strings and a handle is an object. That is the whole
   reason this survives a reload: without it the link would die
   every time the tab closed, which is exactly when a backup
   matters. Point it at a synced folder (Dropbox, Drive, OneDrive)
   and the plan is off the device with no account and no server.
   ============================================================ */
const handleStore = {
  dbPromise: null,
  db(){
    if (!this.dbPromise){
      this.dbPromise = new Promise((resolve, reject) => {
        let req;
        try { req = indexedDB.open("payday-plan-link", 1); }
        catch (err){ reject(err); return; }
        req.onupgradeneeded = () => {
          if (!req.result.objectStoreNames.contains("handles")) req.result.createObjectStore("handles");
        };
        req.onsuccess = () => resolve(req.result);
        req.onerror = () => reject(req.error);
      }).catch(() => null);
    }
    return this.dbPromise;
  },
  async run(mode, fn){
    const db = await this.db();
    if (!db) return null;
    return new Promise(resolve => {
      let tx, req;
      try { tx = db.transaction("handles", mode); req = fn(tx.objectStore("handles")); }
      catch { resolve(null); return; }
      tx.oncomplete = () => resolve(req ? req.result : null);
      tx.onerror = () => resolve(null);
      tx.onabort  = () => resolve(null);
    });
  },
  get(){    return this.run("readonly",  s => s.get("file")); },
  put(h){   return this.run("readwrite", s => s.put(h, "file")); },
  clear(){  return this.run("readwrite", s => s.delete("file")); }
};

const linked = {
  handle: null,
  name: "",
  /* off · linked · needs-permission · unsupported */
  state: canPick() ? "off" : "unsupported",
  remembered: true,
  busy: false,
  pending: false,
  lastSaved: null,

  status(){
    if (this.state === "unsupported") return "Not available in this browser";
    /* The caller escapes this — don't escape twice */
    if (this.state === "needs-permission") return this.name + " needs reconnecting";
    if (this.state !== "linked") return "Not set up";
    const when = this.lastSaved
      ? " · saved " + new Date(this.lastSaved).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })
      : "";
    return "Writing to " + this.name + when +
      (this.remembered ? "" : " · this browser will ask for the file again next time");
  },

  /* Called once at startup. Browsers drop the write grant between
     sessions, so a remembered file usually comes back needing one click. */
  async init(){
    if (!canPick()) return;
    const h = await handleStore.get();
    if (!h) return;
    this.handle = h;
    this.name = h.name || "payday-plan.json";
    const perm = await this.permission(false);
    this.state = perm === "granted" ? "linked" : "needs-permission";
    if (tab === "settings") drawSettings();
    if (this.state === "linked") this.write();
    else setTimeout(() => SHEETS.reconnect(), 700);
  },

  async permission(request){
    if (!this.handle) return "none";
    const opts = { mode:"readwrite" };
    try {
      let s = await this.handle.queryPermission(opts);
      if (s !== "granted" && request) s = await this.handle.requestPermission(opts);
      return s;
    } catch { return "denied"; }
  },

  async reconnect(){
    const perm = await this.permission(true);
    if (perm === "granted"){
      this.state = "linked";
      await this.write();
      render();
      toast("Reconnected · " + this.name + " is up to date again");
      return true;
    }
    toast("Still not connected. Your plan is safe on this device.");
    return false;
  },

  async choose(){
    if (!canPick()){ toast("This browser can't link a file. Use “Save a copy”."); return; }
    let h;
    try {
      h = await window.showSaveFilePicker({
        suggestedName: "payday-plan.json",
        types: [{ description:"Payday Plan file", accept: { "application/json":[".json"] } }]
      });
    } catch (err){ if (!err || err.name !== "AbortError") toast("Couldn't link that file."); return; }
    this.handle = h;
    this.name = h.name;
    this.state = "linked";
    /* If the browser won't remember it, the link still works today —
       it just has to be picked again next time. Say so rather than
       letting someone believe they're covered. */
    this.remembered = (await handleStore.put(h)) !== null;
    await this.write();
    state.lastExport = Date.now(); save();
    render();                    /* the Today reminder keys off this */
    toast("Linked · this file now stays up to date");
  },

  async stop(){
    this.handle = null; this.name = ""; this.state = "off"; this.lastSaved = null;
    await handleStore.clear();
    render();
    toast("Stopped. Nothing more will be written to that file.");
  },

  queueWrite(){
    if (this.state !== "linked") return;
    if (this.busy){ this.pending = true; return; }
    clearTimeout(this._t);
    this._t = setTimeout(() => this.write(), 700);
  },

  async write(){
    if (!this.handle || this.state !== "linked") return;
    this.busy = true;
    try {
      const w = await this.handle.createWritable();
      await w.write(new Blob([snapshot()], { type:"application/json" }));
      await w.close();
      this.lastSaved = Date.now();
      state.lastExport = this.lastSaved;
      lsSet(KEY, JSON.stringify(state));      /* not save(): that would re-queue this write */
      drawBackupChip(); pulseBackupChip();
    } catch {
      /* A lost grant is recoverable; don't throw the link away. */
      this.state = "needs-permission";
      toast("Couldn't write to " + this.name + ".", "Reconnect", () => linked.reconnect());
    }
    this.busy = false;
    if (this.pending){ this.pending = false; this.queueWrite(); }
    if (tab === "settings") drawSettings();
  }
};

const ACTS = {
  async export(){
    const ok = await saveAs(snapshot(), "payday-plan-" + stamp() + ".json", "application/json");
    if (ok){
      commit(() => { state.lastExport = Date.now(); }, null);
      toast("Copy saved");
    }
  },
  restore(){ SHEETS.restore(); },
  /* A statement for the month you're looking at on Insights */
  print(){
    const R = periodRange(period), t = tally(R.from, R.to);
    const title = period === "three" ? "Last three months"
      : day.obj(R.from).toLocaleDateString(undefined, { month:"long", year:"numeric" });

    const cats = allCats().map(c => ({ c, amt: t.cats[c.id] || 0 }))
      .filter(x => x.amt > 0).sort((a,b) => b.amt - a.amt);
    const top = Object.entries(t.names).sort((a,b) => b[1] - a[1]).slice(0, 12);
    const billsPaid = [];
    for (const b of outgoings())
      for (const d of (b.paid || []))
        if (d >= R.from && d <= R.to) billsPaid.push({ name:b.name, date:d, amount:expectedAmount(b) });
    billsPaid.sort((a,b) => a.date < b.date ? -1 : 1);

    const rows = list => list.map(([a, n]) =>
      `<tr><td>${esc(a)}</td><td class="n">${esc(money.fmt(n))}</td></tr>`).join("");

    $("#printout").innerHTML = `
      <div class="pr-head">
        <div><h1>Payday Plan</h1><span>${esc(title)}</span></div>
        <span>Printed ${esc(day.long(day.today()))}</span>
      </div>

      <div class="pr-kpis">
        <div class="pr-kpi"><span>Money in</span><b>${esc(money.fmt(t.in))}</b></div>
        <div class="pr-kpi"><span>Spent</span><b>${esc(money.fmt(t.out))}</b></div>
        <div class="pr-kpi"><span>Put aside</span><b>${esc(money.fmt(t.moved))}</b></div>
        <div class="pr-kpi"><span>Net</span><b>${esc(money.fmt(t.in - t.out - t.moved))}</b></div>
      </div>

      <div class="pr-cols">
        <div class="pr-sec">
          <h2>By category</h2>
          <table><tbody>${cats.map(x => {
            const lim = period === "three" ? 0 : (state.limits || {})[x.c.id] || 0;
            return `<tr><td>${esc(x.c.label)}${lim ? ` <span style="color:#666">of ${esc(money.fmt(lim))}</span>` : ""}</td>
              <td class="n">${esc(money.fmt(x.amt))}</td></tr>`;
          }).join("") || `<tr><td>Nothing logged</td><td class="n">—</td></tr>`}</tbody></table>
        </div>
        <div class="pr-sec">
          <h2>Biggest items</h2>
          <table><tbody>${rows(top) || `<tr><td>Nothing logged</td><td class="n">—</td></tr>`}</tbody></table>
        </div>
      </div>

      <div class="pr-sec">
        <h2>Bills paid</h2>
        <table><tbody>${billsPaid.map(b =>
          `<tr><td>${esc(day.label(b.date))} — ${esc(b.name)}</td>
               <td class="n">${esc(money.fmt(b.amount))}</td></tr>`).join("")
          || `<tr><td>None marked paid in this period</td><td class="n">—</td></tr>`}</tbody></table>
      </div>

      ${state.goals.length || (state.debts || []).length ? `
      <div class="pr-cols">
        ${state.goals.length ? `<div class="pr-sec"><h2>Savings</h2>
          <table><tbody>${state.goals.map(g =>
            `<tr><td>${esc(g.name)}</td><td class="n">${esc(money.fmt(g.saved))} of ${esc(money.fmt(g.target))}</td></tr>`
          ).join("")}</tbody></table></div>` : ""}
        ${(state.debts || []).length ? `<div class="pr-sec"><h2>Debts</h2>
          <table><tbody>${state.debts.map(dt =>
            `<tr><td>${esc(dt.name)}</td><td class="n">${esc(money.fmt(dt.owed || 0))} left</td></tr>`
          ).join("")}</tbody></table></div>` : ""}
      </div>` : ""}

      <div class="pr-foot">
        In hand ${esc(money.fmt(state.balance))} · cushion ${esc(money.fmt(state.buffer))} ·
        ${t.count} entries in this period<br>
        Payday Plan ${esc(VERSION)} · ${esc(BRAND.name)} · ${esc(BRAND.siteLabel)}
      </div>`;
    window.print();
  },
  reconnect(){ reconnectAsked = false; SHEETS.reconnect(); },
  tour(){ openTour(); },
  afford(){ afforded = null; SHEETS.afford(); },
  wireset(){
    whatIf.burn = whatIf.income = whatIf.once = 0;
    const r = reckon(); drawOutlook(r);
  },
  csv(){ SHEETS.csv(); },
  import(){
    const inp = document.createElement("input");
    inp.type = "file"; inp.accept = "application/json,.json";
    inp.onchange = () => {
      const f = inp.files && inp.files[0];
      if (!f) return;
      const rd = new FileReader();
      rd.onload = () => {
        let data;
        try { data = JSON.parse(rd.result); }
        catch { toast("That file isn't a Payday Plan copy."); return; }
        const incoming = data && data.state ? data.state : data;
        if (!incoming || typeof incoming !== "object" || !("balance" in incoming)){
          toast("That file isn't a Payday Plan copy."); return;
        }
        commit(() => { state = Object.assign(blankState(), incoming, { v:3 }); }, "Copy opened");
        document.documentElement.setAttribute("data-theme", state.theme || "paper");
        tab = "today"; render();
      };
      rd.readAsText(f);
    };
    inp.click();
  },
  /* One row, three jobs: set it up, mend it, or stop it. */
  link(){
    if (linked.state === "needs-permission"){ reconnectAsked = false; return SHEETS.reconnect(); }
    if (linked.state === "linked"){
      openSheet("Backup file", `
        <p class="field-note" style="margin:0 0 16px;font-size:.9375rem;color:var(--ink-2)">
          Every change is being written to <b>${esc(linked.name)}</b>.</p>`,
        () => { closeSheet(); linked.choose(); },
        { cta:"Pick a different file", remove:true, noFocus:true });
      $("[data-remove]").textContent = "Stop backing up";
      $("[data-remove]").onclick = () => { closeSheet(); linked.stop(); };
      return;
    }
    linked.choose();
  },
  demo(){
    if (state.demo || (!state.income.length && !state.bills.length && !state.log.length)) return loadDemo();
    openSheet("Load example data", `
      <p class="figure-sub" style="margin:0 0 18px">This replaces your own plan with a made-up one. Save a copy first if you want to keep what's here.</p>`,
      () => loadDemo(), { cta:"Replace with the example", noFocus:true });
  }
};

/* ============================================================
   9. START
   ============================================================ */
function boot(){
  const had = load();
  document.documentElement.setAttribute("data-theme", state.theme || "paper");

  /* Saved data existed but could not be read. Say so and offer the
     snapshots — never present a wiped app as a fresh start. */
  if (!had && loadIssue){
    render();
    setTimeout(() => SHEETS.recover(), 350);
    return;
  }

  /* A shop window should not open onto an empty room. This has to come
     BEFORE the first-run branch below, which returns. */
  let seeded = false;
  if (DEMO_BUILD && !had && !tourSeen()){
    state = demoState();
    state.demo = true;
    save();
    markTourSeen();          /* a visitor is not a buyer being set up */
    seeded = true;
  }

  if (!had && !seeded){
    /* The guided tour is both the setup and the manual, so there is
       one thing to maintain rather than two that drift apart. */
    render();
    setTimeout(() => openTour(), 350);
    return;
  }

  keepSnapshot();            /* today's safety net, before today's edits */
  render();
  /* Ask the browser not to evict this origin under storage pressure */
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  linked.init();             /* picks the backup file back up where it left off */

  /* A plan that predates the tour still gets it once. Never both this and
     the payday nudge in the same breath. */
  if (!tourSeen()){
    setTimeout(() => openTour(), 400);
    return;
  }

  /* Gentle nudge on payday — one tap, not a form. */
  const r = reckon();
  if (r.payday === r.today){
    setTimeout(() => toast("Payday. Did it land?", "Log it", () => SHEETS.payday()), 700);
  }
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", boot);
else boot();
</script>
