<script>
"use strict";
/* ============================================================
   1. FOUNDATIONS — money, dates, storage
   ============================================================
   Money is ALWAYS integer cents. Never a float.
   Dates are ALWAYS "YYYY-MM-DD" strings, compared as strings,
   and only turned into Date objects at local noon so daylight
   saving can never shift a day.
   ============================================================ */

/* ============================================================
   BRAND
   ============================================================
   Everything that names the maker comes from here — the rail
   footer, the About card in Settings and the printed statement.
   Change these four lines and the whole file follows.
   ============================================================ */
const BRAND = {
  name:  "JPS Digital Pages",
  site:  "https://jpsdigitalpages.com/",
  terms: "https://jpsdigitalpages.com/terms-of-service",
  siteLabel: "jpsdigitalpages.com"
};

/* ============================================================
   DEMO BUILD
   ============================================================
   false for the file you sell. Set it to true for the copy you
   host as a public demo: a first-time visitor lands in the
   filled-in example instead of an empty app, with a line saying
   so. Nothing else about the app changes, and a visitor who
   starts editing keeps their own version from then on.
   ============================================================ */
const DEMO_BUILD = false;

const VERSION = "1.1.2";
const KEY = "payday-plan-v3";

/* ---- Money ---- */
const money = {
  /* Parse anything a human might type: "12,50" "€1.234,56" "1,234.56" "(5)" */
  parse(raw){
    if (typeof raw === "number") return Math.round(raw * 100);
    let v = String(raw ?? "").trim();
    if (!v) throw new Error("Enter an amount.");
    let neg = /^\(.*\)$/.test(v);
    if (neg) v = v.slice(1, -1);
    if (/^-/.test(v)) { neg = true; v = v.slice(1); }
    v = v.replace(/[\s  '’]/g, "").replace(/[^\d.,]/g, "");
    if (!v) throw new Error("Enter an amount using digits, like 12.50.");
    const lastComma = v.lastIndexOf(","), lastDot = v.lastIndexOf(".");
    if (lastComma > -1 && lastDot > -1){
      v = lastComma > lastDot
        ? v.replace(/\./g, "").replace(",", ".")   // 1.234,56
        : v.replace(/,/g, "");                      // 1,234.56
    } else if (lastComma > -1){
      const groups = v.split(",");
      // "1,234" = thousands · "12,5" = decimal
      v = (groups.length > 2 || /^\d{1,3},\d{3}$/.test(v)) ? v.replace(/,/g, "") : v.replace(",", ".");
    }
    const n = Number(v);
    if (!isFinite(n)) throw new Error("Enter an amount using digits, like 12.50.");
    const cents = Math.round(n * 100) * (neg ? -1 : 1);
    if (!Number.isSafeInteger(cents) || Math.abs(cents) > 1e12) throw new Error("That amount is too large.");
    return cents;
  },
  fmt(cents, opts){
    const s = state.symbol;
    const abs = Math.abs(cents) / 100;
    const body = s
      ? s + abs.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ",")
      : new Intl.NumberFormat(undefined, { style:"currency", currency: state.currency || "USD" }).format(abs);
    return (cents < 0 ? "−" : (opts && opts.plus ? "+" : "")) + body;
  },
  /* Round display for the headline: no cents when the number is big */
  fmtBig(cents){
    const s = state.symbol;
    const abs = Math.abs(cents) / 100;
    const whole = Math.abs(cents) >= 10000;         /* ≥ 100.00 → drop cents */
    const n = whole ? Math.round(abs).toLocaleString() : abs.toFixed(2);
    const body = s ? s + n
      : new Intl.NumberFormat(undefined,{style:"currency",currency:state.currency||"USD",
          minimumFractionDigits:whole?0:2,maximumFractionDigits:whole?0:2}).format(abs);
    return (cents < 0 ? "−" : "") + body;
  }
};

/* ---- Dates ---- */
const day = {
  today(){ return day.key(new Date()); },
  key(d){
    return d.getFullYear() + "-" + String(d.getMonth()+1).padStart(2,"0") + "-" + String(d.getDate()).padStart(2,"0");
  },
  obj(k){ const [y,m,d] = k.split("-").map(Number); return new Date(y, m-1, d, 12, 0, 0, 0); },
  add(k, days){ const d = day.obj(k); d.setDate(d.getDate() + days); return day.key(d); },
  addMonths(k, months){
    const [y,m,dd] = k.split("-").map(Number);
    const target = new Date(y, m-1+months, 1, 12);
    const last = new Date(target.getFullYear(), target.getMonth()+1, 0).getDate();
    target.setDate(Math.min(dd, last));            /* 31 Jan +1m → 28/29 Feb */
    return day.key(target);
  },
  diff(a, b){ return Math.round((day.obj(b) - day.obj(a)) / 86400000); },
  /* "Today" · "Tomorrow" · "Fri 19" · "19 Dec" */
  label(k){
    const t = day.today(), n = day.diff(t, k);
    if (n === 0) return "Today";
    if (n === 1) return "Tomorrow";
    if (n === -1) return "Yesterday";
    const d = day.obj(k);
    if (n > 1 && n < 7) return d.toLocaleDateString(undefined, { weekday:"long" });
    return d.toLocaleDateString(undefined, { day:"numeric", month:"short" });
  },
  long(k){ return day.obj(k).toLocaleDateString(undefined, { weekday:"long", day:"numeric", month:"long" }); }
};

/* ---- Recurrence ----
   Cycles are deliberately few. Every extra option is a decision
   the user has to make, and decisions are the thing we are cutting. */
const CYCLES = [
  { id:"monthly",   label:"Monthly"        },
  { id:"weekly",    label:"Weekly"         },
  { id:"biweekly",  label:"Every 2 weeks"  },
  { id:"quarterly", label:"Every 3 months" },
  { id:"yearly",    label:"Yearly"         },
  { id:"once",      label:"One time"       }
];
/* Quarterly and yearly earn their place: insurance, road tax and annual
   subscriptions are exactly the bills that wreck a plan, and leaving
   them out doesn't simplify the app — it makes the forecast wrong. */
function nextAfter(dateKey, cycle){
  switch(cycle){
    case "weekly":    return day.add(dateKey, 7);
    case "biweekly":  return day.add(dateKey, 14);
    case "monthly":   return day.addMonths(dateKey, 1);
    case "quarterly": return day.addMonths(dateKey, 3);
    case "yearly":    return day.addMonths(dateKey, 12);
    default:          return null;
  }
}
/* Every occurrence of an item in [from, to] inclusive. Capped so a
   corrupt record can never spin forever. */
function occurrences(item, from, to){
  const out = [];
  let d = item.next;
  if (!d) return out;
  let guard = 0;
  while (d <= to && guard++ < 400){
    if (d >= from) out.push(d);
    const n = nextAfter(d, item.cycle);
    if (!n) break;
    d = n;
  }
  return out;
}

/* The inverse step, so a view can look at a whole month even when
   part of it is already behind us. `next` only ever points forward. */
function prevBefore(dateKey, cycle){
  switch(cycle){
    case "weekly":    return day.add(dateKey, -7);
    case "biweekly":  return day.add(dateKey, -14);
    case "monthly":   return day.addMonths(dateKey, -1);
    case "quarterly": return day.addMonths(dateKey, -3);
    case "yearly":    return day.addMonths(dateKey, -12);
    default:          return null;
  }
}
/* Every occurrence in [from, to], including ones before item.next. */
function occurrencesIn(item, from, to){
  if (!item.next) return [];
  let start = item.next, guard = 0;
  while (start > from && guard++ < 400){
    const p = prevBefore(start, item.cycle);
    if (!p) break;
    start = p;
  }
  const out = [];
  let d = start; guard = 0;
  while (d <= to && guard++ < 400){
    if (d >= from) out.push(d);
    const n = nextAfter(d, item.cycle);
    if (!n) break;
    d = n;
  }
  return out;
}

/* ---- Storage ---- */
let storageOK = true;
/* The sold app keeps your plan on the device for good. The hosted demo
   keeps it for one tab: close it and the whole thing is gone, which is
   what stops a shop window becoming somebody's free budgeting app.
   sessionStorage has the same API, so nothing else has to know. */
function store(){
  try { return DEMO_BUILD ? sessionStorage : localStorage; }
  catch { return localStorage; }
}
function lsGet(k){ try { return store().getItem(k); } catch { storageOK = false; return null; } }
function lsSet(k, v){ try { store().setItem(k, v); return true; } catch { storageOK = false; return false; } }
/* Quota failures here are expected and survivable — they must not flip
   the "this browser won't let us save" flag that lsSet owns. */
function lsTry(k, v){ try { store().setItem(k, v); return true; } catch { return false; } }

/* ---- Rolling safety net ----
   One snapshot per day, taken at startup, so a snapshot is always the
   state as it stood BEFORE anything you did today. Four of them means
   four days to notice a mistake and walk it back. */
const SNAP_KEY = "payday-plan-v3-snapshots";
/* Whether the tour has run belongs to the device, not the plan — otherwise
   loading the example or opening a saved copy would make it reappear. */
const SEEN_KEY = "payday-plan-v3-seen";
function tourSeen(){ return lsGet(SEEN_KEY) === "1"; }
function markTourSeen(){ lsTry(SEEN_KEY, "1"); }
const DAMAGED_KEY = "payday-plan-v3-damaged";
function snapshots(){
  try { const l = JSON.parse(lsGet(SNAP_KEY)); return Array.isArray(l) ? l : []; }
  catch { return []; }
}
function keepSnapshot(){
  const today = day.today();
  let list = snapshots();
  if (list.some(s => s.date === today)) return;
  list.push({ date: today, at: Date.now(), data: JSON.stringify(state) });
  list = list.slice(-4);
  /* If it won't fit, drop the oldest and try again rather than losing
     the whole safety net to one oversized log. */
  while (list.length){
    if (lsTry(SNAP_KEY, JSON.stringify(list))) return;
    list = list.slice(1);
  }
}
function restoreSnapshot(date){
  const s = snapshots().find(x => x.date === date);
  if (!s) return false;
  try {
    const parsed = JSON.parse(s.data);
    if (!parsed || parsed.v !== 3) return false;
    state = Object.assign(blankState(), parsed);
    return true;
  } catch { return false; }
}
/* How long since the user took a real copy off this device */
function daysSinceExport(){
  if (!state.lastExport) return null;
  return Math.floor((Date.now() - state.lastExport) / 86400000);
}
/* Has the user put anything in yet? Used to keep the backup reminder out
   of the way on a brand-new, empty app, where onboarding comes first. */
function hasAnything(){
  return state.balance !== 0 || state.log.length > 0 ||
         state.income.length > 0 || state.bills.length > 0;
}
/* The reminder stands until a file is actually chosen. We cannot tell
   whether the folder they picked syncs to the cloud — only that a file
   is linked — so the copy asks for a synced one rather than claiming it. */
/* Settled in: past setup and actually using it. Backup talk waits until
   then, so day one is about the number, not about files. */
function settledIn(){ return state.log.length >= 5 && state.income.length > 0; }
function needsBackupSetup(){
  return canPick() && linked.state === "off" && settledIn();
}
function backupIsStale(){
  /* Only a *working* link counts. One that needs reconnecting is
     writing nothing, which is precisely when the warning should show. */
  if (linked.state === "linked") return false;
  if (state.log.length < 20) return false;         /* nothing worth losing yet */
  const d = daysSinceExport();
  return d === null || d >= 30;
}

/* ============================================================
   2. STATE
   ============================================================
   One balance, not a chart of accounts. That single choice
   removes the most common reason people abandon these apps.
   ============================================================ */
function blankState(){
  return {
    v: 3,
    started: day.today(),
    currency: "USD",
    symbol: "",
    theme: "paper",
    lastExport: null,    /* when a copy was last taken off this device */
    balance: 0,          /* cents in hand right now */
    buffer: 0,           /* cents held back as a cushion */
    income: [],          /* {id,name,amount,cycle,next} */
    bills:  [],          /* {id,name,amount,cycle,next,paid:[],skipped:[],varies,history:[]} */
    goals:  [],          /* {id,name,target,saved,auto} */
    debts:  [],          /* {id,name,owed,amount,cycle,next,paid:[]} — the mirror of a goal */
    limits: {},          /* category id -> cents a month, entirely optional */
    sink:   {},          /* bill id -> true, for bills you're holding money back for */
    catNames: {},        /* category id -> your name for that slot */
    catRules: {},        /* category id -> comma-separated words that match it */
    catOrder: [],        /* the order slots are tested in, so you decide ties */
    catCount: 6,         /* how many of the twelve slots are switched on */
    calTabs: "side",     /* month dividers: "side" | "bottom" | "off" */
    off: {calendar:true, insights:true, review:true, sink:true, goals:true, debts:true},  /* sections switched off (extras start hidden) — id -> true */
    log:    [],          /* {id,ts,date,name,amount,dir:"out"|"in",goal?} */
    cats:   {},          /* lowercased name -> category id, user overrides only */
    touched: null        /* last day the user logged anything */
  };
}
let state = blankState();
let undoSnapshot = null;

function uid(){
  try { return crypto.randomUUID().slice(0, 8); }
  catch { return Math.random().toString(36).slice(2, 10); }
}

function save(){
  lsSet(KEY, JSON.stringify(state));
  linked.queueWrite();
}
/* Mutate + save + redraw + offer undo, in one call. */
function commit(fn, undoLabel){
  const before = JSON.stringify(state);
  fn();
  save();
  render();
  if (undoLabel){
    undoSnapshot = before;
    toast(undoLabel, "Undo", () => {
      if (!undoSnapshot) return;
      state = JSON.parse(undoSnapshot);
      undoSnapshot = null;
      save(); render();
      toast("Put back");
    });
  }
}

/* Why a load failed, so the app can say so instead of quietly
   presenting itself as brand new. */
let loadIssue = null;
function load(){
  const raw = lsGet(KEY);
  if (!raw) return false;                       /* genuinely a first run */
  let parsed = null;
  try { parsed = JSON.parse(raw); }
  catch { loadIssue = "unreadable"; }
  if (!loadIssue && (!parsed || typeof parsed !== "object")) loadIssue = "unreadable";
  if (!loadIssue && parsed.v !== 3) loadIssue = "version";
  if (loadIssue){
    /* Never overwrite data we failed to read. Park it where a human or
       a later version can still get at it. */
    if (!lsGet(DAMAGED_KEY)) lsTry(DAMAGED_KEY, raw);
    return false;
  }
  state = Object.assign(blankState(), parsed);
  /* Sinking funds arrived after some plans were already made. The bills
     they exist for are exactly the ones already in those plans, so an
     existing quarterly or yearly bill starts held back — never a debt,
     whose payment is monthly by nature and already in the plan. */
  if (!parsed.sink){
    state.sink = {};
    for (const b of state.bills) if (SINKABLE.has(b.cycle)) state.sink[b.id] = true;
  }
  return true;
}

/* ============================================================
   3. THE CALCULATION
   ============================================================
   Everything in the app answers one question:
   "How much can I spend before my next payday?"
   ============================================================ */
function reckon(){
  const today = day.today();

  /* Every upcoming payday, soonest first. Pay landing TODAY is
     handled separately: until it is logged it isn't in the bank,
     and treating today as the horizon would leave the bills
     between now and the NEXT payday out of the sum. */
  const paydays = [];
  for (const inc of state.income){
    for (const d of occurrences(inc, today, day.add(today, 400))) paydays.push({ date:d, item:inc });
  }
  paydays.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);

  const todayPay = paydays.find(p => p.date === today) || null;
  const next = paydays.find(p => p.date > today) || null;
  const payday = next ? next.date : null;
  const paydayItem = next ? next.item : null;
  /* With no income set up we still answer, over a 14-day horizon. */
  const horizon = payday || day.add(today, 14);
  const days = Math.max(1, day.diff(today, horizon));

  /* Bills falling due between now and then, minus ones already paid */
  const due = [];
  for (const b of outgoings()){
    for (const d of occurrences(b, today, horizon)){
      if (d === payday && payday) continue;             /* payday itself starts the next cycle */
      const paid = (b.paid || []).includes(d);
      due.push({ id:b.id, name:b.name, amount:expectedAmount(b), date:d, paid, varies:!!b.varies });
    }
  }
  due.sort((a,b) => a.date < b.date ? -1 : a.date > b.date ? 1 : 0);
  const owing = due.filter(d => !d.paid).reduce((s,d) => s + d.amount, 0);

  /* Money held back for the bills that only land once or twice a year.
     A fund whose bill is ALREADY in `due` must not be counted twice —
     it is about to be paid, not still being saved for. */
  const dueIds = new Set(due.filter(d => !d.paid).map(d => d.id));
  const funds = sinkFunds().filter(b => !dueIds.has(b.id)).map(sinkFund);
  const setAside = funds.reduce((s,f) => s + f.held, 0);

  const safe = state.balance - owing - state.buffer - setAside;
  const perDay = Math.floor(safe / days);

  return {
    today, payday, paydayItem, todayPay, horizon, days,
    due, owing, funds, setAside,
    safe, perDay,
    hasPlan: state.income.length > 0 || state.bills.length > 0
  };
}

/* ============================================================
   4. NATURAL-LANGUAGE QUICK ADD
   ============================================================
   The single biggest reduction in data entry: one text field
   instead of a six-field form. "coffee 4.50" is the whole job.
   ============================================================ */
function parseQuick(text){
  let s = String(text || "").trim();
  if (!s) return null;

  /* Direction: a leading + or the word "got/paid me" means money in */
  let dir = "out";
  if (/^\+/.test(s)) { dir = "in"; s = s.slice(1); }
  else if (/^(got|received|refund(ed)?|paid in|income|salary|wages?|bonus|sold|cashback|dividend|earned|payout|rebate)\b/i.test(s)) {
    dir = "in"; s = s.replace(/^(got|received|refund(ed)?|paid in|income|salary|wages?|bonus|sold|cashback|dividend|earned|payout|rebate)\b/i, "");
  }

  /* Pull the last number-looking token out; the rest is the name */
  const re = /(-?\d[\d., \s']*\d|\d)(?!.*\d)/;
  const m = s.match(re);
  if (!m) return null;
  let cents;
  try { cents = money.parse(m[1]); } catch { return null; }
  if (cents === 0) return null;
  if (cents < 0){ dir = dir === "out" ? "in" : "out"; cents = Math.abs(cents); }

  let name = (s.slice(0, m.index) + " " + s.slice(m.index + m[1].length))
    .replace(/[€$£¥₦]/g, "").replace(/\s+/g, " ")
    .replace(/^[\s\-–—:,.]+|[\s\-–—:,.]+$/g, "").trim();

  /* A day word anywhere in what's left means it happened then, not now.
     The live hint below the box always shows the date it landed on, so
     a wrong guess is visible before anything is written. */
  const date = pullDate(name);
  name = date.rest;

  if (name.length > 60) name = name.slice(0, 60);
  if (!name) name = dir === "in" ? "Money in" : "Spending";
  name = name.charAt(0).toUpperCase() + name.slice(1);

  return { name, amount: cents, dir, date: date.key };
}

/* Strip a day word out of a phrase and turn it into a date.
   Only whole words count, and only ones that can't be a merchant:
   "yesterday", "today", and the weekday names, which resolve to the
   most recent one that has already happened. */
const DAY_WORDS = [
  ["sunday|sun", 0], ["monday|mon", 1], ["tuesday|tues|tue", 2], ["wednesday|weds|wed", 3],
  ["thursday|thurs|thu", 4], ["friday|fri", 5], ["saturday|sat", 6]
];
function pullDate(phrase){
  let rest = String(phrase || "");
  const today = day.today();

  const strip = re => {
    const before = rest;
    rest = rest.replace(re, " ").replace(/\s+/g, " ").trim();
    return rest !== before;
  };
  if (strip(/\b(yesterday|yest)\b/i))  return { key: day.add(today, -1), rest };
  if (strip(/\b(today|tonight)\b/i))   return { key: today, rest };

  for (const [names, dow] of DAY_WORDS){
    if (strip(new RegExp("\\b(" + names + ")\\b", "i"))){
      /* Walk back to that weekday. "Friday" on a Friday means a week ago,
         not today — today would have been said as "today". */
      let d = day.add(today, -1);
      for (let i = 0; i < 7; i++){
        if (day.obj(d).getDay() === dow) return { key: d, rest };
        d = day.add(d, -1);
      }
    }
  }
  return { key: today, rest };
}

/* ============================================================
   4b. CATEGORIES · VARIABLE BILLS · MISSED BILLS · PROJECTION
   ============================================================
   Categories are DERIVED from the name, never asked for at
   entry time. The whole point of the app is not making people
   classify their own coffee.
   ============================================================ */
const CATS = [
  { id:"home",      label:"Home",      v:"--cat-1",
    re:/rent|mortgage|propert|hoa\b|council|insur|repair|hardware|furnitur|cleaner|garden|yard/i },
  { id:"food",      label:"Food",      v:"--cat-2",
    re:/groc|supermarket|market|baker|butcher|deli\b|coffee|lunch|dinner|brunch|takeout|takeaway|snack|food|caf[eé]|restaur|drinks|produce|corner store|convenience/i },
  { id:"transport", label:"Transport", v:"--cat-3",
    re:/gas station|metro|subway|transit|bus\b|train|petrol|fuel|taxi|uber|lyft|parking|transport|flight|airline|travel|car service|oil change|bike/i },
  { id:"health",    label:"Health",    v:"--cat-4",
    re:/pharmac|doctor|dentist|vet\b|gym|climbing|physio|optic|health|medic|therap/i },
  { id:"bills",     label:"Bills",     v:"--cat-5",
    re:/electric|power|water|gas\b|internet|phone|mobile|stream|music|netflix|spotify|subscri|licen|broadband/i },
  { id:"fun",       label:"Fun",       v:"--cat-6",
    re:/cinema|movie|book|gift|christmas|holiday|bar\b|pub\b|concert|game|hobby|sneaker|trainers|coat|cloth|shoes|haircut|shop\b/i }
];
/* Six more slots, off until you ask for them. They start with no
   matching words at all, so nothing lands in one until you say what
   belongs there — a slot that silently claimed entries would be worse
   than no slot. */
for (let i = 1; i <= 6; i++)
  CATS.push({ id:"x" + i, label:"Other " + i, v:"--cat-0", re:null, extra:true });

const CAT_OTHER = { id:"other", label:"Other", v:"--cat-0" };
const CAT_BASE = 6;                 /* slots that own a validated hue */
const CAT_MAX = CATS.length;        /* 12 */
function catCount(){
  const n = Number(state.catCount) || CAT_BASE;
  return Math.max(CAT_BASE, Math.min(CAT_MAX, n));
}

/* ---- Categories are up to twelve slots you can repurpose ----
   Six of them own a colour. That is not an arbitrary cap: the six hues
   are validated for colourblind separation, and a seventh would put
   adjacent pairs below the separation floor — the palette validator
   fails a twelve-hue set on every one of its checks.

   So the extra slots are real categories in every respect (own name,
   own words, own limit, own row) but share the neutral, and once more
   than six of them have spending the breakdown stops being a ring and
   becomes ranked bars, where a label and a position do the identifying
   instead of a colour. The name, the words that match it, and the order
   they are tested in are all yours. */
function catRe(words){
  const parts = String(words || "").split(",").map(w => w.trim()).filter(Boolean)
    .map(w => w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"));
  if (!parts.length) return null;
  try { return new RegExp(parts.join("|"), "i"); } catch { return null; }
}
/* The words behind a slot, as the editor shows them */
function catWords(id){
  const custom = (state.catRules || {})[id];
  if (custom != null) return custom;
  const base = CATS.find(c => c.id === id);
  if (!base || !base.re) return "";
  return base.re.source.replace(/\\b/g, "").split("|").join(", ");
}
function catList(){
  const live = CATS.slice(0, catCount()).map(c => c.id);
  const order = (state.catOrder || []).filter(id => live.includes(id));
  for (const id of live) if (!order.includes(id)) order.push(id);
  return order.map(id => {
    const base = CATS.find(c => c.id === id);
    const custom = (state.catRules || {})[id];
    return {
      id,
      label: (state.catNames || {})[id] || base.label,
      v: base.v,                                  /* colour follows the slot, never its rank */
      re: custom != null ? catRe(custom) : base.re
    };
  });
}
function otherCat(){
  return { id:"other", label:(state.catNames || {}).other || "Other", v:"--cat-0" };
}
function allCats(){ return catList().concat([otherCat()]); }
function catDef(id){ return allCats().find(c => c.id === id) || otherCat(); }
function catOf(name){
  const key = String(name || "").trim().toLowerCase();
  const override = (state.cats || {})[key];
  if (override) return catDef(override);
  for (const c of catList()) if (c.re && c.re.test(key)) return c;
  return otherCat();
}
/* Money moved to a goal left the balance, but it isn't spending. */
function isTransfer(e){ return !!e.goal || /savings/i.test(e.name || ""); }

/* ---- Which source did money come from? ----
   Payday entries carry the source id. Anything older, hand-typed or
   imported falls back to matching on name, then stands on its own — so a
   one-off refund reads as itself rather than being misattributed to a wage. */
function srcOf(e){
  const list = state.income || [];
  let inc = e.src ? list.find(i => i.id === e.src) : null;
  if (!inc){
    const key = String(e.name || "").toLowerCase();
    inc = list.find(i => String(i.name).toLowerCase() === key);
  }
  if (inc) return { id: inc.id, name: inc.name, group: (inc.group || "").trim() || "Other income" };
  return { id: null, name: String(e.name || "Money in"), group: "Other income" };
}
/* Income sources borrow the same validated hues. They never share a chart
   with expense categories, so reusing them costs nothing. */
function srcColour(name, all){
  const i = all.indexOf(name);
  return i < 0 || i >= CATS.length ? "--cat-0" : CATS[i].v;
}

/* ---- Everything that leaves on a schedule ----
   A debt repayment IS a bill with a shrinking balance behind it, so it
   goes through exactly the same due-date, projection and calendar code.
   Anything that forgets this list is a place debts quietly vanish from. */
function outgoings(){
  return state.bills.concat(state.debts || []);
}
function isDebt(item){ return (state.debts || []).some(d => d.id === item.id); }
/* Months until it clears at the current payment. Interest is deliberately
   not modelled — guessing an APR would make this number look precise
   while being wrong. It says "at this rate", and means it. */
function payoff(debt){
  const per = perMonth(debt);
  if (per <= 0 || debt.owed <= 0) return null;
  const months = Math.ceil(debt.owed / per);
  return { months, date: day.addMonths(day.today(), months) };
}

/* ---- Variable bills: forecast on what it has actually been ---- */
function expectedAmount(b){
  const h = b.history || [];
  if (b.varies && h.length) return Math.round(h.reduce((s,x) => s + x, 0) / h.length);
  return b.amount;
}

/* ---- Bills whose day went by without a tick ---- */
function missedBills(){
  const today = day.today();
  const out = [];
  for (const b of outgoings()){
    /* Nothing is "missed" from before the bill was added to the app */
    const since = b.added && b.added > day.add(today, -60) ? b.added : day.add(today, -60);
    for (const d of occurrencesIn(b, since, day.add(today, -1))){
      if ((b.paid || []).includes(d)) continue;
      if ((b.skipped || []).includes(d)) continue;
      out.push({ id:b.id, name:b.name, amount:expectedAmount(b), date:d, varies:!!b.varies });
    }
  }
  return out.sort((a,b) => a.date < b.date ? -1 : 1);
}

/* ---- What day-to-day living actually costs ----
   Scheduled bills are projected separately, so they are excluded here
   by name; otherwise every bill would be counted twice. Returns 0 until
   there is enough history to be worth trusting. */
function dailyBurn(){
  const today = day.today(), from = day.add(today, -56);
  const billNames = new Set(outgoings().map(b => String(b.name).toLowerCase()));
  const daysSeen = new Set();
  let total = 0;
  for (const e of state.log){
    if (e.date < from || e.date > today) continue;
    daysSeen.add(e.date);
    if (e.dir !== "out" || isTransfer(e)) continue;
    if (billNames.has(String(e.name).toLowerCase())) continue;
    total += e.amount;
  }
  if (daysSeen.size < 7) return 0;
  return Math.round(total / Math.max(1, day.diff(from, today)));
}

/* ---- The balance, walked forward day by day ---- */
/* `opts` is only ever supplied by the what-if dials on Outlook. With none
   of them set this is the plain forecast, byte for byte — the real line and
   the imagined one come out of the same code, which is the only way they
   can honestly be drawn on top of each other. */
function project(days, opts){
  days = days || 90;
  opts = opts || {};
  const today = day.today(), end = day.add(today, days);
  const burn = Math.max(0, dailyBurn() + (opts.burnDelta || 0));
  const incScale = 1 + (opts.incomePct || 0) / 100;
  const evs = {};
  const put = (d, amount, name, dir) => { (evs[d] = evs[d] || []).push({ amount, name, dir }); };
  for (const inc of state.income)
    for (const d of occurrences(inc, today, end))
      put(d, Math.round(expectedAmount(inc) * incScale), inc.name, "in");
  if (opts.once) put(day.add(today, Math.min(days, Math.max(0, opts.onceAt || 0))),
                     Math.abs(opts.once), "One-off", "out");
  for (const b of outgoings())
    for (const d of occurrences(b, today, end)){
      if ((b.paid || []).includes(d)) continue;
      put(d, expectedAmount(b), b.name, "out");
    }
  const pts = [];
  let bal = state.balance, low = { balance: bal, date: today };
  let d = today;
  for (let i = 0; i <= days; i++){
    if (i > 0) bal -= burn;                   /* today is already spent */
    /* Each event carries the running balance after it, so two things
       landing on the same day don't both report the day's end figure. */
    for (const e of (evs[d] || [])){
      bal += e.dir === "in" ? e.amount : -e.amount;
      e.after = bal;
    }
    pts.push({ date:d, balance:bal, events: evs[d] || [] });
    if (bal < low.balance) low = { balance: bal, date: d };
    d = day.add(d, 1);
  }
  return { pts, low, end, events: evs, burn };
}

/* ============================================================
   SINKING FUNDS
   ============================================================
   The bill that wrecks a plan is never the rent. It's the one
   that turns up twice a year and is gone from memory in between.

   The money set aside is DERIVED, never stored: it ramps from
   nothing at the start of the bill's cycle to the full amount on
   the day it lands. There is no pot to top up, nothing to forget,
   and nothing that can drift out of step with the bill itself.
   Safe-to-spend simply stops counting it.
   ============================================================ */
const SINKABLE = new Set(["quarterly", "yearly"]);
function sinkCandidates(){ return state.bills.filter(b => SINKABLE.has(b.cycle)); }
function sinkOn(id){ return !!(state.sink && state.sink[id]); }
function sinkFunds(){ return sinkCandidates().filter(b => sinkOn(b.id)); }

/* Where this bill is in its own cycle, and what that's worth today. */
function sinkFund(b){
  const today = day.today();
  const target = expectedAmount(b);
  const due = occurrences(b, today, day.add(today, 800))[0] || null;
  if (!due) return { item:b, target, due:null, held:0, pct:0, perMonth:0, days:0 };
  const start = prevBefore(due, b.cycle) || day.addMonths(due, -12);
  const span = Math.max(1, day.diff(start, due));
  const gone = Math.min(span, Math.max(0, day.diff(start, today)));
  return {
    item: b, target, due,
    held: Math.round(target * gone / span),
    pct: Math.round(gone / span * 100),
    perMonth: perMonth(b),
    days: day.diff(today, due)
  };
}

/* ============================================================
   CAN I AFFORD THIS?
   ============================================================
   Not "is there enough in the account" — that question is easy
   and almost always wrong. This walks the same 120-day
   projection with the purchase in it and reports the worst day
   that follows. The cushion is the floor: touching it is a no.
   ============================================================ */
function afford(cents, fromDate){
  const P = project(120);
  const from = fromDate || day.today();
  const floor = state.buffer;
  let low = null;
  for (const p of P.pts){
    const bal = p.balance - (p.date >= from ? cents : 0);
    if (!low || bal < low.balance) low = { balance: bal, date: p.date };
  }
  /* Suffix minimum: the worst the balance gets from each day onwards.
     The first day whose suffix still clears the cushion is the answer
     to "then when?" — and it never needs a second pass. */
  const n = P.pts.length;
  const worstFrom = new Array(n);
  let m = Infinity;
  for (let i = n - 1; i >= 0; i--){ m = Math.min(m, P.pts[i].balance); worstFrom[i] = m; }
  let safeDay = null;
  for (let i = 0; i < n; i++) if (worstFrom[i] - cents >= floor){ safeDay = P.pts[i].date; break; }
  return { ok: low.balance >= floor, low, floor, safeDay, from, cents,
           short: Math.max(0, floor - low.balance) };
}

/* ============================================================
   RUNWAY
   ============================================================
   How long the money would last if nothing else came in —
   living as you actually live, and still paying what's scheduled.
   Capped at a year, because past that the honest answer is
   "longer than this app can see".
   ============================================================ */
const RUNWAY_CAP = 365;
function runwayFrom(startDate, startBalance, burn){
  if (burn <= 0) return null;                 /* no spending history, no honest answer */
  const end = day.add(startDate, RUNWAY_CAP);
  /* occurrences() only looks forward from item.next, which is no use when
     the walk starts in the past. occurrencesIn() steps back to find the
     cycle, so a month-end in March gets March's bills, not next month's. */
  const dueOn = {};
  for (const b of outgoings()){
    const amt = expectedAmount(b);
    for (const d of occurrencesIn(b, startDate, end)){
      if ((b.paid || []).includes(d)) continue;
      dueOn[d] = (dueOn[d] || 0) + amt;
    }
  }
  let bal = startBalance, d = startDate;
  for (let i = 0; i < RUNWAY_CAP; i++){
    d = day.add(d, 1);
    bal -= burn + (dueOn[d] || 0);
    if (bal <= 0) return i;
  }
  return RUNWAY_CAP;
}
function runway(){ return runwayFrom(day.today(), state.balance, dailyBurn()); }

/* The balance as it stood on a past day, walked back through the log.
   Every entry moved the balance, so this is arithmetic, not a guess. */
function balanceOn(dateKey){
  let bal = state.balance;
  for (const e of state.log){
    if (e.date <= dateKey) continue;
    bal -= (e.dir === "in" ? e.amount : -e.amount);
  }
  return bal;
}
/* Everyday spending over the eight weeks up to a given day. Same rule as
   dailyBurn: scheduled bills and transfers are not everyday spending. */
function burnOn(dateKey){
  const from = day.add(dateKey, -56);
  const billNames = new Set(outgoings().map(b => String(b.name).toLowerCase()));
  const daysSeen = new Set();
  let total = 0;
  for (const e of state.log){
    if (e.date < from || e.date > dateKey) continue;
    daysSeen.add(e.date);
    if (e.dir !== "out" || isTransfer(e)) continue;
    if (billNames.has(String(e.name).toLowerCase())) continue;
    total += e.amount;
  }
  if (daysSeen.size < 7) return 0;
  return Math.round(total / Math.max(1, day.diff(from, dateKey)));
}
/* Runway at the end of each of the last few months. Months without enough
   logged history are left out rather than filled in with a flattering
   number — the chart shows what is known and says so. */
function runwayTrend(months){
  months = months || 6;
  const out = [];
  const today = day.today();
  for (let i = months; i >= 1; i--){
    const first = day.addMonths(today.slice(0, 7) + "-01", -i + 1);
    const end = day.add(day.addMonths(first, 1), -1);
    const at = end > today ? today : end;
    const burn = burnOn(at);
    if (!burn) continue;
    const days = runwayFrom(at, balanceOn(at), burn);
    if (days == null) continue;
    out.push({ month: at.slice(0, 7), date: at, days,
               label: day.obj(at).toLocaleDateString(undefined, { month:"short" }) });
  }
  return out;
}

/* ============================================================
   WHAT THE WEEK ACTUALLY SHOWS
   ============================================================
   Each of these returns null unless the data genuinely supports
   it. An observation the numbers don't carry is worse than no
   observation at all, so none of them rounds a guess up into a
   statement.
   ============================================================ */
function observations(){
  const today = day.today(), from = day.add(today, -6), out = [];
  const spendOn = (a, b) => state.log.filter(e =>
    e.date >= a && e.date <= b && e.dir === "out" && !isTransfer(e))
    .reduce((s,e) => s + e.amount, 0);

  /* 1. This week against your own ordinary week */
  const weeks = [];
  for (let i = 1; i <= 8; i++) weeks.push(spendOn(day.add(from, -7*i), day.add(today, -7*i)));
  const seen = state.log.filter(e => e.date >= day.add(today, -63)).length;
  if (seen >= 20){
    const avg = Math.round(weeks.reduce((s,x) => s + x, 0) / weeks.length);
    const now = spendOn(from, today);
    if (avg > 0){
      const pct = Math.round((now - avg) / avg * 100);
      if (Math.abs(pct) >= 12) out.push({ weight: Math.abs(pct) + 40, tone: pct > 0 ? "warn" : "good",
        text: `You spent <b>${esc(money.fmt(now))}</b> this week — ${Math.abs(pct)}% ${pct > 0 ? "more" : "less"} than your usual week of ${esc(money.fmt(avg))}.` });
      else out.push({ weight: 20, tone: "calm",
        text: `Spending held steady: <b>${esc(money.fmt(now))}</b> this week, against a usual ${esc(money.fmt(avg))}.` });
    }
  }

  /* 2. A variable bill that has been quietly climbing */
  for (const b of outgoings()){
    const h = b.history || [];
    if (!b.varies || h.length < 4) continue;
    const half = Math.floor(h.length / 2);
    const older = h.slice(0, half), recent = h.slice(half);
    const a = Math.round(older.reduce((s,x) => s + x, 0) / older.length);
    const c = Math.round(recent.reduce((s,x) => s + x, 0) / recent.length);
    if (a <= 0) continue;
    const pct = Math.round((c - a) / a * 100);
    if (pct >= 15) out.push({ weight: 70 + pct, tone: "warn",
      text: `<b>${esc(b.name)}</b> has been rising — the last few came to ${esc(money.fmt(c))} against ${esc(money.fmt(a))} before. Your forecast already uses the higher figure.` });
  }

  /* 3. The tightest day in the projection, if it is genuinely tight */
  if (state.income.length || state.bills.length){
    const P = project(60);
    if (P.low.balance < state.buffer && P.low.date > today)
      out.push({ weight: 200, tone: "warn",
        text: `The tightest day ahead is <b>${esc(day.long(P.low.date))}</b>, when this plan leaves ${esc(money.fmt(P.low.balance))}. Easier to move something now than that week.` });
  }

  /* 4. A category running ahead of the limit you set for it */
  const mr = periodRange("this");
  const t = tally(mr.from, mr.to);
  const through = Math.max(0.15, day.diff(mr.from, today) / Math.max(1, day.diff(mr.from, mr.to)));
  for (const c of allCats()){
    const cap = (state.limits || {})[c.id];
    if (!cap) continue;
    const spent = t.cats[c.id] || 0;
    if (!spent) continue;
    const pace = spent / through;
    if (pace > cap * 1.15) out.push({ weight: 120, tone: "warn",
      text: `<b>${esc(c.label)}</b> is on course for ${esc(money.fmt(Math.round(pace)))} this month against a ${esc(money.fmt(cap))} limit.` });
    else if (spent >= cap * 0.5 && pace < cap * 0.85) out.push({ weight: 45, tone: "good",
      text: `<b>${esc(c.label)}</b> is tracking under its limit — ${esc(money.fmt(spent))} of ${esc(money.fmt(cap))} with the month ${Math.round(through*100)}% gone.` });
  }

  /* 5. Days you spent nothing at all */
  if (seen >= 20){
    const quiet = d => !state.log.some(e => e.date === d && e.dir === "out" && !isTransfer(e));
    let nowQuiet = 0;
    for (let i = 0; i < 7; i++) if (quiet(day.add(today, -i))) nowQuiet++;
    let past = 0;
    for (let i = 7; i < 63; i++) if (quiet(day.add(today, -i))) past++;
    const usual = past / 8;
    if (nowQuiet >= 2 && nowQuiet >= usual + 1) out.push({ weight: 50, tone: "good",
      text: `<b>${nowQuiet} days</b> this week you spent nothing — you'd normally manage ${usual.toFixed(1)}.` });
  }

  /* 6. Where the runway stands, and which way it moved */
  const rw = runway();
  if (rw != null){
    const trend = runwayTrend(3);
    const prev = trend.length > 1 ? trend[trend.length - 2] : null;
    const moved = prev ? rw - prev.days : 0;
    out.push({ weight: 60, tone: rw < 30 ? "warn" : "calm",
      text: `With nothing coming in you'd last <b>${rw >= RUNWAY_CAP ? "over a year" : rw + " days"}</b>${
        prev && Math.abs(moved) >= 3 ? ` — ${Math.abs(moved)} days ${moved > 0 ? "more" : "fewer"} than a month ago` : ""}.` });
  }

  /* 7. A bill lands before the next payday and the money isn't there */
  const r = reckon();
  if (r.payday && r.safe < 0)
    out.push({ weight: 180, tone: "warn",
      text: `Bills before ${esc(day.label(r.payday))} come to ${esc(money.fmt(r.owing))} — ${esc(money.fmt(Math.abs(r.safe)))} more than you're holding.` });

  return out.sort((a,b) => b.weight - a.weight).slice(0, 4);
}

/* ============================================================
   CSV IMPORT
   ============================================================
   Bringing in a bank statement is history, not new activity.
   These rows already happened, and the balance you typed in
   already reflects them — so importing NEVER touches the
   balance. Getting that wrong would corrupt the one number
   the whole app is built on.
   ============================================================ */
function parseCSV(text){
  const rows = [];
  let row = [], field = "", quoted = false;
  const s = String(text).replace(/^﻿/, "");        /* strip BOM */
  for (let i = 0; i < s.length; i++){
    const c = s[i];
    if (quoted){
      if (c === '"'){
        if (s[i+1] === '"'){ field += '"'; i++; }        /* escaped quote */
        else quoted = false;
      } else field += c;
      continue;
    }
    if (c === '"'){ quoted = true; continue; }
    if (c === ","){ row.push(field); field = ""; continue; }
    if (c === "\r") continue;
    if (c === "\n"){ row.push(field); rows.push(row); row = []; field = ""; continue; }
    field += c;
  }
  if (field.length || row.length){ row.push(field); rows.push(row); }
  return rows.filter(r => r.some(x => String(x).trim() !== ""));
}

/* Banks disagree about date order and there is no way to tell
   03/04 apart without looking at the whole column. */
function csvDateOrder(values){
  let firstOver12 = false, secondOver12 = false;
  for (const v of values){
    const m = String(v).match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
    if (!m) continue;
    if (m[1].length === 4) return "ymd";
    if (+m[1] > 12) firstOver12 = true;
    if (+m[2] > 12) secondOver12 = true;
  }
  if (firstOver12) return "dmy";
  if (secondOver12) return "mdy";
  return "dmy";                       /* most of the world */
}
function csvDate(v, order){
  const s = String(v).trim();
  let m = s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if (m) return m[1] + "-" + String(+m[2]).padStart(2,"0") + "-" + String(+m[3]).padStart(2,"0");
  m = s.match(/^(\d{1,2})[\/\-.](\d{1,2})[\/\-.](\d{2,4})/);
  if (m){
    let y = +m[3]; if (y < 100) y += y < 70 ? 2000 : 1900;
    const a = +m[1], b = +m[2];
    const day_ = order === "mdy" ? b : a;
    const mon  = order === "mdy" ? a : b;
    if (mon < 1 || mon > 12 || day_ < 1 || day_ > 31) return null;
    return y + "-" + String(mon).padStart(2,"0") + "-" + String(day_).padStart(2,"0");
  }
  /* "12 Jan 2026" and similar */
  const d = new Date(s);
  return isNaN(d) ? null : day.key(d);
}

/* Guess which column is which from the header row */
function csvGuess(header){
  const find = re => header.findIndex(h => re.test(String(h).trim()));
  return {
    date:   find(/date|when/i),
    name:   find(/desc|narrative|detail|payee|reference|memo|name|transaction/i),
    amount: find(/^amount$|amount|value/i),
    out:    find(/debit|paid out|withdraw|money out/i),
    in:     find(/credit|paid in|deposit|money in/i)
  };
}

/* Turn mapped rows into log entries, skipping anything already there */
function csvRows(rows, map, order, flip){
  const header = rows[0];
  const body = rows.slice(map.hasHeader ? 1 : 0);
  const seen = new Set(state.log.map(e => e.date + "|" + String(e.name).toLowerCase() + "|" + e.amount + "|" + e.dir));
  const out = [], skipped = { nodate:0, noamount:0, duplicate:0 };
  for (const r of body){
    const date = csvDate(r[map.date], order);
    if (!date){ skipped.nodate++; continue; }
    let cents = null, dir = "out";
    if (map.mode === "split"){
      const o = String(r[map.out] || "").trim(), i = String(r[map.in] || "").trim();
      try { if (o && money.parse(o) !== 0){ cents = Math.abs(money.parse(o)); dir = "out"; } } catch {}
      if (cents === null) try { if (i && money.parse(i) !== 0){ cents = Math.abs(money.parse(i)); dir = "in"; } } catch {}
    } else {
      try {
        const v = money.parse(r[map.amount]);
        if (v !== 0){ cents = Math.abs(v); dir = v < 0 ? "out" : "in"; }
      } catch {}
    }
    if (cents === null || cents === 0){ skipped.noamount++; continue; }
    if (flip) dir = dir === "out" ? "in" : "out";
    let name = String(r[map.name] == null ? "" : r[map.name]).replace(/\s+/g, " ").trim().slice(0, 60);
    if (!name) name = dir === "in" ? "Money in" : "Spending";
    name = name.charAt(0).toUpperCase() + name.slice(1);
    const key = date + "|" + name.toLowerCase() + "|" + cents + "|" + dir;
    if (seen.has(key)){ skipped.duplicate++; continue; }
    seen.add(key);
    out.push({ date, name, amount: cents, dir });
  }
  out.sort((a,b) => a.date < b.date ? 1 : -1);        /* newest first, as the log expects */
  return { rows: out, skipped, header };
}

/* ============================================================
   PERIODS — the window every figure on Insights is measured in
   ============================================================ */
const PERIODS = [
  { id:"this",   label:"This month" },
  { id:"last",   label:"Last month" },
  { id:"three",  label:"3 months"   },
  { id:"year",   label:"This year"  },
  { id:"custom", label:"Custom…"    }
];
function periodRange(id){
  const t = day.today(), mStart = t.slice(0,7) + "-01";
  if (id === "last")  return { from: day.addMonths(mStart, -1), to: day.add(mStart, -1), label:"last month" };
  if (id === "three") return { from: day.addMonths(mStart, -2), to: t, label:"the last 3 months" };
  if (id === "year")  return { from: t.slice(0,4) + "-01-01", to: t, label:"this year" };
  if (id === "custom" && customFrom && customTo)
    return { from: customFrom, to: customTo,
             label: day.label(customFrom) + " to " + day.label(customTo) };
  return { from: mStart, to: t, label:"this month" };
}
/* The comparable slice before it. For a month still running we take
   the SAME slice of last month, so a half-month isn't judged against
   a whole one. */
function prevRange(id){
  const r = periodRange(id);
  if (id === "three") return { from: day.addMonths(r.from, -3), to: day.add(r.from, -1) };
  if (id === "year")  return { from: day.addMonths(r.from, -12), to: day.addMonths(r.to, -12) };
  /* A picked range is compared with the same number of days before it,
     which is the only honest comparison when the span is arbitrary. */
  if (id === "custom"){
    const span = Math.max(1, day.diff(r.from, r.to) + 1);
    return { from: day.add(r.from, -span), to: day.add(r.from, -1) };
  }
  return { from: day.addMonths(r.from, -1), to: day.addMonths(r.to, -1) };
}
function tally(from, to){
  const t = { in:0, out:0, moved:0, cats:{}, names:{}, days:{}, srcs:{}, groups:{}, count:0 };
  for (const e of state.log){
    if (e.date < from || e.date > to) continue;
    t.count++;
    if (e.dir === "in"){
      t.in += e.amount;
      const src = srcOf(e);
      t.srcs[src.name] = (t.srcs[src.name] || 0) + e.amount;
      t.groups[src.group] = (t.groups[src.group] || 0) + e.amount;
      continue;
    }
    if (isTransfer(e)){ t.moved += e.amount; continue; }
    t.out += e.amount;
    const c = catOf(e.name);
    t.cats[c.id]   = (t.cats[c.id]   || 0) + e.amount;
    t.names[e.name] = (t.names[e.name] || 0) + e.amount;
    t.days[e.date] = (t.days[e.date] || 0) + e.amount;
  }
  return t;
}
/* One honest observation, or nothing at all. */
function topInsight(pid){
  const r = periodRange(pid), p = prevRange(pid);
  const now = tally(r.from, r.to), before = tally(p.from, p.to);
  let best = null;
  for (const c of allCats()){
    const a = now.cats[c.id] || 0, b = before.cats[c.id] || 0;
    if (b < 1000 || a < 1000) continue;
    const pct = Math.round((a - b) / b * 100);
    if (Math.abs(pct) < 15) continue;
    if (!best || Math.abs(pct) > Math.abs(best.pct)) best = { cat:c, pct, now:a, before:b };
  }
  return best;
}
</script>

<script>
"use strict";
/* ============================================================

const $ = sel => document.querySelector(sel);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c =>

/* ---- Shared pieces ---- */
/* A delta chip. `goodWhenUp` flips the colour: more money in is good,
   more money out is not. */
function delta(now, before, goodWhenUp){
  if (!before) return "";
  const pct = Math.round((now - before) / Math.abs(before) * 100);
  if (!isFinite(pct)) return "";
  const cls = pct === 0 ? "flat" : (pct > 0) === !!goodWhenUp ? "good" : "bad";
  return `<span class="delta ${cls}">${pct > 0 ? "+" : ""}${pct}%</span>`;
}
const kpi = (label, value, note, opts) => `
  <div class="kpi ${opts && opts.dark ? "dark" : ""}">
    <span>${esc(label)}</span>
    <b${opts && opts.count != null ? ` data-count="${opts.count}" data-fmt="${opts.fmt || "big"}"` : ""}>${esc(value)}</b>
    ${note ? `<span class="kpi-note">${note}</span>` : ""}
  </div>`;

/* Donut. One ring, direct-labelled beside it, plus a table below —
   the amber and teal steps sit under 3:1 on white, so the labels are
   doing the identifying, not the colour alone. */
function donut(slices, total, midLabel, big){
  const R = 62, C = 2 * Math.PI * R;
  let at = 0;
  const arcs = slices.map(s => {
    const frac = total > 0 ? s.amount / total : 0;
    const len = Math.max(0, frac * C - 2);        /* 2px gap between segments */
    const seg = `<circle cx="82" cy="82" r="${R}" fill="none" stroke="var(${s.cat.v})"
      stroke-width="${big ? 24 : 19}" stroke-dasharray="${len} ${C - len}" stroke-dashoffset="${-at * C}"/>`;
    at += frac;
    return seg;
  }).join("");
  return `
    <div class="donut-ring${big ? " lg" : ""}">
      <svg viewBox="0 0 164 164" role="img" aria-label="${big ? "Income by source" : "Spending by category"}">
        <circle cx="82" cy="82" r="${R}" fill="none" stroke="var(--rule)" stroke-width="${big ? 24 : 19}"/>
        ${arcs}
      </svg>
      <span class="donut-mid"><span><b>${esc(money.fmtBig(total))}</b><span>${esc(midLabel)}</span></span></span>
    </div>`;
}

function render(){

  if (!shown(tab) && tab !== "settings") tab = "today";

  drawToday(r); drawOutlook(r); drawPlan(r); drawLog(); drawCalendar(r); drawInsights(); drawReview(r); drawSettings();
  SCREENS.forEach(id => $("#s-" + id).hidden = (id !== tab));
  document.querySelectorAll("[data-go]").forEach(b => {
    if (b.dataset.go === tab) b.setAttribute("aria-current","page"); else b.removeAttribute("aria-current");
  });
  drawBackupChip();
  $("#chip-balance").innerHTML = "In hand <b>" + esc(money.fmt(state.balance)) + "</b>";
  $("#ver").textContent = VERSION;

}

/* Standing confirmation that the backup is actually happening. A toast on
   every write would fire constantly; a dot that says when it last wrote
   is checkable at a glance and never interrupts. */
function drawBackupChip(){
  const el = $("#chip-backup");
  if (!el) return;
  const L = linked;
  if (L.state === "unsupported"){ el.hidden = true; return; }
  el.hidden = false;
  if (L.state === "linked"){
    const t = L.lastSaved
      ? new Date(L.lastSaved).toLocaleTimeString([], { hour:"2-digit", minute:"2-digit" })
      : "";
    el.innerHTML = `<span class="chip-dot"></span>Backed up${t ? " <b>" + esc(t) + "</b>" : ""}`;
    el.title = "Every change is written to " + L.name + (t ? " — last written " + t : "");
  } else if (L.state === "needs-permission"){
    el.innerHTML = `<span class="chip-dot warn"></span>Backup paused`;
    el.title = L.name + " needs reconnecting";
  } else {
    if (!settledIn()){ el.hidden = true; return; }
    el.innerHTML = `<span class="chip-dot off"></span>No backup`;
    el.title = "Choose a file and every change is written to it automatically";
  }
}
/* A short pulse is the only thing that marks an individual write */
function pulseBackupChip(){
  const dot = document.querySelector("#chip-backup .chip-dot");
  if (!dot) return;
  dot.classList.remove("pulse");
  void dot.offsetWidth;                 /* restart the animation */
  dot.classList.add("pulse");
}

   rel="noopener" because target=_blank without it hands the new tab a
   handle back to this one. */

  const el = $("#rail-brand");

    `<a href="${esc(BRAND.site)}" target="_blank" rel="noopener noreferrer">${esc(BRAND.siteLabel)}</a>` +
    `<a href="${esc(BRAND.terms)}" target="_blank" rel="noopener noreferrer">Terms</a>`;
  el.dataset.done = "1";
}

}

/* ---- The projection chart, drawn from whichever lines are in play ----
   Split out of drawOutlook so a what-if dial can redraw just the picture
   without rebuilding the screen underneath the slider you're holding. */
function projChart(){
  const P = project(90);
  const G = whatIfOn() ? project(90, { burnDelta: whatIf.burn, incomePct: whatIf.income,
                                       once: whatIf.once, onceAt: whatIf.onceAt }) : null;
  const pts = P.pts;
  const cushion = state.buffer || 0;
  const all = pts.map(p => p.balance).concat(G ? G.pts.map(p => p.balance) : [], [0, cushion]);
  /* Round the axis out to tidy steps so the labels read as money, not noise */
  const rawHi = Math.max(...all), rawLo = Math.min(...all);
  const rough = ((rawHi - rawLo) || 10000) / 4;
  const mag = Math.pow(10, Math.floor(Math.log10(rough)));
  const step = [1, 2, 2.5, 5, 10].map(m => m * mag).find(v => v >= rough);
  const lo = Math.floor(rawLo / step) * step, hi = Math.ceil(rawHi / step) * step || step;
  const span = hi - lo;
  const W = 720, H = 220;
  const x = i => i / (pts.length - 1) * W;
  const y = v => H - (v - lo) / span * H;
  const pct = v => (y(v) / H * 100).toFixed(2) + "%";
  const xp = i => (i / (pts.length - 1) * 100).toFixed(2) + "%";
  const path = ps => ps.map((p, i) => (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.balance).toFixed(1)).join(" ");
  const line = path(pts);
  const base = y(Math.max(lo, 0));
  const area = line + ` L${W} ${base.toFixed(1)} L0 ${base.toFixed(1)} Z`;
  const lowI = pts.findIndex(p => p.date === P.low.date);
  const ticks = []; for (let v = lo; v <= hi + 1; v += step) ticks.push(v);
  const short = c => { const a = Math.abs(c) / 100, sym = state.symbol || "$";
    const n = a >= 1000 ? (a / 1000).toFixed(a % 1000 ? 1 : 0).replace(/\.0$/, "") + "k" : Math.round(a);
    return (c < 0 ? "−" : "") + sym + n; };
  const xs = [0, 15, 30, 45, 60, 75, 90].filter(i => i < pts.length);
  const pays = pts.map((p, i) => p.events.some(e => e.dir === "in") ? i : -1).filter(i => i >= 0);
  const lowLeft = lowI / (pts.length - 1) > .7;
  return `
  <div class="pc">
    <div class="pc-y">${ticks.map(v => `<span style="top:${pct(v)}">${esc(short(v))}</span>`).join("")}</div>
    <div class="pc-plot" data-n="${pts.length}">
      <svg class="proj" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none" aria-hidden="true">
        ${ticks.map(v => `<line class="${v === 0 ? "pc-zero" : "pc-grid"}" x1="0" x2="${W}" y1="${y(v).toFixed(1)}" y2="${y(v).toFixed(1)}"/>`).join("")}
        ${pays.map(i => `<line class="pc-pay" x1="${x(i).toFixed(1)}" x2="${x(i).toFixed(1)}" y1="0" y2="${H}"/>`).join("")}
        <path class="proj-fill" d="${area}"/>
        ${cushion ? `<line class="pc-cush" x1="0" x2="${W}" y1="${y(cushion).toFixed(1)}" y2="${y(cushion).toFixed(1)}"/>` : ""}
        <path class="proj-line" d="${line}"/>
        ${G ? `<path class="proj-ghost" d="${path(G.pts)}"/>` : ""}
      </svg>
      ${pays.map(i => `<i class="pc-paydot" style="left:${xp(i)}" title="Payday ${esc(day.label(pts[i].date))}"></i>`).join("")}
      <i class="proj-low" style="left:${xp(lowI)};top:${pct(P.low.balance)}"></i>
      <span class="pc-lowtag ${lowLeft ? "is-left" : ""}" style="left:${xp(lowI)};top:${pct(P.low.balance)}">Lowest <b>${esc(money.fmt(P.low.balance))}</b><small>${esc(day.label(P.low.date))}</small></span>
      <i class="pc-cursor" hidden></i><div class="pc-tip" hidden></div>
    </div>
    <div class="pc-x">${xs.map(i => `<span style="left:${xp(i)}">${i === 0 ? "Today" : esc(day.label(pts[i].date))}</span>`).join("")}</div>
  </div>
  <div class="pc-legend">
    <span><i class="lg-line"></i>Your balance</span>
    ${G ? `<span><i class="lg-ghost"></i>What if</span>` : ""}
    ${pays.length ? `<span><i class="lg-pay"></i>Payday</span>` : ""}
    ${cushion ? `<span><i class="lg-cush"></i>Cushion ${esc(money.fmt(cushion))}</span>` : ""}
    <span><i class="lg-low"></i>Lowest point</span>
  </div>`;
}
/* Hover / touch read-out for the balance chart */
document.addEventListener("pointermove", e => {
  const plot = e.target.closest && e.target.closest(".pc-plot");
  document.querySelectorAll(".pc-plot").forEach(p => { if (p !== plot) { p.querySelector(".pc-tip").hidden = true; p.querySelector(".pc-cursor").hidden = true; } });
  if (!plot) return;
  const pts = project(90).pts, box = plot.getBoundingClientRect();
  const f = Math.min(1, Math.max(0, (e.clientX - box.left) / box.width));
  const i = Math.round(f * (pts.length - 1)), p = pts[i];
  const tip = plot.querySelector(".pc-tip"), cur = plot.querySelector(".pc-cursor");
  cur.hidden = false; cur.style.left = (i / (pts.length - 1) * 100) + "%";
  tip.hidden = false;
  tip.innerHTML = `<small>${esc(day.long(p.date))}</small><b>${esc(money.fmt(p.balance))}</b>` +
    p.events.slice(0, 3).map(ev => `<span class="${ev.dir === "in" ? "in" : ""}">${esc(ev.name)} ${esc(money.fmt(ev.dir === "in" ? ev.amount : -ev.amount, { plus: ev.dir === "in" }))}</span>`).join("");
  tip.style.left = (f > .6 ? f * 100 - 2 : f * 100 + 2) + "%";
  tip.classList.toggle("is-left", f > .6);
});

function cycleLabel(id){ return (CYCLES.find(c => c.id === id) || {label:"One time"}).label; }
function perMonth(item){
  const amt = expectedAmount(item);
  switch(item.cycle){
    case "weekly":    return Math.round(amt * 52 / 12);
    case "biweekly":  return Math.round(amt * 26 / 12);
    case "monthly":   return amt;
    case "quarterly": return Math.round(amt / 3);
    case "yearly":    return Math.round(amt / 12);
    default:          return 0;
  }
}
