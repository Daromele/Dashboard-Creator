# Deploy with Base directory = book-library-studio (Netlify: Site configuration → Build & deploy).
[build]
  publish = "site"
  functions = "netlify/functions"
  command = "node build.mjs"

# The Google Books key in the app is meant to be public: it only works for the Books API and on this site
# (restricted in Google Cloud). Tell Netlify's secret scan this one value is intentional.
[build.environment]
  SECRETS_SCAN_SMART_DETECTION_OMIT_VALUES = "AIzaSyDrzOiGoinwKFXKgQsOHKLiM8ZlNfWxV6s"

[functions]
  node_bundler = "esbuild"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/manifest.webmanifest"
  [headers.values]
    Content-Type = "application/manifest+json"
    Cache-Control = "no-cache"
