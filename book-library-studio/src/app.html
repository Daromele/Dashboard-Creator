/* tokens and the 10 themes, copied from monthly-plan/app/src/core.html. [data-theme] on any element themes that subtree. */
:root{
  /* neutrals carry a slight lavender bias so they read as chosen, not inherited */
  --paper:#FAF9FC; --card:#FFFFFF; --sunk:#F5F2F9;

  --bold:#2E2040; --bold-2:#241932;
  --on-bold:#F5F1FA; --on-bold-dim:#B6A9C7;
  --pop:#F0B98F; --pop-ink:#3A2214;
  --pos:var(--ok); --neg:var(--over); --on-bold-alert:#F4B3A4;

  /* Status is reserved and universal: green = within plan, red = over plan.
     Green/red sit in the 6-8 CVD band, so every use carries a second cue
     (hatched texture on the over-plan arm, plus labels and tooltips). Validated light. */
  --ok:#1F7A52; --over:#D23B2B;
  --ok-1:#E4F1EA; --ok-2:#B4D9C6; --ok-3:#74B899; --ok-4:#1F7A52;

  --on-plan:#EDEAF1;
  --ch-in:#1F7A52; --ch-out:#D23B2B;
  /* categorical hues (donut only), fixed order, never cycled — green and red are
     deliberately absent because they now mean status. Validated light: all checks pass. */
  --cat-1:#5C3F8F; --cat-2:#DD9012; --cat-3:#2478D4;
  --cat-4:#B8309A; --cat-5:#12A5A0; --cat-6:#8A8296; --cat-0:#8A8296;

  /* 4px spacing scale */
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s7:32px; --s8:40px;
  --r-lg:18px; --r-md:14px; --r-sm:10px; --r-xs:8px;
  --shadow-sm:0 1px 2px rgba(27,21,36,.05), 0 1px 1px rgba(27,21,36,.03);

*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--num);letter-spacing:-.02em;line-height:1.18;text-wrap:balance}
h1{font-size:clamp(26px,3vw,32px);font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
small,.small{font-size:12px}
svg{width:18px;height:18px;stroke-width:1.6;flex-shrink:0}
.i{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--pop);color:var(--pop-ink);padding:8px 12px;border-radius:8px;font-weight:600}.skip:focus{left:10px}

/* ---------- frame: rail + main ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
.main{min-width:0}
.rail{background:var(--bold-2);color:var(--on-bold);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:var(--s6) var(--s3) var(--s5);overflow-y:auto;z-index:40;transition:padding .2s ease}
.brand{display:flex;gap:var(--s3);align-items:center;padding:var(--s1) 48px var(--s7) var(--s2);position:relative}
.brand-mark{height:34px;width:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--pop);color:var(--pop-ink);font:800 17px var(--num)}
.brand-txt{min-width:0}
.brand b{display:block;font:700 16px var(--num);letter-spacing:-.02em;line-height:1.2}
.brand small{font-size:9px;letter-spacing:.16em;color:var(--on-bold-dim)}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.14em;padding:var(--s5) var(--s3) var(--s2);color:var(--on-bold-dim);font-weight:600}
.navlink{width:100%;display:flex;align-items:center;gap:var(--s3);min-height:40px;padding:var(--s2) var(--s3);color:var(--on-bold-dim);border-radius:var(--r-sm);text-align:left;font-size:14px;position:relative;transition:background .13s,color .13s,padding .2s}
.navlink:hover{background:#ffffff0f;color:var(--on-bold)}
.navlink[aria-current=page]{background:#ffffff16;color:var(--on-bold);font-weight:600}
.navlink[aria-current=page]:before{content:'';position:absolute;left:calc(var(--s3)*-1);top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--pop);border-radius:0 3px 3px 0}
.navlink svg{opacity:.85}
.rail-foot{margin-top:auto;padding:var(--s6) var(--s2) 0;color:var(--on-bold-dim);font-size:11px;display:grid;gap:var(--s2)}
.rail-foot a{color:var(--on-bold-dim);text-decoration:none}.rail-foot a:hover{color:var(--on-bold)}
.rail-note{border:1px solid #ffffff1f;border-radius:var(--r-md);padding:var(--s3);font-size:12px;line-height:1.5}
.rail-note b{display:block;color:var(--pop);margin-bottom:var(--s1)}
.rail-demo{width:100%;background:#ffffff14;border-color:#ffffff26;color:var(--on-bold);justify-content:center}
.rail-demo:hover{background:#ffffff24;color:var(--on-bold);border-color:#ffffff40}
/* collapsible rail: an icon-only 72px rail, remembered per browser */
.rail-toggle{position:absolute;right:4px;top:2px;width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--r-xs);color:var(--on-bold);background:#ffffff0d;border:1px solid #ffffff26}
.rail-toggle:hover{background:#ffffff1d}
.app.rail-min{grid-template-columns:72px minmax(0,1fr)}
.app.rail-min .rail{padding-left:10px;padding-right:10px;overflow-x:hidden}
.app.rail-min .brand{flex-direction:column;align-items:center;gap:10px;padding:0 0 20px}
.app.rail-min .brand-txt,.app.rail-min .navgroup,.app.rail-min .rail-foot,.app.rail-min .navlink span{display:none}
.app.rail-min .rail-toggle{position:static;width:38px;height:38px}
.app.rail-min .rail-toggle svg{transform:scaleX(-1)}
.app.rail-min .navlink{justify-content:center;padding:10px;gap:0}
.app.rail-min .navlink[aria-current=page]:before{left:-10px}
.app.rail-min .navlink svg{width:21px;height:21px}
.mobile-close,.mobile-menu,.scrim{display:none!important}   /* !important: .ibtn below sets display */
.status{font-size:11px;color:var(--ink-3);display:inline-flex;align-items:center;gap:var(--s1);white-space:nowrap}
.status:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status.warn:before{background:var(--over)}
.rail .status{color:var(--on-bold-dim)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper)}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);max-width:1400px;padding:var(--s3) var(--s7);margin:auto}
.top-left,.actions{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.top-left{flex-wrap:nowrap;min-width:0}
.month-control{display:flex;align-items:center;gap:2px;border:1px solid var(--rule-2);border-radius:var(--r-sm);padding:3px;background:var(--card);transition:border-color .13s,box-shadow .13s}
.month-control:hover,.month-control:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.period-label{font:650 16px/1 var(--num);letter-spacing:-.02em;white-space:nowrap;padding:0 var(--s2)}
/* a native month input shrunk to a calendar glyph painted in the theme accent */
.month-picker{width:28px;height:28px;min-height:28px;padding:0;border:0;color:transparent;background:var(--accent);cursor:pointer;position:relative;opacity:.8;
 -webkit-mask:var(--cal-icon) center/17px 17px no-repeat;mask:var(--cal-icon) center/17px 17px no-repeat}
.month-picker:hover{opacity:1}
.month-picker::-webkit-calendar-picker-indicator{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-xs);color:var(--ink-2);transition:background .13s,color .13s}
.ibtn:hover{background:var(--accent-soft);color:var(--accent)}
.picker{display:flex;flex-direction:column;margin-left:var(--s3)}
.picker small{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.picker select{height:34px;min-height:34px;border-radius:var(--r-sm);max-width:200px;font-weight:600;padding:0 var(--s3)}
.banner{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;padding:var(--s2) var(--s7);font-size:12.5px}
.banner .actions{flex-wrap:nowrap}.banner .link,.banner .btn{white-space:nowrap}
.banner.demo{background:var(--sunk);color:var(--ink-2);border-top:1px solid var(--rule)}
.banner.install{background:var(--accent-soft);color:var(--ink)}.banner.install b{color:var(--accent)}
.banner.backup{background:var(--flag-soft);color:var(--ink)}.banner.backup b{color:var(--flag)}
.banner.storage{background:color-mix(in srgb,var(--over) 10%,var(--card));color:var(--ink)}.banner.storage b{color:var(--over)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:36px;padding:var(--s2) var(--s3);border:1px solid var(--rule-2);background:var(--card);color:var(--ink);border-radius:var(--r-sm);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;transition:background .13s,border-color .13s,color .13s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
.btn.primary:hover{filter:brightness(1.12);color:var(--accent-ink)}
.btn.pop{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}.btn.pop:hover{filter:brightness(1.06);color:var(--pop-ink)}
.btn.ghost{background:transparent;border-color:#ffffff40;color:var(--on-bold)}.btn.ghost:hover{background:#ffffff14;color:var(--on-bold)}
.btn.quiet{background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--over)}.btn.danger:hover{background:color-mix(in srgb,var(--over) 8%,var(--card));border-color:var(--over);color:var(--over)}
.btn.small{min-height:30px;padding:var(--s1) var(--s2);font-size:12px}
.link{color:var(--accent);font-size:13px;font-weight:600;border-bottom:1px solid var(--accent-line);cursor:pointer}
.icon-action{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r-xs);color:var(--ink-3)}
.icon-action:hover{background:var(--accent-soft);color:var(--accent)}.icon-action.danger:hover{color:var(--over)}
.icon-action svg{width:17px;height:17px}

/* ---------- page ---------- */
.page{max-width:1400px;padding:var(--s6) var(--s7) var(--s8);margin:auto}
.pagehead{display:flex;justify-content:space-between;gap:var(--s5);align-items:center;margin-bottom:var(--s6);flex-wrap:wrap}
.pagehead-text{min-width:0;flex:1 1 320px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:var(--s2)}
.subtitle{color:var(--ink-2);font-size:14px;margin-top:var(--s2);max-width:62ch}
.number{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-2)}.dim{color:var(--ink-3)}.good{color:var(--ok)}.warn{color:var(--over)}
.segment{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--sunk);padding:2px;border-radius:var(--r-sm)}
.segment button{font-size:12px;border-radius:var(--r-xs);padding:var(--s1) var(--s3);color:var(--ink-2);min-height:28px;font-weight:600}
.segment button:hover{color:var(--accent)}
.segment button[aria-pressed=true]{background:var(--card);color:var(--accent);box-shadow:var(--shadow-sm)}
.hub-tabs{margin:0 0 var(--s5)}.hub-tabs button{font-size:13px;min-height:32px;padding:var(--s1) var(--s4)}
.custom-range{display:inline-flex;gap:var(--s2);align-items:end}
.custom-range label{display:flex;flex-direction:column;font-size:11px;color:var(--ink-3)}
.custom-range input{height:30px;min-height:30px}
.print-title{display:none}
.footer a{color:inherit;text-decoration:underline;text-underline-offset:2px}.footer a:hover{color:var(--accent)}
.footer{display:flex;justify-content:space-between;gap:var(--s4);font-size:10.5px;color:var(--ink-3);margin-top:var(--s7);border-top:1px solid var(--rule);padding-top:var(--s4)}

/* ---------- pulse strip: one insight at a time, above the hero ---------- */
.pulse{display:flex;align-items:center;gap:var(--s4);background:var(--accent-soft);border-radius:var(--r-md);padding:var(--s3) var(--s4);margin-bottom:var(--s4)}
.pulse-live{flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:ring 2s ease-out infinite}
.pulse-track{position:relative;flex:1;min-height:24px;font-size:14px}
.pulse-track p{position:absolute;inset:0;display:flex;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;pointer-events:none}
.pulse-track p.on{opacity:1;transform:none;pointer-events:auto}
.pulse-nav{display:flex;align-items:center;gap:6px;flex:none}
.pulse-arrow{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule-2);background:var(--card);font:600 16px/1 var(--ui);display:grid;place-items:center}
.pulse-dot{width:6px;height:6px;border-radius:6px;background:var(--rule-2);padding:0;transition:width .2s}.pulse-dot[aria-pressed=true]{width:18px;background:var(--accent)}

/* ---------- hero ---------- */
.hero{background:var(--bold);color:var(--on-bold);border-radius:var(--r-lg);padding:var(--s7);display:grid;grid-template-columns:1.3fr 1fr;gap:var(--s7);margin-bottom:var(--s4);position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;inset:auto -80px -140px auto;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pop) 35%,transparent),transparent 70%);opacity:.6;pointer-events:none}
.hero .eyebrow{color:var(--on-bold-dim)}
.hero-num{font:700 clamp(56px,8vw,104px)/1 var(--num);letter-spacing:-.04em;margin:14px 0 18px;font-variant-numeric:tabular-nums}
.hero p{color:var(--on-bold-dim);font-size:14px;max-width:48ch;line-height:1.6}.hero p b{color:var(--on-bold)}
.hero .actions{margin-top:var(--s5)}
.hero-side{border-left:1px solid #ffffff1f;padding-left:var(--s6);display:grid;align-content:center;gap:var(--s3);position:relative}
.hero-fact{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;gap:var(--s3);color:var(--on-bold-dim)}
.hero-fact strong{font:650 18px var(--num);white-space:nowrap;color:var(--on-bold);font-variant-numeric:tabular-nums}
.hero-meter{height:6px;border-radius:6px;background:#ffffff1f;overflow:hidden}.hero-meter i{display:block;background:var(--ok);height:100%}

/* ---------- KPI tiles: tinted by meaning (solid), icon squares, direction colors ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.kpi{background:var(--card);border-radius:var(--r-md);padding:var(--s4) var(--s5);box-shadow:var(--shadow-sm);border:1px solid transparent;animation:rise .45s ease both;animation-delay:calc(var(--i,0)*50ms);transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi .label{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;font-weight:500}
.kpi b{font:700 clamp(20px,2vw,26px)/1.1 var(--num);letter-spacing:-.03em;display:block;margin:var(--s2) 0 var(--s1);font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-3);font-size:11.5px}
.kpi.tone-pos{--tc:var(--ok);background:color-mix(in srgb,var(--ok) 11%,var(--card));border-color:color-mix(in srgb,var(--ok) 22%,var(--rule));box-shadow:none}
.kpi.tone-neg{--tc:var(--over);background:color-mix(in srgb,var(--over) 10%,var(--card));border-color:color-mix(in srgb,var(--over) 20%,var(--rule));box-shadow:none}
.kpi.tone-net{--tc:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:color-mix(in srgb,var(--accent) 24%,var(--rule));box-shadow:none}
.kpi.tone-neutral{background:var(--sunk);box-shadow:none}
.kpi-ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none;background:color-mix(in srgb,var(--tc,var(--ink-3)) 16%,var(--card));color:var(--tc,var(--ink-2))}
.kpi-ico svg{display:block;width:14px;height:14px;stroke-width:2}
.delta{font-weight:700}.delta.up{color:var(--ok)}.delta.down{color:var(--over)}

/* ---------- surfaces ---------- */
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--s4);margin-bottom:var(--s4)}
.grid2.equal{grid-template-columns:1fr 1fr}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);margin-bottom:var(--s4)}
.card{background:var(--card);border-radius:var(--r-md);padding:var(--s5);min-width:0;margin-bottom:var(--s4);box-shadow:var(--shadow-sm)}
.grid2>.card,.grid3>.card{margin-bottom:0}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s4)}
.cardhead h2{display:flex;align-items:center;gap:10px}
.cardhead p{font-size:12px;color:var(--ink-3);margin-top:var(--s1)}
.h-ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);flex:none}.h-ico svg{width:15px;height:15px;stroke-width:2}
.card-ico{height:34px;width:34px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);margin-bottom:var(--s4)}
.sub-head{font-size:13px;margin:var(--s6) 0 var(--s2);padding-top:var(--s4);border-top:1px solid var(--rule)}
.sub-head.first{border-top:0;padding-top:0;margin-top:var(--s4)}
.table-card{padding:0;overflow:hidden}.table-card .cardhead{padding:var(--s5) var(--s5) var(--s3);margin:0}
.pill{display:inline-flex;border-radius:99px;padding:3px var(--s2);font-size:11px;color:var(--ink-2);background:var(--sunk);align-items:center;gap:var(--s1);white-space:nowrap;font-weight:600}
.pill.good{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--over) 12%,transparent);color:var(--over)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--rule);font-size:13px}
.row:last-child,.row.flat,.row:has(+.sub-head){border-bottom:0}.row strong{font-weight:600}.row small{display:block;color:var(--ink-3);margin-top:2px}
.notice{background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:var(--r-sm);margin-bottom:var(--s4);font-size:13px;display:flex;justify-content:space-between;gap:var(--s4);align-items:center;color:var(--ink-2)}
.notice.warning{background:var(--flag-soft);color:var(--flag)}
.notice.good{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ink)}.notice.good b{color:var(--ok)}
.notice.refused{background:color-mix(in srgb,var(--over) 10%,var(--card));color:var(--ink)}.notice.refused b:first-child{color:var(--over)}
.empty{padding:var(--s7) var(--s5);text-align:center;color:var(--ink-3);font-size:13px}
.empty svg{height:28px;width:28px;color:var(--accent);margin-bottom:var(--s3);opacity:.7}
.empty-actions{justify-content:center;gap:var(--s3)}
.empty h3{color:var(--ink);margin-bottom:var(--s2)}.empty p{max-width:42ch;margin:0 auto var(--s4)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.steps.steps4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:1150px){.steps.steps4{grid-template-columns:repeat(2,minmax(0,1fr))}}
.step{background:var(--sunk);padding:var(--s5);border-radius:var(--r-sm)}
.step span{font:700 11px var(--num);color:var(--accent);letter-spacing:.06em}
.step h3{margin:var(--s3) 0 var(--s2)}.step p{font-size:12.5px;color:var(--ink-2);margin-bottom:var(--s4)}

/* ---------- tables: sortable, paged ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding:var(--s2) var(--s3);background:var(--sunk);white-space:nowrap}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
td .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:34ch}
tr.total td{font-weight:700;border-top:1px solid var(--rule-2)}
.th-sort{cursor:pointer;user-select:none}.th-sort:hover{color:var(--accent)}
.th-sort[data-sort=desc]::after{content:' ↓';color:var(--accent)}.th-sort[data-sort=asc]::after{content:' ↑';color:var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:var(--s3) var(--s5);font-size:12px;color:var(--ink-3)}
.filters{display:flex;gap:var(--s2);flex-wrap:wrap}
.pct{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--sunk);margin-right:8px;vertical-align:middle;overflow:hidden}.pct i{display:block;height:100%;background:var(--ok)}

/* ---------- forms, dialogs, toast ---------- */
input,select,textarea{background:var(--card);border:1px solid var(--rule-2);border-radius:var(--r-xs);min-height:38px;padding:var(--s2) var(--s3);max-width:100%;transition:border-color .13s,box-shadow .13s}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s4)}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.fields label small{font-weight:400;color:var(--ink-3);font-size:11px}
.fields .full{grid-column:1/-1}
.formfoot{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s6);flex-wrap:wrap}
.error{color:var(--over);background:color-mix(in srgb,var(--over) 9%,var(--card));padding:var(--s2) var(--s3);border-radius:var(--r-xs);margin:var(--s2) 0;font-size:13px}
dialog{border:0;border-radius:var(--r-lg);padding:var(--s7);width:min(560px,calc(100% - 32px));background:var(--card);color:var(--ink);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:#160c2470}
.dialog-head{display:flex;justify-content:space-between;gap:var(--s4);align-items:center;margin-bottom:var(--s2)}
.dialog-head h2{font-size:22px}
dialog .subtitle{margin:0 0 var(--s5)}
.toast{position:fixed;bottom:var(--s5);left:50%;transform:translateX(-50%);z-index:99;border-radius:var(--r-sm);padding:var(--s3) var(--s4);background:var(--bold-2);color:var(--on-bold);font-size:13px;display:flex;gap:var(--s4);align-items:center;box-shadow:var(--shadow-lg);max-width:calc(100% - 30px)}
.toast button{color:var(--pop);text-decoration:underline;font-weight:600;white-space:nowrap}
/* welcome tour: art header, step label, dots, one idea per slide */
.welcome{padding:0;width:min(600px,calc(100% - 28px));max-height:min(760px,92vh);overflow:auto}
.welcome-close{position:absolute;right:16px;top:16px;z-index:2;background:#ffffffc7}
.welcome-art{height:190px;display:grid;place-items:center;color:var(--accent);background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--pop) 34%,var(--card)))}
.welcome-art[data-n="1"]{background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--accent) 18%,var(--card)))}
.welcome-art[data-n="2"]{background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--ok) 22%,var(--card)))}
.welcome-art svg{width:80px;height:80px;stroke-width:1.25}
.welcome-body{padding:28px 34px 12px;text-align:center}
.welcome-step{display:block;color:var(--accent);font-size:10px;font-weight:750;letter-spacing:.16em;margin-bottom:10px}
.welcome-body h2{font-size:26px;margin-bottom:10px}
.welcome-body p{color:var(--ink-2);max-width:460px;margin:0 auto 8px}
.welcome-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 34px 28px}
.welcome-dots{display:flex;gap:8px}.welcome-dots i{width:8px;height:8px;border-radius:50%;background:var(--rule-2)}.welcome-dots i.on{background:var(--accent)}
/* settings: palette chips and sidebar switches */
.theme-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.theme-card{border:1px solid var(--rule);border-radius:var(--r-sm);padding:var(--s2);background:var(--card);display:grid;gap:6px;text-align:left}
.theme-card:hover{border-color:var(--rule-2);box-shadow:var(--shadow-sm)}
.theme-card[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.theme-chip{display:flex;align-items:flex-end;gap:4px;height:42px;padding:6px;border-radius:6px}
.theme-chip i{display:block;flex:1;border-radius:3px}.theme-chip i:nth-child(1){height:100%}.theme-chip i:nth-child(2){height:72%}.theme-chip i:nth-child(3){height:44%}
.theme-card b{font-size:12px;font-weight:600}
.toggle-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nav-toggle{position:relative;cursor:pointer}
.nav-toggle input{position:absolute;opacity:0;pointer-events:none}
.nav-toggle span{min-height:52px;display:flex;align-items:center;gap:var(--s2);border:1px solid var(--rule);border-radius:var(--r-sm);padding:var(--s2) var(--s3);color:var(--ink-2);font-size:12.5px;transition:border-color .13s,background .13s}
.nav-toggle svg{width:17px;height:17px}.nav-toggle b{font-weight:650}
.nav-toggle input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nav-toggle input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.nav-toggle span i{margin-left:auto;width:34px;height:20px;border-radius:20px;background:var(--rule-2);padding:3px;flex:0 0 auto;transition:background .16s}
.nav-toggle span i:after{content:'';display:block;width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px #0003;transition:transform .16s}
.nav-toggle input:checked+span i{background:var(--accent)}.nav-toggle input:checked+span i:after{transform:translateX(14px)}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--bold-2);color:var(--on-bold);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:12px;box-shadow:var(--shadow-lg);max-width:280px}
.tip-title{font:700 11px var(--num);letter-spacing:.04em;text-transform:uppercase;color:var(--on-bold-dim);margin-bottom:var(--s1)}
.tip-row{display:flex;align-items:center;gap:var(--s2);white-space:nowrap;line-height:1.7}.tip-row b{font:700 13px var(--num);margin-left:auto;padding-left:var(--s3)}

/* ---------- chart kit ---------- */
.kit-pie{display:grid;justify-items:center;gap:18px}.kit-pie svg{width:100%;height:auto;max-width:200px;overflow:visible}
.kit-seg{transform-origin:90px 90px;animation:kit-pop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*80ms);transition:transform .2s;cursor:pointer}
.kit-seg:hover,.kit-seg:focus{transform:scale(1.045);outline:none}
.kit-cut{stroke:var(--card);stroke-width:2.5;stroke-linecap:butt}
.kit-mid{font:800 20px var(--num);fill:var(--ink);text-anchor:middle}.kit-mid-sub{font:600 9px var(--ui);letter-spacing:.08em;fill:var(--ink-3);text-anchor:middle}
.kit-key{display:grid;width:100%}.kit-key.two{grid-template-columns:repeat(2,minmax(0,1fr));grid-template-rows:repeat(var(--rows),auto);grid-auto-flow:column;column-gap:28px}
@media(max-width:620px){.kit-key.two{grid-template-columns:1fr;grid-template-rows:none;grid-auto-flow:row}}
.kit-key-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:9px 8px;border-bottom:1px solid var(--rule);font-size:13.5px}
.kit-key-row:hover{background:var(--sunk)}.kit-key-row.linked{cursor:pointer}.kit-key-row.linked:hover span{color:var(--accent);text-decoration:underline;text-underline-offset:3px}.kit-key-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kit-key-row em{font-style:normal;color:var(--ink-2);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--accent)}
.kit-gauge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}.kit-gauge svg{width:100%;height:auto;max-width:200px}
.kit-gauge-track,.kit-gauge-val{fill:none;stroke-width:14;stroke-linecap:round}.kit-gauge-track{stroke:var(--sunk)}.kit-gauge-val{stroke:var(--accent);animation:kit-fill 1.1s cubic-bezier(.2,.8,.2,1) both}
.kit-gauge-num{font:800 24px var(--num);fill:var(--ink);text-anchor:middle}.kit-gauge small{color:var(--ink-3);font-size:12px}
.kit-spark{display:block;width:100%;max-width:140px;height:30px;margin:6px 0 2px}
.kit-spark polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke:var(--spark,var(--accent))}.kit-spark circle{fill:var(--spark,var(--accent))}
.kit-chart svg{width:100%;height:auto;overflow:visible}
.chart-grid{stroke:var(--rule);stroke-width:1}
.kit-axis{font:500 11px var(--ui);fill:var(--ink-3)}
.kit-bar{transform-box:fill-box;transform-origin:bottom;animation:kit-grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
.kit-col{cursor:pointer;outline:none}.kit-col:hover .kit-bar{filter:brightness(1.08)}

.rate-pick:hover span{color:var(--pop)}.rate-pick label:hover~label span{color:var(--rule-2)}.rate-pick input:focus-visible+span{outline:2px solid var(--accent);border-radius:4px}

.bulkbar .btn{background:#ffffff14;border-color:#ffffff33;color:var(--on-bold)}.bulkbar .btn:hover{background:#ffffff26;color:var(--on-bold)}.bulkbar .btn.quiet{border-color:transparent}

/* matched rows: cards side by side share one height, set by the shorter card (never below data-floor);
   a longer card scrolls inside its body so the row stays flush and the cards below line up */
.grid-even{display:grid;grid-template-columns:repeat(var(--n,3),minmax(0,1fr));gap:var(--s4);margin-bottom:var(--s4)}
.grid-even>.card{margin:0}

.card.pair.scrolls .pair-body{overflow-y:auto;overscroll-behavior:contain;margin-right:calc(var(--s2)*-1);padding-right:var(--s2);scrollbar-width:thin;scrollbar-color:var(--rule-2) transparent;
 -webkit-mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(to bottom,#000 calc(100% - 28px),transparent);padding-bottom:20px}
.pair-body::-webkit-scrollbar{width:8px}.pair-body::-webkit-scrollbar-thumb{background:var(--rule-2);border-radius:8px}
/* editor */

/* covers: the book's own cover, or a typeset one in the book's colors when there is no picture */
.cover{position:relative;aspect-ratio:2/3;border-radius:3px 7px 7px 3px;overflow:hidden;background:var(--sunk);box-shadow:0 1px 2px #0000001f,0 8px 18px -10px #00000059;flex:none;container-type:inline-size;width:100%}

.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:26px 20px}

.bcard-body{display:grid;gap:5px;min-width:0}
.bt{font:700 14.5px/1.3 var(--num);letter-spacing:-.01em;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}

.st.reading{background:color-mix(in srgb,var(--accent) 14%,transparent);color:var(--accent)}
.st.read{background:color-mix(in srgb,var(--ok) 13%,transparent);color:var(--ok)}

/* ================= print documents: a book list and a year of reading =================
   Printing a list or your year swaps the whole app for #print-root, which holds a document laid out
   for paper (real text, page sizes, page breaks). The browser's "Save as PDF" turns it into a crisp PDF. */
#print-root{display:none}
@media print{
 body.printing{background:#fff!important;color:#221c18;font-size:10.5pt}
 body.printing>*:not(#print-root){display:none!important}
 body.printing #print-root{display:block}}
.pd{font-variant-numeric:lining-nums;--p-ink:#221c18;--p-mute:#6e655e;--p-faint:#9a918a;--p-rule:#e6dfd7;color:var(--p-ink);font:10.5pt/1.55 var(--ui);-webkit-print-color-adjust:exact;print-color-adjust:exact}
.pd *{-webkit-print-color-adjust:exact;print-color-adjust:exact;font-variant-numeric:lining-nums!important}
/* Playfair Display is for titles and a few short accents only; headings and body read in the app fonts */
.pd h1,.pd .serif{font-family:"Playfair Display",Georgia,"Times New Roman",serif;font-weight:600;letter-spacing:0;line-height:1.15;color:var(--p-ink);text-wrap:balance}
.pd h2,.pd h3{font-family:var(--num);font-weight:700;letter-spacing:-.01em;line-height:1.25;color:var(--p-ink)}
.pd p{margin:0}
.pd img{display:block;width:100%;height:100%;object-fit:cover}
.pd figure{margin:0;overflow:hidden;background:var(--p-soft)}
.pd figure:has(img[hidden]),.pd figure:not(:has(img)){display:none}
.pd-kicker{font:700 7.5pt var(--ui);letter-spacing:.22em;text-transform:uppercase;color:var(--p-accent)}
.pd-lead{font:400 11pt/1.55 var(--ui);color:var(--p-mute)}
/* a short line of accent text (cover subtitle, a name) may use the italic serif */
.pd-accent,.pd-cover .pd-lead{font-family:"Playfair Display",Georgia,serif;font-style:italic}
.pd-break{break-before:page}
/* shopping list */
.pd-docHead{display:flex;justify-content:space-between;align-items:flex-end;gap:16pt;padding-bottom:10pt;margin-bottom:16pt;border-bottom:1.25pt solid var(--p-accent)}
.pd-docHead h1{font-size:26pt;margin-top:4pt}
.pd-docHead .pd-lead{font-size:9.5pt;text-align:right}

.pd-cover{position:relative;overflow:hidden;width:100vw;height:100vh;break-after:page;color:var(--p-ink)}
.cv-classic{background:#F6F0E6;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:1.3in 1.1in}
.cv-classic:before,.cv-classic:after{content:'';position:absolute;border:1.1pt solid var(--p-deep)}
.cv-classic:before{inset:.42in}.cv-classic:after{inset:.52in;border-width:.5pt}
.cv-classic h1{font-size:46pt;color:var(--p-deep);margin:16pt 0 12pt;line-height:1.08}
.cv-classic .pd-lead{font-size:15pt}
.cv-orn{width:120pt;height:26pt;color:var(--p-accent);margin:4pt auto}
.cv-by{position:absolute;left:0;right:0;bottom:1.25in;text-align:center}
.cv-by span{display:block;font:700 7pt var(--ui);letter-spacing:.26em;text-transform:uppercase;color:var(--p-faint);margin-bottom:4pt}
.cv-by b{font:italic 400 17pt "Playfair Display",Georgia,serif;color:var(--p-deep)}
.pd-made{margin-top:20pt;font-size:7.5pt;color:var(--p-faint);text-align:center}

let pendingRestore=null;
async function restore(file){try{if(file.size>200*1024*1024)throw Error('That file is too large to be a backup.');const j=JSON.parse(await file.text());
  if(j.app!==CONFIG.storageKey)throw Error(`This backup is from another app. Choose a ${CONFIG.name} backup.`);
  const next=Logic.validate(j.data),photos=j.photos||{};
  if(demo||!state.books.length)return applyRestore('replace',{next,photos});
  pendingRestore={next,photos};const m=Logic.merge(state,next).stats,saved=j.saved?new Date(j.saved).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'}):'';
  modal('Restore this backup?',`The backup${saved?` from ${saved}`:''} has ${plural(next.books.length,'book')}. You have ${plural(state.books.length,'book')} here.`,
   `<div class="restore-sum"><div><b>${num(m.added)}</b><span>new books to add</span></div><div><b>${num(m.updated)}</b><span>already here, with newer edits, reads or quotes to bring in</span></div><div><b>${num(m.same)}</b><span>already here and identical</span></div></div>
   <p class="small dim">Merge adds what’s missing and keeps the most recently edited copy of each book, so nothing is duplicated. Reads, progress notes, quotes and shelves from both are kept. You can undo straight after.</p>
   <div class="formfoot"><button type="button" class="btn" data-action="dismiss">Cancel</button><button type="button" class="btn" data-action="restore-go" data-mode="replace">Replace everything</button><button type="button" class="btn primary" data-action="restore-go" data-mode="merge" autofocus>Merge</button></div>`);}
 catch(e){toast(e instanceof SyntaxError?'That file is not a backup.':e.message||'That file could not be read.');}}
async function applyRestore(mode,p=pendingRestore){if(!p)return;pendingRestore=null;closeModal();const {next,photos}=p;
 try{if(demo)toggleSample(true);storageProblem='';const ok=(v)=>typeof v==='string'&&v.startsWith('data:image/');
  if(mode==='replace'){for(const [id,ph] of Object.entries(photos))if(ok(ph))await putPhoto(id,ph);commit(()=>{state=next;},'Backup restored');return;}
  const m=Logic.merge(state,next);for(const [from,to] of Object.entries(m.photoMap))if(ok(photos[from]))await putPhoto(to,photos[from]);

 guide(){return pagehead('Help','How to use '+esc(CONFIG.name),'Four moves. Everything else fills in by itself.')+
  `<div class="steps steps4" style="margin-bottom:16px">${[['01 / ADD','Add a book','Paste a link, an ISBN or a title in Add a book. Press N anywhere to start.','Add a book','go','data-go="import"'],['02 / READ','Track it','Start reading, log your page, then mark it finished with a rating.','Reading now','go','data-go="reading"'],['03 / KEEP','Quotes & notes','Keep the lines you love and what you thought, on each book’s page.','My books','go','data-go="library"'],['04 / PROTECT','Back up','Choose a backup folder once, or download a backup now and then.','Settings & backup','go','data-go="settings"']].map(([n,h,p,b,a,x])=>`<div class="step"><span>${n}</span><h3>${h}</h3><p>${p}</p>${button(b,a,'small',x)}</div>`).join('')}</div>
  <section class="card table-card">${cardhead('Good to know','','help')}<div class="table-wrap"><table data-nosort><thead><tr><th>Question</th><th>Answer</th></tr></thead><tbody>
  <tr><td>Which links work?</td><td>Most book links. Amazon, Bookshop.org, Barnes &amp; Noble, Waterstones, Booktopia, Indigo, Open Library and Google Books links carry the book’s number (its ISBN), and that’s what we look up. Goodreads links are matched by the title in the link. ${DL?'For any other link, type the book’s title instead.':'Other bookshop and publisher pages are read for their ISBN and title.'} <b>Add a book</b> lists them.</td></tr>
  <tr><td>Kindle and audiobook links?</td><td>They don’t carry an ISBN, so type the title instead: the link is kept with the book. If the link has the title in it, we search for that straight away.</td></tr>
  <tr><td>No link at hand?</td><td>Type the title (add the author if it’s a common one), or the ISBN printed above the barcode on the back of the book. You can also type a book in by hand with <b>Type it in</b>.</td></tr>
  <tr><td>Moving from Goodreads or StoryGraph?</td><td>Export your library there (Goodreads: My Books, then Import and export; StoryGraph: Manage account), then choose the file in <b>Add a book → Import from Goodreads or StoryGraph</b>. Shelves, ratings, dates read and reviews come across, and books already here are skipped.</td></tr>
  <tr><td>Where do the covers and descriptions come from?</td><td>From Open Library, a free catalog run by the Internet Archive, with Google Books as a backup. Only the ISBN or title is sent to look the book up. A book without a cover gets a typeset one in its own colors; you can upload a photo of yours in <b>Edit</b>.</td></tr>
  <tr><td>Where are my books kept?</td><td>In this browser on this device. Nothing is uploaded and there’s no account.${DL?' Only the ISBN or title you look up is sent, to Open Library or Google Books.':' Links without an ISBN are read by our link reader, which fetches that one page and forgets it.'}</td></tr>
  <tr><td>Track my reading?</td><td>On a book, choose <b>Reading</b>, then <b>Update progress</b> with your page (or a percentage, like 40%). <b>I finished it</b> records the day, your rating and a few words. It counts toward the year you finish it in.</td></tr>
  <tr><td>Reading goal?</td><td>Set it on the <b>Reading</b> page or in Settings. The dashboard shows whether you’re ahead or behind an even pace.</td></tr>
  <tr><td>Re-reads and books I stopped?</td><td>On a read book, <b>Read it again</b> starts a new read; both count. <b>Did not finish</b> keeps the book with the day you stopped, without counting it as read.</td></tr>
  <tr><td>Books I read years ago?</td><td>Add them as <b>Read</b> and tick <b>I don’t remember when</b>. They stay in your library without landing in a year. <b>Add a past read</b> on a book adds dates later.</td></tr>
  <tr><td>Shelves, genres and tags?</td><td>Genres fill in from the catalog; tags are your own words. Shelves are your groups: a book club, books to lend. Change many books at once with <b>Select</b> in All books.</td></tr>
  <tr><td>Print or save a PDF?</td><td><b>Print my year</b> makes a keepsake journal: a cover, your stats, every book month by month, and your favorite quotes. <b>Print list</b> in All books or on a shelf prints a book list. Pick <b>Save as PDF</b> as the printer, and turn off Headers and footers.</td></tr>
  ${DL?`<tr><td>Where should I keep this file?</td><td>In one folder you won’t tidy away, like Documents. Your books are saved by your browser for <b>this file in this place</b>: if you move or rename the file, or open it in another browser, the library looks empty. Nothing is lost: open the file from its old place, or restore your latest backup. Bookmark the file so you always open the same one.</td></tr><tr><td>Do I need the internet?</td><td>Only to find new books and show their covers. Everything else works offline.</td></tr><tr><td>Can I use it on my phone?</td><td>It works best on a computer. To use it on a phone too, open the file in the phone’s browser and move your books across with a backup (download it on one device, restore it on the other, and choose <b>Merge</b>). Each device keeps its own library.</td></tr>`:`<tr><td>Can I use it on my phone?</td><td>Yes. Open the same web address on your phone. Each device keeps its own library, so move books with a backup: download it on one device, restore it on the other, and choose <b>Merge</b> to combine both without duplicates.</td></tr>
  <tr><td>Install it on my phone or computer?</td><td>Choose <b>Install the app</b> in the sidebar or Settings. On iPhone and iPad: in Safari, tap Share, then <b>Add to Home Screen</b>. It opens like any app and works offline, except finding new books.</td></tr>`}
  <tr><td>Keyboard shortcuts</td><td><b>N</b> adds a book. <b>/</b> searches your books.</td></tr></tbody></table></div></section>`;},

 const show=!demo&&!storageProblem&&!bannerHidden&&hasData()&&!protectedNow(),reconnect=folder&&folderStatus!=='Connected';

function captureFocus(){const el=document.activeElement;if(!el||el===document.body||!$('#content').contains(el))return null;
 const key=el.id?'#'+CSS.escape(el.id):Object.keys(el.dataset||{}).length?el.tagName.toLowerCase()+Object.entries(el.dataset).map(([k,v])=>`[data-${k.replace(/[A-Z]/g,m=>'-'+m.toLowerCase())}="${CSS.escape(v)}"]`).join(''):'';
 if(!key)return null;let sel=null;try{if(el.selectionStart!=null)sel=[el.selectionStart,el.selectionEnd];}catch{}return {key,sel};}
function restoreFocus(f){if(!f)return;let el=null;try{el=document.querySelector(f.key);}catch{}if(!el)return;el.focus({preventScroll:true});try{if(f.sel)el.setSelectionRange(...f.sel);}catch{}}

  if(m){const up=m[1]==='+';sm.innerHTML=`<span class="delta ${up?'up':'down'}">${m[1]}${m[2]}%</span>`+esc(sm.textContent.slice(m[0].length));if(sp)sp.style.setProperty('--spark',up?'var(--ok)':'var(--over)');}});

// matched rows: every card in a .match-row takes the height of the shortest one (at least data-floor px);
// taller cards scroll inside. Rows that have stacked into one column (phones) keep their natural height.
function matchRows(){document.querySelectorAll('#content .match-row').forEach(row=>{const cards=[...row.children].filter(c=>c.classList.contains('pair'));
 row.classList.add('measuring');cards.forEach(c=>{c.style.height='';c.classList.remove('scrolls');});
 // cards are matched per visual line, so a row that wraps (tablets) or stacks (phones) still lines up where it can
 const lines=new Map();for(const c of cards){const t=Math.round(c.getBoundingClientRect().top);if(!lines.has(t))lines.set(t,[]);lines.get(t).push(c);}
 const hs=new Map(cards.map(c=>[c,c.getBoundingClientRect().height]));row.classList.remove('measuring');
 for(const line of lines.values()){if(line.length<2)continue;const h=Math.max(Math.min(...line.map(c=>hs.get(c))),+row.dataset.floor||0);
  line.forEach(c=>{c.style.height=h+'px';if(hs.get(c)>h+1)c.classList.add('scrolls');});}});}

const sorts=new Map();
const cellVal=td=>{if(!td)return null;if(td.dataset.v!==undefined){const v=td.dataset.v;if(v==='')return null;return /^-?\d+(\.\d+)?$/.test(v)?+v:v;}const t=td.textContent.trim();if(!t||t==='—')return null;const n=t.replace(/[−–]/g,'-').replace(/[^\d.-]/g,'');return /^[−–\-$€£(]?\s*[\d$]/.test(t)&&/^-?\d+(\.\d+)?$/.test(n)?+n:t.toLowerCase();};

 const apply=()=>{const st=sorts.get(key);if(!st)return;const body=tb.tBodies[0],all=[...body.rows],pin=all.filter(r=>r.classList.contains('total')),rest=all.filter(r=>!pin.includes(r));
  rest.sort((a,b)=>{const x=cellVal(a.cells[st.i]),y=cellVal(b.cells[st.i]);if(x===null)return 1;if(y===null)return -1;return (x<y?-1:x>y?1:0)*st.dir;});[...rest,...pin].forEach(r=>body.appendChild(r));
  [...tb.tHead.rows[0].cells].forEach((th,j)=>{th.dataset.sort=j===st.i?(st.dir<0?'desc':'asc'):'';th.setAttribute('aria-sort',j===st.i?(st.dir<0?'descending':'ascending'):'none');});};
 [...tb.tHead.rows[0].cells].forEach((th,i)=>{if(!th.textContent.trim())return;th.classList.add('th-sort');th.tabIndex=0;th.setAttribute('role','button');
  const go=()=>{const cur=sorts.get(key),first=cellVal(tb.tBodies[0].rows[0]?.cells[i]);sorts.set(key,{i,dir:cur&&cur.i===i?-cur.dir:(typeof first==='string'?1:-1)});apply();};th.onclick=go;th.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});apply();});}

 const t0=performance.now(),step=t=>{const p=Math.min(1,(t-t0)/620),e=1-Math.pow(1-p,3);for(const x of els)if(x.el.isConnected)x.el.textContent=p<1?num(Math.round(x.to*e)):x.final;if(p<1)countUp.t=requestAnimationFrame(step);};countUp.t=requestAnimationFrame(step);}

/* ---------- photos: shrink an upload to a small WebP/JPEG before keeping it ---------- */
async function shrink(file){if(!/^image\/(jpeg|png|webp)$/.test(file.type))throw Error('Choose a JPEG, PNG or WebP photo.');if(file.size>15*1024*1024)throw Error('Choose a photo smaller than 15 MB.');
 const bmp=await createImageBitmap(file);try{let side=1200;for(let k=0;k<5;k++){const s=Math.min(1,side/Math.max(bmp.width,bmp.height)),c=document.createElement('canvas');c.width=Math.round(bmp.width*s);c.height=Math.round(bmp.height*s);c.getContext('2d').drawImage(bmp,0,0,c.width,c.height);
  let url=c.toDataURL('image/webp',.8);if(!url.startsWith('data:image/webp'))url=c.toDataURL('image/jpeg',.8);if(url.length<=340000)return url;side*=.75;}throw Error('That photo could not be made small enough. Try another one.');}finally{bmp.close?.();}}

function yearDoc(y){const ys=Logic.yearStats(state,y),n=ys.fin.length,who=state.settings.name,goal=state.settings.goals[y]||0,quotes=ys.fin.flatMap(({b})=>b.quotes.map(q=>({q,b}))),

 const stats=`<div class="pd-stats"><div><span>Books</span><b>${num(n)}</b><small>${goal?`Goal: ${num(goal)}${n>=goal?' · reached':''}`:'finished'}</small></div><div><span>Pages</span><b>${num(ys.pages)}</b><small>${n&&ys.pages?`about ${num(Math.round(ys.pages/n))} a book`:'&nbsp;'}</small></div><div><span>Average rating</span><b>${Number.isFinite(ys.avg)?'★ '+ys.avg.toFixed(1):'—'}</b><small>${ys.longest?'Longest: '+esc(cut(ys.longest.title,28)):'&nbsp;'}</small></div><div><span>Top genre</span><b style="font-size:14pt">${esc(ys.genres[0]?.[0]||'—')}</b><small>${ys.authors[0]?'Most read: '+esc(ys.authors[0][0]):'&nbsp;'}</small></div></div>`;
 const months=ys.months.map((list,i)=>list.length?`<section class="pd-month"><h2>${monthName(`${y}-${pad(i+1)}`,{month:'long'})}<small>${plural(list.length,'book')}</small></h2>${list.map(({b,d})=>`<div class="pd-brow">${pdCover(b)}<div><b>${esc(b.title)}</b><small>${esc(byline(b))}${b.pages?` · ${num(b.pages)} pages`:''}</small>${b.notes?`<p>${esc(cut(b.notes.replace(/\s+/g,' '),280))}</p>`:''}</div><div class="pd-right">${pdStars(b.rating)}<br>${fmtDay(d,{month:'short',day:'numeric'})}</div></div>`).join('')}</section>`:'').join('');
 return {lead:cover,html:`<div class="pd-year"><div class="pd-kicker">The year at a glance</div><h1 style="font-size:28pt;margin:4pt 0 12pt">${y} in Books</h1>${stats}<div class="pd-wall">${ys.fin.slice(0,48).map(({b})=>pdCover(b)).join('')}</div>
  <div class="pd-break"><div class="pd-kicker">Month by month</div><h1 style="font-size:24pt;margin:4pt 0 14pt">Every book I finished</h1>${months}</div>
  ${quotes.length?`<div class="pd-break"><div class="pd-kicker">Worth keeping</div><h1 style="font-size:24pt;margin:4pt 0 14pt">Favorite lines</h1><div class="pd-quotes">${quotes.map(({q,b})=>`<div class="pd-q"><p>“${esc(q.text)}”</p><small>${esc(b.title)}${b.authors[0]?' · '+esc(b.authors[0]):''}${q.page?` · page ${esc(q.page)}`:''}</small></div>`).join('')}</div></div>`:''}

  <p class="pd-made">Printed ${esc(new Date().toLocaleDateString('en-US',{month:'long',year:'numeric'}))} with ${CONFIG.name}</p></div>`};}

  if(f.dataset.id){const x=bookById(f.dataset.id);if(!x)return;commit(()=>{Logic.setStatus(x,'read',{date});if(rating)x.rating=rating;if(note)x.notes=(x.notes?x.notes+'\n\n':'')+note;},`Finished “${x.title}”${date&&date.slice(0,4)===thisYear()?`: that’s ${plural(Logic.yearStats(state,thisYear()).fin.length,'book')} this year`:''}`);}
  else addResult(f.dataset.i,'read',{date,rating,notes:note});return;}
 if(f.id==='progress-form'){const x=bookById(f.dataset.id);if(!x)return closeModal();const raw=String(d.page||'').trim();let page=/%$/.test(raw)&&x.pages?Math.round(x.pages*parseFloat(raw)/100):Math.round(+raw.replace(/[^\d.]/g,''));
  if(!Number.isFinite(page)||page<0)return formError(x.pages?'Type a page number, or a percentage like 40%.':'Type a page number.');if(x.pages)page=Math.min(page,x.pages);if(!dateOk(d.date))return formError('Pick a day.');const note=String(d.note||'').trim().slice(0,2000);closeModal();
  commit(()=>{x.progress=page;x.log.push({date:d.date,page,note});x.log.sort((a,b)=>a.date.localeCompare(b.date));if(x.status!=='reading')Logic.setStatus(x,'reading',{date:d.date});touch(x);},x.pages?`Page ${num(page)} of ${num(x.pages)}: ${pc(page/x.pages)} read`:`Page ${num(page)} logged`);
  if(x.pages&&page>=x.pages)setTimeout(()=>finishForm({id:x.id}),300);return;}
 if(f.id==='past-read-form'){const x=bookById(f.dataset.id);if(!x)return closeModal();if(!dateOk(d.end))return formError('Pick the day you finished.');if(d.start&&(!dateOk(d.start)||d.start>d.end))return formError('The start day should come before the day you finished.');closeModal();
  commit(()=>{x.reads.push({start:d.start||'',end:d.end,dnf:!!d.dnf});x.reads.sort((a,b)=>(a.start||a.end).localeCompare(b.start||b.end));if(x.status==='want'&&!d.dnf)x.status='read';touch(x);},`Read added for ${fmtDay(d.end)}`);return;}
 if(f.dataset.form==='quote'){const x=bookById(f.dataset.id),text=String(d.text||'').trim().slice(0,3000);if(!x||!text)return;commit(()=>{x.quotes.push({text,page:String(d.page||'').trim().slice(0,12)});touch(x);},'Quote saved');return;}
 if(f.dataset.form==='notes'){const x=bookById(f.dataset.id);if(!x)return;commit(()=>{x.notes=String(d.notes||'').trim().slice(0,20000);touch(x);},'Notes saved');return;}
 if(f.id==='shelf-form'){const id=f.dataset.id,name=tidy(d.name).slice(0,60);if(!name)return formError('Give the shelf a name.');closeModal();if(screen==='edit')keepForm();const nid='h'+uid(),x=bookById(f.dataset.book);
  commit(()=>{if(id)state.shelves.find(c=>c.id===id).name=name;else{state.shelves.push({id:nid,name});if(x){x.shelves.push(nid);touch(x);}}},id?'Shelf renamed':x?`Put on ${name}`:'Shelf created');return;}
 if(f.id==='goal-form'){const g=Math.round(+String(d.goal||'').replace(/\D/g,''));if(!(g>0&&g<10000))return formError('Type how many books, like 24.');closeModal();commit(()=>{state.settings.goals[thisYear()]=g;},`Goal set: ${plural(g,'book')} in ${thisYear()}`);return;}
 if(f.id==='book-form'){keepForm();if(!draft.title){toast('Give the book a title before saving.');return $('[name="title"]').focus();}
  if(draft.isbn&&!ISBN.to13(draft.isbn)){toast('That ISBN doesn’t look right. Check the digits, or leave it empty.');return $('[name="isbn"]').focus();}draft.isbn=ISBN.to13(draft.isbn);
  const x={...draft,updatedAt:new Date().toISOString()},isNew=!bookById(x.id),photo=draftPhoto;if(photo){x.hasPhoto=true;putPhoto(x.id,photo);}
  dirty=false;draft=null;draftPhoto=null;commit(()=>{if(isNew)state.books.unshift(x);else state.books=state.books.map(y=>y.id===x.id?x:y);},isNew?`Added “${x.title}” to your library`:'Book saved');if(isNew&&!x.description&&(x.isbn||x.title))enrich(x.id);openBook(x.id);return;}
 if(f.id==='bulk-status-form'){const bs=pickedBooks(),k=d.v;closeModal();commit(()=>{bs.forEach(b=>{if(b.status!==k)Logic.setStatus(b,k,{date:k==='read'?'':today()});});lib.sel.clear();},`${plural(bs.length,'book')} set to ${STATUS[k]}`);return;}
 if(f.id==='bulk-shelf-form'){const bs=pickedBooks();let v=d.v;const name=tidy(d.name).slice(0,60);if(v==='__new'&&!name)return formError('Give the new shelf a name.');closeModal();
  commit(()=>{if(v==='__new'){v='h'+uid();state.shelves.push({id:v,name});}bs.forEach(b=>{if(!b.shelves.includes(v)){b.shelves.push(v);touch(b);}});lib.sel.clear();},`${plural(bs.length,'book')} put on ${name&&d.v==='__new'?name:shelfName(d.v)}`);return;}
 if(f.id==='bulk-genre-form'){const v=tidy(d.v).slice(0,40);if(!v)return formError('Type a genre.');const bs=pickedBooks();closeModal();
  commit(()=>{bs.forEach(b=>{b.genres=d.mode==='add'?[...new Set([...b.genres,v])]:[v,...b.genres.filter(x=>x!==v)];touch(b);});lib.sel.clear();},`${plural(bs.length,'book')} now in ${v}`);return;}
 if(f.id==='bulk-tags-form'){const add=String(d.add||'').split(',').map(tidy).filter(Boolean).map(t=>t.slice(0,40)),rem=new FormData(f).getAll('remove');if(!add.length&&!rem.length)return formError('Add a tag or choose one to remove.');const bs=pickedBooks();closeModal();
  commit(()=>{bs.forEach(b=>{b.tags=[...new Set([...b.tags.filter(t=>!rem.includes(t)),...add])];touch(b);});lib.sel.clear();},`Tags updated on ${plural(bs.length,'book')}`);return;}
 if(f.id==='facet-form'){const k=f.dataset.k,v=f.dataset.v,to=tidy(d.to).slice(0,k==='authors'?100:40);if(!to)return formError('Type a name.');closeModal();if(to===v)return;const merge=listOf(k).includes(to);
  commit(()=>{state.books.forEach(b=>{if(b[k].includes(v)){b[k]=[...new Set(b[k].map(x=>x===v?to:x))];touch(b);}});if(lib.cat.slice(2)===v)lib.cat=lib.cat.slice(0,2)+to;},merge?`Merged “${v}” into “${to}”`:`Renamed to “${to}”`);return;}
 if(f.id==='settings-form'){const g=Math.round(+String(d.goal||'').replace(/\D/g,''));if(String(d.goal||'').trim()&&!(g>0&&g<10000))return toast('The goal should be a number of books, like 24.');
  commit(()=>{state.settings.name=String(d.name||'').trim().slice(0,100);if(g>0)state.settings.goals[thisYear()]=g;else delete state.settings.goals[thisYear()];},'Preferences saved');}});
document.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===',')&&e.target.dataset?.chip){e.preventDefault();return addChip(e.target);}if(e.key==='Enter'&&e.target.id==='photo-url'){e.preventDefault();return coverFromLink(e.target.value);}if(e.key==='Escape')document.body.classList.remove('menu-open');
 const typing=/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.target.isContentEditable,dlg=document.querySelector('dialog[open]');if(typing||dlg||e.metaKey||e.ctrlKey||e.altKey)return;
 if(e.key.toLowerCase()==='n'){e.preventDefault();focusFind();}
 if(e.key==='/'){e.preventDefault();if(screen!=='library')go('library');$('#lib-search')?.focus();}});
window.addEventListener('beforeunload',e=>{if(dirty&&draft&&screen==='edit'){e.preventDefault();e.returnValue='';}});
function showTip(el,x,y){const tip=$('#tip');try{const {t,r}=JSON.parse(el.dataset.tip);tip.innerHTML=`<div class="tip-title">${esc(t)}</div>`+r.map(v=>`<div class="tip-row">${v.color?`<i class="dot" style="background:${v.color}"></i>`:''}<span>${esc(v.name)}</span><b>${esc(v.value)}</b></div>`).join('');tip.hidden=false;
 tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,x+14))+'px';tip.style.top=Math.max(8,Math.min(innerHeight-tip.offsetHeight-8,y+14))+'px';}catch{tip.hidden=true;}}
document.addEventListener('pointermove',e=>{const el=e.target.closest?.('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else $('#tip').hidden=true;});
document.addEventListener('focusin',e=>{const el=e.target.closest?.('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.right,r.top);}else $('#tip').hidden=true;});
window.addEventListener('scroll',()=>{$('#tip').hidden=true;},{passive:true});
// a link shared to the app (from a phone's share menu, ?url=… or ?text=…, or …/#add=…) is looked up straight away
function linkFromShare(){const q=new URLSearchParams(location.search),h=location.hash.match(/^#(?:add|import|url)=(.+)$/);let u=q.get('url')||(q.get('text')||'').match(/https?:\/\/\S+/)?.[0]||'';
 if(!u&&h){try{u=decodeURIComponent(h[1]);}catch{}}if(!u)return false;history.replaceState(null,'',location.pathname);screen='import';render();findBooks(u);return true;}

/* ---------- start ---------- */
document.querySelectorAll('[data-action="prev"]').forEach(b=>b.innerHTML=ico('left'));document.querySelectorAll('[data-action="next"]').forEach(b=>b.innerHTML=ico('right'));
$('.mobile-menu').innerHTML=ico('menu');$('.topbar [data-go="guide"]').innerHTML=ico('help')+'<span>Guide</span>';$('.topbar [data-action="backup"]').innerHTML=ico('down')+'<span>Back up</span>';$('.topbar [data-action="add"]').innerHTML=ico('plus')+'<span>Add book</span>';
$('#rail-note').innerHTML=CONFIG.railNote;$('#rail-version').textContent=`${CONFIG.tagline} · v${CONFIG.version}${DL?' · download edition':''}`;
Promise.all([load(),initFolder()]).then(()=>{render();renderInstall();if(!linkFromShare())startupPrompt();});
window.addEventListener('hashchange',linkFromShare);
</script>
