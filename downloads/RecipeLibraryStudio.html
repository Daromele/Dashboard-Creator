<script>// Runs before first paint: apply the saved theme so the page never flashes the wrong colours.
// (The source of truth for settings is IndexedDB; this is only a fast mirror in localStorage.)
(function () {
  var colors = { mono: '#ffffff', sage: '#f4f7f3', blush: '#fdf6f6', cream: '#fbf6ea', blue: '#f4f7fa' };
  try {
    var t = localStorage.getItem('rls_theme');
    if (t && colors[t]) {
      document.documentElement.setAttribute('data-theme', t);
      var meta = document.querySelector('meta[name="theme-color"]');
      if (meta) meta.setAttribute('content', colors[t]);
    }
  } catch (e) { /* storage blocked: default theme (Mono) stays */ }
})();
</script>

/* ---- Tokens ---------------------------------------------------------------------- */
:root {
  --font-body: 'Montserrat', system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
  --font-head: 'Playfair Display', Georgia, 'Times New Roman', serif;

  --radius: 14px;
  --radius-sm: 10px;
  --radius-pill: 999px;
  --tap: 44px;
  --nav-h: 64px;
  --sidebar-w: 256px;
  --content-max: 1240px;
  --safe-bottom: env(safe-area-inset-bottom, 0px);

  --shadow-sm: 0 1px 2px rgb(0 0 0 / 0.06);
  --shadow: 0 1px 2px rgb(0 0 0 / 0.05), 0 6px 18px rgb(0 0 0 / 0.07);
  --shadow-lg: 0 18px 50px rgb(0 0 0 / 0.22);

  /* semantic (same in every theme; all pass 4.5:1 on the surfaces below) */
  --danger: #b3261e;
  --danger-soft: #fbeae8;
  --success: #1e6b3a;
  --success-soft: #e6f3ea;
  --warn-soft: #fff4d6;
  --warn-text: #5c4300;

  color-scheme: light;
}

/* Mono (default) */
:root, [data-theme='mono'] {
  --bg: #f6f6f6;
  --surface: #ffffff;
  --surface-2: #efefef;
  --text: #161616;
  --muted: #5a5a5a;
  --border: #d8d8d8;
  --accent: #161616;
  --accent-fg: #ffffff;
  --accent-soft: #ebebeb;
  --accent-strong: #000000;
}
[data-theme='sage'] {
  --bg: #f3f6f2; --surface: #ffffff; --surface-2: #e9efe9; --text: #1c2a22; --muted: #52635a; --border: #d2ddd4;
  --accent: #3f6150; --accent-fg: #ffffff; --accent-soft: #e1ebe4; --accent-strong: #2f4a3d;
}
[data-theme='blush'] {
  --bg: #fbf4f4; --surface: #ffffff; --surface-2: #f6e9eb; --text: #2b1d21; --muted: #6a5358; --border: #ead6da;
  --accent: #8f3f57; --accent-fg: #ffffff; --accent-soft: #f6e3e7; --accent-strong: #762f45;
}
[data-theme='cream'] {
  --bg: #faf5e9; --surface: #fffdf8; --surface-2: #f2e9d3; --text: #2a2218; --muted: #645847; --border: #e6dcc6;
  --accent: #7a4e22; --accent-fg: #ffffff; --accent-soft: #f1e6cd; --accent-strong: #5f3a15;
}
[data-theme='blue'] {
  --bg: #f3f6f9; --surface: #ffffff; --surface-2: #e7edf3; --text: #1b2733; --muted: #506377; --border: #d3dde7;
  --accent: #3d5a75; --accent-fg: #ffffff; --accent-soft: #e0e9f1; --accent-strong: #2c4761;
}

/* ---- Reset & base ------------------------------------------------------------------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  min-height: 100vh;
  min-height: 100dvh;
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-body);
  font-size: 1rem;
  line-height: 1.55;
  overflow-x: hidden;
  -webkit-tap-highlight-color: transparent;
}
body.modal-open { overflow: hidden; }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h1, .page-title, .recipe-title, .empty-title, .failure-title, .brand-name { font-family: var(--font-head); font-weight: 600; letter-spacing: -0.01em; }
h2 { font-family: var(--font-head); font-weight: 600; }
h3 { font-weight: 600; }
p { margin: 0; }
a { color: inherit; text-underline-offset: 3px; }
img, svg { max-width: 100%; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
ul, ol { margin: 0; padding: 0; }
hr { border: 0; border-top: 1px solid var(--border); margin: 8px 0; }
[hidden] { display: none !important; }

:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
.btn:focus-visible, .icon-btn:focus-visible, .chip:focus-visible { outline-offset: 3px; }

.sr-only {
  position: absolute !important; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0, 0, 0, 0); white-space: nowrap; border: 0;
}
.skip-link {
  position: absolute; left: 12px; top: -60px; z-index: 1000; background: var(--accent); color: var(--accent-fg);
  padding: 10px 16px; border-radius: var(--radius-sm); text-decoration: none; font-weight: 600;
}
.skip-link:focus { top: 12px; }
.muted { color: var(--muted); }
.fineprint { color: var(--muted); font-size: 0.8125rem; line-height: 1.5; display: flex; gap: 6px; align-items: flex-start; }
.fineprint .icon { flex: none; margin-top: 3px; }
.rule { margin: 12px 0; }
.center { justify-content: center; text-align: center; }
.icon { flex: none; vertical-align: middle; }

.boot-screen { display: grid; place-items: center; min-height: 60vh; color: var(--muted); }
.fatal { max-width: 520px; margin: 14vh auto; padding: 0 20px; display: grid; gap: 14px; }
.fatal h1 { font-size: 1.75rem; }

/* ---- Layout shell ------------------------------------------------------------------------ */
.app { min-height: 100vh; min-height: 100dvh; }
.app-main { min-width: 0; padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 24px); }
#main { outline: none; padding: 16px 16px 24px; max-width: var(--content-max); margin: 0 auto; }
body.has-bulk-bar #main { padding-bottom: 96px; }

.sidebar { display: none; }

.topbar {
  position: sticky; top: 0; z-index: 30; display: flex; align-items: center; gap: 10px;
  padding: 10px 16px; padding-top: calc(10px + env(safe-area-inset-top, 0px));
  background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--border);
}
.brand { display: inline-flex; align-items: center; gap: 10px; text-decoration: none; color: var(--text); }
.brand-compact { flex: 1; min-width: 0; }
.brand-compact .brand-name { font-size: 1.125rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-mark { display: grid; place-items: center; width: 36px; height: 36px; border-radius: 10px; background: var(--accent); color: var(--accent-fg); }
.offline-pill {
  display: inline-flex; align-items: center; gap: 4px; font-size: 0.75rem; font-weight: 600; padding: 4px 10px;
  border-radius: var(--radius-pill); background: var(--warn-soft); color: var(--warn-text); border: 1px solid #e8d48a;
}
.topbar-settings { flex: none; }

.banner-region { max-width: var(--content-max); margin: 0 auto; padding: 0 16px; display: grid; gap: 8px; }
.banner-region:not(:empty) { padding-top: 12px; }
.banner {
  display: flex; align-items: center; gap: 10px; flex-wrap: wrap; padding: 10px 14px; border-radius: var(--radius-sm);
  background: var(--accent-soft); border: 1px solid var(--border); font-size: 0.9375rem;
}
.banner-warn { background: var(--warn-soft); border-color: #e8d48a; color: var(--warn-text); }
.banner-text { flex: 1 1 220px; min-width: 0; }
.banner-actions { display: inline-flex; gap: 8px; flex-wrap: wrap; }

/* bottom navigation (phones/tablets) */
.bottom-nav {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; display: grid; grid-template-columns: repeat(5, 1fr);
  height: calc(var(--nav-h) + var(--safe-bottom)); padding-bottom: var(--safe-bottom);
  background: var(--surface); border-top: 1px solid var(--border); box-shadow: 0 -4px 20px rgb(0 0 0 / 0.05);
}
.nav-link { text-decoration: none; color: var(--muted); position: relative; }
.nav-bottom {
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-width: 0;
  font-size: 0.6875rem; font-weight: 600; padding: 6px 2px;
}
.nav-bottom .nav-label { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.nav-link[aria-current='page'] { color: var(--text); }
.nav-bottom[aria-current='page'] .nav-icon { background: var(--accent); color: var(--accent-fg); }
.nav-bottom .nav-icon { display: grid; place-items: center; width: 44px; height: 28px; border-radius: var(--radius-pill); transition: background 0.15s; }
.nav-badge {
  position: absolute; top: 4px; left: calc(50% + 8px); min-width: 18px; height: 18px; padding: 0 5px; display: grid; place-items: center;
  border-radius: var(--radius-pill); background: var(--danger); color: #fff; font-size: 0.6875rem; font-weight: 700; line-height: 1;
}

.timer-tray {
  position: fixed; left: 8px; right: 8px; bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px); z-index: 45; display: grid; gap: 8px; pointer-events: none;
}
.timer-tray > * { pointer-events: auto; }
.timer-chip {
  display: grid; grid-template-columns: 1fr auto; grid-template-areas: 'info clock' 'actions actions'; gap: 6px 12px; align-items: center;
  padding: 10px 14px; background: var(--accent); color: var(--accent-fg); border-radius: var(--radius); box-shadow: var(--shadow-lg);
}
.timer-chip.is-done { background: var(--success); animation: pulse 1.2s ease-in-out 3; }
.timer-info { grid-area: info; display: grid; min-width: 0; }
.timer-name { font-weight: 700; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer-recipe { font-size: 0.75rem; opacity: 0.85; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.timer-clock { grid-area: clock; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.timer-actions { grid-area: actions; display: flex; gap: 8px; justify-content: flex-end; }
.timer-chip .btn { background: rgb(255 255 255 / 0.16); color: inherit; border-color: rgb(255 255 255 / 0.4); }
.timer-chip.is-done .btn { background: #fff; color: var(--success); }
.timer-chip .icon-btn { color: inherit; }
@keyframes pulse { 50% { transform: scale(1.015); } }

body.is-cooking .bottom-nav, body.is-cooking .topbar, body.is-cooking .sidebar { display: none; }
body.is-cooking .app-main { padding-bottom: 0; }
body.is-cooking .timer-tray { bottom: calc(var(--safe-bottom) + 96px); z-index: 70; }

@media (min-width: 900px) {
  .app { display: grid; grid-template-columns: var(--sidebar-w) minmax(0, 1fr); }
  .sidebar {
    display: flex; flex-direction: column; gap: 20px; position: sticky; top: 0; height: 100vh; height: 100dvh; padding: 24px 16px;
    background: var(--surface); border-right: 1px solid var(--border);
  }
  .sidebar .brand { padding: 0 8px; }
  .sidebar .brand-name { font-size: 1.125rem; line-height: 1.2; }
  .side-nav { display: grid; gap: 4px; }
  .nav-side {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: var(--radius-sm); font-weight: 600; min-height: var(--tap);
  }
  .nav-side:hover { background: var(--surface-2); color: var(--text); }
  .nav-side[aria-current='page'] { background: var(--accent); color: var(--accent-fg); }
  .nav-side .nav-icon { display: grid; place-items: center; }
  .nav-side .nav-badge { position: static; margin-left: auto; }
  .sidebar-foot { margin-top: auto; padding: 0 8px; font-size: 0.8125rem; color: var(--muted); }
  .topbar, .bottom-nav { display: none; }
  .app-main { padding-bottom: 32px; }
  #main { padding: 32px 32px 40px; }
  .banner-region { padding: 0 32px; }
  .banner-region:not(:empty) { padding-top: 16px; }
  .timer-tray { left: auto; right: 24px; bottom: 24px; width: 360px; }
}

/* ---- Buttons & controls ------------------------------------------------------------------------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: var(--tap); padding: 10px 18px;
  border-radius: var(--radius-pill); border: 1.5px solid transparent; font-weight: 600; font-size: 0.9375rem; line-height: 1.2;
  text-decoration: none; background: transparent; transition: background 0.12s, border-color 0.12s, transform 0.05s;
  -webkit-user-select: none; user-select: none; text-align: center;
}
.btn:active:not(:disabled) { transform: scale(0.98); }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary { background: var(--accent); color: var(--accent-fg); }
.btn-primary:hover:not(:disabled) { background: var(--accent-strong); }
.btn-secondary { background: var(--surface); color: var(--text); border-color: var(--border); }
.btn-secondary:hover:not(:disabled) { border-color: var(--text); }
.btn-ghost { color: var(--text); }
.btn-ghost:hover:not(:disabled) { background: var(--surface-2); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover:not(:disabled) { filter: brightness(0.92); }
.btn-sm { min-height: 36px; padding: 6px 12px; font-size: 0.8125rem; }
.btn-lg { min-height: 52px; padding: 12px 24px; font-size: 1rem; }
.btn-xl { min-height: 64px; padding: 14px 28px; font-size: 1.125rem; flex: 1; }
.btn-tool { min-height: 40px; padding: 8px 12px; font-size: 0.8125rem; gap: 6px; }
.btn-tool.is-active { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.btn-fav.is-on { background: var(--accent-soft); border-color: var(--accent); }
.btn-fav.is-on .icon { fill: currentColor; }
.btn-block-mobile { width: 100%; }
.button-row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.count-badge {
  display: inline-grid; place-items: center; min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--radius-pill);
  background: var(--accent); color: var(--accent-fg); font-size: 0.75rem; font-weight: 700;
}
.btn-tool.is-active .count-badge, .btn-primary .count-badge { background: var(--accent-fg); color: var(--accent); }
.count-badge-lg { min-width: 28px; height: 28px; font-size: 0.875rem; }

.icon-btn {
  display: inline-grid; place-items: center; width: var(--tap); height: var(--tap); border-radius: 50%; border: 1.5px solid transparent;
  background: transparent; color: var(--text); text-decoration: none; flex: none;
}
.icon-btn:hover:not(:disabled) { background: var(--surface-2); }
.icon-btn:disabled { opacity: 0.35; cursor: not-allowed; }
.icon-btn-secondary { background: var(--surface); border-color: var(--border); }
.link-btn { background: none; border: 0; padding: 4px 2px; color: var(--text); text-decoration: underline; text-underline-offset: 3px; font-weight: 600; min-height: 32px; }

.input, .select {
  width: 100%; min-height: var(--tap); padding: 10px 14px; background: var(--surface); color: var(--text);
  border: 1.5px solid var(--border); border-radius: var(--radius-sm); font-size: 1rem; /* 16px: prevents iOS zoom */
}
.input:hover { border-color: #9a9a9a; }
.input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.input[aria-invalid='true'] { border-color: var(--danger); background: var(--danger-soft); }
.input-inline { width: auto; min-height: 40px; }
.textarea { resize: vertical; min-height: 96px; line-height: 1.5; }
input[type='checkbox'], input[type='radio'] { width: 22px; height: 22px; accent-color: var(--accent); flex: none; margin: 0; }
input[type='search'] { -webkit-appearance: none; appearance: none; }

.field { display: grid; gap: 6px; }
.field-label { font-weight: 600; font-size: 0.875rem; }
.req { color: var(--danger); }
.field-hint { color: var(--muted); font-size: 0.8125rem; line-height: 1.45; }
.field-error { color: var(--danger); font-size: 0.8125rem; font-weight: 600; }
.field-error::before { content: '⚠ '; content: '⚠ ' / ''; }
.fieldset { border: 0; padding: 0; margin: 0; display: grid; gap: 8px; min-width: 0; }
.check-row { display: flex; align-items: flex-start; gap: 12px; padding: 6px 0; min-height: var(--tap); cursor: pointer; }
.check-row span { padding-top: 1px; }
.check-hint { display: block; color: var(--muted); font-size: 0.8125rem; }
.check-list { display: grid; gap: 2px; }
.inline-form { display: flex; gap: 8px; align-items: stretch; }
.inline-form .input { flex: 1; }
.stack { display: grid; gap: 12px; min-width: 0; }
.stack-lg { display: grid; gap: 20px; min-width: 0; }
.grid-3 { display: grid; gap: 12px; grid-template-columns: repeat(3, minmax(0, 1fr)); }
@media (max-width: 480px) { .grid-3 { grid-template-columns: 1fr 1fr; } .grid-3 .field:first-child { grid-column: 1 / -1; } }

/* chips, segmented, badges */
.chip-row { display: flex; gap: 8px; overflow-x: auto; padding: 4px 2px 8px; margin: 0 -2px; scrollbar-width: none; -webkit-overflow-scrolling: touch; }
.chip-row::-webkit-scrollbar { display: none; }
.chip-row.wrap { flex-wrap: wrap; overflow: visible; }
.chip {
  display: inline-flex; align-items: center; gap: 6px; flex: none; min-height: 38px; padding: 6px 14px; border-radius: var(--radius-pill);
  background: var(--surface); color: var(--text); border: 1.5px solid var(--border); font-size: 0.875rem; font-weight: 600; text-decoration: none; white-space: nowrap;
}
.chip:hover { border-color: var(--text); }
.chip.is-selected { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.chip.is-selected::before { content: '✓'; content: '✓' / ''; font-size: 0.75rem; } /* decorative: aria-pressed carries the state */
.chip-count { font-size: 0.75rem; opacity: 0.85; }
.chip-link { min-height: 34px; font-weight: 500; }

.segmented { display: inline-flex; background: var(--surface-2); border-radius: var(--radius-pill); padding: 4px; gap: 2px; max-width: 100%; flex-wrap: wrap; }
.seg { min-height: 38px; padding: 6px 16px; border: 0; background: transparent; border-radius: var(--radius-pill); font-weight: 600; font-size: 0.875rem; color: var(--muted); }
.seg.is-selected { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); outline: 1.5px solid var(--text); outline-offset: -1.5px; }

.badge { display: inline-flex; align-items: center; padding: 2px 10px; border-radius: var(--radius-pill); font-size: 0.6875rem; font-weight: 700; letter-spacing: 0.02em; text-transform: uppercase; background: var(--surface-2); color: var(--text); border: 1px solid var(--border); }
.badge-sample { background: var(--warn-soft); color: var(--warn-text); border-color: #e8d48a; }
.badge-inbox { background: var(--accent); color: var(--accent-fg); border-color: var(--accent); }
.badge-row { display: flex; gap: 6px; flex-wrap: wrap; }
.badge-row:empty { display: none; }

/* stars */
.stars { display: inline-flex; gap: 2px; }
.star-btn { width: 40px; height: 40px; display: grid; place-items: center; border: 0; background: transparent; color: var(--muted); border-radius: 50%; }
.star-btn .icon { fill: none; }
.star-btn.is-on { color: var(--text); }
.star-btn.is-on .icon { fill: currentColor; }
.star-btn:hover { color: var(--text); }
.stars-static { display: inline-flex; gap: 1px; }
.star-on { color: var(--text); } .star-on .icon { fill: currentColor; }
.star-off { color: var(--border); }
.rating-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.rating-label { font-size: 0.875rem; font-weight: 600; }

/* ---- Page header & common sections ------------------------------------------------------------------- */
.view { display: grid; gap: 16px; align-content: start; min-width: 0; }
.page-header { display: grid; gap: 8px; margin-bottom: 4px; }
.page-header-row { display: flex; gap: 12px 16px; align-items: flex-end; justify-content: space-between; flex-wrap: wrap; }
.page-header-text { min-width: 0; flex: 1 1 240px; }
.page-title { font-size: clamp(1.75rem, 5vw, 2.5rem); }
.page-subtitle { color: var(--muted); margin-top: 4px; }
.page-actions { display: flex; gap: 8px; flex-wrap: wrap; }
.back-link { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; font-size: 0.875rem; color: var(--muted); text-decoration: none; min-height: 32px; }
.back-link:hover { color: var(--text); }
.card-section { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow-sm); min-width: 0; }
.section-title { font-size: 1.25rem; }
.section-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.subsection-title { font-size: 1rem; font-family: var(--font-body); font-weight: 700; }
.callout { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--radius-sm); background: var(--accent-soft); border: 1px solid var(--border); }
.callout > .icon { margin-top: 3px; }
.callout p { margin: 2px 0 0; font-size: 0.9375rem; }
.callout-warn { background: var(--warn-soft); border-color: #e8d48a; color: var(--warn-text); }
.callout-actions { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.plain-list { display: grid; gap: 8px; padding-left: 20px; }
.summary-list { display: grid; gap: 4px; padding-left: 20px; }
.kv-list { display: grid; gap: 8px; margin: 0; }
.kv { display: grid; grid-template-columns: minmax(120px, 0.6fr) 1fr; gap: 8px; }
.kv dt { color: var(--muted); font-size: 0.875rem; } .kv dd { margin: 0; font-weight: 500; }
@media (max-width: 480px) { .kv { grid-template-columns: 1fr; gap: 0; } }

.empty-state { display: grid; justify-items: center; text-align: center; gap: 10px; padding: 48px 20px; max-width: 560px; margin: 0 auto; }
.empty-icon { display: grid; place-items: center; width: 72px; height: 72px; border-radius: 50%; background: var(--accent-soft); color: var(--text); }
.empty-title { font-size: 1.5rem; }
.empty-text { color: var(--muted); }
.empty-actions { display: flex; gap: 10px; flex-wrap: wrap; justify-content: center; margin-top: 8px; }

.spinner { display: inline-block; width: 22px; height: 22px; border: 3px solid var(--border); border-top-color: var(--accent); border-radius: 50%; animation: spin 0.8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* ---- Library ----------------------------------------------------------------------------------------- */
.search-box { position: relative; display: flex; align-items: center; }
.search-icon { position: absolute; left: 14px; color: var(--muted); pointer-events: none; }
.search-input {
  width: 100%; min-height: 48px; padding: 10px 44px 10px 44px; border: 1.5px solid var(--border); border-radius: var(--radius-pill);
  background: var(--surface); font-size: 1rem;
}
.search-input:focus-visible { outline: 3px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
.search-box .icon-btn { position: absolute; right: 2px; }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
.result-count { color: var(--muted); font-size: 0.875rem; min-height: 1.3em; }

.recipe-grid { display: grid; gap: 16px; grid-template-columns: 1fr; }
@media (min-width: 560px) { .recipe-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (min-width: 820px) { .recipe-grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (min-width: 1140px) { .recipe-grid { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
@media (min-width: 1500px) { .recipe-grid { grid-template-columns: repeat(5, minmax(0, 1fr)); } }

.recipe-card { position: relative; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-sm); overflow: hidden; transition: box-shadow 0.15s, transform 0.15s; content-visibility: auto; contain-intrinsic-size: auto 300px; }

.cook-top { display: flex; align-items: center; gap: 6px; padding: 8px 10px; border-bottom: 2px solid #0b0b0b; flex: none; flex-wrap: wrap; }
.cook-top .btn-ghost, .cook-top .icon-btn { color: #0b0b0b; }
.cook-title { flex: 1 1 140px; min-width: 0; font-size: 1.0625rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-family: var(--font-head); }
.cook-tools { display: flex; gap: 2px; align-items: center; flex-wrap: wrap; }
.cook-tools .icon-btn[aria-pressed='true'] { background: #0b0b0b; color: #fff; }
.cook-meta { padding: 10px 16px 0; display: grid; gap: 8px; flex: none; }
.cook-step-label { font-weight: 700; font-size: 1.125rem; letter-spacing: 0.02em; }
.cook-progress { height: 8px; background: #e0e0e0; border-radius: 4px; overflow: hidden; }
.cook-progress-bar { height: 100%; background: #0b0b0b; width: 0; transition: width 0.25s; }
.cook-stage { flex: 1 1 auto; overflow-y: auto; padding: 20px 20px 16px; display: flex; flex-direction: column; justify-content: center; gap: 18px; outline: none; max-width: 900px; width: 100%; margin: 0 auto; }
.cook-section { font-size: 0.875rem; letter-spacing: 0.1em; text-transform: uppercase; font-weight: 700; color: #444; }
.cook-text { font-size: calc(1.75rem * var(--cook-scale)); line-height: 1.4; font-weight: 500; overflow-wrap: anywhere; }
@media (min-width: 900px) { .cook-text { font-size: calc(2.25rem * var(--cook-scale)); } }
.cook-timers { display: flex; flex-wrap: wrap; gap: 10px; }
.cook-timer-btn { border-color: #0b0b0b; }
.cook-note { padding: 0 20px; font-size: 0.875rem; color: #444; text-align: center; }
.cook-nav { display: flex; gap: 12px; padding: 12px 16px calc(14px + var(--safe-bottom)); border-top: 2px solid #0b0b0b; flex: none; background: #fff; }
.cook .btn-primary { background: #0b0b0b; color: #fff; }
.cook .btn-secondary { border-color: #0b0b0b; color: #0b0b0b; background: #fff; }
.cook-sheet .ingredient label { font-size: 1.125rem; }

/* ---- Print ---------------------------------------------------------------------------------------------------------------------------------- */
@media screen { .print-root { display: none; } }
@media print {
  body { background: #fff; color: #000; overflow: visible; }
  #app, .toast-region, .skip-link, dialog, .timer-tray, noscript { display: none !important; }
  .print-root { display: block !important; }
  .print-recipe { font-family: var(--font-body); color: #000; }
  .print-title { font-family: var(--font-head); font-size: 26pt; margin: 0 0 6pt; }
  .print-meta { display: flex; gap: 14pt; flex-wrap: wrap; font-size: 10pt; margin: 0 0 10pt; }
  .print-recipe h2 { font-family: var(--font-head); font-size: 14pt; border-bottom: 1pt solid #000; padding-bottom: 2pt; margin: 14pt 0 6pt; }
  .print-recipe h3 { font-size: 11pt; margin: 8pt 0 3pt; }
  .print-ingredients { list-style: none; padding: 0; margin: 0; font-size: 11pt; line-height: 1.45; }
  .print-ingredients li { padding: 2pt 0 2pt 14pt; position: relative; break-inside: avoid; }
  .print-ingredients li::before { content: '☐'; position: absolute; left: 0; }
  .print-steps ol { padding-left: 18pt; margin: 0; font-size: 11pt; line-height: 1.5; }
  .print-steps li { margin-bottom: 5pt; break-inside: avoid; }
  .print-desc { font-size: 11pt; margin: 0 0 8pt; }
  .print-photo { width: 100%; max-height: 3.2in; object-fit: cover; margin-bottom: 10pt; border-radius: 4pt; }
  .print-notes { margin-top: 12pt; padding: 8pt; border: 1pt solid #999; font-size: 10.5pt; break-inside: avoid; white-space: pre-wrap; }
  .print-source { margin-top: 14pt; font-size: 8.5pt; color: #333; word-break: break-all; }
  .print-card { border: 1.5pt solid #000; padding: 14pt; border-radius: 6pt; }
  .print-card .print-title { font-size: 20pt; }
  .print-card .print-columns { display: grid; grid-template-columns: 0.42fr 0.58fr; gap: 18pt; }
  .print-card .print-ingredients, .print-card .print-steps ol { font-size: 10pt; }
  @page { margin: 0.6in; }
}

/* ---- Motion preferences ------------------------------------------------------------------------------------------------------------------------- */
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
}
@media (forced-colors: active) {
  .chip.is-selected, .seg.is-selected, .btn-primary { outline: 2px solid CanvasText; }
}
