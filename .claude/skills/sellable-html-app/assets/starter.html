*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.55 var(--ui);-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
button:disabled{opacity:.4;cursor:not-allowed}
a{color:var(--accent);text-underline-offset:3px}
h1,h2,h3,p{margin:0}
h1,h2,h3{font-family:var(--num);letter-spacing:-.02em;line-height:1.18;text-wrap:balance}
h1{font-size:clamp(26px,3vw,32px);font-weight:700}
h2{font-size:17px;font-weight:700}
h3{font-size:14px;font-weight:700}
small,.small{font-size:12px}
svg{width:18px;height:18px;stroke-width:1.6;flex-shrink:0}
.i{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round}
button:focus-visible,a:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-xs)}
input:focus-visible,select:focus-visible,textarea:focus-visible{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
[hidden]{display:none!important}
.sr-only{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:200;background:var(--pop);color:var(--pop-ink);padding:8px 12px;border-radius:8px;font-weight:600}.skip:focus{left:10px}

/* ---------- frame: rail + main ---------- */
.app{display:grid;grid-template-columns:var(--rail) minmax(0,1fr);min-height:100vh;transition:grid-template-columns .2s ease}
.main{min-width:0}
.rail{background:var(--bold-2);color:var(--on-bold);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:var(--s6) var(--s3) var(--s5);overflow-y:auto;z-index:40;transition:padding .2s ease}
.brand{display:flex;gap:var(--s3);align-items:center;padding:var(--s1) 48px var(--s7) var(--s2);position:relative}
.brand-mark{height:34px;width:34px;flex:0 0 34px;display:grid;place-items:center;border-radius:var(--r-sm);background:var(--pop);color:var(--pop-ink);font:800 17px var(--num)}
.brand-txt{min-width:0}
.brand b{display:block;font:700 16px var(--num);letter-spacing:-.02em;line-height:1.2}
.brand small{font-size:9px;letter-spacing:.16em;color:var(--on-bold-dim)}
.navgroup{font-size:10px;text-transform:uppercase;letter-spacing:.14em;padding:var(--s5) var(--s3) var(--s2);color:var(--on-bold-dim);font-weight:600}
.navlink{width:100%;display:flex;align-items:center;gap:var(--s3);min-height:40px;padding:var(--s2) var(--s3);color:var(--on-bold-dim);border-radius:var(--r-sm);text-align:left;font-size:14px;position:relative;transition:background .13s,color .13s,padding .2s}
.navlink:hover{background:#ffffff0f;color:var(--on-bold)}
.navlink[aria-current=page]{background:#ffffff16;color:var(--on-bold);font-weight:600}
.navlink[aria-current=page]:before{content:'';position:absolute;left:calc(var(--s3)*-1);top:50%;transform:translateY(-50%);width:3px;height:18px;background:var(--pop);border-radius:0 3px 3px 0}
.navlink svg{opacity:.85}
.rail-foot{margin-top:auto;padding:var(--s6) var(--s2) 0;color:var(--on-bold-dim);font-size:11px;display:grid;gap:var(--s2)}
.rail-foot a{color:var(--on-bold-dim);text-decoration:none}.rail-foot a:hover{color:var(--on-bold)}
.rail-note{border:1px solid #ffffff1f;border-radius:var(--r-md);padding:var(--s3);font-size:12px;line-height:1.5}
.rail-note b{display:block;color:var(--pop);margin-bottom:var(--s1)}
.rail-demo{width:100%;background:#ffffff14;border-color:#ffffff26;color:var(--on-bold);justify-content:center}
.rail-demo:hover{background:#ffffff24;color:var(--on-bold);border-color:#ffffff40}
/* collapsible rail: an icon-only 72px rail, remembered per browser */
.rail-toggle{position:absolute;right:4px;top:2px;width:34px;height:34px;display:inline-grid;place-items:center;border-radius:var(--r-xs);color:var(--on-bold);background:#ffffff0d;border:1px solid #ffffff26}
.rail-toggle:hover{background:#ffffff1d}
.app.rail-min{grid-template-columns:72px minmax(0,1fr)}
.app.rail-min .rail{padding-left:10px;padding-right:10px;overflow-x:hidden}
.app.rail-min .brand{flex-direction:column;align-items:center;gap:10px;padding:0 0 20px}
.app.rail-min .brand-txt,.app.rail-min .navgroup,.app.rail-min .rail-foot,.app.rail-min .navlink span{display:none}
.app.rail-min .rail-toggle{position:static;width:38px;height:38px}
.app.rail-min .rail-toggle svg{transform:scaleX(-1)}
.app.rail-min .navlink{justify-content:center;padding:10px;gap:0}
.app.rail-min .navlink[aria-current=page]:before{left:-10px}
.app.rail-min .navlink svg{width:21px;height:21px}
.mobile-close,.mobile-menu,.scrim{display:none!important}   /* !important: .ibtn below sets display */
.status{font-size:11px;color:var(--ink-3);display:inline-flex;align-items:center;gap:var(--s1);white-space:nowrap}
.status:before{content:'';width:6px;height:6px;border-radius:50%;background:var(--ok)}
.status.warn:before{background:var(--over)}
.rail .status{color:var(--on-bold-dim)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:0;z-index:20;background:var(--paper)}
.topbar-in{display:flex;justify-content:space-between;align-items:center;gap:var(--s4);max-width:1400px;padding:var(--s3) var(--s7);margin:auto}
.top-left,.actions{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap}
.top-left{flex-wrap:nowrap;min-width:0}
.month-control{display:flex;align-items:center;gap:2px;border:1px solid var(--rule-2);border-radius:var(--r-sm);padding:3px;background:var(--card);transition:border-color .13s,box-shadow .13s}
.month-control:hover,.month-control:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.period-label{font:650 16px/1 var(--num);letter-spacing:-.02em;white-space:nowrap;padding:0 var(--s2)}
/* a native month input shrunk to a calendar glyph painted in the theme accent */
.month-picker{width:28px;height:28px;min-height:28px;padding:0;border:0;color:transparent;background:var(--accent);cursor:pointer;position:relative;opacity:.8;
 -webkit-mask:var(--cal-icon) center/17px 17px no-repeat;mask:var(--cal-icon) center/17px 17px no-repeat}
.month-picker:hover{opacity:1}
.month-picker::-webkit-calendar-picker-indicator{opacity:0;position:absolute;inset:0;width:100%;height:100%;cursor:pointer}
.ibtn{width:32px;height:32px;display:inline-grid;place-items:center;border-radius:var(--r-xs);color:var(--ink-2);transition:background .13s,color .13s}
.ibtn:hover{background:var(--accent-soft);color:var(--accent)}
.picker{display:flex;flex-direction:column;margin-left:var(--s3)}
.picker small{font-size:10px;color:var(--ink-3);text-transform:uppercase;letter-spacing:.1em}
.picker select{height:34px;min-height:34px;border-radius:var(--r-sm);max-width:200px;font-weight:600;padding:0 var(--s3)}
.banner{display:flex;justify-content:space-between;gap:var(--s3);align-items:center;padding:var(--s2) var(--s7);font-size:12.5px}
.banner .actions{flex-wrap:nowrap}.banner .link,.banner .btn{white-space:nowrap}
.banner.demo{background:var(--sunk);color:var(--ink-2);border-top:1px solid var(--rule)}
.banner.backup{background:var(--flag-soft);color:var(--ink)}.banner.backup b{color:var(--flag)}
.banner.storage{background:color-mix(in srgb,var(--over) 10%,var(--card));color:var(--ink)}.banner.storage b{color:var(--over)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);min-height:36px;padding:var(--s2) var(--s3);border:1px solid var(--rule-2);background:var(--card);color:var(--ink);border-radius:var(--r-sm);font-weight:600;font-size:13px;white-space:nowrap;text-decoration:none;transition:background .13s,border-color .13s,color .13s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:var(--shadow-sm)}
.btn.primary:hover{filter:brightness(1.12);color:var(--accent-ink)}
.btn.pop{background:var(--pop);border-color:var(--pop);color:var(--pop-ink)}.btn.pop:hover{filter:brightness(1.06);color:var(--pop-ink)}
.btn.ghost{background:transparent;border-color:#ffffff40;color:var(--on-bold)}.btn.ghost:hover{background:#ffffff14;color:var(--on-bold)}
.btn.quiet{background:transparent;color:var(--ink-2)}
.btn.danger{color:var(--over)}.btn.danger:hover{background:color-mix(in srgb,var(--over) 8%,var(--card));border-color:var(--over);color:var(--over)}
.btn.small{min-height:30px;padding:var(--s1) var(--s2);font-size:12px}
.link{color:var(--accent);font-size:13px;font-weight:600;border-bottom:1px solid var(--accent-line);cursor:pointer}
.icon-action{width:30px;height:30px;display:inline-grid;place-items:center;border-radius:var(--r-xs);color:var(--ink-3)}
.icon-action:hover{background:var(--accent-soft);color:var(--accent)}.icon-action.danger:hover{color:var(--over)}
.icon-action svg{width:17px;height:17px}

/* ---------- page ---------- */
.page{max-width:1400px;padding:var(--s6) var(--s7) var(--s8);margin:auto}
.pagehead{display:flex;justify-content:space-between;gap:var(--s5);align-items:center;margin-bottom:var(--s6);flex-wrap:wrap}
.pagehead-text{min-width:0;flex:1 1 320px}
.eyebrow{font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;color:var(--ink-3);margin-bottom:var(--s2)}
.subtitle{color:var(--ink-2);font-size:14px;margin-top:var(--s2);max-width:62ch}
.number{font-family:var(--num);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--ink-2)}.dim{color:var(--ink-3)}.good{color:var(--ok)}.warn{color:var(--over)}
.segment{display:inline-flex;gap:2px;flex-wrap:wrap;background:var(--sunk);padding:2px;border-radius:var(--r-sm)}
.segment button{font-size:12px;border-radius:var(--r-xs);padding:var(--s1) var(--s3);color:var(--ink-2);min-height:28px;font-weight:600}
.segment button:hover{color:var(--accent)}
.segment button[aria-pressed=true]{background:var(--card);color:var(--accent);box-shadow:var(--shadow-sm)}
.hub-tabs{margin:0 0 var(--s5)}.hub-tabs button{font-size:13px;min-height:32px;padding:var(--s1) var(--s4)}
.custom-range{display:inline-flex;gap:var(--s2);align-items:end}
.custom-range label{display:flex;flex-direction:column;font-size:11px;color:var(--ink-3)}
.custom-range input{height:30px;min-height:30px}
.print-title{display:none}
.footer{display:flex;justify-content:space-between;gap:var(--s4);font-size:10.5px;color:var(--ink-3);margin-top:var(--s7);border-top:1px solid var(--rule);padding-top:var(--s4)}

/* ---------- pulse strip: one insight at a time, above the hero ---------- */
.pulse{display:flex;align-items:center;gap:var(--s4);background:var(--accent-soft);border-radius:var(--r-md);padding:var(--s3) var(--s4);margin-bottom:var(--s4)}
.pulse-live{flex:none;width:10px;height:10px;border-radius:50%;background:var(--accent);animation:ring 2s ease-out infinite}
.pulse-track{position:relative;flex:1;min-height:24px;font-size:14px}
.pulse-track p{position:absolute;inset:0;display:flex;align-items:center;opacity:0;transform:translateY(8px);transition:opacity .5s,transform .5s;pointer-events:none}
.pulse-track p.on{opacity:1;transform:none;pointer-events:auto}
.pulse-nav{display:flex;align-items:center;gap:6px;flex:none}
.pulse-arrow{width:28px;height:28px;border-radius:50%;border:1px solid var(--rule-2);background:var(--card);font:600 16px/1 var(--ui);display:grid;place-items:center}
.pulse-dot{width:6px;height:6px;border-radius:6px;background:var(--rule-2);padding:0;transition:width .2s}.pulse-dot[aria-pressed=true]{width:18px;background:var(--accent)}

/* ---------- hero ---------- */
.hero{background:var(--bold);color:var(--on-bold);border-radius:var(--r-lg);padding:var(--s7);display:grid;grid-template-columns:1.3fr 1fr;gap:var(--s7);margin-bottom:var(--s4);position:relative;overflow:hidden}
.hero:before{content:'';position:absolute;inset:auto -80px -140px auto;width:320px;height:320px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--pop) 35%,transparent),transparent 70%);opacity:.6;pointer-events:none}
.hero .eyebrow{color:var(--on-bold-dim)}
.hero-num{font:700 clamp(56px,8vw,104px)/1 var(--num);letter-spacing:-.04em;margin:14px 0 18px;font-variant-numeric:tabular-nums}
.hero p{color:var(--on-bold-dim);font-size:14px;max-width:48ch;line-height:1.6}.hero p b{color:var(--on-bold)}
.hero .actions{margin-top:var(--s5)}
.hero-side{border-left:1px solid #ffffff1f;padding-left:var(--s6);display:grid;align-content:center;gap:var(--s3);position:relative}
.hero-fact{display:flex;align-items:baseline;justify-content:space-between;font-size:13px;gap:var(--s3);color:var(--on-bold-dim)}
.hero-fact strong{font:650 18px var(--num);white-space:nowrap;color:var(--on-bold);font-variant-numeric:tabular-nums}
.hero-meter{height:6px;border-radius:6px;background:#ffffff1f;overflow:hidden}.hero-meter i{display:block;background:var(--ok);height:100%}

/* ---------- KPI tiles: tinted by meaning (solid), icon squares, direction colors ---------- */
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s3);margin-bottom:var(--s4)}
.kpi{background:var(--card);border-radius:var(--r-md);padding:var(--s4) var(--s5);box-shadow:var(--shadow-sm);border:1px solid transparent;animation:rise .45s ease both;animation-delay:calc(var(--i,0)*50ms);transition:transform .2s,box-shadow .2s}
.kpi:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.kpi .label{font-size:12.5px;color:var(--ink-2);display:flex;align-items:center;gap:8px;font-weight:500}
.kpi b{font:700 clamp(20px,2vw,26px)/1.1 var(--num);letter-spacing:-.03em;display:block;margin:var(--s2) 0 var(--s1);font-variant-numeric:tabular-nums}
.kpi small{color:var(--ink-3);font-size:11.5px}
.kpi.tone-pos{--tc:var(--ok);background:color-mix(in srgb,var(--ok) 11%,var(--card));border-color:color-mix(in srgb,var(--ok) 22%,var(--rule));box-shadow:none}
.kpi.tone-neg{--tc:var(--over);background:color-mix(in srgb,var(--over) 10%,var(--card));border-color:color-mix(in srgb,var(--over) 20%,var(--rule));box-shadow:none}
.kpi.tone-net{--tc:var(--accent);background:color-mix(in srgb,var(--accent) 12%,var(--card));border-color:color-mix(in srgb,var(--accent) 24%,var(--rule));box-shadow:none}
.kpi.tone-neutral{background:var(--sunk);box-shadow:none}
.kpi-ico{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;flex:none;background:color-mix(in srgb,var(--tc,var(--ink-3)) 16%,var(--card));color:var(--tc,var(--ink-2))}
.kpi-ico svg{display:block;width:14px;height:14px;stroke-width:2}
.delta{font-weight:700}.delta.up{color:var(--ok)}.delta.down{color:var(--over)}

/* ---------- surfaces ---------- */
.grid2{display:grid;grid-template-columns:1.3fr 1fr;gap:var(--s4);margin-bottom:var(--s4)}
.grid2.equal{grid-template-columns:1fr 1fr}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:var(--s4);margin-bottom:var(--s4)}
.card{background:var(--card);border-radius:var(--r-md);padding:var(--s5);min-width:0;margin-bottom:var(--s4);box-shadow:var(--shadow-sm)}
.grid2>.card,.grid3>.card{margin-bottom:0}
.cardhead{display:flex;justify-content:space-between;align-items:flex-start;gap:var(--s4);margin-bottom:var(--s4)}
.cardhead h2{display:flex;align-items:center;gap:10px}
.cardhead p{font-size:12px;color:var(--ink-3);margin-top:var(--s1)}
.h-ico{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;background:var(--accent-soft);color:var(--accent);flex:none}.h-ico svg{width:15px;height:15px;stroke-width:2}
.card-ico{height:34px;width:34px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);border-radius:var(--r-sm);margin-bottom:var(--s4)}
.sub-head{font-size:13px;margin:var(--s6) 0 var(--s2);padding-top:var(--s4);border-top:1px solid var(--rule)}
.sub-head.first{border-top:0;padding-top:0;margin-top:var(--s4)}
.table-card{padding:0;overflow:hidden}.table-card .cardhead{padding:var(--s5) var(--s5) var(--s3);margin:0}
.pill{display:inline-flex;border-radius:99px;padding:3px var(--s2);font-size:11px;color:var(--ink-2);background:var(--sunk);align-items:center;gap:var(--s1);white-space:nowrap;font-weight:600}
.pill.good{background:color-mix(in srgb,var(--ok) 12%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--over) 12%,transparent);color:var(--over)}
.row{display:flex;align-items:center;justify-content:space-between;gap:var(--s4);padding:var(--s3) 0;border-bottom:1px solid var(--rule);font-size:13px}
.row:last-child,.row.flat,.row:has(+.sub-head){border-bottom:0}.row strong{font-weight:600}.row small{display:block;color:var(--ink-3);margin-top:2px}
.notice{background:var(--accent-soft);padding:var(--s3) var(--s4);border-radius:var(--r-sm);margin-bottom:var(--s4);font-size:13px;display:flex;justify-content:space-between;gap:var(--s4);align-items:center;color:var(--ink-2)}
.notice.warning{background:var(--flag-soft);color:var(--flag)}
.notice.refused{background:color-mix(in srgb,var(--over) 10%,var(--card));color:var(--ink)}.notice.refused b:first-child{color:var(--over)}
.empty{padding:var(--s7) var(--s5);text-align:center;color:var(--ink-3);font-size:13px}
.empty svg{height:28px;width:28px;color:var(--accent);margin-bottom:var(--s3);opacity:.7}
.empty h3{color:var(--ink);margin-bottom:var(--s2)}.empty p{max-width:42ch;margin:0 auto var(--s4)}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--s3)}
.step{background:var(--sunk);padding:var(--s5);border-radius:var(--r-sm)}
.step span{font:700 11px var(--num);color:var(--accent);letter-spacing:.06em}
.step h3{margin:var(--s3) 0 var(--s2)}.step p{font-size:12.5px;color:var(--ink-2);margin-bottom:var(--s4)}

/* ---------- tables: sortable, paged ---------- */
.table-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);font-weight:700;padding:var(--s2) var(--s3);background:var(--sunk);white-space:nowrap}
td{padding:var(--s2) var(--s3);border-bottom:1px solid var(--rule);vertical-align:middle}
tbody tr:hover{background:var(--accent-soft)}
td.num,th.num{text-align:right;font-family:var(--num);font-variant-numeric:tabular-nums;white-space:nowrap}
td .clamp{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:34ch}
tr.total td{font-weight:700;border-top:1px solid var(--rule-2)}
.th-sort{cursor:pointer;user-select:none}.th-sort:hover{color:var(--accent)}
.th-sort[data-sort=desc]::after{content:' ↓';color:var(--accent)}.th-sort[data-sort=asc]::after{content:' ↑';color:var(--accent)}
.pager{display:flex;justify-content:space-between;align-items:center;padding:var(--s3) var(--s5);font-size:12px;color:var(--ink-3)}
.filters{display:flex;gap:var(--s2);flex-wrap:wrap}
.pct{display:inline-block;width:56px;height:6px;border-radius:3px;background:var(--sunk);margin-right:8px;vertical-align:middle;overflow:hidden}.pct i{display:block;height:100%;background:var(--ok)}

/* ---------- forms, dialogs, toast ---------- */
input,select,textarea{background:var(--card);border:1px solid var(--rule-2);border-radius:var(--r-xs);min-height:38px;padding:var(--s2) var(--s3);max-width:100%;transition:border-color .13s,box-shadow .13s}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:var(--s3) var(--s4)}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:600;color:var(--ink-2)}
.fields label small{font-weight:400;color:var(--ink-3);font-size:11px}
.fields .full{grid-column:1/-1}
.formfoot{display:flex;justify-content:flex-end;gap:var(--s2);margin-top:var(--s6);flex-wrap:wrap}
.error{color:var(--over);background:color-mix(in srgb,var(--over) 9%,var(--card));padding:var(--s2) var(--s3);border-radius:var(--r-xs);margin:var(--s2) 0;font-size:13px}
dialog{border:0;border-radius:var(--r-lg);padding:var(--s7);width:min(560px,calc(100% - 32px));background:var(--card);color:var(--ink);box-shadow:var(--shadow-lg)}
dialog::backdrop{background:#160c2470}
.dialog-head{display:flex;justify-content:space-between;gap:var(--s4);align-items:center;margin-bottom:var(--s2)}
.dialog-head h2{font-size:22px}
dialog .subtitle{margin:0 0 var(--s5)}
.toast{position:fixed;bottom:var(--s5);left:50%;transform:translateX(-50%);z-index:99;border-radius:var(--r-sm);padding:var(--s3) var(--s4);background:var(--bold-2);color:var(--on-bold);font-size:13px;display:flex;gap:var(--s4);align-items:center;box-shadow:var(--shadow-lg);max-width:calc(100% - 30px)}
.toast button{color:var(--pop);text-decoration:underline;font-weight:600;white-space:nowrap}
/* welcome tour: art header, step label, dots, one idea per slide */
.welcome{padding:0;width:min(600px,calc(100% - 28px));max-height:min(760px,92vh);overflow:auto}
.welcome-close{position:absolute;right:16px;top:16px;z-index:2;background:#ffffffc7}
.welcome-art{height:190px;display:grid;place-items:center;color:var(--accent);background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--pop) 34%,var(--card)))}
.welcome-art[data-n="1"]{background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--accent) 18%,var(--card)))}
.welcome-art[data-n="2"]{background:linear-gradient(145deg,var(--accent-soft),color-mix(in srgb,var(--ok) 22%,var(--card)))}
.welcome-art svg{width:80px;height:80px;stroke-width:1.25}
.welcome-body{padding:28px 34px 12px;text-align:center}
.welcome-step{display:block;color:var(--accent);font-size:10px;font-weight:750;letter-spacing:.16em;margin-bottom:10px}
.welcome-body h2{font-size:26px;margin-bottom:10px}
.welcome-body p{color:var(--ink-2);max-width:460px;margin:0 auto 8px}
.welcome-foot{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:12px 34px 28px}
.welcome-dots{display:flex;gap:8px}.welcome-dots i{width:8px;height:8px;border-radius:50%;background:var(--rule-2)}.welcome-dots i.on{background:var(--accent)}
/* settings: palette chips and sidebar switches */
.theme-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:var(--s2)}
.theme-card{border:1px solid var(--rule);border-radius:var(--r-sm);padding:var(--s2);background:var(--card);display:grid;gap:6px;text-align:left}
.theme-card:hover{border-color:var(--rule-2);box-shadow:var(--shadow-sm)}
.theme-card[aria-pressed=true]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.theme-chip{display:flex;align-items:flex-end;gap:4px;height:42px;padding:6px;border-radius:6px}
.theme-chip i{display:block;flex:1;border-radius:3px}.theme-chip i:nth-child(1){height:100%}.theme-chip i:nth-child(2){height:72%}.theme-chip i:nth-child(3){height:44%}
.theme-card b{font-size:12px;font-weight:600}
.toggle-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.nav-toggle{position:relative;cursor:pointer}
.nav-toggle input{position:absolute;opacity:0;pointer-events:none}
.nav-toggle span{min-height:52px;display:flex;align-items:center;gap:var(--s2);border:1px solid var(--rule);border-radius:var(--r-sm);padding:var(--s2) var(--s3);color:var(--ink-2);font-size:12.5px;transition:border-color .13s,background .13s}
.nav-toggle svg{width:17px;height:17px}.nav-toggle b{font-weight:650}
.nav-toggle input:checked+span{background:var(--accent-soft);border-color:var(--accent);color:var(--accent)}
.nav-toggle input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
.nav-toggle span i{margin-left:auto;width:34px;height:20px;border-radius:20px;background:var(--rule-2);padding:3px;flex:0 0 auto;transition:background .16s}
.nav-toggle span i:after{content:'';display:block;width:14px;height:14px;border-radius:50%;background:var(--card);box-shadow:0 1px 3px #0003;transition:transform .16s}
.nav-toggle input:checked+span i{background:var(--accent)}.nav-toggle input:checked+span i:after{transform:translateX(14px)}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--bold-2);color:var(--on-bold);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:12px;box-shadow:var(--shadow-lg);max-width:280px}
.tip-title{font:700 11px var(--num);letter-spacing:.04em;text-transform:uppercase;color:var(--on-bold-dim);margin-bottom:var(--s1)}
.tip-row{display:flex;align-items:center;gap:var(--s2);white-space:nowrap;line-height:1.7}.tip-row b{font:700 13px var(--num);margin-left:auto;padding-left:var(--s3)}

/* ---------- chart kit ---------- */
.kit-pie{display:grid;justify-items:center;gap:18px}.kit-pie svg{width:100%;height:auto;max-width:200px;overflow:visible}
.kit-seg{transform-origin:90px 90px;animation:kit-pop .7s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*80ms);transition:transform .2s;cursor:pointer}
.kit-seg:hover,.kit-seg:focus{transform:scale(1.045);outline:none}
.kit-cut{stroke:var(--card);stroke-width:2.5;stroke-linecap:butt}
.kit-mid{font:800 20px var(--num);fill:var(--ink);text-anchor:middle}.kit-mid-sub{font:600 9px var(--ui);letter-spacing:.08em;fill:var(--ink-3);text-anchor:middle}
.kit-key{display:grid;gap:2px;width:100%}
.kit-key-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:6px 8px;border-radius:8px;font-size:13.5px}
.kit-key-row:hover{background:var(--sunk)}.kit-key-row span{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.kit-key-row em{font-style:normal;color:var(--ink-2);font-size:12.5px}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;background:var(--accent)}
.kit-gauge{display:flex;flex-direction:column;align-items:center;text-align:center;gap:2px}.kit-gauge svg{width:100%;height:auto;max-width:200px}
.kit-gauge-track,.kit-gauge-val{fill:none;stroke-width:14;stroke-linecap:round}.kit-gauge-track{stroke:var(--sunk)}.kit-gauge-val{stroke:var(--accent);animation:kit-fill 1.1s cubic-bezier(.2,.8,.2,1) both}
.kit-gauge-num{font:800 24px var(--num);fill:var(--ink);text-anchor:middle}.kit-gauge small{color:var(--ink-3);font-size:12px}
.kit-spark{display:block;width:100%;max-width:140px;height:30px;margin:6px 0 2px}
.kit-spark polyline{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;stroke:var(--spark,var(--accent))}.kit-spark circle{fill:var(--spark,var(--accent))}
.kit-chart svg{width:100%;height:auto;overflow:visible}
.chart-grid{stroke:var(--rule);stroke-width:1}
.kit-axis{font:500 11px var(--ui);fill:var(--ink-3)}
.kit-bar{transform-box:fill-box;transform-origin:bottom;animation:kit-grow .8s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i)*40ms)}
.kit-col{cursor:pointer;outline:none}.kit-col:hover .kit-bar{filter:brightness(1.08)}
.kit-path{fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:100;animation:kit-draw 1.2s ease-out both}
.kit-dot{stroke:var(--card);stroke-width:2}
.legend{display:flex;gap:var(--s4);flex-wrap:wrap;color:var(--ink-2);font-size:12px;margin-bottom:var(--s2)}.legend span{display:inline-flex;align-items:center;gap:6px}
.tip{position:fixed;z-index:120;pointer-events:none;background:var(--bold-2);color:var(--on-bold);border-radius:var(--r-sm);padding:var(--s2) var(--s3);font-size:12px;box-shadow:var(--shadow-lg)}
.tip b{font:700 13px var(--num)}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes kit-pop{from{opacity:0;transform:scale(.55)}}
@keyframes kit-grow{from{transform:scaleY(0)}}
@keyframes kit-draw{from{stroke-dashoffset:100}}
@keyframes kit-fill{from{stroke-dasharray:0 100}}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
@keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in oklab,var(--accent) 55%,transparent)}100%{box-shadow:0 0 0 12px transparent}}

/* ---------- responsive ---------- */
@media(min-width:1550px){.page{padding-top:43px}.hero{padding:37px}.kpi{padding:24px}}
@media(max-width:1150px){.app{grid-template-columns:220px minmax(0,1fr)}.page{padding:28px 24px}.topbar-in{padding:13px 24px}.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.toggle-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:900px){
 .app,.app.rail-min{display:block}
 .rail{position:fixed;left:0;top:0;width:270px;transform:translateX(-100%);transition:transform .18s}
 .menu-open .rail{transform:none;box-shadow:var(--shadow-lg)}
 .menu-open .scrim{display:block!important;position:fixed;inset:0;background:#160c2470;z-index:35}
 .mobile-menu,.mobile-close{display:inline-grid!important}.mobile-close{position:absolute;right:8px;top:8px;color:var(--on-bold)}
 .rail-toggle{display:none}
 .app.rail-min .brand-txt,.app.rail-min .navgroup,.app.rail-min .navlink span{display:block}.app.rail-min .rail-foot{display:grid}
 .app.rail-min .brand{flex-direction:row;padding:0 48px 28px 8px}.app.rail-min .navlink{justify-content:flex-start;padding:10px 13px;gap:12px}.app.rail-min .rail{padding:30px 17px 20px}
 .hero{grid-template-columns:1fr}.hero-side{border-left:0;border-top:1px solid #ffffff1f;padding:var(--s4) 0 0}
 .grid2,.grid2.equal,.grid3{grid-template-columns:1fr}}
@media(max-width:620px){
 .page{padding:22px 16px 30px}.topbar-in{padding:10px 12px;align-items:flex-start}.top-left{flex-wrap:wrap}
 .picker{flex-direction:row;align-items:center;gap:var(--s2);width:100%;margin:var(--s2) 0 0}.picker select{flex:1;max-width:none}
 #save-status{display:none}.topbar .actions{flex-wrap:nowrap}.topbar .btn span{display:none}.period-label{font-size:14px}
 .banner{padding:var(--s2) var(--s4)}.banner .btn{white-space:nowrap}
 .kpis{grid-template-columns:1fr 1fr}.kpi{padding:var(--s3)}.steps,.fields,.toggle-grid{grid-template-columns:1fr}.theme-grid{grid-template-columns:1fr 1fr}
 .cardhead{flex-wrap:wrap}.cardhead .actions,.filters,.filters input{width:100%}.pulse{flex-wrap:wrap}.pulse-track{min-height:44px;flex-basis:calc(100% - 30px)}
 .welcome{width:100%;max-width:none;margin:auto 0 0;border-radius:20px 20px 0 0}.welcome-art{height:150px}.footer{flex-direction:column;gap:6px}.formfoot .btn{flex:1}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
@media print{
 body{background:#fff;font-size:11px;color:#222}
 .rail,.topbar,.banner,.toast,.scrim,dialog,.pagehead .actions,.hub-tabs,.pulse,.btn,.ibtn,.icon-action,.segment,.pager,.no-print,.skip{display:none!important}
 .app{display:block}.page{padding:0;max-width:none}
 .print-title{display:flex;justify-content:space-between;font-size:11px;margin-bottom:18px;color:#555}.print-title b{font:700 15px var(--num);color:#111}
 .card,.table-card{box-shadow:none;border:1px solid #ddd;break-inside:auto}
 .kpi,svg,.row,h2,.hero,.cardhead{break-inside:avoid}
 .hero,.kpi,th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
 thead{display:table-header-group}*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<a class="skip" href="#content">Skip to content</a>
<div class="app" id="app">
 <aside class="rail" id="rail" aria-label="Main navigation">
  <button class="ibtn mobile-close" data-action="menu" aria-label="Close menu">×</button>
  <div class="brand"><span class="brand-mark" id="brand-mark">{{MARK}}</span><div class="brand-txt"><b>{{NAME}}</b><small>JPS DIGITAL PAGES</small></div>
   <button class="ibtn rail-toggle" data-action="rail-toggle" aria-label="Collapse navigation" aria-expanded="true" aria-controls="rail"><svg viewBox="0 0 24 24" class="i"><rect x="3" y="4.5" width="18" height="15" rx="2.5"/><path d="M9.5 4.5v15"/></svg></button></div>
  <nav id="nav"></nav>
  <div class="rail-foot"><div class="rail-note" id="rail-note"></div><button class="btn small rail-demo" data-action="sample" id="rail-demo">Explore sample data</button><a href="https://www.jpsdigitalpages.com" target="_blank" rel="noopener">JPS Digital Pages ↗</a><span id="rail-version"></span><span class="status" id="rail-status">Saved on this device</span></div>
 </aside>
 <button class="scrim" data-action="menu" aria-label="Close navigation"></button>
 <div class="main">
  <header class="topbar"><div class="topbar-in">
   <div class="top-left">
    <button class="ibtn mobile-menu" data-action="menu" aria-label="Open navigation"></button>
    <div class="month-control"><button class="ibtn" data-action="prev" aria-label="Previous month"></button><span class="period-label" id="period-label"></span><input class="month-picker" id="month-picker" type="month" aria-label="Pick a month"><button class="ibtn" data-action="next" aria-label="Next month"></button></div>
    <label class="picker" id="picker"></label>
   </div>
   <div class="actions">
    <span class="status" id="save-status">Saved on this device</span>
    <button class="btn quiet" data-action="go" data-go="guide"></button>
    <button class="btn" data-action="backup"></button>
   </div>
  </div>
  <div class="banner demo" id="demo-banner" hidden><span><b>Sample mode.</b> Made-up data to explore. Nothing here is saved, and your own data is untouched.</span><button class="link" data-action="sample">Return to my data</button></div>
  <div class="banner backup" id="backup-banner" hidden></div>
  <div class="banner storage" id="storage-banner" role="alert" hidden></div>
  </header>
  <main class="page" id="content" tabindex="-1"></main>
 </div>
</div>
<dialog id="dlg" aria-labelledby="dlg-title"></dialog>
<dialog id="welcome" class="welcome" aria-labelledby="welcome-title"></dialog>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>
<div class="tip" id="tip" hidden></div>
<input type="file" id="restore-file" accept=".json,application/json" hidden>
<noscript><p style="padding:20px">Turn on JavaScript to use {{NAME}}. Your data stays in this browser.</p></noscript>
<script>
'use strict';
/* ================================================================================
   CONFIG · the product (like a niche pack). Everything product-specific that isn't logic.
   ================================================================================ */
const CONFIG={
 name:'{{NAME}}', mark:'{{MARK}}', version:'1.0', publisher:'JPS Digital Pages',
 tagline:'Offline planner', email:'hello@jpsdigitalpages.com',
 storageKey:'{{KEY}}',            // unique per product; names every storage key and backup file
 idb:true,                         // IndexedDB for anything that can grow past a few MB
 defaultTheme:'{{THEME}}',
 themes:['kiln','ledger','sage','linen','fjord','slate','night','midnight'],
 railNote:'<b>Know where you stand.</b>Everything stays on your computer.',
 entity:{one:'Project',many:'Projects',all:'All projects'},
 // [id, label, icon, hub tabs?]. A hub shows once in the sidebar; its screens are tabs on the page.
 nav:[['dashboard','Dashboard','today'],['records','Records','log'],
  ['reports','Reports','outlook',[['reports','Shares'],['year','Year at a glance']]],
  ['settings','Settings & backup','palette'],['guide','How to use','help']],
 navGroups:[['Overview',['dashboard','records']],['Reports',['reports']]], navGroupRest:'Help & settings',
 optionalNav:['records','reports','guide'],   // can be switched off in Settings; the rest can't
 hiddenNav:[],                                  // switched off in a new file (e.g. advanced screens)
 welcome:[
  {icon:'today',step:'WELCOME',title:'Everything in one calm place',text:'Add what happens, and every screen fills in by itself.'},
  {icon:'shield',step:'PRIVATE',title:'Your data stays on this computer',text:'Nothing is uploaded. There is no account and no subscription.'},
  'backup',
  {icon:'check',step:'START',title:'Try the sample first',text:'Explore made-up data safely, then return to your own and add the first record.'}],
 categories:[['sales','Sales','in'],['services','Services','in'],['supplies','Supplies','out'],['marketing','Marketing','out'],['tools','Tools & software','out'],['other','Other costs','out']],
 currencies:['USD','EUR','GBP','CAD','AUD','NZD','INR','NGN','ZAR','JPY','CHF','SEK','SGD','MXN','BRL'],
};

/* ---------- icons: 24px stroke set (same names as the core's ICON) ---------- */
const S=d=>`<svg viewBox="0 0 24 24" class="i" aria-hidden="true">${d}</svg>`;
const ICON={today:S('<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/>'),outlook:S('<path d="M3 16.5 9 10l4 4 8-8.5"/><path d="M15 5.5h6v6"/>'),
 log:S('<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>'),help:S('<circle cx="12" cy="12" r="9"/><path d="M9.6 9.3a2.5 2.5 0 0 1 4.8.8c0 1.7-2.4 2.2-2.4 3.6"/><path d="M12 17.2h.01"/>'),
 palette:S('<circle cx="12" cy="12" r="8.6"/><path d="M12 3.4a8.6 8.6 0 0 0 0 17.2Z" fill="currentColor" stroke="none"/>'),shield:S('<path d="M12 3 4.5 6v5.5c0 4.6 3.2 8.4 7.5 9.5 4.3-1.1 7.5-4.9 7.5-9.5V6Z"/>'),
 down:S('<path d="M12 4v11M7 10l5 5 5-5M5 20h14"/>'),up:S('<path d="M12 20V9M7 14l5-5 5 5M5 4h14"/>'),check:S('<path d="m5 12.5 4.5 4.5L19 7"/>'),coins:S('<ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/>'),
 wallet:S('<rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 14.5h2"/>'),insights:S('<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>'),history:S('<path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5M12 7v5l3 2"/>'),
 tags:S('<path d="M3 12V4h8l10 10-8 8Z"/><path d="M7.5 7.5h.01"/>'),plus:S('<path d="M12 5v14M5 12h14"/>'),left:S('<path d="m15 18-6-6 6-6"/>'),right:S('<path d="m9 18 6-6-6-6"/>'),menu:S('<path d="M4 7h16M4 12h16M4 17h16"/>'),
 edit:S('<path d="M4 20h4L19 9l-4-4L4 16Z"/>'),trash:S('<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>'),print:S('<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><rect x="7" y="14" width="10" height="7"/>'),
 cross:S('<path d="M6 6l12 12M18 6 6 18"/>'),calendar:S('<rect x="3" y="4.5" width="18" height="16" rx="2.5"/><path d="M3 9.5h18M8 3v3M16 3v3"/>'),table:S('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18M3 15h18M9 4v16"/>'),
 compass:S('<circle cx="12" cy="12" r="9"/><path d="m15.5 8.5-2 5-5 2 2-5Z"/>'),globe:S('<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/>')};
const ico=n=>ICON[n]||ICON.today;

/* ---------- helpers ---------- */
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;};
const addMonths=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5)-1+n,1,12);return `${d.getFullYear()}-${pad(d.getMonth()+1)}`;};
const monthName=(ym,o={month:'long',year:'numeric'})=>new Date(ym+'-15T12:00:00').toLocaleDateString('en-US',o);
const shortMonth=ym=>monthName(ym,{month:'short'});
const endOf=ym=>`${ym}-${pad(new Date(+ym.slice(0,4),+ym.slice(5),0).getDate())}`;
// money is integer cents everywhere; formatting happens only here. A zero is never "-$0.00".
const money=c=>{const sym=(state.settings.symbol||'').trim(),a=Math.abs(c)/100,s=sym?sym+a.toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2}):new Intl.NumberFormat('en-US',{style:'currency',currency:state.settings.currency||'USD'}).format(a);return (c<0?'−':'')+s;};
const fmt=money;
const compact=c=>{const sym=(state.settings.symbol||'').trim()||(new Intl.NumberFormat('en-US',{style:'currency',currency:state.settings.currency||'USD'}).formatToParts(0).find(p=>p.type==='currency')?.value)||'$';const v=Math.abs(c)/100;return (c<0?'−':'')+sym+(v>=1000?(v/1000).toFixed(v>=10000?0:1).replace(/\.0$/,'')+'k':Math.round(v));};
const pc=(v,d=0)=>Number.isFinite(v)?(v*100).toFixed(d)+'%':'—';
const num=n=>Number(n||0).toLocaleString('en-US');
const uid=()=>globalThis.crypto?.randomUUID?.().slice(0,8)||Math.random().toString(36).slice(2,10);
const button=(label,action,cls='',extra='')=>`<button class="btn ${cls}" data-action="${action}" ${extra}>${label}</button>`;

/* ================================================================================
   Logic · pure, no DOM. Replace with the product's own rules; keep it testable.
   ================================================================================ */
const Logic={
 blank:()=>({version:1,app:CONFIG.storageKey,settings:{name:'',theme:CONFIG.defaultTheme,currency:'USD',symbol:'',entity:'',hiddenNav:[...CONFIG.hiddenNav]},entities:[],records:[]}),
 validate(s){if(!s||typeof s!=='object'||!Array.isArray(s.records)||!Array.isArray(s.entities))throw Error(`This is not a ${CONFIG.name} file.`);
  const b=Logic.blank();s.settings={...b.settings,...s.settings};if(!CONFIG.themes.includes(s.settings.theme))s.settings.theme=CONFIG.defaultTheme;
  s.records=s.records.filter(r=>r&&/^\d{4}-\d{2}-\d{2}$/.test(r.date)&&Number.isInteger(r.amount)&&r.amount>=0);return s;},
 kind:cat=>(CONFIG.categories.find(c=>c[0]===cat)||[])[2]||'out',
 inRange:(s,from,to,entity=s.settings.entity)=>s.records.filter(r=>r.date>=from&&r.date<=to&&(!entity||r.entity===entity)),
 totals(rows){let inn=0,out=0;for(const r of rows)(Logic.kind(r.category)==='in'?inn+=r.amount:out+=r.amount);return {in:inn,out,net:inn-out,count:rows.length};},
 byCategory(rows){const m=new Map();rows.forEach(r=>m.set(r.category,(m.get(r.category)||0)+r.amount));return m;},
};
const catName=id=>CONFIG.categories.find(c=>c[0]===id)?.[1]||id;

/* ---------- state + storage keys (every key starts with the product's storage key) ---------- */
const KEY=CONFIG.storageKey+'-v1',RAIL_KEY=CONFIG.storageKey+'-rail-collapsed',WELCOME_KEY=CONFIG.storageKey+'-welcome-v1',
 NUDGE_KEY=CONFIG.storageKey+'-backup-nudge',MANUAL_BACKUP_KEY=CONFIG.storageKey+'-manual-backup';
const ls={get:k=>{try{return localStorage.getItem(k);}catch{return null;}},set:(k,v)=>{try{localStorage.setItem(k,v);}catch{}}};
let state=Logic.blank(),real=null,demo=false,undoState=null,storageProblem='',screen='dashboard',selected=today().slice(0,7),period='month',custom={from:'',to:''},
 railMin=ls.get(RAIL_KEY)==='1',hubLast={},returnFocus=null,askFn=null;

/* ---------- storage: IndexedDB (room for big data) with a localStorage fallback ---------- */
let IDB=CONFIG.idb&&!!globalThis.indexedDB,writing=null,again=false;
const openDB=(name,store)=>new Promise((res,rej)=>{const q=indexedDB.open(name,1);q.onupgradeneeded=()=>q.result.createObjectStore(store);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error);});
async function kv(dbName,store,key,mode='get',value){const db=await openDB(dbName,store);return new Promise((res,rej)=>{const tx=db.transaction(store,mode==='get'?'readonly':'readwrite'),st=tx.objectStore(store),
 q=mode==='get'?st.get(key):mode==='del'?st.delete(key):st.put(value,key);if(mode==='get')q.onsuccess=()=>res(q.result);else tx.oncomplete=()=>res();tx.onerror=tx.onabort=()=>rej(tx.error||q.error);});}
const dataStore=(mode,v)=>kv(CONFIG.storageKey+'-data','kv',KEY,mode,v);
async function load(){let raw=null;
 if(IDB){try{raw=await dataStore('get');if(!raw)raw=ls.get(KEY);}catch{IDB=false;}}   // first open moves an old localStorage copy across
 if(!IDB){try{raw=localStorage.getItem(KEY);}catch{storageProblem='Browser storage is unavailable. Changes stay in this session only. Download a backup before closing.';}}
 if(raw){try{state=Logic.validate(JSON.parse(raw));if(IDB)save();}catch{storageProblem='Your saved data could not be read. It has not been overwritten. Restore a backup to continue.';}}}
function save(){if(demo)return;
 if(storageProblem)return renderStatus();
 const text=JSON.stringify(state);
 if(IDB){if(writing){again=true;return;}   // one write in flight, one queued: an older save never lands after a newer one
  writing=dataStore('put',text).then(()=>{try{localStorage.removeItem(KEY);}catch{}}).catch(()=>{storageProblem='Browser storage is unavailable or full. Changes are only in this session. Download a backup before closing.';}).finally(()=>{writing=null;renderStatus();if(again){again=false;save();}});}
 else{try{localStorage.setItem(KEY,text);}catch{storageProblem='Browser storage is unavailable or full. Changes are only in this session. Download a backup before closing.';}renderStatus();}
 queueFolderBackup();}
// every change goes through commit: snapshot for undo, change, save, redraw, toast with Undo
function commit(fn,message='Saved'){undoState=clone(state);fn();save();render();toast(storageProblem&&!demo?message+' in this session only. Download a backup.':message,true);}
function toast(message,undo=false){clearTimeout(toast.t);const el=$('#toast');el.innerHTML=`<span>${esc(message)}</span>${undo?'<button data-action="undo">Undo</button>':''}`;el.hidden=false;toast.t=setTimeout(()=>el.hidden=true,6500);}

/* ---------- backups: download, restore, and a daily file in a folder the user picks (Chrome/Edge) ---------- */
function download(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}
const backupJSON=()=>JSON.stringify({app:CONFIG.storageKey,version:CONFIG.version,saved:new Date().toISOString(),data:state},null,2);
function backup(){download(`${CONFIG.storageKey}-${demo?'sample-':''}${today()}.json`,backupJSON());if(!demo){ls.set(MANUAL_BACKUP_KEY,String(Date.now()));renderStatus();}toast('Backup downloaded. Keep it somewhere safe.');}
async function restore(file){try{const j=JSON.parse(await file.text());if(j.app!==CONFIG.storageKey)throw Error(`This backup is from another app. Choose a ${CONFIG.name} backup.`);const next=Logic.validate(j.data);
 if(demo)toggleSample(true);storageProblem='';commit(()=>{state=next;},'Backup restored');}catch(e){toast(e instanceof SyntaxError?'That file is not a backup.':e.message||'That file could not be read.');}}
const folderSupported=()=>!!globalThis.showDirectoryPicker;
let folder=null,folderStatus='Not connected',folderTimer=null,folderChain=Promise.resolve(),bannerHidden=false;
const handleStore=(mode,v)=>kv(CONFIG.storageKey+'-backup','handles','folder',mode,v);
// the pill says when the folder copy was last written, with date and time: "Backed up Oct 2, 3:42 PM"
const backupStamp=ms=>{const d=new Date(ms);return d.toLocaleDateString(undefined,{month:'short',day:'numeric',...(d.getFullYear()!==new Date().getFullYear()?{year:'numeric'}:{})})+', '+d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});};
const FOLDER_TIME_KEY=CONFIG.storageKey+'-folder-backup';
const folderLabel=()=>{const last=+ls.get(FOLDER_TIME_KEY)||0;return folderStatus==='Connected'&&last?'Backed up '+backupStamp(last):folderStatus;};
function setFolderStatus(t){folderStatus=t;const el=$('#folder-status');if(el)el.textContent=folderLabel();renderStatus();}
async function chooseFolder(){if(!folderSupported())return toast('Folder backup needs Chrome or Edge on a computer. Use Download backup here.');
 try{folder=await showDirectoryPicker({mode:'readwrite',id:CONFIG.storageKey+'-backups'});await handleStore('put',folder);await writeFolder(true);toast('Backups will be saved to that folder after every change.');render();}catch(e){if(e.name!=='AbortError')toast('That folder could not be used.');}}
async function reconnectFolder(){if(!folder)return chooseFolder();try{const p=await folder.requestPermission({mode:'readwrite'});if(p==='granted'){await writeFolder(true);render();}}catch{setFolderStatus('Reconnect needed');}}
function queueFolderBackup(){if(!folder||demo)return;clearTimeout(folderTimer);folderTimer=setTimeout(()=>writeFolder().catch(()=>setFolderStatus('Backup needs attention')),1200);}
function writeFolder(){const f=folder;folderChain=folderChain.catch(()=>{}).then(async()=>{if(!f||f!==folder||demo)return;
 if(await f.queryPermission({mode:'readwrite'})!=='granted')return setFolderStatus('Reconnect needed');
 const h=await f.getFileHandle(`${CONFIG.storageKey}-backup-${today()}.json`,{create:true}),w=await h.createWritable();await w.write(backupJSON());await w.close();ls.set(FOLDER_TIME_KEY,String(Date.now()));setFolderStatus('Connected');});return folderChain;}
async function initFolder(){if(!folderSupported()){folderStatus='Not available here';return;}try{folder=await handleStore('get')||null;if(folder){const p=await folder.queryPermission({mode:'readwrite'});setFolderStatus(p==='granted'?'Connected':'Reconnect needed');}}catch{folderStatus='Not available here';}}
const hasData=()=>state.records.length>0;
// protected = a healthy folder backup, or a downloaded backup in the last 7 days
const protectedNow=()=>(folder&&folderStatus==='Connected')||Date.now()-(+ls.get(MANUAL_BACKUP_KEY)||0)<7*864e5;

/* ---------- sample mode: separate, never saved ---------- */
function sampleData(){const s=Logic.blank();s.settings.theme=state.settings.theme;s.settings.currency=state.settings.currency;
 const ents=[['e1','Fern & Fable'],['e2','Copper Kiln']];s.entities=ents.map(([id,name])=>({id,name}));
 const start=addMonths(today().slice(0,7),-13);let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
 for(let m=0;m<14;m++){const ym=addMonths(start,m),season=1+0.35*Math.sin((m+2)/12*Math.PI*2);
  for(const [id] of ents){const w=id==='e1'?1:0.7;
   for(let k=0;k<6;k++)s.records.push({id:uid(),entity:id,date:`${ym}-${pad(2+k*4)}`,category:k%3?'sales':'services',amount:Math.round((42000+rnd()*26000)*season*w),note:k%3?'Online orders':'Custom commission'});
   [['supplies',120000],['marketing',45000],['tools',18000],['other',12000]].forEach(([c,base],k)=>s.records.push({id:uid(),entity:id,date:`${ym}-${pad(5+k*6)}`,category:c,amount:Math.round(base*(0.7+rnd()*0.6)*w),note:c==='tools'?'Monthly apps':'Receipts'}));}}
 return s;}
function toggleSample(quiet=false){if(!demo){real=state;state=sampleData();demo=true;if(!quiet)toast('Sample mode: made-up data, nothing is saved');}else{state=real;real=null;demo=false;if(!quiet)toast('Back to your own data');}undoState=null;render();}

/* ================================================================================
   Chart kit · SVG strings, no library. Donut above its legend, flat bars, value labels.
   ================================================================================ */
const CAT=['var(--cat-1)','var(--cat-2)','var(--cat-3)','var(--cat-4)','var(--cat-5)','var(--cat-6)'];
const tipOf=(t,rows)=>esc(JSON.stringify({t,r:rows}));
// top five slices, then one grey "Other"; hues in fixed order, never cycled
const fold=rows=>{const r=rows.filter(x=>x[1]>0).sort((a,b)=>b[1]-a[1]),top=r.slice(0,5).map((x,i)=>[x[0],x[1],x[2]||CAT[i]]);const rest=r.slice(5).reduce((n,x)=>n+x[1],0);if(rest)top.push([`Other (${r.length-5} more)`,rest,CAT[5]]);return top;};
function pie(parts,{label='',donut=true,center='',sub='',f=fmt}={}){
 parts=parts.filter(p=>p[1]>0);const total=parts.reduce((n,p)=>n+p[1],0);if(!total)return '';
 const R=80,r0=donut?52:0,c=90,pt=(a,r)=>[(c+r*Math.cos(a)).toFixed(2),(c+r*Math.sin(a)).toFixed(2)];let a=-Math.PI/2;
 const segs=parts.map(([name,n,color],i)=>{const sw=n/total*Math.PI*2,a1=a,a2=a+sw;a=a2;let d;
  if(sw>=Math.PI*2-1e-6)d=`M${c} ${c-R}A${R} ${R} 0 1 1 ${c-0.01} ${c-R}Z`+(donut?`M${c} ${c-r0}A${r0} ${r0} 0 1 0 ${c+0.01} ${c-r0}Z`:'');
  else{const lg=sw>Math.PI?1:0,[x1,y1]=pt(a1,R),[x2,y2]=pt(a2,R);if(donut){const [x3,y3]=pt(a2,r0),[x4,y4]=pt(a1,r0);d=`M${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}L${x3} ${y3}A${r0} ${r0} 0 ${lg} 0 ${x4} ${y4}Z`;}else d=`M${c} ${c}L${x1} ${y1}A${R} ${R} 0 ${lg} 1 ${x2} ${y2}Z`;}
  return `<path class="kit-seg" d="${d}" fill="${color}" fill-rule="evenodd" style="--i:${i}" tabindex="0" aria-label="${esc(name)}: ${pc(n/total)}" data-tip="${tipOf(name,[{name:label,value:f(n),color},{name:'Share',value:pc(n/total)}])}"/>`;}).join('');
 // straight dividers between slices, drawn over them
 let cuts='';if(parts.length>1){let b=-Math.PI/2;for(const p of parts){const [x1,y1]=pt(b,r0),[x2,y2]=pt(b,R+1);cuts+=`<line class="kit-cut" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`;b+=p[1]/total*Math.PI*2;}}
 const key=parts.map(([name,n,color])=>`<div class="kit-key-row"><i class="dot" style="background:${color}"></i><span>${esc(name)}</span><b class="number">${pc(n/total,n/total<0.1?1:0)}</b><em class="number">${f(n)}</em></div>`).join('');
 return `<div class="kit-pie"><svg viewBox="0 0 180 180" role="img" aria-label="${esc(label)}">${segs}${cuts}${donut&&center?`<text x="90" y="92" class="kit-mid">${esc(center)}</text><text x="90" y="110" class="kit-mid-sub">${esc(sub)}</text>`:''}</svg><div class="kit-key">${key}</div></div>`;}
function gauge(v,title,note){const p=Math.max(0,Math.min(1,Number.isFinite(v)?v:0));return `<div class="kit-gauge"><svg viewBox="0 0 180 104" role="img" aria-label="${esc(title)} ${pc(v)}"><path d="M20 92A70 70 0 0 1 160 92" class="kit-gauge-track" pathLength="100"/><path d="M20 92A70 70 0 0 1 160 92" class="kit-gauge-val" pathLength="100" style="stroke-dasharray:${(p*100).toFixed(1)} 100"/><text x="90" y="86" class="kit-gauge-num">${pc(v)}</text></svg><b>${esc(title)}</b><small>${esc(note)}</small></div>`;}
function spark(vals){const pts=vals.map((n,i)=>Number.isFinite(n)?[i,n]:null).filter(Boolean);if(pts.length<2)return '';const ys=pts.map(p=>p[1]),mn=Math.min(...ys),sp=(Math.max(...ys)-mn)||1,W=120,H=30,X=i=>2+i*(W-6)/Math.max(1,vals.length-1),Y=n=>H-4-(n-mn)/sp*(H-8),l=pts.at(-1);

// columns, stacked when several series; square corners, no gaps, the total printed on top, optional line on the same scale
// W: drawing width. 700 suits a half-width card; pass ~1100 for a full-width card so the chart isn't blown up
function bars(series,labels,{title='',overlay=null,H=260,W=700}={}){
 const tot=labels.map((_,i)=>series.reduce((n,s)=>n+Math.max(0,s.values[i]||0),0)),max=Math.max(1,...tot,...(overlay?overlay.values.filter(Number.isFinite):[]));if(!tot.some(Boolean))return '';
 const pl=52,pr=12,pt=22,pb=28,band=(W-pl-pr)/labels.length,bw=Math.min(38,band*.62),Y=v=>pt+(1-v/max)*(H-pt-pb),ticks=[0,1,2,3,4].map(i=>max*i/4);
 const cols=labels.map((l,i)=>{let base=H-pb;const x=pl+band*i+(band-bw)/2;
  const segs=series.map(s=>{const v=Math.max(0,s.values[i]||0);if(!v)return '';const h=(H-pt-pb)*v/max,y=base-h;base=y;return `<rect class="kit-bar" x="${x.toFixed(1)}" y="${y.toFixed(1)}" width="${bw.toFixed(1)}" height="${h.toFixed(1)}" style="fill:${s.color};--i:${i}"/>`;}).join('');
  const tip=tipOf(l,[...series.filter(s=>s.values[i]).map(s=>({name:s.name,value:fmt(s.values[i]),color:s.color})),...(series.length>1?[{name:'Total',value:fmt(tot[i])}]:[]),...(overlay&&Number.isFinite(overlay.values[i])?[{name:overlay.name,value:fmt(overlay.values[i]),color:overlay.color}]:[])]);
  return `<g class="kit-col" tabindex="0" data-tip="${tip}"><rect x="${(pl+band*i).toFixed(1)}" y="${pt}" width="${band.toFixed(1)}" height="${H-pt-pb}" fill="transparent"/>${segs}${tot[i]?`<text x="${(x+bw/2).toFixed(1)}" y="${(Y(tot[i])-6).toFixed(1)}" class="kit-axis" text-anchor="middle">${compact(tot[i])}</text>`:''}</g><text x="${(x+bw/2).toFixed(1)}" y="${H-8}" class="kit-axis" text-anchor="middle">${esc(l)}</text>`;}).join('');
 const ov=overlay?(()=>{const p=overlay.values.map((v,i)=>Number.isFinite(v)?[pl+band*i+band/2,Y(Math.max(0,v))]:null).filter(Boolean);return `<polyline class="kit-path" pathLength="100" points="${p.map(q=>q[0].toFixed(1)+','+q[1].toFixed(1)).join(' ')}" style="stroke:${overlay.color}"/>`+p.map(q=>`<circle class="kit-dot" cx="${q[0].toFixed(1)}" cy="${q[1].toFixed(1)}" r="4" style="fill:${overlay.color}"/>`).join('');})():'';
 const keys=[...series,...(overlay?[overlay]:[])];
 return `<div class="kit-chart">${keys.length>1?`<div class="legend">${keys.map(s=>`<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join('')}</div>`:''}<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(title)}">${ticks.map(v=>`<line x1="${pl}" x2="${W-pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" class="chart-grid"/><text x="${pl-8}" y="${(Y(v)+4).toFixed(1)}" class="kit-axis" text-anchor="end">${compact(v)}</text>`).join('')}${cols}${ov}</svg></div>`;}

 if(f.id==='record-form'){const s=String(d.amount).trim().replace(/[$,\s]/g,'');if(!/^\d{1,8}(\.\d{1,2})?$/.test(s)||+s<=0)return formError('Enter an amount above zero, with up to two decimals.');const id=f.dataset.id;
  closeModal();commit(()=>{const r={id:id||uid(),date:d.date,category:d.category,amount:Math.round(+s*100),note:d.note.trim(),entity:d.entity??state.settings.entity};if(id)state.records=state.records.map(x=>x.id===id?r:x);else state.records.push(r);},id?'Record saved':'Record added');}
 if(f.id==='entity-form'){const id=f.dataset.id,name=d.name.trim();if(!name)return formError('Give it a name.');closeModal();commit(()=>{if(id)state.entities.find(x=>x.id===id).name=name;else{state.entities.push({id:'e'+uid(),name});if(state.entities.length===1)state.settings.entity='';}},'Saved');}
 if(f.id==='settings-form')commit(()=>Object.assign(state.settings,{name:d.name.trim(),currency:d.currency,symbol:d.symbol.trim()}),'Preferences saved');});
// keyboard: Esc closes the mobile menu, N adds a record (never while typing or in a dialog)
document.addEventListener('keydown',e=>{if(e.key==='Escape')document.body.classList.remove('menu-open');
 if(e.key.toLowerCase()==='n'&&!e.metaKey&&!e.ctrlKey&&!e.altKey&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!document.querySelector('dialog[open]')){e.preventDefault();recordForm();}});
// chart tooltips: hover or focus anything with data-tip
function showTip(el,x,y){const tip=$('#tip');try{const {t,r}=JSON.parse(el.dataset.tip);tip.innerHTML=`<div class="tip-title">${esc(t)}</div>`+r.map(v=>`<div class="tip-row">${v.color?`<i class="dot" style="background:${v.color}"></i>`:''}<span>${esc(v.name)}</span><b>${esc(v.value)}</b></div>`).join('');tip.hidden=false;
 tip.style.left=Math.max(8,Math.min(innerWidth-tip.offsetWidth-8,x+14))+'px';tip.style.top=Math.max(8,Math.min(innerHeight-tip.offsetHeight-8,y+14))+'px';}catch{tip.hidden=true;}}
document.addEventListener('pointermove',e=>{const el=e.target.closest?.('[data-tip]');if(el)showTip(el,e.clientX,e.clientY);else $('#tip').hidden=true;});
document.addEventListener('focusin',e=>{const el=e.target.closest?.('[data-tip]');if(el){const r=el.getBoundingClientRect();showTip(el,r.right,r.top);}else $('#tip').hidden=true;});
window.addEventListener('scroll',()=>{$('#tip').hidden=true;},{passive:true});

/* ---------- start ---------- */
document.querySelectorAll('[data-action="prev"]').forEach(b=>b.innerHTML=ico('left'));document.querySelectorAll('[data-action="next"]').forEach(b=>b.innerHTML=ico('right'));
$('.mobile-menu').innerHTML=ico('menu');$('.topbar [data-go="guide"]').innerHTML=ico('help')+'<span>Guide</span>';$('.topbar [data-action="backup"]').innerHTML=ico('down')+'<span>Back up</span>';
$('#rail-note').innerHTML=CONFIG.railNote;$('#rail-version').textContent=`${CONFIG.tagline} · v${CONFIG.version}`;
Promise.all([load(),initFolder()]).then(()=>{render();startupPrompt();});
</script>
