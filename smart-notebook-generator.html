<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smart Notebook PDF Generator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,650;9..144,750&family=Instrument+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="pageSizeRule">@page{size:8.5in 11.333in}</style>
<style>
*,*::before,*::after{box-sizing:border-box}
:root{
  --ink:#24262a;
  --muted:#72767e;
  --paper:#fff;
  --soft:#eef1f4;
  --line:#d9dee5;
  --accent:#334155;
  --accent-2:#64748b;
  --deep:#111827;
  --surface:#f5f6f8;
  --shadow:0 18px 55px rgba(17,24,39,.14);
  --sans:"Instrument Sans", ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  --serif:"Fraunces", ui-serif, Georgia, serif;
}
body.theme-graphite{--accent:#334155;--accent-2:#64748b;--deep:#111827;--soft:#eef1f4;--line:#d9dee5}
body.theme-sage{--accent:#3F6B52;--accent-2:#759b85;--deep:#1a3425;--soft:#f2f8f4;--line:#d7e5dd}
body.theme-sky{--accent:#5f8faf;--accent-2:#7fa9c2;--deep:#1f394a;--soft:#eef7fb;--line:#d5e6ef}
body.theme-lilac{--accent:#8d7aa8;--accent-2:#a697ba;--deep:#352f45;--soft:#f4f0f8;--line:#dfd8e9}
body.theme-blush{--accent:#bf7f8a;--accent-2:#d19ba4;--deep:#4a3036;--soft:#fff1f4;--line:#ead5da}
body.theme-butter{--accent:#c3a45b;--accent-2:#d1bb80;--deep:#443926;--soft:#fff8e9;--line:#eadfbd}
body.theme-coral{--accent:#c87868;--accent-2:#dc9a8d;--deep:#4c302b;--soft:#fff0eb;--line:#eed6ce}
body.theme-mono{--accent:#353535;--accent-2:#777;--deep:#161616;--soft:#f1f1f1;--line:#dedede}
body.theme-dark{--ink:#eef3f8;--muted:#a8b2bf;--paper:#101721;--accent:#4f6f8f;--accent-2:#9ba9b8;--deep:#f6f8fb;--soft:#1c2633;--line:#344153;--surface:#121b26}
body.theme-multi{--accent:#5f7480;--accent-2:#8a7670;--deep:#263038;--soft:#f3f0ed;--line:#ded8d2}
body.theme-vibrant{--accent:#2563eb;--accent-2:#f59e0b;--deep:#172554;--soft:#eef4ff;--line:#d8e3f8}
body.theme-pastel{--accent:#7fb3d5;--accent-2:#d9ad7c;--deep:#385066;--soft:#f3f8fb;--line:#dbe8ee}
body.theme-ember{--accent:#B5481F;--accent-2:#d98261;--deep:#5f2c19;--soft:#f8f4f2;--line:#ecd7cf}
body.theme-plum{--accent:#6B3FA0;--accent-2:#a084c1;--deep:#3e2063;--soft:#f5f2f8;--line:#ddd4e8}
body.theme-rose{--accent:#AE3457;--accent-2:#cc7c93;--deep:#6a1c33;--soft:#f8f2f4;--line:#e9d2d9}
body.theme-ocean{--accent:#1E5A82;--accent-2:#4290c4;--deep:#0e2636;--soft:#f2f5f8;--line:#d1e0eb}
body.theme-clay{--accent:#9C5A2E;--accent-2:#c68f6a;--deep:#573117;--soft:#f8f4f2;--line:#eadcd2}
body.theme-forest{--accent:#2C5639;--accent-2:#5a8e6a;--deep:#0f2416;--soft:#f2f8f4;--line:#d6e6db}
body.theme-berry{--accent:#8A2E5C;--accent-2:#bc628f;--deep:#49132e;--soft:#f8f2f5;--line:#e9d3de}
body.theme-slate{--accent:#37434F;--accent-2:#687684;--deep:#131920;--soft:#f2f5f8;--line:#d8dee3}
body.theme-marigold{--accent:#B07A14;--accent-2:#dfac4b;--deep:#523d16;--soft:#f8f6f2;--line:#ede2cf}
body.theme-graphite{--theme-h:215;--theme-s:31%;--theme-l:43%}
body.theme-sage{--theme-h:146;--theme-s:26%;--theme-l:48%}
body.theme-sky{--theme-h:202;--theme-s:33%;--theme-l:53%}
body.theme-lilac{--theme-h:269;--theme-s:22%;--theme-l:57%}
body.theme-blush{--theme-h:350;--theme-s:36%;--theme-l:62%}
body.theme-butter{--theme-h:43;--theme-s:47%;--theme-l:56%}
body.theme-coral{--theme-h:10;--theme-s:47%;--theme-l:60%}
body.theme-mono{--theme-h:0;--theme-s:0%;--theme-l:44%}
body.theme-dark{--theme-h:217;--theme-s:33%;--theme-l:32%}
body.theme-multi{--theme-h:202;--theme-s:25%;--theme-l:52%}
body.theme-vibrant{--theme-h:221;--theme-s:83%;--theme-l:54%}
body.theme-pastel{--theme-h:204;--theme-s:48%;--theme-l:67%}
body.theme-ember{--theme-h:16;--theme-s:50%;--theme-l:48%}
body.theme-plum{--theme-h:267;--theme-s:43%;--theme-l:48%}
body.theme-rose{--theme-h:343;--theme-s:50%;--theme-l:48%}
body.theme-ocean{--theme-h:204;--theme-s:50%;--theme-l:46%}
body.theme-clay{--theme-h:24;--theme-s:50%;--theme-l:48%}
body.theme-forest{--theme-h:139;--theme-s:32%;--theme-l:40%}
body.theme-berry{--theme-h:330;--theme-s:50%;--theme-l:48%}
body.theme-slate{--theme-h:210;--theme-s:18%;--theme-l:41%}
body.theme-marigold{--theme-h:39;--theme-s:50%;--theme-l:48%}
body{
  margin:0;
  background:#e7e9ed;
  color:var(--ink);
  font-family:var(--sans);
  letter-spacing:0;
}
button,input,select{font:inherit}
.builder{
  max-width:1200px;
  margin:18px auto 26px;
  padding:16px;
  background:#f9fafb;
  border:1px solid rgba(17,24,39,.12);
}
.toolbar{
  display:flex;
  align-items:center;
  gap:8px;
  flex-wrap:wrap;
  margin-bottom:12px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(17,24,39,.12);
}
.brand{
  color:var(--deep);
  font-size:13px;
  font-weight:850;
  margin-right:12px;
}
.chip,
.icon-btn{
  border:1px solid rgba(17,24,39,.16);
  background:#fff;
  color:var(--deep);
  border-radius:3px;
  padding:7px 10px;
  font-size:12px;
  font-weight:800;
  cursor:pointer;
}
.chip.active{background:var(--accent);border-color:var(--accent);color:#fff}
.chip{display:inline-flex;align-items:center;gap:6px}
.chip-dot{width:11px;height:11px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(17,24,39,.2);box-sizing:border-box}
.chip.active .chip-dot{border-color:rgba(255,255,255,.75)}
body.theme-dark .chip-dot{border-color:rgba(255,255,255,.3)}
body.theme-dark .chip.active .chip-dot{border-color:rgba(255,255,255,.75)}
.icon-btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.spacer{flex:1}
.settings{
  background:#fff;
  border:1px solid rgba(17,24,39,.12);
  border-radius:3px;
  padding:16px;
}
.settings h1{
  margin:0 0 12px;
  color:var(--deep);
  font-size:15px;
  letter-spacing:-.01em;
}
.grid{
  display:grid;
  grid-template-columns:repeat(4,minmax(150px,1fr));
  gap:14px;
}
.field{
  display:flex;
  flex-direction:column;
  gap:6px;
}
.field label{
  color:var(--muted);
  font-size:10px;
  font-weight:850;
  text-transform:uppercase;
}
.field input,
.field select,
.field textarea{
  border:1px solid var(--line);
  border-radius:3px;
  padding:9px 10px;
  background:#fff;
  color:var(--ink);
  outline:none;
}
.checks{
  display:grid;
  grid-template-columns:repeat(4,minmax(150px,1fr));
  gap:10px;
  margin-top:14px;
  padding-top:14px;
  border-top:1px solid var(--line);
}
.checks label{
  display:flex;
  align-items:center;
  gap:8px;
  color:var(--deep);
  font-size:13px;
  font-weight:750;
}
.checks input{accent-color:var(--accent)}
.hint{
  margin-top:12px;
  color:var(--muted);
  font-size:12px;
  line-height:1.45;
}
#notebook{
  display:flex;
  flex-direction:column;
  gap:24px;
  align-items:center;
}
.page{
  width:min(100%,820px);
  aspect-ratio:3/4;
  background:var(--paper);
  border-radius:3px;
  overflow:hidden;
  display:flex;
  flex-direction:column;
  position:relative;
  padding:28px 32px;
  scroll-margin-top:24px;
}
.page-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:16px;
  flex-shrink:0;
  padding-bottom:13px;
  border-bottom:1px solid var(--line);
}
.eyebrow{
  color:var(--accent);
  font-size:9px;
  font-weight:850;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.page-title{
  margin-top:5px;
  color:var(--deep);
  font-family:var(--serif);
  font-size:30px;
  font-weight:750;
  line-height:1;
  letter-spacing:-.02em;
}
.page-subtitle{
  margin-top:5px;
  color:var(--muted);
  font-size:12px;
  font-weight:650;
}
.nav{
  display:flex;
  justify-content:flex-end;
  gap:4px;
  flex-wrap:nowrap;
  padding-top:2px;
}
.nav a,
.index-link,
.tab-link,
.tool-link,
.section-link{
  color:inherit;
  text-decoration:none;
}
.nav a{
  background:#f2f4f7;
  color:var(--muted);
  border-radius:3px;
  padding:5px 7px;
  font-size:7px;
  font-weight:850;
  text-transform:uppercase;
  white-space:nowrap;
}
.index-page .nav{display:none}
.content{
  flex:1;
  min-height:0;
  padding-top:18px;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.cover{
  background:var(--accent);
  color:#fff;
  justify-content:center;
  padding:0;
}
body.theme-multi .cover{
  background:linear-gradient(135deg,#6f8791 0%,#8a9b76 18%,#c79374 36%,#aa7f99 56%,#6f9a96 74%,#b9a260 100%);
}
body.theme-vibrant .cover{
  background:linear-gradient(135deg,#2563eb 0%,#ef4444 18%,#f59e0b 36%,#8b5cf6 56%,#10b981 74%,#ec4899 100%);
}
body.theme-pastel .cover{
  background:linear-gradient(135deg,#8ab6f0 0%,#f3a1a1 18%,#f5d68a 36%,#c3a6f4 56%,#9ed9bb 74%,#e9aacb 100%);
}
body.theme-pastel .cover .content{
  background:rgba(40,48,58,.18);
}
.cover .content{
  justify-content:center;
  text-align:center;
  margin:20px;
  padding:58px 48px;
  border:1px solid rgba(255,255,255,.22);
}
.cover-mark{
  width:fit-content;
  min-width:78px;
  height:78px;
  padding:0 18px;
  white-space:nowrap;
  letter-spacing:.04em;
  margin:0 auto 34px;
  border:1px solid rgba(255,255,255,.4);
  display:grid;
  place-items:center;
  font-family:var(--serif);
  font-size:36px;
}
.cover h2{
  margin:0;
  color:#fff;
  font-family:var(--serif);
  font-size:62px;
  line-height:.95;
  letter-spacing:-.03em;
}
.cover p{
  max-width:520px;
  margin:18px auto 0;
  color:rgba(255,255,255,.76);
  font-size:14px;
  font-weight:650;
}
.belongs{
  width:360px;
  max-width:100%;
  margin:58px auto 0;
  padding-top:14px;
  border-top:1px solid rgba(255,255,255,.35);
  color:rgba(255,255,255,.75);
  font-size:10px;
  font-weight:850;
  letter-spacing:.16em;
  text-transform:uppercase;
}
.index-grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px 22px;
}
.index-group{
  break-inside:avoid;
  min-height:0;
}
.index-group h3{
  margin:0 0 7px;
  color:var(--accent);
  font-size:10px;
  font-weight:850;
  letter-spacing:.13em;
  text-transform:uppercase;
}
.index-link{
  display:flex;
  gap:10px;
  padding:4px 0;
  border-bottom:1px solid #edf0f3;
  color:var(--ink);
  font-size:10.5px;
  font-weight:650;
}
.index-link span:first-child{flex:1}
.index-link span:last-child{color:var(--muted)}
.index-page .content{gap:12px}
.index-layout{
  flex:1;
  min-height:0;
  display:flex;
  flex-direction:column;
  gap:16px;
}
.index-card-grid{
  display:grid;
  gap:7px;
}
.index-pill-grid{
  display:grid;
  grid-template-columns:repeat(5,minmax(0,1fr));
  gap:10px;
}
.index-section-grid{grid-template-columns:repeat(3,minmax(0,1fr))}
.write-line{flex:1;align-self:flex-end;height:0;margin:0 2px 4px 2px;border-bottom:1px solid currentColor;opacity:.35}
.course-label{white-space:nowrap;flex:0 0 auto}
.index-template-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:7px;
}
.template-library-grid{
  display:grid;
  grid-template-columns:repeat(6,minmax(0,1fr));
  gap:7px;
}
.index-tile,
.template-tile{
  border:1px solid #d8dde5;
  background:#fff;
  color:var(--deep);
  border-radius:3px;
  text-decoration:none;
  overflow:hidden;
}
.index-tile{
  min-height:36px;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:7px 6px;
  text-align:center;
  font-size:8px;
  line-height:1.12;
  font-weight:850;
  text-transform:uppercase;
}
.index-pill{
  min-height:46px;
  border-radius:999px;
  border-color:transparent;
  background:var(--accent);
  color:#fff;
  font-size:8.5px;
  letter-spacing:.02em;
}
.index-tone-tile{
  justify-content:flex-start;
  gap:7px;
  background:var(--tone-soft);
  border-color:var(--tone);
  color:var(--deep);
  text-align:left;
}
.section-dot{
  width:9px;
  height:9px;
  background:var(--tone);
  border-radius:50%;
  flex:0 0 auto;
}
.template-tile{
  aspect-ratio:1/1;
  min-height:0;
  padding:7px;
  display:flex;
  flex-direction:column;
  gap:6px;
  background:#fff;
  background-image:linear-gradient(var(--tone,var(--accent)),var(--tone,var(--accent)));
  background-repeat:no-repeat;
  background-size:100% 4px;
}
.template-tile strong{
  color:var(--deep);
  font-size:7.2px;
  line-height:1.08;
  font-weight:850;
  text-transform:uppercase;
}
.template-tile span:not(.mini-preview){
  margin-top:auto;
  color:var(--muted);
  font-size:6.4px;
  font-weight:800;
  text-transform:uppercase;
}
.index-template-grid .template-tile{
  padding:6px 5px 5px;
  gap:4px;
}
.index-template-grid .template-tile strong{
  font-size:7px;
}
.index-template-grid .template-tile span:not(.mini-preview){
  display:none;
}
.mini-preview{
  flex:1;
  min-height:0;
  border:1px solid #dce2e8;
  background:#fff;
  display:block;
}
.preview-lined{background-image:repeating-linear-gradient(to bottom,#fff 0,#fff 7px,#d8dde5 8px)}
.preview-wide-lined{background-image:repeating-linear-gradient(to bottom,#fff 0,#fff 10px,#d8dde5 11px)}
.preview-narrow-lined{background-image:repeating-linear-gradient(to bottom,#fff 0,#fff 5px,#d8dde5 6px)}
.preview-yellow-ruled{background:#fff7c8;background-image:linear-gradient(90deg,rgba(216,221,229,0) 0 18%,#eab3a4 18% calc(18% + 1.5px),rgba(216,221,229,0) calc(18% + 1.5px)),repeating-linear-gradient(to bottom,rgba(216,221,229,0) 0,rgba(216,221,229,0) 8px,#b8c6da 9px)}
.preview-grid{background-image:linear-gradient(#e2e6eb 1px,rgba(216,221,229,0) 1px),linear-gradient(90deg,#e2e6eb 1px,rgba(216,221,229,0) 1px);background-size:10px 10px}
.preview-fine-grid{background-image:linear-gradient(#e2e6eb 1px,rgba(216,221,229,0) 1px),linear-gradient(90deg,#e2e6eb 1px,rgba(216,221,229,0) 1px);background-size:6px 6px}
.preview-large-grid{background-image:linear-gradient(#e2e6eb 1px,rgba(216,221,229,0) 1px),linear-gradient(90deg,#e2e6eb 1px,rgba(216,221,229,0) 1px);background-size:16px 16px}
.preview-dot-grid,
.preview-mind-map{background-image:radial-gradient(#cfd6df 1px,rgba(216,221,229,0) 1px);background-size:9px 9px}
.preview-large-dot{background-image:radial-gradient(#cfd6df 1px,rgba(216,221,229,0) 1px);background-size:16px 16px}
.preview-blank{background:#fff}
.preview-cornell{background:linear-gradient(90deg,rgba(216,221,229,0) 0 32%,#d8dde5 32% calc(32% + 1.5px),rgba(216,221,229,0) calc(32% + 1.5px)),linear-gradient(to bottom,rgba(216,221,229,0) 0 72%,#d8dde5 72% calc(72% + 1.5px),rgba(216,221,229,0) calc(72% + 1.5px)),repeating-linear-gradient(to bottom,#fff 0,#fff 7px,#e6e9ee 8px)}
.preview-split{background:linear-gradient(90deg,rgba(216,221,229,0) 0 49%,#d8dde5 49% calc(49% + 1.5px),rgba(216,221,229,0) calc(49% + 1.5px)),repeating-linear-gradient(to bottom,#fff 0,#fff 8px,#e6e9ee 9px)}
.preview-kanban{background:linear-gradient(90deg,rgba(216,221,229,0) 0 33%,#d8dde5 33% calc(33% + 1.5px),rgba(216,221,229,0) calc(33% + 1.5px) 66%,#d8dde5 66% calc(66% + 1.5px),rgba(216,221,229,0) calc(66% + 1.5px))}
.preview-table{background-image:linear-gradient(#d8dde5 1.5px,rgba(216,221,229,0) 1.5px),linear-gradient(90deg,#d8dde5 1.5px,rgba(216,221,229,0) 1.5px);background-size:25% 11%;background-color:#fff}
body.theme-dark .preview-table{background-image:linear-gradient(#405066 1.5px,rgba(64,80,102,0) 1.5px),linear-gradient(90deg,#405066 1.5px,rgba(64,80,102,0) 1.5px);background-color:#0d141d}
.preview-monthly{background-image:linear-gradient(#d8dde5 1px,rgba(216,221,229,0) 1px),linear-gradient(90deg,#d8dde5 1px,rgba(216,221,229,0) 1px);background-size:14.28% 18%}
.preview-structured{background:linear-gradient(to bottom,rgba(216,221,229,0) 0 22%,#d8dde5 22% calc(22% + 1.5px),rgba(216,221,229,0) calc(22% + 1.5px) 68%,#d8dde5 68% calc(68% + 1.5px),rgba(216,221,229,0) calc(68% + 1.5px)),linear-gradient(90deg,rgba(216,221,229,0) 0 50%,#d8dde5 50% calc(50% + 1.5px),rgba(216,221,229,0) calc(50% + 1.5px))}
.metric-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:10px;
}
.metric{
  border:1px solid var(--line);
  background:#fff;
  padding:11px 12px;
  min-height:60px;
  color:var(--deep);
  font-size:17px;
  font-weight:850;
}
.metric span{
  display:block;
  margin-bottom:4px;
  color:var(--muted);
  font-size:8.5px;
  font-weight:850;
  letter-spacing:.1em;
  text-transform:uppercase;
}
.band,
.box{
  border:1px solid #d8dde5;
  background:#fff;
  border-radius:3px;
  padding:15px 16px;
}
.band h3,
.box h3,
.cell h3{
  margin:0 0 12px;
  color:var(--accent-2);
  font-size:9.5px;
  font-weight:850;
  letter-spacing:.11em;
  text-transform:uppercase;
}
.section-tabs,
.tool-grid,
.template-grid{
  display:grid;
  grid-template-columns:repeat(auto-fit,minmax(0,1fr));
  gap:9px;
}
.section-tabs{grid-template-columns:repeat(6,minmax(0,1fr))}
.binder-section-grid{
  grid-template-columns:repeat(3,minmax(0,1fr));
  grid-auto-rows:1fr;
}
.smart-tool-grid{
  grid-template-columns:repeat(4,minmax(0,1fr));
  grid-template-rows:repeat(3,1fr);
}
.tab-link,
.tool-link,
.section-link{
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  min-height:38px;
  padding:8px 7px;
  background:var(--accent);
  color:#fff;
  border:1px solid var(--accent);
  border-radius:3px;
  font-size:8.5px;

function esc(value){

  })[ch]);
}

function activePalette(){
  const className = String(document.body.className || "");
  if(className.includes("theme-vibrant")) return vibrantPalette;
  if(className.includes("theme-pastel")) return pastelPalette;
  if(className.includes("theme-multi")) return multiPalette;
  return null;
}

function toneStyle(index){
  const palette = activePalette();
  if(palette){
    const tone = palette[index % palette.length];
    return `--tone:${tone.tone};--tone-soft:${tone.soft};--tone-ink:${tone.ink};`;
  }
  const tone = toneOffsets[index % toneOffsets.length];
  return `--tone:hsl(calc(var(--theme-h) + ${tone.h}) calc(var(--theme-s) + ${tone.s}%) calc(var(--theme-l) + ${tone.l}%));--tone-soft:hsl(calc(var(--theme-h) + ${tone.h}) calc(var(--theme-s) - 12%) 94%);--tone-ink:#fff;`;
}

function toneIndexFromString(value){
  return String(value || "").split("").reduce((sum,ch)=>sum + ch.charCodeAt(0),0) % toneOffsets.length;
}

function buttonToneStyle(index){
  return activePalette() ? `${toneStyle(index)}background:var(--tone);border-color:var(--tone);color:var(--tone-ink,#fff);` : "";
}

function sectionSlots(c){
  const meta = notebookModeMeta(c.notebookType);
  const numbered = (i)=>({name:`${meta.sectionSingular} ${String(i+1).padStart(2,"0")}`, writeIn:true});
  const source = c.sectionMode === "custom" ? c.customNames
    : (c.sectionMode === "preset" && c.notebookType !== "student") ? (sectionPresets[c.notebookType] || []) : [];
  return Array.from({length:c.sectionCount},(_,i)=>source[i] ? {name:source[i], writeIn:false} : numbered(i));
}

function sectionNames(c){
  return sectionSlots(c).map(s=>s.name);
}

function isWriteIn(c,i){
  return sectionSlots(c)[i]?.writeIn;
}

  const meta = notebookModeMeta($("notebookType")?.value || "student");
  const links = [
    ["#index","Index",true],

    ["#templates","Templates",$("includeTemplates").checked],
    ["#planner-hub","Planner",$("includePlanner").checked],
    ["#smart-hub","AI Hub",$("includeSmart").checked],
    ["#stickers","Stickers",$("includeStickers").checked]
  ];
  return `<nav class="nav">${backLink ? `<a class="back-link" href="#${backLink[0]}">&larr; ${esc(backLink[1])}</a>` : ""}${links.filter(([, , active])=>active).map(([href,label],i)=>`<a style="${buttonToneStyle(i)}" href="${href}">${label}</a>`).join("")}</nav>`;
}

function compactDateTime(date, time){
  const cleanDate = (date || "2026-01-01").replaceAll("-","");
  const cleanTime = (time || "09:00").replace(":","") + "00";
  return `${cleanDate}T${cleanTime}`;
}

function endTime(time, minutes=30){
  const [h,m] = (time || "09:00").split(":").map(Number);
  const d = new Date(2026,0,1,h || 9,m || 0);
  d.setMinutes(d.getMinutes() + minutes);
  return `${String(d.getHours()).padStart(2,"0")}:${String(d.getMinutes()).padStart(2,"0")}`;
}

function previewClass(kind){
  if(kind === "wide-lined") return "preview-wide-lined";
  if(kind === "narrow-lined") return "preview-narrow-lined";
  if(kind === "yellow-ruled") return "preview-yellow-ruled";
  if(kind === "fine-grid") return "preview-fine-grid";
  if(kind === "large-grid") return "preview-large-grid";
  if(kind === "large-dot") return "preview-large-dot";
  if(kind === "grid") return "preview-grid";
  if(kind === "dot-grid") return "preview-dot-grid";
  if(kind === "blank") return "preview-blank";
  if(kind === "cornell") return "preview-cornell";
  if(kind === "split" || kind === "two-column") return "preview-split";
  if(kind === "kanban") return "preview-kanban";
  if(kind === "mind-map") return "preview-mind-map";
  if(["habit","assignment","vocab","source"].includes(kind)) return "preview-table";
  if(kind === "monthly") return "preview-monthly";
  if(kind === "lined") return "preview-lined";
  return "preview-structured";
}

function previewKindFromId(id){
  if(id.startsWith("template-")) return id.replace("template-","");
  const planner = plannerPages.find(([pageId])=>pageId === id);
  return planner ? planner[2] : "lined";
}

      <div class="table three-rows">
        <div class="row"><div class="cell"><h3>${esc(data[0])}</h3>${fields(data.slice(1))}</div></div>
        <div class="row two"><div class="cell"><h3>Details</h3>${lineSet(6)}</div><div class="cell"><h3>Notes</h3>${lineSet(6)}</div></div>
        <div class="row"><div class="cell"><h3>Next Steps</h3>${lineSet(5)}</div></div>
      </div>
    `;
  }
  if(kind === "cornell"){
    return `<div class="template-sheet"><div class="template-head"><span>${esc(title)}</span><span>Cornell</span></div><div class="paper-area"><div class="cornell-paper"><div class="cue ruled-paper"></div><div class="notes ruled-paper"></div><div class="summary ruled-paper"></div></div></div></div>`;
  }
  if(kind === "split" || kind === "two-column"){
    return `<div class="template-sheet"><div class="template-head"><span>${esc(title)}</span><span>Split Notes</span></div><div class="paper-area"><div class="split-paper"><div class="ruled-paper"></div><div class="ruled-paper"></div></div></div></div>`;
  }
  if(kind === "kanban"){
    return `<div class="template-sheet"><div class="template-head"><span>${esc(title)}</span><span>Kanban</span></div><div class="paper-area"><div class="kanban-paper"><div><h4>To Do</h4></div><div><h4>Doing</h4></div><div><h4>Done</h4></div></div></div></div>`;
  }
  if(kind === "mind-map"){
    const nodes = [[50,14],[84,32],[84,68],[50,86],[16,68],[16,32]];
    const lines = nodes.map(([x,y])=>`<line x1="50" y1="50" x2="${x}" y2="${y}"/>`).join("");
    const bubbles = nodes.map(([x,y])=>`<ellipse cx="${x}" cy="${y}" rx="12" ry="6"/>`).join("");
    return `<div class="template-sheet"><div class="template-head"><span>${esc(title)}</span><span>Mind Map</span></div><div class="paper-area mind-map-area"><div class="dot-paper"></div><svg class="mind-map-svg" viewBox="0 0 100 100" preserveAspectRatio="none"><g class="mm-lines">${lines}</g><g class="mm-nodes">${bubbles}<ellipse class="mm-center" cx="50" cy="50" rx="17" ry="8"/></g></svg><span class="mm-label">Main idea</span></div></div>`;
  }
  const paperClass = {
    "lined":"ruled-paper",
    "wide-lined":"wide-paper",
    "narrow-lined":"narrow-paper",
    "yellow-ruled":"yellow-ruled-paper",
    "grid":"grid-paper",
    "fine-grid":"fine-grid-paper",
    "large-grid":"large-grid-paper",
    "dot-grid":"dot-paper",
    "large-dot":"large-dot-paper",
    "blank":"blank-paper"
  }[kind] || "ruled-paper";
  return `<div class="template-sheet"><div class="template-head"><span>${esc(title)}</span><span>${esc(label)}</span></div><div class="paper-area"><div class="${paperClass}"></div></div></div>`;
}

function config(){
  return {
    title:$("notebookTitle").value.trim() || "Smart Notebook",
    owner:$("ownerLabel").value.trim() || "This notebook belongs to",
    notebookType:$("notebookType").value,
    sectionCount:Number($("sectionCount").value),
    sectionMode:$("sectionMode").value,
    customNames:$("customNames").value.split("\n").map(s=>s.trim()).filter(Boolean),
    pagesPerSection:Number($("pagesPerSection").value),
    formatLabel:$("formatLabel").value,
    formatName:$("formatLabel").selectedOptions[0].textContent,
    taskLabel:$("taskLabel").value.trim() || "Notebook Task",
    includeTemplates:$("includeTemplates").checked,
    includePlanner:$("includePlanner").checked,
    includeSmart:$("includeSmart").checked,
    includeStickers:$("includeStickers").checked,
    edition:notebookModeMeta($("notebookType").value).study ? "Hyperlinked PDF for notes, planning, AI study support, and smart calendar shortcuts" : "Hyperlinked PDF for notes, planning, AI tools, and smart calendar shortcuts",
    totalPages:0
  };
}

function collectEntries(c){
  const meta = notebookModeMeta(c.notebookType);
  const entries = [
    {group:"Start Here",id:"cover",title:"Cover",label:"Start"},
    {group:"Start Here",id:"index",title:"Index",label:"Links"},
    {group:"Start Here",id:"dashboard",title:"Dashboard",label:"Overview"},
    {group:"Start Here",id:"student-setup",title:meta.setupTitle,label:"Setup"},
    {group:"Navigation",id:"sections",title:meta.indexTitle,label:`${c.sectionCount} ${meta.navLabel.toLowerCase()}`}
  ];
  if(c.includeTemplates) entries.push({group:"Navigation",id:"templates",title:"Template Library",label:`${activeTemplates(c).length} pages`});
  if(c.includePlanner) entries.push({group:"Navigation",id:"planner-hub",title:"Planner Hub",label:"Pages"});
  if(c.includeSmart) entries.push({group:"Navigation",id:"smart-hub",title:"AI Hub",label:"Links"});
  if(c.includeStickers) entries.push({group:"Navigation",id:"stickers",title:"Sticker Sheet",label:"Extras"});
  entries.push({group:"Navigation",id:"duplicate-guide",title:"Duplicate Pages Guide",label:"Pages"});
  if(c.includeSmart) entries.push({group:"Navigation",id:"instructions",title:"Shortcut Instructions",label:"Setup"});

  sectionNames(c).forEach((name,i)=>{
    const sectionId = i + 1;
    entries.push({group:"Binder Sections",id:`section-${sectionId}`,title:name,label:"Divider"});
    for(let p=1;p<=c.pagesPerSection;p++){
      entries.push({group:"Binder Sections",id:`section-${sectionId}-page-${p}`,title:`${name} Page ${p}`,label:"Note"});
    }
  });
  if(c.includeTemplates){
    activeTemplates(c).forEach(([id,title])=>entries.push({group:"Templates",id:`template-${id}`,title,label:"Template"}));
  }
  if(c.includePlanner && !c.includeTemplates){
    plannerPages.forEach(([id,title])=>entries.push({group:"Planner Pages",id,title,label:"Plan"}));
  }
  return entries;
}

function generate(){
  const c = config();
  CURRENT = c;
  const entries = collectEntries(c);
  c.totalPages = entries.length;
  let html = coverPage(c);
  html += indexPage(entries);
  html += dashboardPage(c);
  html += studentSetupPage(c);
  html += sectionsHub(c);
  if(c.includeTemplates) html += templateLibraryPage(c);
  if(c.includePlanner) html += plannerHubPage(c);
  if(c.includeSmart) html += smartHubPage(c);
  if(c.includeStickers) html += stickerPage(c);
  html += duplicateGuidePage(c);
  if(c.includeSmart) html += instructionsPage(c);

  sectionNames(c).forEach((name,i)=>{
    const sectionIndex = i + 1;
    html += sectionDivider(sectionIndex, name, c);
    for(let p=1;p<=c.pagesPerSection;p++) html += sectionNotePage(sectionIndex, name, p, c);
  });
  if(c.includeTemplates) activeTemplates(c).forEach(([id,title])=>html += templatePage(id,title));
  if(c.includePlanner && !c.includeTemplates) plannerPages.forEach(([id,title,kind])=>html += plannerTemplatePage(id,title,kind));

  notebook.innerHTML = html;
  const sizes = {ipad:"8.5in 11.333in", letter:"letter", a4:"A4"};
  $("pageSizeRule").textContent = `@page{size:${sizes[c.formatLabel] || sizes.ipad}}`;
  const themeName = document.querySelector(".chip.active")?.textContent.trim() || "Graphite";
  const clean = (s)=>String(s).normalize("NFKD").replace(/[\u0300-\u036f]/g,"").replace(/['’]/g,"").replace(/[^A-Za-z0-9 ]+/g," ").split(/\s+/).filter(Boolean).map(w=>/[A-Z]/.test(w) ? w : w[0].toUpperCase()+w.slice(1)).join("");
  document.title = [c.title, themeName, c.formatName].map(clean).filter(Boolean).join("-");
}

document.querySelectorAll("[data-theme]").forEach(btn=>{
  btn.addEventListener("click",()=>{
    document.querySelectorAll("[data-theme]").forEach(b=>b.classList.remove("active"));
    btn.classList.add("active");
    document.body.className = "theme-" + btn.dataset.theme;
    generate();
  });
});
const modeDefaults = {
  student:{title:"Smart Study Notebook", task:"Notebook Study Task"},
  work:{title:"Smart Work Notebook", task:"Notebook Work Task"},
  personal:{title:"Smart Personal Notebook", task:"Notebook Task"},
  teacher:{title:"Smart Teacher Notebook", task:"Teacher Planning Task"},
  nursing:{title:"Smart Nursing Notebook", task:"Nursing Study Task"},
  medical:{title:"Smart Medical Notebook", task:"Medical Study Task"},
  health:{title:"Smart Health Sciences Notebook", task:"Health Sciences Study Task"}
};
$("notebookType").addEventListener("change",()=>{
  const d = modeDefaults[$("notebookType").value];
  const isDefault = (id,key)=>{const v=$(id).value.trim();return !v || Object.values(modeDefaults).some(m=>m[key]===v);};
  if(isDefault("notebookTitle","title")) $("notebookTitle").value = d.title;
  if(isDefault("taskLabel","task")) $("taskLabel").value = d.task;
});
document.querySelectorAll("input,select,textarea").forEach(el=>el.addEventListener("change",generate));
["notebookTitle","ownerLabel","taskLabel","customNames"].forEach(id=>$(id).addEventListener("input",generate));
$("sectionMode").addEventListener("change",()=>{$("customNamesField").hidden = $("sectionMode").value !== "custom";});
$("regenerate").addEventListener("click",generate);
generate();
</script>
</body>
</html>
