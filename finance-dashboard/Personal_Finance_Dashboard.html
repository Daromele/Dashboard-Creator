<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Personal Finance Dashboard</title>
<style>
:root{
  --bg:#f5f0e6; --bg2:#ede6d8; --surface:#fffdf9; --surface2:#faf6ee; --line:#e4dccb; --line2:#d3c9b4;
  --ink:#2a2824; --ink2:#5d574c; --muted:#8a8374; --accent:#b8643a; --accent2:#a0532d; --accent-soft:#f3e3d7;
  --good:#5a7f54; --good-soft:#e6eee2; --bad:#b4463f; --bad-soft:#f5e3e1; --warn:#c48f2c; --warn-soft:#f7ecd6; --info:#5b7a8c; --info-soft:#e2ebf0;
  --c1:#2a2824; --c2:#b8643a; --c3:#7a8f6a; --c4:#c9a24e; --c5:#8b6f8e; --c6:#5b7a8c; --c7:#b58a6b; --c8:#9aa69a; --c9:#d4a373; --c10:#6d6875;
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:14px; --r-sm:8px; --shadow:0 1px 2px rgba(42,40,36,.05),0 6px 20px -8px rgba(42,40,36,.12);
  --sidebar:240px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}h4{font-size:15px}
p{margin:0 0 .6em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.right{text-align:right}.center{text-align:center}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.mt{margin-top:16px}.mb{margin-bottom:16px}.mt-s{margin-top:8px}.mb-s{margin-bottom:8px}.mt-l{margin-top:28px}
.flex{display:flex;gap:10px;align-items:center}.flex-wrap{flex-wrap:wrap}.between{justify-content:space-between}.col{flex-direction:column;align-items:stretch}.grow{flex:1}
.grid{display:grid;gap:16px}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(max-width:1100px){.grid-5{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}}
@media(max-width:480px){.grid-4,.grid-5{grid-template-columns:1fr}}

/* Layout */
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--serif);font-size:18px}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:10px;cursor:pointer;color:var(--ink2);font-size:14.5px}
.nav button svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.active{background:var(--ink);color:#fff}
.side-foot{margin-top:auto;padding:12px 8px 0;font-size:12px;color:var(--muted)}
.backup-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--surface2);border:1px solid var(--line);font-size:12px;color:var(--ink2);cursor:pointer}
.backup-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:0 0 8px}
.backup-pill.linked .dot{background:var(--good)}.backup-pill.needs-permission .dot{background:var(--warn)}.backup-pill.error .dot{background:var(--bad)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:14px;padding:18px 32px 10px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,rgba(245,240,230,0));z-index:10}
.topbar h1{flex:1;font-size:26px}
.hamburger{display:none;background:var(--surface);border:1px solid var(--line);border-radius:10px;width:40px;height:40px;cursor:pointer}
.month-nav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:3px}
.month-nav button{background:none;border:0;width:30px;height:30px;border-radius:7px;cursor:pointer;color:var(--ink2);font-size:16px}
.month-nav button:hover{background:var(--surface2)}
.month-nav input[type=month]{border:0;background:none;font-weight:600;padding:4px 6px;min-width:150px;text-align:center}
.month-nav .lbl{font-weight:600;padding:0 8px;min-width:130px;text-align:center}
#view{padding:8px 32px 48px;flex:1}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .hamburger{display:block}
  .topbar{padding:14px 16px 8px}.topbar h1{font-size:22px}
  #view{padding:6px 16px 40px}
  .scrim{position:fixed;inset:0;background:rgba(42,40,36,.35);z-index:15}
}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;box-shadow:var(--shadow)}
.card.flat{box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.card-head h3{font-size:17px}
.kpi{padding:16px 18px}
.kpi .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted);margin-top:6px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:26px 0 12px}
.section-title h2{font-size:20px}
.callout{padding:12px 16px;border-radius:12px;background:var(--surface2);border:1px solid var(--line);font-size:14px}
.callout.warn{background:var(--warn-soft);border-color:#ecd7a6}.callout.bad{background:var(--bad-soft);border-color:#e6b9b5}.callout.good{background:var(--good-soft);border-color:#c5d6be}.callout.info{background:var(--info-soft);border-color:#bfd0da}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r)}
.empty h3{color:var(--ink2);margin-bottom:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:10px;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}.btn.primary:hover{background:#3a3733}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.accent:hover{background:var(--accent2)}
.btn.danger{color:var(--bad);border-color:#e6b9b5}.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--surface2)}
.btn.icon{padding:5px 7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;cursor:pointer;font-size:13px;color:var(--ink2)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.p1{background:#e2ebf0;border-color:#bfd0da;color:#3e5b6b}.chip.p2{background:#eee3ef;border-color:#d6c3d8;color:#6b4d6e}.chip.joint{background:var(--good-soft);border-color:#c5d6be;color:#3f5c3a}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:#8a6217}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.actions,th.actions{text-align:right;white-space:nowrap;width:1%}
tfoot td{font-weight:600;border-top:2px solid var(--line2);background:var(--surface2)}
.row-muted td{color:var(--muted)}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{width:100%;border:1px solid var(--line2);border-radius:9px;padding:8px 10px;background:#fff;font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(184,100,58,.35);border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--ink)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
.inline-input{border:1px solid transparent;background:transparent;border-radius:7px;padding:4px 6px;width:110px;text-align:right;font-variant-numeric:tabular-nums}
.inline-input:hover,.inline-input:focus{border-color:var(--line2);background:#fff}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters input,.filters select{width:auto;min-width:120px}
.filters input[type=search]{min-width:200px}

/* Progress */
.bar{height:10px;background:var(--bg2);border-radius:999px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--good);border-radius:999px;transition:width .3s}
.bar.over > i{background:var(--bad)}.bar.warn > i{background:var(--warn)}.bar.accent > i{background:var(--accent)}.bar.ink > i{background:var(--ink)}
.bar.thin{height:6px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(42,40,36,.45);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:18px;width:100%;max-width:640px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);animation:pop .15s ease-out}
.modal.wide{max-width:900px}.modal.narrow{max-width:460px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px}
.modal-body{padding:6px 22px 18px}
.modal-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line)}
.modal-foot .spacer{flex:1}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:8px}.x:hover{background:var(--surface2);color:var(--ink)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:600px){.modal-bg{padding:12px 8px}.modal{border-radius:14px}}

/* Toasts */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:360px}
.toast{background:var(--ink);color:#fff;padding:11px 16px;border-radius:12px;font-size:14px;box-shadow:var(--shadow);animation:pop .15s ease-out;display:flex;gap:10px;align-items:center}
.toast.good{background:var(--good)}.toast.bad{background:var(--bad)}.toast.warn{background:var(--warn);color:#2a2824}
.toast button{background:rgba(255,255,255,.18);border:0;color:inherit;padding:4px 9px;border-radius:7px;cursor:pointer;font-size:12.5px}

/* Charts */
.chart{width:100%;height:auto;display:block;font-family:var(--sans)}
.chart text{fill:var(--muted);font-size:11px}
.chart .grid line{stroke:var(--line);stroke-dasharray:2 3}
.chart .axis{stroke:var(--line2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donut-wrap .list{flex:1;min-width:180px;font-size:13.5px}
.donut-wrap .list div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.donut-wrap .list div:last-child{border-bottom:0}

/* Bill calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:4px 6px;background:var(--surface2);font-size:12px}
.cal .day.blank{background:transparent;border-color:transparent}
.cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .day .d{font-weight:600;color:var(--ink2);margin-bottom:3px}
.cal .day .it{display:block;padding:1px 5px;border-radius:5px;background:var(--surface);border:1px solid var(--line);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.cal .day .it.paid{opacity:.5;text-decoration:line-through}
.cal .day .it.sub{border-style:dashed}
@media(max-width:640px){.cal .day{min-height:48px;padding:3px}.cal .day .it{font-size:9.5px;padding:0 3px}}

/* Wizard */
.wiz-steps{display:flex;gap:6px;margin-bottom:18px}
.wiz-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wiz-steps i.on{background:var(--accent)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{border:1px solid var(--line2);border-radius:12px;padding:14px;cursor:pointer;display:block}
.choice label:has(input:checked){border-color:var(--ink);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--ink)}
.choice input{display:none}
.choice b{display:block;margin-bottom:3px}
.choice span{font-size:12.5px;color:var(--muted)}

/* Print */
.print-only{display:none}
@media print{
  @page{margin:16mm}
  body{background:#fff;font-size:12px}
  .sidebar,.topbar,.no-print,#toasts,.modal-bg{display:none!important}
  #app{display:block}#view{padding:0}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid;page-break-inside:avoid}
  .page-break{page-break-before:always;break-before:page}
  .print-only{display:block}
  h1{font-size:22px}
  table{font-size:11px}
  .grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo">₿</div><div><b>Finance Dashboard</b><span>Designs by Darowan</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <div class="backup-pill" id="backupPill" data-action="goto" data-view="settings" title="Backup status"><span class="dot"></span><span id="backupPillText">Backup off</span></div>
      <div class="mt-s tiny">v<span id="verLabel"></span> · Your data stays in this browser.</div>
    </div>
  </aside>
  <div class="scrim hidden" id="scrim" data-action="closeSidebar"></div>
  <main>
    <div class="topbar">
      <button class="hamburger" data-action="toggleSidebar" aria-label="Menu">☰</button>
      <h1 id="viewTitle">Overview</h1>
      <div class="month-nav" id="monthNav">
        <button data-action="monthShift" data-n="-1" aria-label="Previous month">‹</button>
        <span class="lbl" id="monthLabel" data-action="monthPick" title="Click to pick a month"></span>
        <button data-action="monthShift" data-n="1" aria-label="Next month">›</button>
      </div>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
<script id="engine">
/* ============================================================
   FINANCE ENGINE — pure functions, no DOM.
   This block is shared by the app and the self-test harness.
   ============================================================ */
'use strict';
const SCHEMA_VERSION = 1;
const APP_VERSION = '1.0.0';

// ---------- Date utilities (all ISO strings, no timezone math) ----------
const D = (() => {
  const pad = n => String(n).padStart(2, '0');
  const iso = (y, m, d) => `${y}-${pad(m)}-${pad(d)}`;
  const parse = s => { const [y, m, d] = String(s).split('-').map(Number); return { y, m, d: d || 1 }; };
  const dim = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();          // m is 1-12
  const clampDay = (y, m, d) => Math.min(Math.max(1, d), dim(y, m));
  const epochDay = s => { const { y, m, d } = parse(s); return Math.round(Date.UTC(y, m - 1, d) / 86400000); };
  const fromEpochDay = n => { const t = new Date(n * 86400000); return iso(t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()); };
  const addDays = (s, n) => fromEpochDay(epochDay(s) + n);
  const daysBetween = (a, b) => epochDay(b) - epochDay(a);
  const monthIndex = ym => { const { y, m } = parse(ym); return y * 12 + (m - 1); };
  const fromMonthIndex = i => `${Math.floor(i / 12)}-${pad((i % 12) + 1)}`;
  const addMonths = (ym, n) => fromMonthIndex(monthIndex(ym) + n);
  const monthDiff = (a, b) => monthIndex(b) - monthIndex(a);
  const monthsBetween = (a, b) => { const out = []; for (let i = monthIndex(a); i <= monthIndex(b); i++) out.push(fromMonthIndex(i)); return out; };
  const monthOf = s => String(s).slice(0, 7);
  const monthStart = ym => ym + '-01';
  const monthEnd = ym => { const { y, m } = parse(ym); return iso(y, m, dim(y, m)); };
  const today = () => { const t = new Date(); return iso(t.getFullYear(), t.getMonth() + 1, t.getDate()); };
  const thisMonth = () => today().slice(0, 7);
  const weekday = s => new Date(Date.UTC(parse(s).y, parse(s).m - 1, parse(s).d)).getUTCDay(); // 0=Sun
  const MONTHS = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONTHS_LONG = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const monthLabel = (ym, long) => { const { y, m } = parse(ym); return `${(long ? MONTHS_LONG : MONTHS)[m - 1]} ${y}`; };
  const dateLabel = s => { if (!s) return ''; const { y, m, d } = parse(s); return `${d} ${MONTHS[m - 1]} ${y}`; };
  const isValid = s => /^\d{4}-\d{2}-\d{2}$/.test(s || '') && (() => { const { y, m, d } = parse(s); return m >= 1 && m <= 12 && d >= 1 && d <= dim(y, m); })();
  return { pad, iso, parse, dim, clampDay, addDays, daysBetween, monthIndex, fromMonthIndex, addMonths, monthDiff, monthsBetween, monthOf, monthStart, monthEnd, today, thisMonth, weekday, monthLabel, dateLabel, isValid, MONTHS, MONTHS_LONG };
})();

const round2 = n => Math.round((n + Number.EPSILON) * 100) / 100;
const num = v => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const sum = (arr, f) => arr.reduce((a, x) => a + (f ? num(f(x)) : num(x)), 0);

// ---------- Frequency engine ----------
const FREQ = {
  weekly:      { label: 'Weekly',        unit: 'week',  every: 1, perYear: 52 },
  fortnightly: { label: 'Fortnightly',   unit: 'week',  every: 2, perYear: 26 },
  monthly:     { label: 'Monthly',       unit: 'month', every: 1, perYear: 12 },

// ---------- Debt engine ----------

 * Returns { schedule:[{month, perDebt:{id:{payment,interest,principal,balance}}, totalBalance, totalPayment}],

}

    return eq(r.payoffByDebt.A, '2026-03', 'A') === true && eq(r.payoffByDebt.B, '2026-07', 'B') === true && eq(r.schedule[3].perDebt.B.payment, 200, 'B m4 gets 200') === true && eq(r.monthsToDebtFree, 7);
  });
  T('short final payment frees remainder same month', () => {
    // A: 150 @0% min 100 → month 2 pays 50, the other 50 goes to B that month
    const r = simulateDebt([{ id: 'A', currentBalance: 150, apr: 0, minPayment: 100 }, { id: 'B', currentBalance: 1000, apr: 0, minPayment: 100 }], 'snowball', 0, '2026-01');
    return eq(r.schedule[1].perDebt.A.payment, 50) === true && eq(r.schedule[1].perDebt.B.payment, 150);
  });
  T('avalanche targets highest APR, snowball smallest balance', () => {
    const debts = [{ id: 'big', currentBalance: 1000, apr: 20, minPayment: 50 }, { id: 'small', currentBalance: 500, apr: 5, minPayment: 25 }];
    const av = simulateDebt(debts, 'avalanche', 100, '2026-01'), sn = simulateDebt(debts, 'snowball', 100, '2026-01');
    return eq(av.schedule[0].perDebt.big.payment, 150, 'av big') === true && eq(av.schedule[0].perDebt.small.payment, 25, 'av small') === true
      && eq(sn.schedule[0].perDebt.small.payment, 125, 'sn small') === true && eq(sn.schedule[0].perDebt.big.payment, 50, 'sn big') === true
      && (av.totalInterest < sn.totalInterest ? true : 'avalanche should cost less interest');
  });
  T('per-debt extra payment is committed and rolls', () => {
    const r = simulateDebt([{ id: 'A', currentBalance: 200, apr: 0, minPayment: 50, extraPayment: 50 }, { id: 'B', currentBalance: 1000, apr: 0, minPayment: 100 }], 'snowball', 0, '2026-01');
    return eq(r.payoffByDebt.A, '2026-02') === true && eq(r.schedule[2].perDebt.B.payment, 200);
  });
  T('never pays off is flagged and capped', () => {
    const r = simulateDebt([{ id: 'a', currentBalance: 1000, apr: 24, minPayment: 10 }], 'snowball', 0, '2026-01');
    return eq(r.neverPaysOff, true) === true && eq(r.schedule.length, 600) === true && eq(r.monthsToDebtFree, null);
  });
  T('no debts', () => { const r = simulateDebt([], 'snowball', 0, '2026-01'); return eq(r.schedule.length, 0) === true && eq(r.neverPaysOff, false); });
  T('blended APR', () => near(blendedApr([{ currentBalance: 1000, apr: 20 }, { currentBalance: 3000, apr: 4 }]), 8));

  // Rollover
  T('rollover surplus only', () => {
    const planned = { '2026-01': 100, '2026-02': 100, '2026-03': 100 }, actual = { '2026-01': 60, '2026-02': 170 };
    const p = (mo) => planned[mo] === undefined ? null : planned[mo], a = (mo) => actual[mo] || 0;
    return eq(rolloverInto('2026-02', 'x', 'surplus', p, a), 40, 'feb') === true && eq(rolloverInto('2026-03', 'x', 'surplus', p, a), 0, 'mar (overspent by 30 → 0)') === true && eq(rolloverInto('2026-03', 'x', 'full', p, a), -30, 'mar full') === true && eq(rolloverInto('2026-02', 'x', 'off', p, a), 0, 'off');
  });
  T('rollover stops where no budget exists', () => eq(rolloverInto('2026-02', 'x', 'full', () => null, () => 0), 0));

  // Goals
  T('goal projection', () => { const g = goalProjection({ target: 1200, current: 200, monthlyContribution: 250, targetDate: '2026-04-30' }, '2026-01'); return eq([g.remaining, g.monthsNeeded, g.projectedMonth, g.behind, g.requiredMonthly], [1000, 4, '2026-05', true, 333.33]); });
  T('goal complete', () => eq(goalProjection({ target: 100, current: 100, monthlyContribution: 0 }, '2026-01').pct, 100));

  // CSV
  T('csv parse quotes/newlines', () => eq(parseCSV('a,b\r\n"x, y","line1\nline2"\n"q""q",2'), [['a', 'b'], ['x, y', 'line1\nline2'], ['q"q', '2']]));
  T('csv roundtrip', () => { const rows = [['d', 'e'], ['1,2', 'he said "hi"']]; return eq(parseCSV(toCSV(rows)), rows); });
  T('date loose', () => eq([parseDateLoose('2026-03-04'), parseDateLoose('04/03/2026', true), parseDateLoose('03/04/2026', false), parseDateLoose('31/01/2026'), parseDateLoose('20260131'), parseDateLoose('nope')], ['2026-03-04', '2026-03-04', '2026-03-04', '2026-01-31', '2026-01-31', null]));
  T('amount loose', () => eq([parseAmountLoose('$1,234.56'), parseAmountLoose('(45.00)'), parseAmountLoose('-12'), parseAmountLoose('1.234,56'), parseAmountLoose('€ 99'), parseAmountLoose('')], [1234.56, -45, -12, 1234.56, 99, null]));

  // Validation
  T('import validation', () => eq([validateImport({ __schema: 1, settings: {} }).ok, validateImport({ __schema: 99, settings: {} }).ok, validateImport({}).ok, validateImport({ __schema: 1, settings: {}, txns: 'no' }).ok], [true, false, false, false]));

  const passed = results.filter(r => r.ok).length;
  out(`Self-tests: ${passed}/${results.length} passed`);
  results.filter(r => !r.ok).forEach(r => out(`  FAIL ${r.name}: ${r.detail}`));
  return { passed, total: results.length, results };
}
</script>
<script>
/* ============================================================
   APP CORE — state, storage, backup, UI helpers, charts
   ============================================================ */
const LS_KEY = 'pfd:v1:state';
const LS_SESS = 'pfd:v1:sessions';
const LS_LAST_EXPORT = 'pfd:v1:lastExportSession';
const LS_UI = 'pfd:v1:ui';
const IDB_NAME = 'pfd-backup', IDB_STORE = 'kv';
const VERIFY_EVERY = 20;
const REMIND_EVERY_SESSIONS = 5;

const DEFAULT_CATEGORIES = ['Housing', 'Utilities', 'Groceries', 'Transport', 'Insurance', 'Health', 'Dining', 'Entertainment', 'Subscriptions', 'Shopping', 'Personal', 'Kids', 'Pets', 'Gifts', 'Education', 'Debt Payments', 'Savings', 'Travel', 'Other'];
const INCOME_TYPES = ['Salary', 'Wages', 'Freelance', 'Business', 'Benefits', 'Rental', 'Investment', 'Pension', 'Other'];
const ACCOUNT_TYPES = [
  { v: 'checking', l: 'Checking / Current', liability: false, spendable: true },
  { v: 'savings', l: 'Savings', liability: false },
  { v: 'cash', l: 'Cash', liability: false, spendable: true },
  { v: 'investment', l: 'Investments', liability: false },
  { v: 'retirement', l: 'Retirement / Pension', liability: false },
  { v: 'property', l: 'Property', liability: false },
  { v: 'vehicle', l: 'Vehicle', liability: false },
  { v: 'other-asset', l: 'Other asset', liability: false },
  { v: 'credit-card', l: 'Credit card', liability: true },
  { v: 'loan', l: 'Loan', liability: true },
  { v: 'mortgage', l: 'Mortgage', liability: true },
  { v: 'other-liability', l: 'Other liability', liability: true },
];
const DEBT_TYPES = ['Credit card', 'Personal loan', 'Car loan', 'Student loan', 'Mortgage', 'Medical', 'Buy now pay later', 'Family loan', 'Other'];
const CURRENCIES = [
  ['USD', '$', 'en-US', 'US Dollar'], ['EUR', '€', 'de-DE', 'Euro'], ['GBP', '£', 'en-GB', 'British Pound'], ['AUD', 'A$', 'en-AU', 'Australian Dollar'],
  ['CAD', 'C$', 'en-CA', 'Canadian Dollar'], ['NZD', 'NZ$', 'en-NZ', 'New Zealand Dollar'], ['CHF', 'CHF', 'de-CH', 'Swiss Franc'], ['JPY', '¥', 'ja-JP', 'Japanese Yen'],
  ['INR', '₹', 'en-IN', 'Indian Rupee'], ['SEK', 'kr', 'sv-SE', 'Swedish Krona'], ['NOK', 'kr', 'nb-NO', 'Norwegian Krone'], ['DKK', 'kr', 'da-DK', 'Danish Krone'],
  ['ZAR', 'R', 'en-ZA', 'South African Rand'], ['BRL', 'R$', 'pt-BR', 'Brazilian Real'], ['MXN', '$', 'es-MX', 'Mexican Peso'], ['SGD', 'S$', 'en-SG', 'Singapore Dollar'],
  ['HKD', 'HK$', 'en-HK', 'Hong Kong Dollar'], ['PLN', 'zł', 'pl-PL', 'Polish Złoty'], ['CZK', 'Kč', 'cs-CZ', 'Czech Koruna'], ['PHP', '₱', 'en-PH', 'Philippine Peso'],
  ['AED', 'AED', 'en-AE', 'UAE Dirham'], ['ILS', '₪', 'he-IL', 'Israeli Shekel'], ['KRW', '₩', 'ko-KR', 'South Korean Won'], ['CUSTOM', '', 'en-US', 'Custom symbol'],
].map(([code, symbol, locale, name]) => ({ code, symbol, locale, name }));

// ---------- Storage wrapper (localStorage with quota detection) ----------
const storage = {
  get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
  set(k, v) {
    try { localStorage.setItem(k, v); return { ok: true }; }
    catch (e) {
      const quota = !!e && (e.name === 'QuotaExceededError' || e.name === 'NS_ERROR_DOM_QUOTA_REACHED' || e.code === 22 || e.code === 1014);
      return { ok: false, quota, error: e };
    }
  },
  remove(k) { try { localStorage.removeItem(k); } catch (e) { } },
  available() { try { localStorage.setItem('pfd:probe', '1'); localStorage.removeItem('pfd:probe'); return true; } catch (e) { return false; } },
};

// ---------- IndexedDB key/value (for file handle + last-known-good) ----------
const idb = {
  _db: null,
  open() {
    if (this._db) return Promise.resolve(this._db);
    return new Promise((res, rej) => {
      try {
        const rq = indexedDB.open(IDB_NAME, 1);
        rq.onupgradeneeded = () => rq.result.createObjectStore(IDB_STORE);
        rq.onsuccess = () => { this._db = rq.result; res(this._db); };
        rq.onerror = () => rej(rq.error);
      } catch (e) { rej(e); }
    });
  },
  async get(key) { try { const db = await this.open(); return await new Promise((res, rej) => { const r = db.transaction(IDB_STORE).objectStore(IDB_STORE).get(key); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); } catch (e) { return undefined; } },
  async set(key, val) { try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction(IDB_STORE, 'readwrite'); t.objectStore(IDB_STORE).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; } catch (e) { return false; } },
  async del(key) { try { const db = await this.open(); await new Promise((res, rej) => { const t = db.transaction(IDB_STORE, 'readwrite'); t.objectStore(IDB_STORE).delete(key); t.oncomplete = res; t.onerror = () => rej(t.error); }); } catch (e) { } },
};

// ---------- State ----------
let state = null;
const ui = { view: 'overview', month: D.thisMonth(), txnFilter: {}, debtStrategy: 'snowball', reportYear: D.thisMonth().slice(0, 4), calendarMode: 'list', budgetShowAll: false };

function defaultSettings() {
  return {
    householdMode: 'single', person1Name: 'Me', person2Name: 'Partner',
    currency: { code: 'USD', symbol: '$', locale: 'en-US' },
    startMonth: D.thisMonth(), safetyBuffer: 0, budgetRollover: 'off', includeSubsInBills: true,
    categories: DEFAULT_CATEGORIES.slice(), spendableTypes: ['checking', 'cash'], onboarded: false, emergencyMonths: 3,
  };
}
function blankState() {
  return { __schema: SCHEMA_VERSION, __app: APP_VERSION, savedAt: null, settings: defaultSettings(), accounts: [], income: [], bills: [], subs: [], txns: [], budgets: [], debts: [], goals: [], snapshots: [], billPaid: {} };
}
function normalizeState(s) {
  const b = blankState();
  const out = Object.assign(b, s);
  out.settings = Object.assign(defaultSettings(), s.settings || {});
  if (!out.settings.currency || typeof out.settings.currency !== 'object') out.settings.currency = defaultSettings().currency;
  if (!Array.isArray(out.settings.categories) || !out.settings.categories.length) out.settings.categories = DEFAULT_CATEGORIES.slice();
  for (const c of COLLECTIONS) if (!Array.isArray(out[c])) out[c] = [];
  if (!out.billPaid || typeof out.billPaid !== 'object') out.billPaid = {};
  for (const t of out.txns) { if (!Array.isArray(t.splits) || !t.splits.length) t.splits = [{ category: t.category || 'Other', amount: num(t.amount) }]; if (!t.month) t.month = D.monthOf(t.date); }
  out.__schema = SCHEMA_VERSION; out.__app = APP_VERSION;
  return out;
}
function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 8); }

function loadState() {
  const raw = storage.get(LS_KEY);
  if (!raw) return null;
  try {
    const parsed = JSON.parse(raw);
    const v = validateImport(parsed);
    if (!v.ok) { console.warn('Stored state invalid:', v.reason); return null; }
    return normalizeState(migrate(parsed));
  } catch (e) { console.warn('Could not parse stored state', e); return null; }
}
function serialize() { return JSON.stringify(state); }
function persist() {
  state.savedAt = new Date().toISOString();
  state.__app = APP_VERSION; state.__schema = SCHEMA_VERSION;
  const json = serialize();
  const r = storage.set(LS_KEY, json);
  if (!r.ok) toast(r.quota ? 'Browser storage is full. Export a JSON backup now and delete old transactions.' : 'Could not save to browser storage. Export a backup to be safe.', 'bad', 8000);
  backupFile.scheduleWrite();
  return json;
}
function commit(fn, opts) {
  if (typeof fn === 'function') fn(state);
  maybeSnapshot();
  persist();
  if (!opts || !opts.silent) render();
}
function saveUi() { storage.set(LS_UI, JSON.stringify({ view: ui.view, month: ui.month, debtStrategy: ui.debtStrategy, calendarMode: ui.calendarMode })); }
function loadUi() { try { const u = JSON.parse(storage.get(LS_UI) || '{}'); if (u.view) ui.view = u.view; if (u.debtStrategy) ui.debtStrategy = u.debtStrategy; if (u.calendarMode) ui.calendarMode = u.calendarMode; } catch (e) { } }

// ---------- Derived helpers ----------
const S = () => state.settings;
const isCouple = () => S().householdMode === 'couple';
const ownerName = o => o === 'p2' ? S().person2Name : o === 'joint' ? 'Joint' : S().person1Name;
const ownerChip = o => isCouple() ? `<span class="chip ${o || 'p1'}">${esc(ownerName(o || 'p1'))}</span>` : '';
const catList = () => S().categories;
const accountType = v => ACCOUNT_TYPES.find(t => t.v === v) || ACCOUNT_TYPES[0];
const byId = (coll, id) => (state[coll] || []).find(x => x.id === id);

function billItems() {
  const items = state.bills.slice();
  if (S().includeSubsInBills) items.push(...state.subs.map(subAsRecurring));
  return items;
}
function isBillPaid(month, id) { return !!(state.billPaid[month] && state.billPaid[month][id]); }
function expenseTxnsInMonth(month) { return state.txns.filter(t => t.month === month && t.type === 'expense'); }
function incomeTxnsInMonth(month) { return state.txns.filter(t => t.month === month && t.type === 'income'); }
const txnTotal = t => sum(t.splits, s => s.amount);
function categoryActuals(month) {
  const out = {};
  for (const t of expenseTxnsInMonth(month)) for (const s of t.splits) out[s.category || 'Other'] = round2((out[s.category || 'Other'] || 0) + num(s.amount));
  return out;
}
function expectedIncome(month) { return round2(sum(state.income, i => amountInMonth(i, month))); }
function expectedBills(month) { return round2(sum(billItems(), b => amountInMonth(b, month))); }
function monthSummary(month) {
  const income = round2(sum(incomeTxnsInMonth(month), txnTotal));
  const expenses = round2(sum(expenseTxnsInMonth(month), txnTotal));
  const saved = round2(sum(expenseTxnsInMonth(month), t => sum(t.splits.filter(sp => sp.category === 'Savings'), sp => sp.amount)));
  const net = round2(income - expenses);
  // Money moved into the "Savings" category is saved, not spent, so it counts toward the savings rate.
  const savingsRate = income > 0 ? (net + saved) / income * 100 : null;
  return { month, income, expenses, saved, net, savingsRate, expectedIncome: expectedIncome(month), expectedBills: expectedBills(month) };
}
function netWorth() {
  const assets = round2(sum(state.accounts.filter(a => !a.isLiability), a => a.balance));
  const liabilities = round2(sum(state.accounts.filter(a => a.isLiability), a => a.balance));
  const debts = round2(sum(state.debts, d => d.currentBalance));
  return { assets, liabilities, debts, net: round2(assets - liabilities - debts) };
}
function maybeSnapshot() {
  if (!state.accounts.length && !state.debts.length) return;
  const nw = netWorth(); const month = D.thisMonth();
  const i = state.snapshots.findIndex(s => D.monthOf(s.date) === month);
  const snap = { date: D.today(), assets: nw.assets, liabilities: round2(nw.liabilities + nw.debts), net: nw.net };
  if (i >= 0) { if (state.snapshots[i].net === snap.net && state.snapshots[i].assets === snap.assets) return; state.snapshots[i] = snap; }
  else state.snapshots.push(snap);
  state.snapshots.sort((a, b) => a.date < b.date ? -1 : 1);
}
function monthsWithData() {
  const set = new Set([D.thisMonth(), S().startMonth].filter(Boolean));
  for (const t of state.txns) set.add(t.month);
  for (const b of state.budgets) set.add(b.month);
  return [...set].sort();
}
function safeToSpend(month) {
  const today = D.today();
  const inMonth = month === D.thisMonth();
  const from = inMonth ? today : D.monthStart(month), to = D.monthEnd(month);
  const spendable = state.accounts.filter(a => !a.isLiability && (S().spendableTypes || []).includes(a.type));
  const available = round2(sum(spendable, a => a.balance));
  let upcomingBills = 0; const upcomingList = [];
  for (const b of billItems()) {
    if (isBillPaid(month, b.id)) continue;
    const hits = occurrences(b, from, to);
    if (hits.length) { upcomingBills = round2(upcomingBills + hits.length * num(b.amount)); upcomingList.push({ name: b.name, amount: hits.length * num(b.amount), date: hits[0], isSub: !!b._isSub }); }
  }
  const goals = round2(sum(state.goals.filter(g => num(g.current) < num(g.target)), g => g.monthlyContribution));
  const buffer = num(S().safetyBuffer);
  const result = round2(available - upcomingBills - goals - buffer);
  return { available, upcomingBills, upcomingList, goals, buffer, result, accounts: spendable };
}

// ---------- Backup file (File System Access API) ----------
const backupFile = {
  supported: typeof window !== 'undefined' && 'showSaveFilePicker' in window,
  handle: null, status: 'off', writeCount: 0, lastWrite: null, lastVerified: null, timer: null, fileName: '', lastError: '',
  async init() {
    if (!this.supported) { this.status = 'unsupported'; return; }
    try {
      const h = await idb.get('handle');
      if (!h) { this.status = 'off'; return; }
      this.handle = h; this.fileName = h.name || 'backup.json';
      const wc = await idb.get('writeCount'); if (typeof wc === 'number') this.writeCount = wc;
      const p = await h.queryPermission({ mode: 'readwrite' });
      if (p === 'granted') { this.status = 'linked'; await this.checkStale(); }
      else this.status = 'needs-permission';
    } catch (e) { this.status = 'error'; this.lastError = e.message; }
    this.renderStatus();
  },
  async link() {
    try {
      const h = await window.showSaveFilePicker({ suggestedName: 'Finance-Dashboard-Backup.json', types: [{ description: 'JSON backup', accept: { 'application/json': ['.json'] } }] });
      this.handle = h; this.fileName = h.name; this.status = 'linked'; this.writeCount = 0;
      await idb.set('handle', h);
      await this.write(true);
      toast(`Auto-backup linked to ${h.name}`, 'good');
    } catch (e) { if (e.name !== 'AbortError') { this.status = 'error'; this.lastError = e.message; toast('Could not link backup file: ' + e.message, 'bad'); } }
    this.renderStatus(); render();
  },
  async unlink() {
    this.handle = null; this.status = 'off'; this.fileName = '';
    await idb.del('handle');
    this.renderStatus(); render();
    toast('Auto-backup turned off. Your data stays in this browser.', 'default');
  },
  async requestPermission() {
    if (!this.handle) return;
    try {
      const p = await this.handle.requestPermission({ mode: 'readwrite' });
      if (p === 'granted') { this.status = 'linked'; await this.checkStale(); await this.write(true); toast('Auto-backup reconnected', 'good'); }
      else toast('Permission not granted — auto-backup stays paused', 'warn');
    } catch (e) { this.status = 'error'; this.lastError = e.message; }
    this.renderStatus(); render();
  },
  scheduleWrite() {
    if (this.status !== 'linked' || !this.handle) return;
    clearTimeout(this.timer);
    this.timer = setTimeout(() => this.write(false), 2000);
  },
  async write(force) {
    if (!this.handle || (this.status !== 'linked' && !force)) return;
    const payload = serialize();
    try {
      const w = await this.handle.createWritable();
      await w.write(payload); await w.close();
      this.writeCount++; this.lastWrite = new Date(); this.status = 'linked';
      idb.set('writeCount', this.writeCount);
      if (force || this.writeCount % VERIFY_EVERY === 0) await this.verify(payload);
    } catch (e) {
      if (e.name === 'NotAllowedError' || e.name === 'SecurityError') { this.status = 'needs-permission'; toast('Auto-backup needs permission again', 'warn', 6000, { label: 'Allow', action: 'backupPermission' }); }
      else { this.status = 'error'; this.lastError = e.message; toast('Auto-backup write failed: ' + e.message, 'bad'); }
    }
    this.renderStatus();
  },
  async verify(payload) {
    try {
      const f = await this.handle.getFile();
      const text = await f.text();
      const parsed = JSON.parse(text);
      const a = recordCounts(parsed), b = recordCounts(state);
      const same = JSON.stringify(a) === JSON.stringify(b) && parsed.savedAt === state.savedAt;
      if (same) { this.lastVerified = new Date(); await idb.set('lkg', text); await idb.set('lkgAt', state.savedAt); }
      else { this.status = 'error'; this.lastError = 'Verification mismatch'; toast('Backup verification failed — the file on disk does not match. Export a manual JSON backup.', 'bad', 9000); }
    } catch (e) { this.status = 'error'; this.lastError = 'Verify: ' + e.message; toast('Could not verify backup file: ' + e.message, 'bad'); }
  },
  async checkStale() {
    try {
      const f = await this.handle.getFile();
      if (!f.size) return;
      const parsed = JSON.parse(await f.text());
      const v = validateImport(parsed);
      if (!v.ok) return;
      if (parsed.savedAt && state.savedAt && parsed.savedAt > state.savedAt) {
        await new Promise(resolve => {
          openModal(`<div class="modal narrow"><div class="modal-head"><h3>Backup file is newer</h3></div><div class="modal-body">
            <p>The linked backup file was saved <b>${esc(fmtDateTime(parsed.savedAt))}</b>, which is newer than the data in this browser (saved ${esc(fmtDateTime(state.savedAt))}).</p>
            <p class="small muted">This usually means you used the dashboard on another device or browser. Choose which copy to keep — nothing is overwritten until you pick.</p>
            <div class="small mt"><b>File:</b> ${countsLabel(recordCounts(parsed))}<br><b>This browser:</b> ${countsLabel(recordCounts(state))}</div>
          </div><div class="modal-foot"><button class="btn" data-modal-result="local">Keep this browser's data</button><span class="spacer"></span><button class="btn primary" data-modal-result="file">Restore from file</button></div></div>`,
            { onResult: (r) => { if (r === 'file') { state = normalizeState(migrate(parsed)); buildFormatter(); persist(); toast('Restored from backup file', 'good'); } resolve(); }, sticky: true });
        });
      }
    } catch (e) { console.warn('Stale check failed', e); }
  },
  async lkg() { return await idb.get('lkg'); },
  statusText() {
    return { off: 'Backup off', linked: 'Auto-backup on', 'needs-permission': 'Backup needs permission', error: 'Backup error', unsupported: 'Manual backup only' }[this.status] || this.status;

views.budget = {
  title: 'Budget',
  render() {
    const month = ui.month, mode = S().budgetRollover;
    const actuals = categoryActuals(month);
    const plannedFn = (mo, cat) => { const b = state.budgets.find(x => x.month === mo && x.category === cat); return b ? num(b.planned) : null; };
    const actualFn = (mo, cat) => categoryActuals(mo)[cat] || 0;
    const rows = catList().map(cat => {
      const planned = plannedFn(month, cat);
      const carry = mode === 'off' ? 0 : rolloverInto(month, cat, mode, plannedFn, actualFn, S().startMonth);
      const effective = round2((planned || 0) + carry);
      const actual = actuals[cat] || 0;
      return { cat, planned, carry, effective, actual, remaining: round2(effective - actual), hasBudget: planned !== null };
    });
    const shown = ui.budgetShowAll ? rows : rows.filter(r => r.hasBudget || r.actual > 0);
    const totPlanned = sum(rows, r => r.effective), totActual = sum(rows, r => r.actual);
    const unbudgeted = rows.filter(r => !r.hasBudget && r.actual > 0);
    const prev = D.addMonths(month, -1); const prevHas = state.budgets.some(b => b.month === prev);
    const hasAny = rows.some(r => r.hasBudget);
    const pctUsed = totPlanned ? totActual / totPlanned * 100 : 0;
    return `
      <div class="grid grid-4">
        ${kpi('Planned', fmt0(totPlanned), mode !== 'off' ? 'Including rollover' : '')}
        ${kpi('Spent', fmt0(totActual), `${fmtPct(pctUsed)} of plan`, totActual > totPlanned && totPlanned ? 'bad' : '')}
        ${kpi('Remaining', fmt0(totPlanned - totActual), '', signCls(totPlanned - totActual))}
        ${kpi('Over budget', String(rows.filter(r => r.hasBudget && r.actual > r.effective).length), 'categories', rows.some(r => r.hasBudget && r.actual > r.effective) ? 'bad' : '')}
      </div>
      <div class="card mt">
        <div class="card-head"><h3>${esc(D.monthLabel(month, true))}</h3><div class="flex flex-wrap">
          ${prevHas ? `<button class="btn sm" data-action="budgetCopyPrev">Copy ${esc(D.monthLabel(prev))}</button>` : ''}
          <button class="btn sm" data-action="budgetFromAverage" title="Set each category to its average spend over the last 3 months">Suggest from last 3 months</button>
          <label class="check small"><input type="checkbox" data-change="budgetShowAll" ${ui.budgetShowAll ? 'checked' : ''}> Show all categories</label>
          <button class="btn sm ghost" data-action="goto" data-view="settings">Rollover: ${esc({ off: 'off', surplus: 'surplus', full: 'full' }[mode] || 'off')}</button></div></div>
        ${!hasAny && !shown.length ? emptyBox('No budget for this month', 'Type planned amounts below — every category is editable inline. Press Enter or click away to save.', '') : ''}
        <div class="table-wrap"><table>
          <thead><tr><th>Category</th><th class="right">Planned</th>${mode !== 'off' ? '<th class="right">Rollover</th><th class="right">Available</th>' : ''}<th class="right">Spent</th><th class="right">Remaining</th><th style="width:26%">Progress</th></tr></thead>
          <tbody>${(shown.length ? shown : rows).map(r => {
            const over = r.hasBudget && r.actual > r.effective; const p = r.effective > 0 ? r.actual / r.effective * 100 : (r.actual > 0 ? 100 : 0);
            return `<tr><td>${esc(r.cat)}${!r.hasBudget && r.actual > 0 ? ' <span class="chip warn" title="Spending with no budget set">unbudgeted</span>' : ''}</td>
              <td class="right"><input class="inline-input" type="number" step="0.01" min="0" inputmode="decimal" value="${r.planned === null ? '' : r.planned}" placeholder="—" data-change="budgetSet" data-cat="${attr(r.cat)}"></td>
              ${mode !== 'off' ? `<td class="right num ${signCls(r.carry)}">${r.carry ? fmt(r.carry, { sign: true }) : '—'}</td><td class="right num">${r.hasBudget ? fmt(r.effective) : '—'}</td>` : ''}
              <td class="right num">${fmt(r.actual)}</td><td class="right num ${over ? 'bad' : r.hasBudget ? 'good' : 'muted'}">${r.hasBudget ? fmt(r.remaining) : '—'}</td>
              <td>${progressBar(p, over ? 'over' : p > 85 ? 'warn' : '')}</td></tr>`;
          }).join('')}</tbody>
          <tfoot><tr><td>Total</td><td class="right num">${fmt(sum(rows, r => r.planned || 0))}</td>${mode !== 'off' ? `<td class="right num">${fmt(sum(rows, r => r.carry))}</td><td class="right num">${fmt(totPlanned)}</td>` : ''}<td class="right num">${fmt(totActual)}</td><td class="right num ${signCls(totPlanned - totActual)}">${fmt(totPlanned - totActual)}</td><td></td></tr></tfoot>
        </table></div>
        ${unbudgeted.length ? `<div class="callout warn mt small"><b>${fmt(sum(unbudgeted, r => r.actual))}</b> spent across ${unbudgeted.length} categor${unbudgeted.length === 1 ? 'y' : 'ies'} with no budget: ${unbudgeted.map(r => esc(r.cat)).join(', ')}.</div>` : ''}
        ${mode !== 'off' ? `<div class="tiny muted mt">Rollover (${mode === 'surplus' ? 'surplus only' : 'full, including overspend'}) carries the unspent amount from the previous month's budget. Chains stop at months with no budget set.</div>` : ''}
      </div>`;
  }
};

function paymentOptions() { return [{ v: '', l: '— none —' }].concat(state.accounts.map(a => ({ v: a.id, l: a.name })), [{ v: 'cash', l: 'Cash' }, { v: 'other', l: 'Other' }]); }
function paymentLabel(v) { if (!v) return ''; const a = byId('accounts', v); return a ? a.name : v === 'cash' ? 'Cash' : v === 'other' ? 'Other' : v; }
function splitCategories(type) { return type === 'income' ? INCOME_TYPES : type === 'transfer' ? ['Transfer'] : catList(); }
function splitsEditorHtml(vals) {
  const splits = vals.splits && vals.splits.length ? vals.splits : [{ category: '', amount: '' }];
  const cats = splitCategories(vals.type || 'expense');
  return `<div class="field full"><label>${splits.length > 1 ? 'Splits' : 'Category & amount'}</label>
    <div id="splitRows">${splits.map((s, i) => `<div class="flex mb-s split-row"><select name="split_cat_${i}" class="grow">${cats.map(c => `<option value="${attr(c)}"${c === s.category ? ' selected' : ''}>${esc(c)}</option>`).join('')}</select>

    <div class="flex between"><button type="button" class="btn sm ghost" data-action="splitAdd">+ Add split</button>${splits.length > 1 ? `<span class="small muted">Total: <b id="splitTotal">${fmt(sum(splits, s => s.amount))}</b></span>` : ''}</div></div>`;
}
function readSplits(form, vals) {
  const rows = form.querySelectorAll('.split-row'); const out = [];
  rows.forEach((r, i) => { const c = r.querySelector(`[name="split_cat_${i}"]`), a = r.querySelector(`[name="split_amt_${i}"]`); out.push({ category: c ? c.value : '', amount: a && a.value !== '' ? num(a.value) : '' }); });

}
function openTxnForm(txn) {
  const isNew = !txn;

  openForm({

    values,

      if (vals.splits.some(s => !s.category)) return 'Every split needs a category.';

    },
    onSave: vals => {

      if (txn && txn.billRef) rec.billRef = txn.billRef;
      commit(s => { if (txn) { const i = s.txns.findIndex(t => t.id === txn.id); s.txns[i] = rec; } else s.txns.push(rec); });
      toast(isNew ? 'Transaction added' : 'Transaction updated', 'good');
    },
    onDelete: txn ? () => { commit(s => { s.txns = s.txns.filter(t => t.id !== txn.id); if (txn.billRef && s.billPaid[txn.billRef.month]) delete s.billPaid[txn.billRef.month][txn.billRef.id]; }); toast('Transaction deleted'); } : null,
    after: (form, vals, m) => {

function guessColumn(headers, names) { const h = headers.map(x => String(x).toLowerCase().trim()); for (const n of names) { const i = h.findIndex(x => x === n || x.includes(n)); if (i >= 0) return i; } return -1; }
function openCsvImport() {

      <div class="field"><label>Date format</label><select id="csvDay"><option value="0">Month first (US, 03/31/2026)</option><option value="1">Day first (31/03/2026)</option></select><div class="hint">ISO dates (2026-03-31) work either way.</div></div>
      <div class="field"><label>Default category</label><select id="csvCat">${catList().map(c => `<option value="${attr(c)}">${esc(c)}</option>`).join('')}</select></div>
      ${isCouple() ? `<div class="field"><label>Owner</label><select id="csvOwner"><option value="p1">${esc(S().person1Name)}</option><option value="p2">${esc(S().person2Name)}</option><option value="joint">Joint</option></select></div>` : ''}
      <div class="field"><label>Paid from</label><select id="csvPay">${paymentOptions().map(o => `<option value="${attr(o.v)}">${esc(o.l)}</option>`).join('')}</select></div>
      <div class="field full"><label class="check"><input type="checkbox" id="csvHeader" ${hasHeader ? 'checked' : ''}> First row is a header</label><label class="check mt-s"><input type="checkbox" id="csvSkipDup" checked> Skip rows that look like duplicates (same date, amount and description)</label></div></div>
      <div id="csvPreview"></div>`;
    stage.querySelectorAll('select,input').forEach(el => el.addEventListener('change', () => { if (el.id === 'csvHeader') { hasHeader = el.checked; build(); return; } previewBuild(); }));

    toast(`Imported ${add.length} transaction${add.length === 1 ? '' : 's'}`, 'good');
  });
}

  const list = D.monthsBetween(D.addMonths(D.thisMonth(), -(months || 3)), D.addMonths(D.thisMonth(), -1)).map(m => sum(expenseTxnsInMonth(m), t => sum(t.splits.filter(sp => sp.category !== 'Savings'), sp => sp.amount))).filter(v => v > 0);

  const bills = sum(billItems().filter(b => b.active !== false), monthlyEquivalent);
  return bills;
}

function openAccountForm(acct) {
  const isNew = !acct;
  openForm({
    title: isNew ? 'Add account' : 'Edit account',
    values: acct || { type: 'checking', owner: 'p1', balance: 0 },
    fields: [
      { key: 'name', label: 'Account name', type: 'text', required: true, full: true, placeholder: 'e.g. Main checking, ISA, Car' },
      { key: 'type', label: 'Type', type: 'select', options: ACCOUNT_TYPES.map(t => ({ v: t.v, l: t.l })), required: true }, ownerField(),
      { key: 'balance', label: 'Current balance', type: 'number', required: true, hint: 'For liabilities, enter the amount owed as a positive number.' },
      { key: 'notes', label: 'Notes', type: 'text', full: true },
    ],
    onSave: vals => {
      const rec = Object.assign({ id: acct ? acct.id : uid() }, vals, { balance: round2(Math.abs(num(vals.balance))), isLiability: !!accountType(vals.type).liability, owner: vals.owner || 'p1', updatedAt: D.today() });
      commit(s => { if (acct) s.accounts[s.accounts.findIndex(a => a.id === acct.id)] = rec; else s.accounts.push(rec); });
      toast(isNew ? 'Account added' : 'Account updated', 'good');
    },
    onDelete: acct ? () => { commit(s => { s.accounts = s.accounts.filter(a => a.id !== acct.id); }); toast('Account deleted'); } : null,
  });
}

  s.debts.push({ id: id(), name: 'Car loan', owner: 'joint', debtType: 'Car loan', originalBalance: 12000, currentBalance: 7150, apr: 6.4, minPayment: 265, extraPayment: 0, startDate: D.addMonths(start, -20) + '-01' });
  s.debts.push({ id: id(), name: 'Student loan — Sam', owner: 'p2', debtType: 'Student loan', originalBalance: 9800, currentBalance: 5320, apr: 4.5, minPayment: 110, extraPayment: 0, startDate: D.addMonths(start, -40) + '-01' });
  s.goals.push({ id: id(), name: 'Emergency fund', owner: 'joint', target: 12000, current: 6800, monthlyContribution: 400, targetDate: D.addMonths(now, 12) + '-01', priority: 'high' });
  s.goals.push({ id: id(), name: 'Japan trip', owner: 'joint', target: 4500, current: 1450, monthlyContribution: 250, targetDate: D.addMonths(now, 9) + '-01', priority: 'medium' });
  s.goals.push({ id: id(), name: 'New laptop', owner: 'p1', target: 1800, current: 620, monthlyContribution: 100, targetDate: D.addMonths(now, 6) + '-01', priority: 'low' });
  s.goals.push({ id: id(), name: 'House deposit', owner: 'joint', target: 40000, current: 12400, monthlyContribution: 500, targetDate: D.addMonths(now, 48) + '-01', priority: 'medium' });
  const budgetPlan = { Housing: 1950, Utilities: 300, Groceries: 700, Transport: 150, Insurance: 100, Health: 45, Dining: 200, Entertainment: 100, Subscriptions: 100, Shopping: 240, Personal: 50, Pets: 90, Gifts: 40, 'Debt Payments': 665, Savings: 1150, Travel: 120 };
  const months = D.monthsBetween(start, now);
  const groc = ['Tesco', 'Aldi', 'Sainsbury\'s', 'Lidl', 'Farmers market', 'Costco']; const dine = ['Pizza night', 'Coffee', 'Lunch out', 'Thai takeaway', 'Brunch with friends', 'Pub dinner']; const shop = ['Amazon order', 'IKEA', 'Clothes — Uniqlo', 'Hardware store', 'Pharmacy', 'Bookshop'];
  const ent = ['Cinema', 'Concert tickets', 'Board game', 'Museum', 'Football match']; const transport = ['Petrol', 'Train tickets', 'Parking', 'Bus pass', 'Car wash'];
  const txn = (date, type, description, owner, category, amount, extra) => s.txns.push(Object.assign({ id: id(), date, month: D.monthOf(date), type, description, owner, paymentMethod: '', notes: '', splits: [{ category, amount: round2(amount) }] }, extra || {}));
  for (const m of months) {
    const isCurrent = m === now; const lastDay = isCurrent ? D.parse(D.today()).d : D.dim(D.parse(m).y, D.parse(m).m);
    const cutoff = D.iso(D.parse(m).y, D.parse(m).m, lastDay);
    for (const [category, planned] of Object.entries(budgetPlan)) s.budgets.push({ id: id(), month: m, category, planned: category === 'Groceries' && m === D.addMonths(now, -2) ? 640 : planned });
    for (const inc of s.income) for (const d of occurrences(inc, D.monthStart(m), cutoff)) txn(d, 'income', inc.source, inc.owner, inc.type, inc.amount);
    for (const b of [...s.bills, ...s.subs.map(subAsRecurring)]) {
      const hits = occurrences(b, D.monthStart(m), cutoff);
      if (!hits.length) continue;
      if (isCurrent && rnd() < 0.25) continue;
      s.billPaid[m] = s.billPaid[m] || {}; s.billPaid[m][b.id] = true;
      txn(hits[0], 'expense', b.name, b.owner, b.category, hits.length * b.amount, { billRef: { id: b.id, month: m }, notes: hits.length > 1 ? `${hits.length} payments this month` : '' });
    }
    const dayIn = (lo, hi) => { const d = Math.min(lastDay, Math.max(1, Math.round(lo + rnd() * (hi - lo)))); return D.iso(D.parse(m).y, D.parse(m).m, d); };
    const n = Math.round(lastDay / 31 * 7);
    for (let i = 0; i < n; i++) txn(dayIn(1, lastDay), 'expense', pick(groc), pick(['joint', 'joint', 'p1', 'p2']), 'Groceries', R(38, 128));
    for (let i = 0; i < Math.round(lastDay / 31 * 5); i++) txn(dayIn(1, lastDay), 'expense', pick(dine), pick(['p1', 'p2', 'joint']), 'Dining', R(9, 68));
    for (let i = 0; i < Math.round(lastDay / 31 * 3); i++) txn(dayIn(1, lastDay), 'expense', pick(transport), pick(['p1', 'p2']), 'Transport', R(18, 75));
    for (let i = 0; i < Math.round(lastDay / 31 * 3); i++) txn(dayIn(1, lastDay), 'expense', pick(shop), pick(['p1', 'p2', 'joint']), 'Shopping', R(15, 110));
    for (let i = 0; i < Math.round(lastDay / 31 * 2); i++) txn(dayIn(1, lastDay), 'expense', pick(ent), pick(['p1', 'p2', 'joint']), 'Entertainment', R(12, 80));
    if (lastDay >= 6) txn(dayIn(3, 6), 'expense', 'Haircut', 'p2', 'Personal', R(30, 45));
    if (lastDay >= 10) txn(dayIn(8, 10), 'expense', 'Dog food & treats', 'joint', 'Pets', R(35, 55));
    if (lastDay >= 5) { txn(dayIn(2, 5), 'expense', 'Visa card payment', 'p1', 'Debt Payments', 290); txn(dayIn(2, 5), 'expense', 'Car loan payment', 'joint', 'Debt Payments', 265); txn(dayIn(2, 5), 'expense', 'Student loan payment', 'p2', 'Debt Payments', 110); }
    if (lastDay >= 26) { txn(dayIn(25, 26), 'expense', 'Transfer to emergency fund', 'joint', 'Savings', 400); txn(dayIn(25, 26), 'expense', 'Transfer to Japan trip', 'joint', 'Savings', 250); txn(dayIn(25, 26), 'expense', 'ISA contribution', 'p1', 'Savings', 500); }
    if (lastDay >= 15 && rnd() < 0.5) txn(dayIn(10, 15), 'expense', 'Weekend away', 'joint', 'Travel', R(120, 320));
    if (lastDay >= 12 && rnd() < 0.6) txn(dayIn(5, 12), 'expense', 'Birthday present', pick(['p1', 'p2']), 'Gifts', R(25, 70));
    if (lastDay >= 20) txn(dayIn(18, 20), 'expense', 'Big shop — Costco', 'joint', 'Groceries', R(160, 240), { splits: [{ category: 'Groceries', amount: 150 }, { category: 'Shopping', amount: 45.5 }, { category: 'Pets', amount: 22 }] });
  }
  for (const t of s.txns) if (t.splits.length > 1) t.notes = 'Split receipt';
  // net worth history
  for (let i = months.length - 1; i >= 1; i--) { const m = months[months.length - 1 - i]; s.snapshots.push({ date: D.monthEnd(m), assets: round2(57543.5 - i * 1180 + (rnd() - 0.5) * 400), liabilities: round2(15330 + i * 470), net: 0 }); }
  for (const sn of s.snapshots) sn.net = round2(sn.assets - sn.liabilities);
  s.txns.sort((a, b) => a.date < b.date ? -1 : 1);
  state = s; buildFormatter(); ui.month = now; ui.txnFilter = {}; ui.debtStrategy = 'snowball';
  commit();
  toast('Sample household loaded — Alex & Sam. Replace it with your own data whenever you like.', 'good', 5000);
}

// ---------- First-run wizard ----------
function openWizard() {
  let step = 0; const vals = { mode: S().householdMode, p1: S().person1Name === 'Me' ? '' : S().person1Name, p2: S().person2Name === 'Partner' ? '' : S().person2Name, currency: S().currency.code, startMonth: S().startMonth || D.thisMonth(), data: (state.txns.length || state.bills.length) ? 'keep' : 'sample' };
  const hasData = !!(state.txns.length || state.bills.length || state.income.length);
  const steps = [
    () => `<h2>Welcome to your Finance Dashboard</h2><p class="muted mt-s">Three quick questions, then you're in. Everything you enter stays in this browser — there's no account, no upload and no bank connection. You can change all of this later in Settings.</p>
      <div class="field mt"><label>Who is this dashboard for?</label><div class="choice"><label><input type="radio" name="mode" value="single" ${vals.mode === 'single' ? 'checked' : ''}><b>Just me</b><span>One set of accounts and goals.</span></label><label><input type="radio" name="mode" value="couple" ${vals.mode === 'couple' ? 'checked' : ''}><b>A couple</b><span>Tag income, bills, debts and goals per person, with joint items and a household split.</span></label></div></div>
      <div class="form-grid mt"><div class="field"><label>Your name</label><input type="text" name="p1" value="${attr(vals.p1)}" placeholder="e.g. Alex" maxlength="24"></div><div class="field" id="wizP2" ${vals.mode === 'couple' ? '' : 'style="display:none"'}><label>Partner's name</label><input type="text" name="p2" value="${attr(vals.p2)}" placeholder="e.g. Sam" maxlength="24"></div></div>`,
    () => `<h2>Currency and start month</h2><p class="muted mt-s">The currency only changes how amounts are displayed — nothing is converted.</p>
      <div class="form-grid mt"><div class="field"><label>Currency</label><select name="currency">${CURRENCIES.filter(c => c.code !== 'CUSTOM').map(c => `<option value="${c.code}"${c.code === vals.currency ? ' selected' : ''}>${c.code} · ${esc(c.name)}</option>`).join('')}</select><div class="hint">Need a different symbol? Pick "Custom" in Settings.</div></div>
      <div class="field"><label>Tracking starts</label><input type="month" name="startMonth" value="${attr(vals.startMonth)}"><div class="hint">Budgets and rollover chains begin here.</div></div></div>`,
    () => `<h2>Start with sample data?</h2><p class="muted mt-s">The sample household (Alex & Sam) has six months of realistic transactions, bills, debts and goals so you can see every page working. Replace it with your own data whenever you're ready — or start empty.</p>
      <div class="choice mt">${hasData ? `<label><input type="radio" name="data" value="keep" ${vals.data === 'keep' ? 'checked' : ''}><b>Keep my data</b><span>Apply the settings above to what's already here.</span></label>` : ''}<label><input type="radio" name="data" value="sample" ${vals.data === 'sample' ? 'checked' : ''}><b>Load the sample household</b><span>Explore with realistic data${hasData ? ' — <b>replaces</b> what is here now' : ''}.</span></label><label><input type="radio" name="data" value="empty" ${vals.data === 'empty' ? 'checked' : ''}><b>Start empty</b><span>Add your own income, bills and accounts.${hasData ? ' <b>Erases</b> current data.' : ''}</span></label></div>
      <div class="callout mt small">Tip: after setup, add your <b>income</b> and <b>bills</b> first — the overview, calendar and safe-to-spend all build from those.</div>`,
  ];
  const m = openModal(`<div class="modal"><div class="modal-body" style="padding-top:22px"><div class="wiz-steps" id="wizSteps"></div><div id="wizBody"></div></div><div class="modal-foot"><button class="btn" id="wizBack">Back</button><span class="spacer"></span><button class="btn ghost" data-modal-close>Skip</button><button class="btn primary" id="wizNext">Next</button></div></div>`, { sticky: true, noFocus: true });
  const body = m.bg.querySelector('#wizBody');
  const read = () => { body.querySelectorAll('input,select').forEach(el => { if (el.type === 'radio') { if (el.checked) vals[el.name] = el.value; } else vals[el.name] = el.value; }); };
  const draw = () => { body.innerHTML = steps[step](); m.bg.querySelector('#wizSteps').innerHTML = steps.map((_, i) => `<i class="${i <= step ? 'on' : ''}"></i>`).join(''); m.bg.querySelector('#wizBack').style.visibility = step ? 'visible' : 'hidden'; m.bg.querySelector('#wizNext').textContent = step === steps.length - 1 ? 'Finish' : 'Next'; };
  body.addEventListener('change', e => { read(); if (e.target.name === 'mode') { const p2 = body.querySelector('#wizP2'); if (p2) p2.style.display = vals.mode === 'couple' ? '' : 'none'; } });
  m.bg.querySelector('#wizBack').addEventListener('click', () => { read(); step = Math.max(0, step - 1); draw(); });
  m.bg.querySelector('#wizNext').addEventListener('click', () => {
    read();
    if (step < steps.length - 1) { step++; draw(); return; }
    m.close();
    const apply = s => { s.settings.householdMode = vals.mode; s.settings.person1Name = vals.p1.trim() || (vals.mode === 'couple' ? 'Person 1' : 'Me'); s.settings.person2Name = vals.p2.trim() || 'Partner'; const c = CURRENCIES.find(x => x.code === vals.currency) || CURRENCIES[0]; s.settings.currency = { code: c.code, symbol: c.symbol, locale: c.locale }; if (/^\d{4}-\d{2}$/.test(vals.startMonth)) s.settings.startMonth = vals.startMonth; s.settings.onboarded = true; };
    // With the sample household, keep its couple setup and start month unless the user typed their own names.
    const applySample = s => { const c = CURRENCIES.find(x => x.code === vals.currency) || CURRENCIES[0]; s.settings.currency = { code: c.code, symbol: c.symbol, locale: c.locale }; if (vals.p1.trim()) { s.settings.householdMode = vals.mode; s.settings.person1Name = vals.p1.trim(); s.settings.person2Name = vals.p2.trim() || 'Partner'; } s.settings.onboarded = true; };
    if (vals.data === 'sample') { loadSampleData(); commit(applySample); }
    else if (vals.data === 'empty') { state = blankState(); commit(apply); }
    else commit(apply);
    buildFormatter(); ui.view = 'overview'; render();
    if (vals.data !== 'sample') toast('You\'re set up. Start with Income and Bills.', 'good', 5000);
  });
  draw();
}

// ---------- Boot ----------
async function boot() {
  document.getElementById('verLabel').textContent = APP_VERSION;
  if (!storage.available()) toast('This browser is blocking local storage — data will not be saved. Try a normal (non-private) window.', 'bad', 12000);
  const loaded = loadState();
  state = loaded || blankState();
  buildFormatter(); loadUi();
  if (!views[ui.view]) ui.view = 'overview';
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  render();
  await backupFile.init();
  backupFile.renderStatus();
  const sessions = +(storage.get(LS_SESS) || 0) + 1; storage.set(LS_SESS, String(sessions));
  if (!loaded || !state.settings.onboarded) openWizard();
  else if (!backupFile.supported && state.txns.length) {
    const lastExport = +(storage.get(LS_LAST_EXPORT) || 0);
    if (sessions - lastExport >= REMIND_EVERY_SESSIONS && sessions % REMIND_EVERY_SESSIONS === 0) toast('Reminder: this browser can\'t auto-backup. Download a JSON backup to keep your data safe.', 'warn', 12000, { label: 'Export now', action: 'exportJson' });
  }
  if (location.search.includes('selftest')) { const r = runSelfTests(console.log); window.__selfTestResult = r; }
  window.__pfd = { get state() { return state; }, ui, render, runSelfTests, simulateDebt, expandRecurring, occurrences, loadSampleData };
}
document.addEventListener('DOMContentLoaded', boot);
</script>
</body>
</html>
