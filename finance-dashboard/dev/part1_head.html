<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light">
<title>Personal Finance Dashboard</title>
<link rel="icon" id="favicon" href="data:,">
<style>
:root{
  --bg:#f5f0e6; --bg2:#ede6d8; --surface:#fffdf9; --surface2:#faf6ee; --line:#e4dccb; --line2:#d3c9b4;
  --ink:#2a2824; --ink2:#5d574c; --muted:#8a8374; --accent:#b8643a; --accent2:#a0532d; --accent-soft:#f3e3d7;
  --good:#5a7f54; --good-soft:#e6eee2; --bad:#b4463f; --bad-soft:#f5e3e1; --warn:#c48f2c; --warn-soft:#f7ecd6; --info:#5b7a8c; --info-soft:#e2ebf0;
  --input:#ffffff; --p1:#3e5b6b; --p1-soft:#e2ebf0; --p2:#6b4d6e; --p2-soft:#eee3ef; --joint:#3f5c3a; --joint-soft:#e6eee2; --shadow-c:rgba(42,40,36,.12);
  --serif:"Iowan Old Style","Palatino Linotype","Book Antiqua",Palatino,Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --r:6px; --r-sm:5px; --r-lg:10px; --r-pill:999px; --shadow:0 1px 2px rgba(0,0,0,.05),0 6px 20px -8px var(--shadow-c);
  --sidebar:240px;
}
html{transition:background .25s}
*{box-sizing:border-box}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--serif);font-weight:600;margin:0;letter-spacing:-.01em;color:var(--ink)}
h1{font-size:28px}h2{font-size:21px}h3{font-size:17px}h4{font-size:15px}
p{margin:0 0 .6em}
a{color:var(--accent)}
button{font:inherit;color:inherit}
input,select,textarea{font:inherit;color:var(--ink)}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:12px}.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}
.right{text-align:right}.center{text-align:center}
.nowrap{white-space:nowrap}
.hidden{display:none!important}
.mt{margin-top:12px}.mb{margin-bottom:12px}.mt-s{margin-top:8px}.mb-s{margin-bottom:8px}.mt-l{margin-top:28px}
.flex{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.flex.nowrap-row{flex-wrap:nowrap}.flex-wrap{flex-wrap:wrap}.between{justify-content:space-between}.col{flex-direction:column;align-items:stretch}.grow{flex:1}
.grid{display:grid;gap:12px;align-items:stretch}
.grid > .card,.grid > .empty{display:flex;flex-direction:column}
.grid > .card > .table-wrap:last-child,.grid > .card > table:last-child{margin-bottom:auto}
.table-wrap.mt{margin-top:12px}
.push-b{margin-top:auto;padding-top:10px}
.grid > .card > .donut-wrap,.grid > .card > svg{margin-top:auto;margin-bottom:auto}
.grid.ragged{align-items:start}
.grid-2{grid-template-columns:repeat(2,minmax(0,1fr))}.grid-3{grid-template-columns:repeat(3,minmax(0,1fr))}.grid-4{grid-template-columns:repeat(4,minmax(0,1fr))}.grid-5{grid-template-columns:repeat(5,minmax(0,1fr))}
@media(min-width:761px){.grid-5{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}}
@media(max-width:1100px){.grid-4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:760px){.grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr 1fr}.grid-2{grid-template-columns:1fr}.grid-3{grid-template-columns:1fr}}
@media(max-width:480px){.grid-4,.grid-5{grid-template-columns:1fr 1fr;gap:10px}.kpi{padding:12px 14px}.kpi .v{font-size:21px}.kpi .s{font-size:11px}}

/* Layout */
#app{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar);flex:0 0 var(--sidebar);position:relative;transition:width .18s,flex-basis .18s;background:var(--surface);border-right:1px solid var(--line);position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:22px 14px;z-index:20}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px}
.brand .logo{width:34px;height:34px;border-radius:var(--r-sm);background:var(--accent);color:#fff;display:grid;place-items:center}.brand .logo svg{width:22px;height:22px;display:block}
.brand .txt{min-width:0}
.brand b{font-family:var(--serif);font-size:17px;font-weight:600;display:block;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand span{font-size:11px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:none;border:0;padding:9px 10px;border-radius:var(--r);cursor:pointer;color:var(--ink2);font-size:14.5px}
.nav button svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.nav button:hover{background:var(--surface2);color:var(--ink)}
.nav button.active{background:var(--ink);color:var(--bg)}
.side-foot{margin-top:auto;padding:12px 8px 0;font-size:12px;color:var(--muted)}
.rail-btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);cursor:pointer;color:var(--muted);font-size:12px;line-height:1;padding:7px;margin-bottom:10px}
.rail-btn:hover{color:var(--ink);background:var(--surface2)}
body.rail{--sidebar:68px}
body.rail .brand{justify-content:center;padding:2px 0 18px}
body.rail .brand .txt,body.rail #backupPillText,body.rail .side-foot .ver,body.rail .storage-pill span{display:none}
body.rail .rail-btn{width:38px;padding:7px 0}
body.rail .theme-dots{display:none}
body.rail .nav button{justify-content:center;padding:10px 0}
body.rail .nav button > span{display:none}
body.rail .nav button svg{width:20px;height:20px;flex:0 0 20px}
body.rail .side-foot{padding:12px 0 0;display:flex;flex-direction:column;align-items:center}
body.rail .backup-pill,body.rail .storage-pill{justify-content:center;padding:8px;width:38px}
@media(max-width:900px){.rail-btn{display:none}body.rail .theme-dots{display:flex}body.rail{--sidebar:240px}body.rail .brand .txt,body.rail #backupPillText,body.rail .side-foot .ver{display:block}body.rail .nav button > span{display:inline}body.rail .nav button{justify-content:flex-start;padding:9px 10px}body.rail .side-foot{align-items:stretch}body.rail .backup-pill{width:auto}}
.backup-pill{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line);font-size:12px;color:var(--ink2);cursor:pointer}
.backup-pill .dot{width:8px;height:8px;border-radius:50%;background:var(--line2);flex:0 0 8px}
.backup-pill.linked .dot{background:var(--good)}.backup-pill.needs-permission .dot{background:var(--warn)}.backup-pill.error .dot{background:var(--bad)}
main{flex:1;min-width:0;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:10px;padding:14px 28px 8px;position:sticky;top:0;background:linear-gradient(var(--bg) 80%,transparent);z-index:10}
.topbar h1{flex:1;font-size:26px}
.hamburger{display:none;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);width:40px;height:40px;cursor:pointer}
.month-nav{display:flex;align-items:center;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.month-nav button{background:none;border:0;width:30px;height:30px;border-radius:var(--r-sm);cursor:pointer;color:var(--ink2);font-size:16px}
.month-nav button:hover{background:var(--surface2)}
.month-nav input[type=month]{border:0;background:none;font-weight:600;padding:4px 6px;min-width:150px;text-align:center}
.month-nav .lbl{font-weight:600;padding:0 8px;min-width:130px;text-align:center;white-space:nowrap;cursor:pointer}
#view{padding:4px 28px 40px;flex:1}
@media(max-width:900px){
  .sidebar{position:fixed;left:0;top:0;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--shadow)}
  .sidebar.open{transform:none}
  .hamburger{display:block}
  .topbar{padding:14px 16px 8px}.topbar h1{font-size:22px}
  #view{padding:6px 16px 40px}
  .scrim{position:fixed;inset:0;background:rgba(42,40,36,.35);z-index:15}
}

/* Cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;box-shadow:var(--shadow);container-type:inline-size}
.card.inverse{background:var(--ink);color:var(--bg);border-color:var(--ink)}.card.inverse h3,.card.inverse .kpi .v,.card.inverse b{color:var(--bg)}.card.inverse .muted,.card.inverse .kpi .s,.card.inverse .tiny,.card.inverse .dim{color:var(--bg);opacity:.62}.card.inverse td{border-color:rgba(128,128,128,.28)}.card.inverse .chip{background:rgba(128,128,128,.28);color:var(--bg);border-color:transparent}.card.inverse a{color:var(--bg)}.card.inverse .good{color:var(--good)}.card.inverse .kpi .v.good{color:var(--good)}
.card.flat{box-shadow:none}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.card-head h3{font-size:17px}
.kpi{padding:14px 18px}
.kpi .k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.kpi .v{font-family:var(--serif);font-size:26px;font-weight:600;line-height:1.1}
.kpi .s{font-size:12px;color:var(--muted);margin-top:6px}
.section-title{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:22px 0 10px}
.section-title h2{font-size:20px}
.callout{padding:12px 16px;border-radius:var(--r);background:var(--surface2);border:1px solid var(--line);font-size:14px}
.callout.warn{background:var(--warn-soft);border-color:transparent}.callout.bad{background:var(--bad-soft);border-color:transparent}.callout.good{background:var(--good-soft);border-color:transparent}.callout.info{background:var(--info-soft);border-color:transparent}
.empty{padding:36px 20px;text-align:center;color:var(--muted);border:1px dashed var(--line2);border-radius:var(--r);background:var(--surface)}
.empty h3{color:var(--ink2);margin-bottom:6px}

/* Buttons */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line2);background:var(--surface);border-radius:var(--r);padding:8px 14px;cursor:pointer;font-size:14px;font-weight:500;color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:var(--bg)}.btn.primary:hover{opacity:.88}
.btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.btn.accent:hover{background:var(--accent2)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}.btn.danger:hover{background:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:var(--r-sm)}
.btn.ghost{border-color:transparent;background:transparent}.btn.ghost:hover{background:var(--surface2)}
.btn.icon{padding:5px 7px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:3px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:var(--r-sm);cursor:pointer;font-size:13px;color:var(--ink2)}
.seg button.active{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15);font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:var(--r-sm);font-size:11.5px;font-weight:600;background:var(--surface2);border:1px solid var(--line);color:var(--ink2);white-space:nowrap}
.chip.p1{background:var(--p1-soft);border-color:transparent;color:var(--p1)}.chip.p2{background:var(--p2-soft);border-color:transparent;color:var(--p2)}.chip.joint{background:var(--joint-soft);border-color:transparent;color:var(--joint)}
.chip.good{background:var(--good-soft);color:var(--good)}.chip.bad{background:var(--bad-soft);color:var(--bad)}.chip.warn{background:var(--warn-soft);color:#8a6217}

/* Tables */
.table-wrap{overflow-x:auto;-webkit-overflow-scrolling:touch}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
td .chip,th .chip{margin-left:4px;vertical-align:1px}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--surface2)}
td.actions,th.actions{text-align:right;white-space:nowrap;width:1%}
tfoot td{font-weight:600;border-top:2px solid var(--line2);background:var(--surface2)}
.row-muted td{color:var(--muted)}

/* Forms */
.field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px}
.field label{font-size:12.5px;font-weight:600;color:var(--ink2)}
.field .hint{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=month],input[type=search],select,textarea{width:100%;border:1px solid var(--line2);border-radius:var(--r);padding:8px 10px;background:var(--input);color:var(--ink);font-size:14px}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(184,100,58,.35);border-color:var(--accent)}
textarea{min-height:70px;resize:vertical}
.check{display:flex;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.check input{width:16px;height:16px;accent-color:var(--ink)}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 14px}
.form-grid .full{grid-column:1/-1}
@media(max-width:560px){.form-grid{grid-template-columns:1fr}}
input.inline-input{border:1px solid var(--line);background:var(--input);border-radius:var(--r-sm);padding:4px 8px;width:104px;text-align:right;font-variant-numeric:tabular-nums;font-size:14px}
input.inline-input:hover,input.inline-input:focus{border-color:var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.filters input,.filters select{width:auto;min-width:120px}
.filters input[type=search]{min-width:200px}

/* Progress */
.bar{height:8px;background:var(--bg2);border-radius:2px;overflow:hidden}
.bar > i{display:block;height:100%;background:var(--good);border-radius:2px;transition:width .3s}
.bar.over > i{background:var(--bad)}.bar.warn > i{background:var(--warn)}.bar.accent > i{background:var(--accent)}.bar.ink > i{background:var(--ink)}
.bar.thin{height:6px}

/* Modal */
.modal-bg{position:fixed;inset:0;background:rgba(15,14,12,.5);display:flex;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:auto;z-index:100;backdrop-filter:blur(2px)}
.modal{background:var(--surface);border-radius:var(--r-lg);width:100%;max-width:640px;box-shadow:0 30px 60px -20px rgba(0,0,0,.4);animation:pop .15s ease-out}
.modal.wide{max-width:900px}.modal.narrow{max-width:460px}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 10px}
.modal-body{padding:6px 22px 18px}
.modal-foot{display:flex;justify-content:space-between;gap:10px;padding:14px 22px 20px;border-top:1px solid var(--line)}
.modal-foot .spacer{flex:1}
.x{background:none;border:0;font-size:22px;line-height:1;cursor:pointer;color:var(--muted);padding:4px 8px;border-radius:var(--r-sm)}.x:hover{background:var(--surface2);color:var(--ink)}
@keyframes pop{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
@media(max-width:600px){.modal-bg{padding:12px 8px}.modal{border-radius:var(--r)}}

/* Toasts */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:200;max-width:360px}
.toast{background:var(--ink);color:var(--bg);padding:11px 16px;border-radius:var(--r);font-size:14px;box-shadow:var(--shadow);animation:pop .15s ease-out;display:flex;gap:10px;align-items:center}
.toast.good{background:var(--good);color:#fff}.toast.bad{background:var(--bad);color:#fff}.toast.warn{background:var(--warn);color:#1f1d1a}
.toast button{background:rgba(127,127,127,.25);border:0;color:inherit;padding:4px 9px;border-radius:var(--r-sm);cursor:pointer;font-size:12.5px}

/* Charts */
.chart{width:100%;height:auto;display:block;font-family:var(--sans)}
.chart text{fill:var(--muted);font-size:11px}
.chart .grid line{stroke:var(--line);stroke-dasharray:2 3}
.chart .axis{stroke:var(--line2)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink2);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.donut-wrap{display:flex;gap:18px;align-items:center;justify-content:center;flex-wrap:wrap}
.donut-wrap .list{flex:1 1 200px;min-width:0;font-size:13.5px}
/* Narrow card: stack and centre the chart, shrink the type, drop tables to two lines. */
@container (max-width:400px){
  .donut-wrap{flex-direction:column;align-items:center}
  .donut-wrap .list{width:100%;flex:1 1 auto}
  .card-head{flex-wrap:wrap;gap:6px 10px}
  table{font-size:13px}
  .kpi .v{font-size:22px}
}
@container (max-width:330px){
  table{font-size:12.5px}
  .t-stack thead{display:none}
  .t-stack tr{display:grid;grid-template-columns:1fr auto;gap:0 10px;padding:7px 0}
  .t-stack td{border:0;padding:0;white-space:normal}
  .t-stack td:nth-child(1){grid-column:1;grid-row:1;font-size:11.5px;color:var(--muted)}
  .t-stack td:nth-child(2){grid-column:1;grid-row:2}
  .t-stack td:nth-child(3){grid-column:2;grid-row:1/3;align-self:center;text-align:right}
  .t-stack tbody tr{border-bottom:1px solid var(--line)}
  .t-stack tbody tr:last-child{border-bottom:0}
}
.donut-wrap .list div{display:flex;justify-content:space-between;gap:8px;padding:4px 0;border-bottom:1px solid var(--line)}
.donut-wrap .list div:last-child{border-bottom:0}

/* Bill calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .dow{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:center;padding:4px 0}
.cal .day{min-height:74px;border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 6px;background:var(--surface2);font-size:12px}
.cal .day.blank{background:transparent;border-color:transparent}
.cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .day .d{font-weight:600;color:var(--ink2);margin-bottom:3px}
.cal .day .it{display:block;padding:1px 5px;border-radius:3px;background:var(--surface);border:1px solid var(--line);margin-bottom:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:11px}
.cal .day .it.paid{opacity:.5;text-decoration:line-through}
.cal .day .it.sub{border-style:dashed}
@media(max-width:640px){.cal .day{min-height:48px;padding:3px}.cal .day .it{font-size:9.5px;padding:0 3px}}

/* Wizard */
.wiz-steps{display:flex;gap:6px;margin-bottom:18px}
.wiz-steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}
.wiz-steps i.on{background:var(--accent)}
.choice{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.choice label{border:1px solid var(--line2);border-radius:var(--r);padding:14px;cursor:pointer;display:block}
.choice label.sel,.choice label:has(input:checked){border-color:var(--accent);background:var(--surface2);box-shadow:inset 0 0 0 1px var(--accent)}
.choice input{display:none}
.choice b{display:block;margin-bottom:3px}
.choice span{font-size:12.5px;color:var(--muted)}


/* Topbar extras */
.topbar .tb-btn{display:inline-flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);height:38px;padding:0 12px;cursor:pointer;font-weight:600;font-size:14px;color:var(--ink)}
.topbar .tb-btn:hover{background:var(--surface2)}
.topbar .tb-btn.accent{background:var(--accent);border-color:var(--accent);color:#fff}.topbar .tb-btn.accent:hover{background:var(--accent2)}
.topbar .tb-btn.icon{width:38px;padding:0;justify-content:center;font-family:var(--serif);font-size:18px}
@media(max-width:900px){.topbar .tb-btn .lbl-add{display:none}.topbar .tb-btn.accent{width:38px;padding:0;justify-content:center}.month-nav .lbl{min-width:0;padding:0 4px;font-size:13px}}
/* Theme dots */
.theme-dots{display:flex;gap:7px;flex-wrap:wrap;padding:0 8px 12px}
.theme-dot{width:20px;height:20px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line2);cursor:pointer;position:relative;overflow:hidden;background:var(--dot-bg)}
.theme-dot:after{content:"";position:absolute;inset:0;background:linear-gradient(135deg,transparent 50%,var(--dot-accent) 50%)}
.theme-dot.active{box-shadow:0 0 0 2px var(--accent)}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:560px){.theme-grid{grid-template-columns:1fr 1fr}}
.theme-card{border:2px solid var(--line);border-radius:var(--r);overflow:hidden;cursor:pointer;background:var(--surface);text-align:left;padding:0}
.theme-card.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.theme-card .prev{height:74px;padding:10px;display:flex;gap:6px;align-items:flex-end}
.theme-card .prev i{display:block;border-radius:4px}
.theme-card .nm{padding:8px 12px;font-size:13px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.theme-card .nm span{font-weight:400;color:var(--muted);font-size:11.5px}
/* Greeting & insights */
.greet{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin:2px 0 14px;flex-wrap:wrap}
.greet h2{font-size:30px;font-weight:600}
.greet .sub{color:var(--muted);font-size:14px;margin-top:4px}
.insights{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-bottom:14px}
@media(max-width:1100px){.insights{grid-template-columns:1fr 1fr}}@media(max-width:560px){.insights{grid-template-columns:1fr}}
.insight{display:flex;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:11px 14px;min-width:0;box-shadow:var(--shadow)}
.insight .ic{width:38px;height:38px;border-radius:var(--r-sm);display:grid;place-items:center;font-size:18px;flex:0 0 38px;background:var(--accent-soft)}
.insight .ic.good{background:var(--good-soft)}.insight .ic.warn{background:var(--warn-soft)}.insight .ic.info{background:var(--info-soft)}.insight .ic.bad{background:var(--bad-soft)}
.insight b{display:block;font-size:14px;line-height:1.3}.insight span{font-size:12px;color:var(--muted)}
/* First steps checklist */
.steps-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;box-shadow:var(--shadow);margin-bottom:14px;position:relative}
.steps-card > *{position:relative}
.steps-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px}
.steps-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
@media(max-width:900px){.steps-list{grid-template-columns:1fr 1fr}}@media(max-width:560px){.steps-list{grid-template-columns:1fr}.step-item.done{display:none}}
.step-item{display:flex;gap:12px;align-items:center;background:var(--surface2);border:1px solid var(--line);border-radius:var(--r);padding:11px 13px;transition:background .15s}
.step-item .grow{min-width:0}.step-item .btn{flex:0 0 auto;align-self:center}
.step-item.done{opacity:.6}
.step-item .n{width:28px;height:28px;border-radius:50%;background:var(--bg2);color:var(--ink2);display:grid;place-items:center;font-weight:700;font-size:13px;flex:0 0 28px}
.step-item.done .n{background:var(--good);color:#fff}
.step-item.next .n{background:var(--accent);color:#fff;box-shadow:0 0 0 4px var(--accent-soft)}
.step-item b{display:block;font-size:14px}.step-item span{font-size:12px;color:var(--muted);display:block;line-height:1.35}
.step-item .btn{margin-top:8px}
/* Masonry-ish card columns (settings) */
.masonry{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:stretch}.masonry>.card{display:flex;flex-direction:column}
@media(max-width:900px){.masonry{grid-template-columns:1fr}}
/* Compact progress rows (goals, budget snapshot) */
.mini{margin-bottom:13px}.mini:last-child{margin-bottom:0}
.mini-head{display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:13.5px;margin-bottom:6px}
.mini-head .l{display:flex;align-items:center;gap:6px;min-width:0;flex-wrap:wrap}
.mini-head .v{white-space:nowrap;font-variant-numeric:tabular-nums}
.mini .bar{height:6px}
/* Icon picker */
.icon-row{display:flex;flex-wrap:wrap;gap:8px}
.icon-opt{width:40px;height:40px;border-radius:var(--r-sm);display:grid;place-items:center;cursor:pointer;border:2px solid transparent;background:var(--surface2);padding:0}
.icon-opt svg{width:24px;height:24px;display:block}
.icon-opt.active{border-color:var(--accent);background:var(--accent-soft)}
.icon-opt:hover{border-color:var(--line2)}
/* Quick add */
.qa-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media(max-width:560px){.qa-grid{grid-template-columns:1fr 1fr}}
.qa{border:1px solid var(--line);background:var(--surface2);border-radius:var(--r);padding:16px 12px;cursor:pointer;text-align:center;font:inherit;color:var(--ink)}
.qa:hover{background:var(--accent-soft);border-color:var(--accent)}
.qa .ic{font-size:26px;display:block;margin-bottom:6px}.qa b{display:block;font-size:14px}.qa span{font-size:11.5px;color:var(--muted)}
/* Tour */
.tour{max-width:760px}
.tour-body{display:grid;grid-template-columns:260px 1fr;min-height:340px}
.tour-art{background:var(--accent-soft);display:flex;align-items:center;justify-content:center;border-radius:var(--r-lg) 0 0 0;position:relative;overflow:hidden}
.tour-art .big{font-size:96px;line-height:1;filter:drop-shadow(0 12px 18px rgba(0,0,0,.15));animation:float 3s ease-in-out infinite}
.tour-art .num{position:absolute;left:18px;top:14px;font-family:var(--serif);font-size:54px;color:var(--accent);opacity:.35;font-weight:600}
.tour-text{padding:34px 34px 20px}
.tour-text .kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.tour-text h2{font-size:26px;margin-bottom:12px}
.tour-text p{color:var(--ink2);font-size:15px;line-height:1.5}
.tour-dots{display:flex;gap:6px;align-items:center}
.tour-dots i{width:8px;height:8px;border-radius:50%;background:var(--line2);transition:all .2s}.tour-dots i.on{background:var(--accent);width:22px;border-radius:4px}
@media(max-width:640px){.tour-body{grid-template-columns:1fr}.tour-art{min-height:150px;border-radius:var(--r-lg) var(--r-lg) 0 0}.tour-art .big{font-size:64px}.tour-text{padding:22px}}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
/* Household split */
.split-bars{display:grid;grid-template-columns:1fr 1fr;gap:16px 26px;margin-bottom:18px}
.sbar-head{display:flex;justify-content:space-between;align-items:baseline;gap:10px;font-size:13px;margin-bottom:6px}
.sbar-head b{font-family:var(--serif);font-size:18px}
.stack{display:flex;height:10px;border-radius:2px;overflow:hidden;background:rgba(128,128,128,.28)}
.stack i{display:block;height:100%;transition:width .3s}
.stack-key{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:7px;font-size:12px;opacity:.8}
.stack-key span{display:inline-flex;align-items:center;gap:6px}
.stack-key i{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.split-people{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;border-top:1px solid rgba(128,128,128,.28);padding-top:16px}
.sp{min-width:0}
.sp-top{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:600;margin-bottom:4px}
.sp-top i{width:9px;height:9px;border-radius:2px;flex:0 0 9px}
.sp-net{font-family:var(--serif);font-size:25px;font-weight:600;line-height:1.15;margin-bottom:2px}
.sp-sub{font-size:12px;opacity:.7;margin-bottom:9px}
.sp-rows{font-size:12.5px}
.sp-rows div{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-bottom:1px solid rgba(128,128,128,.22)}
.sp-rows div:last-child{border-bottom:0}
@container (max-width:620px){.split-bars{grid-template-columns:1fr}.split-people{grid-template-columns:1fr;gap:16px}}
/* Month in review */
.story{max-width:620px;position:relative;overflow:hidden;display:flex;flex-direction:column;min-height:min(600px,86vh);background:var(--surface)}
.story-top{display:flex;align-items:center;gap:10px;padding:12px 14px 0}
.story-segs{display:flex;gap:4px;flex:1}
.story-segs i{height:3px;flex:1;border-radius:2px;background:var(--line2)}
.story-segs i.on{background:var(--accent)}.story-segs i.done{background:var(--accent);opacity:.45}
.story-stage{flex:1;display:flex;position:relative;z-index:2;pointer-events:none}
.story-stage .btn{pointer-events:auto}
.story-slide{padding:26px 34px 10px;width:100%;align-self:center;animation:storyIn .28s ease-out}
.story-art{font-size:54px;line-height:1;margin-bottom:14px;animation:float 3s ease-in-out infinite}
.story-kicker{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:6px}
.story-title{font-size:27px;line-height:1.2;margin-bottom:10px}
.story-big{font-family:var(--serif);font-size:56px;line-height:1;font-weight:600;letter-spacing:-.02em;margin:2px 0 6px}
.story-slide.good .story-big{color:var(--good)}.story-slide.bad .story-big{color:var(--bad)}.story-slide.warn .story-big{color:var(--warn)}
.story-sub{color:var(--ink2);font-size:14px;margin-bottom:12px}
.story-p{color:var(--ink2);font-size:14.5px;line-height:1.55;margin-top:8px}
.story-bars{margin-top:14px;display:flex;flex-direction:column;gap:9px}
.story-bars .sb-head{display:flex;justify-content:space-between;font-size:13px;margin-bottom:4px}
.story-bars .sb-track{height:8px;border-radius:2px;background:var(--surface2);overflow:hidden}
.story-bars .sb-track i{display:block;height:100%;border-radius:2px;animation:grow .5s ease-out}
.story-tap{position:absolute;top:44px;bottom:56px;width:28%;border:0;background:none;cursor:pointer;z-index:1;-webkit-tap-highlight-color:transparent}
.story-tap.left{left:0}.story-tap.right{right:0;width:40%}
.story-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 18px 16px;border-top:1px solid var(--line);position:relative;z-index:2}
.story-count{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
@keyframes storyIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@keyframes grow{from{width:0}}
@media(max-width:600px){.story{min-height:88vh}.story-slide{padding:20px 22px 8px}.story-big{font-size:44px}.story-title{font-size:23px}}
/* More options in forms */
.month-hint{display:none}html.no-month-input .month-hint{display:block}
.more-toggle{background:none;border:0;color:var(--accent);font-weight:600;cursor:pointer;padding:4px 0;font-size:13px;grid-column:1/-1;text-align:left}
/* Motion */
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes growy{from{transform:scaleY(0)}}
@keyframes groww{from{width:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadein{from{opacity:0}}
.fresh .chart path.ln{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1s ease-out forwards}
.fresh .chart path.ar{animation:fadein .9s ease-out both}
.fresh .chart rect.br{transform-box:fill-box;transform-origin:bottom;animation:growy .6s cubic-bezier(.2,.8,.2,1) both}
.fresh .chart circle.sl{animation:fadein .6s ease-out both}
.fresh .bar > i{animation:groww .8s cubic-bezier(.2,.8,.2,1) both}
.fresh .card,.fresh .kpi,.fresh .insight,.fresh .steps-card{animation:rise .35s ease-out both}
.fresh .grid > .card:nth-child(2),.fresh .insight:nth-child(2){animation-delay:.05s}.fresh .grid > .card:nth-child(3),.fresh .insight:nth-child(3){animation-delay:.1s}.fresh .grid > .card:nth-child(4),.fresh .insight:nth-child(4){animation-delay:.15s}.fresh .grid > .card:nth-child(5){animation-delay:.2s}
#confetti{position:fixed;inset:0;pointer-events:none;z-index:300}
[data-anchor]{scroll-margin-top:84px}
@keyframes flash{0%{box-shadow:0 0 0 0 var(--accent)}30%{box-shadow:0 0 0 4px var(--accent)}100%{box-shadow:0 0 0 0 transparent}}
.flash{animation:flash 1.6s ease-out}
.storage-pill{margin-bottom:8px;padding:8px 10px;border-radius:var(--r-sm);background:var(--bad-soft);color:var(--bad);font-size:12px;font-weight:600;cursor:pointer}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Print */
.print-only{display:none}
@media print{
  @page{margin:16mm}
  :root{--bg:#fff;--surface:#fff;--surface2:#f7f7f7;--ink:#111;--ink2:#333;--muted:#666;--line:#ccc;--line2:#bbb}
  body{background:#fff;font-size:12px}
  .sidebar,.topbar,.no-print,#toasts,.modal-bg{display:none!important}
  #app{display:block}#view{padding:0}
  .card{box-shadow:none;border-color:#ccc;break-inside:avoid;page-break-inside:avoid}
  .card.inverse{background:#fff!important;color:#111!important;border-color:#ccc!important}.card.inverse *{color:#111!important}
  .page-break{page-break-before:always;break-before:page}
  .print-only{display:block}
  h1{font-size:22px}
  table{font-size:11px}
  .grid-2,.grid-3,.grid-4,.grid-5{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div id="app">
  <aside class="sidebar" id="sidebar">
    <div class="brand"><div class="logo" id="brandLogo"></div><div class="txt"><b>Finance Dashboard</b><span>Designs by Darowan</span></div></div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <button class="rail-btn" id="railBtn" data-action="toggleRail" aria-label="Collapse sidebar" title="Collapse sidebar">‹</button>
      <div class="theme-dots" id="themeDots" title="Colour theme"></div>
      <div class="storage-pill hidden" id="storagePill" data-action="goto" data-view="settings" data-anchor="backup" title="Export a backup"></div>
      <div class="backup-pill" id="backupPill" data-action="goto" data-view="settings" data-anchor="backup" title="Backup status"><span class="dot"></span><span id="backupPillText">Backup off</span></div>
      <div class="mt-s tiny ver">v<span id="verLabel"></span> · Your data stays in this browser.</div>
    </div>
  </aside>
  <div class="scrim hidden" id="scrim" data-action="closeSidebar"></div>
  <main>
    <div class="topbar">
      <button class="hamburger" data-action="toggleSidebar" aria-label="Menu">☰</button>
      <h1 id="viewTitle">Overview</h1>
      <div class="month-nav" id="monthNav">
        <button data-action="monthShift" data-n="-1" aria-label="Previous month">‹</button>
        <span class="lbl" id="monthLabel" data-action="monthPick" title="Click to pick a month"></span>
        <button data-action="monthShift" data-n="1" aria-label="Next month">›</button>
      </div>
      <button class="tb-btn accent" data-action="quickAdd" title="Add anything (N)"><span style="font-size:18px;line-height:1">+</span><span class="lbl-add">Add</span></button>
      <button class="tb-btn icon" data-action="help" title="Welcome tour & help">?</button>
    </div>
    <div id="view"></div>
  </main>
</div>
<div id="modal-root"></div>
<div id="toasts"></div>
