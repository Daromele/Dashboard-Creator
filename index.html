<!doctype html>
<html lang="en" data-theme="mono">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Recipe Library Studio</title>
  <meta name="description" content="Paste a recipe link. Build your personal recipe library. Private, offline-ready, and stored on your device.">
  <meta name="theme-color" content="#ffffff">
  <meta name="color-scheme" content="light">
  <meta name="referrer" content="strict-origin-when-cross-origin">

  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="icon" href="/icons/icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Recipes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <!-- Applies the saved theme before first paint (external so a strict CSP can stay in place). -->
  <script src="/src/theme-init.js"></script>
  <link rel="preload" href="/fonts/montserrat-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/playfair-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main">Skip to main content</a>

  <div id="app" class="app">
    <div class="boot-screen" role="status">Loading your recipes…</div>
  </div>

  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>
  <div id="print-root" class="print-root" aria-hidden="true"></div>

  <noscript>
    <main class="fatal">
      <h1>Recipe Library Studio needs JavaScript</h1>
      <p>Please enable JavaScript in your browser to use your recipe library.</p>
    </main>
  </noscript>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
